// 보류함: 만들다 멈춘 시리즈·화. 자료는 그대로 두고, 꺼내면 이어서 만든다.
async function renderShelf() {
  const box = $('#shelfBox'); if (!box) return;
  const [sers, eps] = await Promise.all([
    q(S.sb.from('series').select('id,title,on_hold,held_at,hold_note').eq('on_hold', true)).catch(() => []),
    q(S.sb.from('episodes').select('id,number,title,series_id,held_at,hold_note,series(title)').eq('status', 'on_hold').order('number')).catch(() => []),
  ]);
  const ids = eps.map(e => e.id);
  const [vers, cuts] = ids.length ? await Promise.all([
    q(S.sb.from('script_versions').select('episode_id,status').in('episode_id', ids)),
    q(S.sb.from('production_cuts').select('episode_id,status').in('episode_id', ids).neq('status', 'cancelled'))]) : [[], []];
  const where = e => { const c = cuts.filter(x => x.episode_id === e.id); const v = vers.filter(x => x.episode_id === e.id);
    return c.length ? `컷 ${c.length}개(통과 ${c.filter(x => x.status === 'passed').length})까지 만듦` : v.some(x => x.status === 'confirmed') ? '대본 확정까지' : v.length ? '원고만' : '대본 없음'; };
  box.innerHTML = `<div class="card"><div class="row"><b>보류함</b><span class="quiet">만들다 멈춘 시리즈·화를 여기 영구 보관합니다. 대본·바이블·컷·영상은 그대로 있고, 꺼내면 멈춘 곳부터 이어서 만듭니다. 보류는 제작 탭(시리즈 옆 "이 시리즈 보류", 화 카드의 "보류")에서.</span></div>
    ${!sers.length && !eps.length ? '<p class="quiet" style="margin:6px 0 0">보류한 것이 없습니다.</p>' : ''}
    ${sers.map(s => `<div class="ibrow" style="grid-template-columns:58px 1fr auto">${pill('시리즈', 'warn')}<div><b>${esc(s.title)}</b><div class="quiet">${fmt(s.held_at)} 보류${s.hold_note ? ' · ' + esc(s.hold_note) : ''}</div></div>
      <div class="row"><button class="btn small" data-shopen="${esc(s.id)}">제작 탭에서 보기</button><button class="btn small primary" data-shun="series:${esc(s.id)}">꺼내기</button></div></div>`).join('')}
    ${eps.map(e => `<div class="ibrow" style="grid-template-columns:58px 1fr auto">${pill('화')}<div><b>${esc(e.series?.title || '')} ${e.number}화</b> ${esc(e.title || '')}<div class="quiet">${fmt(e.held_at)} 보류 · ${esc(where(e))}${e.hold_note ? ' · ' + esc(e.hold_note) : ''}</div></div>
      <div class="row"><button class="btn small" data-shopen="${esc(e.series_id)}" data-shep="${esc(e.id)}">제작 탭에서 보기</button><button class="btn small primary" data-shun="episode:${esc(e.id)}">꺼내기</button></div></div>`).join('')}</div>`;
  box.querySelectorAll('[data-shun]').forEach(b => b.onclick = guard(async () => {
    const [k, id] = b.dataset.shun.split(':'); await q(S.sb.rpc('owner_hold', { p_kind: k, p_id: id, p_on: false })); toast('꺼냈습니다. 제작 탭에서 이어서 만들 수 있어요'); renderShelf();
  }));
  box.querySelectorAll('[data-shopen]').forEach(b => b.onclick = () => { S.seriesId = b.dataset.shopen; S.episodeId = b.dataset.shep || null; go('production'); });
}
async function viewLog(main) {
  const devices = await q(S.sb.from('devices').select('name').order('name'));
  main.innerHTML = `
  <h2>기록</h2>
  <div id="shelfBox"></div>
  <h3 style="margin:16px 0 6px">활동 기록</h3>
  <div class="card row">
    <select id="fdev" style="width:auto"><option value="">모든 기기</option>${devices.map(d => `<option>${esc(d.name)}</option>`).join('')}</select>
    <select id="fwho" style="width:auto"><option value="">모든 주체</option><option value="대표">대표</option><option value="!대표">AI·에이전트</option></select>
    <input id="ftxt" placeholder="내용 검색" style="flex:1;min-width:140px">
    <button class="btn" id="fgo">검색</button>
  </div>
  <div class="card" id="logBox"><p class="quiet">불러오는 중…</p></div>
  <div class="row"><button class="btn" id="fmore">더 보기</button></div>`;
  renderShelf().catch(console.error);
  let limit = 100;
  const load = guard(async () => {
    let qy = S.sb.from('v_activity').select('*').limit(limit);
    if ($('#fdev').value) qy = qy.eq('device', $('#fdev').value);
    if ($('#fwho').value === '대표') qy = qy.eq('actor', '대표');
    if ($('#fwho').value === '!대표') qy = qy.neq('actor', '대표');
    const t = $('#ftxt').value.trim().replace(/[%,()]/g, ' ');
    if (t) qy = qy.ilike('summary', `%${t}%`);
    const rows = await q(qy);
    $('#logBox').innerHTML = activityTable(rows);
    $('#fmore').style.display = rows.length < limit ? 'none' : '';
  });
  $('#fgo').onclick = () => { limit = 100; load(); };
  $('#ftxt').onkeydown = e => { if (e.key === 'Enter') { limit = 100; load(); } };
  $('#fdev').onchange = $('#fwho').onchange = () => { limit = 100; load(); };
  $('#fmore').onclick = () => { limit += 100; load(); };
  await load();
}

// API 키: 넣기만 하고 다시 볼 수는 없다. 에이전트만 꺼내 쓴다.
const KEYS = [
  ['anthropic_api_key', 'Claude API 키', 'sk-ant-…', 'AI 직원들이 일할 때 씁니다. console.anthropic.com → API Keys'],
  ['higgsfield_key_id', 'Higgsfield Key ID', '', '영상 생성에 씁니다. console.higgsfield.ai에서 키를 만들면 ID와 Secret이 나옵니다'],
  ['higgsfield_key_secret', 'Higgsfield Key Secret', '', ''],
  ['elevenlabs_api_key', 'ElevenLabs API 키', 'sk_…', '배경음악·목소리 분리·다국어 더빙에 씁니다. elevenlabs.io → Developers → API Keys'],
];
async function renderKeys() {
  const box = $('#keyBox'); if (!box) return;
  const [meta, agents, cmds] = await Promise.all([
    q(S.sb.from('app_secret_meta').select('*')),
    q(S.sb.from('agent_status').select('device_id,last_seen_at,version,devices(name)')),
    q(S.sb.from('agent_commands').select('command,status,result,created_at,done_at').eq('command', 'test_keys').order('created_at', { ascending: false }).limit(1)),
  ]);
  const m = n => meta.find(x => x.name === n);
  const online = agents.filter(a => a.last_seen_at && (Date.now() - new Date(a.last_seen_at)) / 1000 < 60);
  const last = cmds[0];
  box.innerHTML = `<b>API 키</b>
    <p class="quiet" style="margin:4px 0 8px">넣은 키는 암호화해 보관하고 화면에는 마지막 4자리만 보입니다. 에이전트만 꺼내 쓸 수 있습니다. 바꾸려면 새 키를 넣고 저장하세요.</p>
    <table>${KEYS.map(([n, label, ph, help]) => `<tr><td style="white-space:nowrap"><b>${label}</b>${help ? `<br><span class="quiet">${help}</span>` : ''}</td>
      <td>${m(n) ? pill('등록됨 …' + m(n).last4, 'good') + `<br><span class="quiet">${fmt(m(n).updated_at)}</span>` : pill('미등록', 'warn')}</td>
      <td><input type="password" autocomplete="off" data-key="${n}" placeholder="${ph || '새 값 붙여 넣기'}" style="min-width:200px"></td></tr>`).join('')}</table>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="kSave">입력한 키 저장</button>
      <button class="btn" id="kTest" ${online.length ? '' : 'disabled'}>연결 시험 (비용 없음)</button>
      <span class="quiet">${online.length ? `시험은 ${esc(online[0].devices?.name || '에이전트')}가 합니다` : '연결 시험은 켜져 있는 에이전트가 있어야 합니다'}</span></div>
    ${last ? `<div class="msg ${last.status === 'done' ? 'ok' : last.status === 'failed' ? 'err' : ''}" style="margin-top:10px">${last.status === 'queued' || last.status === 'sent' ? '시험 중… (15초 안에 결과가 나옵니다)' : esc(last.result || '')}
      <span class="quiet"> · ${fmt(last.done_at || last.created_at)}</span></div>` : ''}`;
  $('#kSave').onclick = guard(async () => {
    const inputs = [...box.querySelectorAll('[data-key]')].filter(i => i.value.trim());
    if (!inputs.length) return toast('저장할 키를 입력하세요');
    for (const i of inputs) await q(S.sb.rpc('set_secret', { p_name: i.dataset.key, p_value: i.value.trim() }));
    toast(`키 ${inputs.length}개를 저장했습니다`); renderKeys();
  });
  $('#kTest').onclick = guard(async () => {
    if (online.some(a => a.version && verNum(a.version) < verNum('1.3.0')) && !online.some(a => verNum(a.version || '0') >= verNum('1.3.0')))
      return toast('에이전트가 아직 v1.3.0이 아닙니다. 에이전트 탭에서 "업데이트"를 눌러 주세요');
    const a = online.find(x => verNum(x.version || '0') >= verNum('1.3.0')) || online[0];
    await q(S.sb.from('agent_commands').insert({ device_id: a.device_id, command: 'test_keys' }));
    toast('연결 시험을 보냈습니다'); renderKeys();
    setTimeout(() => { if (S.tab === 'settings') renderKeys().catch(() => {}); }, 18000);
  });
}

// ------------------------------------------------------------------

function openVideo(src, poster, title) {
  document.getElementById('zoomBox')?.remove();
  const box = document.createElement('div'); box.id = 'zoomBox'; box.className = 'zoombox';
  box.innerHTML = `<div class="zoomin vidpop">${src ? `<video src="${esc(src)}" ${poster ? `poster="${esc(poster)}"` : ''} controls autoplay playsinline></video>` : `<img src="${esc(poster)}" alt="">`}
    <div class="zoombar"><span>${esc(title || '')}</span>${src ? `<a class="btn small" href="${esc(src)}" target="_blank" rel="noopener">원본 새 창</a>` : ''}
      <button class="btn small" id="zClose">닫기 (Esc)</button></div></div>`;
  const key = ev => { if (ev.key === 'Escape') close(); };
  function close() { box.querySelector('video')?.pause(); box.remove(); document.removeEventListener('keydown', key); }
  box.onclick = ev => { if (ev.target === box) close(); };
  box.querySelector('#zClose').onclick = close;
  document.addEventListener('keydown', key);
  document.body.appendChild(box);
}
document.addEventListener('click', ev => {

function openZoom(imgs, i) {
  document.getElementById('zoomBox')?.remove();
  const box = document.createElement('div'); box.id = 'zoomBox'; box.className = 'zoombox';
  const show = () => {
    const im = imgs[i], wrap = im.closest('label, a, div'), cb = wrap?.querySelector('input[type=checkbox]');
    const label = wrap?.querySelector('span:not(.ph)')?.textContent || '';
    box.innerHTML = `<div class="zoomin"><img src="${esc(im.src)}" alt="">
      <div class="zoombar"><span>${i + 1} / ${imgs.length}${label ? ' · ' + esc(label) : ''}</span>
        ${cb ? `<button class="btn small ${cb.checked ? 'primary' : ''}" id="zPick">${cb.checked ? '✓ 고름 (누르면 빼기)' : '이 사진 고르기'}</button>` : ''}
        <a class="btn small" href="${esc(im.src)}" target="_blank" rel="noopener">원본 새 창</a>
        <button class="btn small" id="zClose">닫기 (Esc)</button></div>
      ${imgs.length > 1 ? '<button class="zarrow l" id="zPrev">‹</button><button class="zarrow r" id="zNext">›</button>' : ''}</div>`;
    box.querySelector('#zClose').onclick = close;
    const zp = box.querySelector('#zPick'); if (zp) zp.onclick = () => { cb.checked = !cb.checked; cb.dispatchEvent(new Event('change', { bubbles: true })); cb.closest('label')?.classList.toggle('on', cb.checked); show(); };
    const pv = box.querySelector('#zPrev'); if (pv) pv.onclick = ev => { ev.stopPropagation(); i = (i - 1 + imgs.length) % imgs.length; show(); };
    const nx = box.querySelector('#zNext'); if (nx) nx.onclick = ev => { ev.stopPropagation(); i = (i + 1) % imgs.length; show(); };
  };
  const key = ev => { if (ev.key === 'Escape') close(); else if (ev.key === 'ArrowLeft') box.querySelector('#zPrev')?.click(); else if (ev.key === 'ArrowRight') box.querySelector('#zNext')?.click(); };
  function close() { box.remove(); document.removeEventListener('keydown', key); }
  box.onclick = ev => { if (ev.target === box) close(); };
  document.addEventListener('keydown', key);
  document.body.appendChild(box); show();
}

// 예상 소요 시간: 최근 14일 같은 종류 작업이 실제로 걸린 시간(중앙값)으로 "보통 N분 · 약 M분 남음"을 보여 준다.
// 기록이 적으면 기본값(Higgsfield·Claude 평소 속도)을 쓴다.
const ETA_DEFAULT = { generate: [180, 480], photo_design: [60, 180], photo_set: [300, 1200], prep_cut: [60, 240], upscale: [600, 1800],
  director: [120, 600], writers_room: [60, 240], bible_prompt: [20, 90], coord_review: [20, 90], photo_describe: [20, 90], video_review: [30, 120],
  assemble: [30, 180], bgm: [30, 120], voice_design: [20, 90], voice_cast: [30, 120], bible_extract: [60, 300], bible_suggest: [30, 120], bible_place: [30, 120] };
async function loadEta(force) {
  if (!force && S.etaAt && Date.now() - S.etaAt < 10 * 60e3) return;
  S.etaAt = Date.now();
  const since = new Date(Date.now() - 14 * 864e5).toISOString();
  const rows = await q(S.sb.from('pipeline_tasks').select('kind,started_at,finished_at').eq('status', 'done').gte('finished_at', since)
    .not('started_at', 'is', null).order('finished_at', { ascending: false }).limit(1000)).catch(() => []);
  const by = {};
  rows.forEach(r => { const s = (new Date(r.finished_at) - new Date(r.started_at)) / 1000; if (s > 2 && s < 4 * 3600) (by[r.kind] = by[r.kind] || []).push(s); });
  S.eta = {};
  Object.entries(by).forEach(([k, xs]) => { if (xs.length >= 3) { xs.sort((a, b) => a - b); S.eta[k] = { med: xs[Math.floor(xs.length / 2)], p80: xs[Math.floor(xs.length * 0.8)], n: xs.length }; } });
}
const mins = s => s < 90 ? `${Math.max(1, Math.round(s / 60))}분` : `${Math.round(s / 60)}분`;
function etaText(kind, startedAt, status) {
  const e = (S.eta || {})[kind], d = ETA_DEFAULT[kind];
  if (!e && !d) return '';
  const typ = e ? `보통 ${mins(e.med)}${e.p80 > e.med * 1.3 ? `~${mins(e.p80)}` : ''} (최근 ${e.n}건)` : `보통 ${mins(d[0])}~${mins(d[1])}`;
  if (status !== 'running' || !startedAt) return typ;
  const el = (Date.now() - new Date(startedAt)) / 1000, hi = e ? e.p80 : d[1], mid = e ? e.med : (d[0] + d[1]) / 2;
  const left = el < mid ? mid - el : el < hi ? hi - el : null;
  return `${typ} · ${left != null ? `약 ${mins(left)} 남음` : `예상보다 오래 걸리는 중(${mins(el)} 지남)`}`;
}

// 긴 칸 접기: 내용이 길면 칸 아래에 "펼치기 ▾ / 접기 ▴"가 생긴다. 고른 상태는 이 브라우저에 기억.
// data-fold="열쇠"가 있으면 그 열쇠로, 없으면 탭·칸 제목으로 기억. data-fold-default="1"이면 처음엔 접힌 채로.
// ------------------------------------------------------------------
const FOLD_KEY = 'nyx.fold';
const foldState = () => { try { return JSON.parse(localStorage.getItem(FOLD_KEY) || '{}'); } catch { return {}; } };
const foldSave = (k, v) => { try { const s = foldState(); s[k] = v; localStorage.setItem(FOLD_KEY, JSON.stringify(s)); } catch {} };
function autoFold() {
  const main = document.getElementById('main'); if (!main) return;
  main.querySelectorAll('.card, .rvbox').forEach(el => {
    if (el.dataset.foldInit || el.closest('#zoomBox') || el.id === 'invoice') return;
    const min = +(el.dataset.foldMin || 520);
    const full = el.scrollHeight;
    if (full < min + 120) return;   // 짧으면 그대로
    el.dataset.foldInit = '1';
    const key = el.dataset.fold || `${S.tab}:${(el.querySelector('h3, b')?.textContent || '').trim().slice(0, 40)}`;
    const st = foldState();
    const folded = key in st ? st[key] : el.dataset.foldDefault === '1';
    el.style.setProperty('--fold-h', min + 'px');
    const bar = document.createElement('button');
    bar.type = 'button'; bar.className = 'foldbar';
    const paint = f => { el.classList.toggle('folded', f); bar.textContent = f ? '펼치기 ▾' : '접기 ▴'; };
    bar.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); const f = !el.classList.contains('folded'); paint(f); foldSave(key, f);
      if (f) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
    el.appendChild(bar); paint(folded);
  });
}
// 그린 직후(화면에 보이기 전에) 바로 접는다 → 펼쳐졌다 접히는 깜박임 없음
let folding = false;
new MutationObserver(() => { if (folding) return; folding = true; try { autoFold(); } finally { folding = false; } })
  .observe(document.body, { childList: true, subtree: true });

const FAIL_ACT = { writers: '작가실에 요청', retry: '다시 시도', scripts: '대본 탭 열기', settings: '설정 열기', bible: '바이블 열기', agents: '에이전트 열기', production: '제작 탭 열기' };
async function retryTask(t) {
  // 먼저 옛 일을 '실패·대기'일 때만 접는다: 컴퓨터가 아직 하고 있는 일을 복사해 두 번 돌리거나(유료 생성 두 번), 두 번 눌러 둘 생기던 문제
  const took = await q(S.sb.from('pipeline_tasks').update({ status: 'cancelled' }).eq('id', t.id).in('status', ['failed', 'queued']).select('id'));

  }
  await q(S.sb.from('pipeline_tasks').insert({ kind: t.kind, payload: t.payload || {}, episode_id: t.episode_id, series_id: t.series_id, scene_no: t.scene_no,
    cut_id: t.cut_id, take_id: t.take_id, platform: t.platform }));

}
function failCard(t) {

    <div class="row" style="gap:6px">${pill((TASK_LABEL[t.kind] || t.kind) + ' 실패', 'bad')}<span class="quiet">${esc(agoText(t.finished_at || t.created_at))}${t.scene_no ? ` · S${t.scene_no}` : ''}</span></div>
    <div style="margin-top:4px"><b>무슨 일인가요?</b> ${esc(x.what)}</div>

    <div class="row" style="gap:6px;margin-top:6px">${x.acts.map(a => `<button class="btn small ${a === 'retry' ? 'primary' : ''}" data-fact="${a}">${FAIL_ACT[a]}</button>`).join('')}
      <button class="btn small" data-fact="dismiss" style="margin-left:auto">확인했어요(지우기)</button></div></div>`;
}
function bindFailCards(root, tasks, after) {
  root.querySelectorAll('.failcard').forEach(card => card.querySelectorAll('[data-fact]').forEach(b => b.onclick = guard(async () => {
    const t = tasks.find(x => x.id === card.dataset.fid); if (!t) return;
    const a = b.dataset.fact;
    if (a === 'retry') { if (await retryTask(t)) toast('다시 맡겼습니다'); return after(); }
    if (a === 'writers') {
      const nos = [...new Set([...(t.error || '').matchAll(/S#(\d+)/g)].map(m => +m[1]))];
      const note = prompt(`작가실에 ${nos.length ? 'S#' + nos.join(', S#') : '이 화'}을(를) 고쳐 달라고 요청합니다.\n기본: 감독이 설계할 수 있게 긴 씬을 대사·흐름 그대로 2~3개로 나눔.\n작가실에 더 전할 말(선택):`, '');
      if (note === null) return;
      await q(S.sb.from('pipeline_tasks').insert({ kind: 'writers_room', episode_id: t.episode_id, payload: { mode: 'split_scenes', scenes: nos,
        source_version_id: t.payload?.script_version_id || null, why: '감독이 컷으로 설계하지 못함', detail: (t.error || '').split('\n').slice(1, 9), note: note.trim() || null } }));
      await q(S.sb.from('pipeline_tasks').update({ status: 'cancelled' }).eq('id', t.id));
      toast('작가실에 요청했습니다. 수정본이 오면 대본 탭(또는 지시 탭)에서 확정하세요. 확정하면 감독이 그 씬만 다시 설계합니다'); return after();
    }

    if (a === 'scripts' && t.episode_id) { S.episodeId = t.episode_id; S.versionId = null; }
    go(a);
  })));
}

const DESK = [['코디네이터', ['coord_review', 'photo_describe', 'bible_prompt']], ['작가실', ['writers_room', 'bible_extract', 'bible_suggest', 'bible_place', 'voice_cast']],

// 제작할 화 고르기: 전체 또는 원하는 화만 골라 작가실 정리(→ 확정 → 컷 설계) 또는 컷 설계를 시작

  ]);
  const tgtRow = await q(S.sb.from('app_settings').select('value').eq('key', 'cut_target').maybeSingle()).catch(() => null);
  const st = e => { const v = vers.filter(x => x.episode_id === e.id), c = cuts.filter(x => x.episode_id === e.id), o = open.filter(x => x.episode_id === e.id);

  const rng = ns => { ns = [...ns].sort((a, b) => a - b); const out = []; for (let i = 0; i < ns.length; i++) { let j = i; while (j + 1 < ns.length && ns[j + 1] === ns[j] + 1) j++; out.push(i === j ? `${ns[i]}` : `${ns[i]}~${ns[j]}`); i = j; } return out.length ? out.join(', ') + '화' : '없음'; };
  const target = Number((tgtRow?.value || {})[S.seriesId]) || 0;
  const scope = target ? episodes.filter(e => e.number <= target) : episodes;
  const grp = { designing: [], waiting: [], done: [], ready: [], notyet: [] };
  scope.forEach(e => { const s = st(e); grp[s.designing ? 'designing' : s.waiting ? 'waiting' : s.cuts ? 'done' : s.conf ? 'ready' : 'notyet'].push(e.number); });
  const maxNo = Math.max(0, ...all.map(e => e.number));
  // 위쪽 화별 상태 줄: 화마다 지금 어디까지 왔는지 한 단어로
  const stripOf = e => { if (e.status === 'on_hold') return ['보류', ''];
    const s = st(e), o = open.filter(x => x.episode_id === e.id), k = new Set(o.map(x => x.kind));
    if (s.designing) return ['컷 설계 중', 'warn']; if (s.waiting) return ['설계 차례 대기', 'warn'];
    if (k.has('writers_room')) return ['작가실 중', 'warn'];

    if (s.cuts) return s.passed === s.cuts ? ['완성', 'good'] : s.passed ? [`완성 ${s.passed}/${s.cuts}`, 'good'] : ['설계 끝 · 승인 대기', 'accent'];
    if (s.conf) return ['설계 전', 'accent'];
    if (vers.some(x => x.episode_id === e.id && x.status === 'draft')) return ['확정 대기', 'warn'];

  all.forEach(e => { const el = document.querySelector(`[data-epst="${e.id}"]`); if (!el) return; const [t, k] = stripOf(e); el.textContent = t; el.className = k; });

  S.pick = S.pick || {};
  box.innerHTML = `<div class="card">
    <div class="row"><b>컷 설계 범위</b>
      <span class="quiet">대본에 올린 화: ${all.length ? `${rng(all.map(e => e.number))} (${all.length}개 화)` : '없음'}</span>
      <span class="row" style="margin-left:auto;gap:6px"><span class="quiet">목표:</span>
        <input id="pkTgt" type="number" min="1" max="${maxNo || 999}" value="${target || ''}" placeholder="전체" style="width:70px">
        <span class="quiet">화까지 만들기</span><button class="btn small" id="pkTgtSave">저장</button></span></div>
    <div class="quiet" style="margin:4px 0 6px">${target ? `목표 <b>1~${target}화</b> 기준` : '목표를 정하지 않아 <b>대본에 올린 모든 화</b> 기준'}입니다. 컷 설계는 <b>화마다 따로</b> 진행됩니다(감독 1번 = 1개 화).</div>
    <div class="row" style="gap:6px;flex-wrap:wrap">
      ${pill('설계 중: ' + rng(grp.designing), grp.designing.length ? 'warn' : '')}
      ${pill('설계 차례 기다림: ' + rng(grp.waiting), grp.waiting.length ? 'warn' : '')}
      ${pill('설계 끝: ' + rng(grp.done), grp.done.length ? 'good' : '')}
      ${pill('대본 확정 · 아직 설계 안 함: ' + rng(grp.ready), grp.ready.length ? 'accent' : '')}
      ${pill('대본 확정 전: ' + rng(grp.notyet))}
      ${grp.ready.length ? `<button class="btn small" id="pkTgtPick">아직 설계 안 한 ${rng(grp.ready)} 고르기</button>` : ''}</div></div>
  <div class="card">
    <div class="row"><b>제작할 화 고르기</b><span class="quiet">대본에 올린 화를 모두 만들지 않아도 됩니다. 만들 화만 고르세요.</span>
      <button class="btn small" id="pkAll" style="margin-left:auto">전체 선택</button><button class="btn small" id="pkNone">선택 해제</button></div>
    <div class="pkgrid">${episodes.map(e => { const s = st(e); return `<label class="pk ${S.pick[e.id] ? 'on' : ''}"><input type="checkbox" data-pk="${esc(e.id)}" ${S.pick[e.id] ? 'checked' : ''}>
      <b>${e.number}화</b> <span class="quiet">${esc((e.title || '').slice(0, 14))}</span>
      <div class="quiet" style="font-size:12px">${s.busy.length ? `<span style="color:var(--warn)">진행 중: ${esc([...new Set(s.busy)].join(', '))}</span>` : s.cuts ? `컷 ${s.cuts} · 통과 ${s.passed}` : s.conf ? '대본 확정 · 컷 전' : s.raw ? '원고만' : '대본 없음'}</div></label>`; }).join('')}</div>
    ${held.length ? `<div class="row quiet" style="margin-top:6px">보류한 화: ${held.map(e => `<span>${e.number}화${e.hold_note ? ` (${esc(e.hold_note)})` : ''} <a href="#" data-pkun="${esc(e.id)}">꺼내기</a></span>`).join(' · ')}</div>` : ''}
    <div class="row" style="margin-top:8px"><button class="btn primary small" id="pkWr">선택한 화: 작가실 정리부터</button>
      <button class="btn small" id="pkDir">선택한 화: 감독 컷 설계만(확정본 있는 화)</button><span class="quiet" id="pkN"></span></div>
    <p class="quiet" style="margin:4px 0 0">작가실 정리부터: 정리본 → (자동 확정이 켜져 있으면) 확정 → 컷 설계까지 이어집니다. 이미 진행 중인 화는 건너뜁니다. 영상 생성은 여전히 컷마다 대표 승인으로만.</p></div>`;
  const sel = () => episodes.filter(e => S.pick[e.id]);
  const upd = () => { $('#pkN').textContent = sel().length ? `${sel().length}개 화 선택` : ''; };
  box.querySelectorAll('[data-pk]').forEach(c => c.onchange = () => { S.pick[c.dataset.pk] = c.checked; c.closest('.pk').classList.toggle('on', c.checked); upd(); });
  box.querySelectorAll('[data-pkhold]').forEach(a => a.onclick = guard(async ev => {
    ev.preventDefault(); ev.stopPropagation();
    const e = all.find(x => x.id === a.dataset.pkhold);
    const note = prompt(`${e.number}화를 보류할까요? 대본·컷·영상은 그대로 두고, 대기 중인 일만 취소합니다. 기록 탭 '보류함'에서 언제든 꺼낼 수 있어요.\n보류 이유(선택):`, '');
    if (note === null) return;
    const n = await q(S.sb.rpc('owner_hold', { p_kind: 'episode', p_id: e.id, p_on: true, p_note: note.trim() || null }));
    toast(`${e.number}화 보류${n ? ` · 대기 중이던 일 ${n}건 취소` : ''}`); go('production');
  }));
  box.querySelectorAll('[data-pkun]').forEach(a => a.onclick = guard(async ev => {
    ev.preventDefault(); await q(S.sb.rpc('owner_hold', { p_kind: 'episode', p_id: a.dataset.pkun, p_on: false })); toast('꺼냈습니다'); go('production');
  }));
  $('#pkTgtSave').onclick = guard(async () => {
    const n = Math.max(0, Math.floor(+$('#pkTgt').value || 0));
    const cur = (await q(S.sb.from('app_settings').select('value').eq('key', 'cut_target').maybeSingle()).catch(() => null))?.value || {};
    await q(S.sb.from('app_settings').upsert({ key: 'cut_target', value: { ...cur, [S.seriesId]: n || null }, updated_at: new Date().toISOString() }));
    toast(n ? `목표를 1~${n}화로 저장했습니다` : '목표를 지웠습니다(모든 화 기준)'); renderPicker(all);
  });
  const tp = $('#pkTgtPick'); if (tp) tp.onclick = () => { S.pick = {}; episodes.filter(e => grp.ready.includes(e.number)).forEach(e => { S.pick[e.id] = true; }); renderPicker(all); };
  $('#pkAll').onclick = () => { episodes.forEach(e => { S.pick[e.id] = true; }); renderPicker(all); };
  $('#pkNone').onclick = () => { S.pick = {}; renderPicker(all); };
  const start = kind => guard(async () => {
    const list = sel(); if (!list.length) return toast('화를 먼저 고르세요');
    const skip = [], go2 = [];
    for (const e of list) { const s = st(e);
      if (s.busy.length) { skip.push(`${e.number}화(진행 중)`); continue; }
      if (kind === 'writers_room' && !s.raw) { skip.push(`${e.number}화(대본 없음)`); continue; }
      if (kind === 'director' && !s.conf) { skip.push(`${e.number}화(확정본 없음)`); continue; }
      go2.push(e); }
    if (!go2.length) return toast('시작할 수 있는 화가 없습니다: ' + skip.join(', '));
    if (!confirm(`${go2.map(e => e.number + '화').join(', ')}에 ${kind === 'writers_room' ? '작가실 정리' : '감독 컷 설계'}를 맡깁니다(Claude 비용, 화당 수백 원).${skip.length ? `\n건너뜀: ${skip.join(', ')}` : ''}`)) return;
    const conf = kind === 'director' ? await q(S.sb.from('script_versions').select('id,episode_id,version_no').in('episode_id', go2.map(e => e.id)).eq('status', 'confirmed').order('version_no', { ascending: false })) : [];
    await q(S.sb.from('pipeline_tasks').insert(go2.map(e => ({ kind, episode_id: e.id, payload: kind === 'director' ? { script_version_id: conf.find(v => v.episode_id === e.id)?.id } : {} }))));
    toast(`${go2.length}개 화를 맡겼습니다. 위 제작 현황에서 진행을 볼 수 있습니다`); S.boardOpen = true; renderBoard(); renderPicker(all);
  });
  $('#pkWr').onclick = start('writers_room'); $('#pkDir').onclick = start('director'); upd();
}

async function viewProduction(main) {
  const series = await q(S.sb.from('series').select('id,title,on_hold,hold_note').order('created_at')).catch(() => q(S.sb.from('series').select('id,title').order('created_at')));
  if (!S.seriesId || !series.some(s => s.id === S.seriesId)) S.seriesId = (series.find(s => !s.on_hold) || series[0])?.id || null;
  const curSer = series.find(s => s.id === S.seriesId);
  const episodes = S.seriesId ? await q(S.sb.from('episodes').select('id,number,title,status,hold_note').eq('series_id', S.seriesId).order('number'))
    .catch(() => q(S.sb.from('episodes').select('id,number,title,status').eq('series_id', S.seriesId).order('number'))) : [];
  if (!S.episodeId || !episodes.some(e => e.id === S.episodeId)) S.episodeId = (episodes.find(e => e.status !== 'on_hold') || episodes[0])?.id || null;
  main.innerHTML = `
    <div class="row" style="margin-bottom:12px">
      <h2 style="margin:0 12px 0 0">제작</h2>
      <select id="pSer" style="width:auto">${series.map(s => `<option value="${esc(s.id)}" ${s.id === S.seriesId ? 'selected' : ''}>${esc(s.title)}${s.on_hold ? ' (보류)' : ''}</option>`).join('')}</select>
      ${curSer ? `<button class="btn small" id="pSerHold">${curSer.on_hold ? '이 시리즈 보류 풀기' : '이 시리즈 보류'}</button>` : ''}
      <span class="quiet" id="pSum" style="margin-left:auto"></span>
      ${episodes.length ? `<button class="btn small" id="pMulti">${S.multiOpen ? '여러 화 한꺼번에 ▴' : '여러 화 한꺼번에 ▾'}</button>` : ''}
    </div>
    ${curSer?.on_hold ? `<div class="msg warn">이 시리즈는 보류 중입니다${curSer.hold_note ? ` (${esc(curSer.hold_note)})` : ''}. 새 일은 시작되지 않습니다. 자료는 모두 그대로 있으니 "보류 풀기"로 이어서 만들 수 있습니다.</div>` : ''}
    <div class="epstrip">${episodes.map(e => `<button class="eps ${e.id === S.episodeId ? 'on' : ''}" data-pep="${esc(e.id)}"><b>${e.number}화</b><small data-epst="${esc(e.id)}">&nbsp;</small></button>`).join('') || '<span class="quiet">대본 탭에서 화를 먼저 만드세요</span>'}</div>
    <div id="prodMulti" ${S.multiOpen ? '' : 'hidden'}><div id="prodBoard"></div><div id="prodPick"></div></div>
    <div id="prodPane"><p class="quiet">불러오는 중…</p></div>`;
  renderBoard().catch(console.error); renderPicker(episodes).catch(console.error);
  const pm = $('#pMulti'); if (pm) pm.onclick = () => { S.multiOpen = !S.multiOpen; $('#prodMulti').hidden = !S.multiOpen; pm.textContent = S.multiOpen ? '여러 화 한꺼번에 ▴' : '여러 화 한꺼번에 ▾'; };
  $('#pSer').onchange = e => { S.seriesId = e.target.value; S.episodeId = null; go('production'); };
  const sh = $('#pSerHold'); if (sh) sh.onclick = guard(async () => {
    if (curSer.on_hold) { await q(S.sb.rpc('owner_hold', { p_kind: 'series', p_id: curSer.id, p_on: false })); toast('보류를 풀었습니다'); return go('production'); }
    const note = prompt(`「${curSer.title}」 시리즈를 보류할까요? 대본·바이블·컷·영상은 그대로 두고 대기 중인 일만 취소합니다(진행 중인 일은 끝까지). 기록 탭 '보류함'에서 언제든 꺼낼 수 있어요.\n보류 이유(선택):`, '');
    if (note === null) return;
    const n = await q(S.sb.rpc('owner_hold', { p_kind: 'series', p_id: curSer.id, p_on: true, p_note: note.trim() || null }));
    toast(`보류했습니다${n ? ` · 대기 중이던 일 ${n}건 취소` : ''}`); go('production');
  });
  main.querySelectorAll('[data-pep]').forEach(b => b.onclick = () => { S.episodeId = b.dataset.pep; go('production'); });
  if (S.episodeId) await renderProduction(episodes.find(e => e.id === S.episodeId));
  else $('#prodPane').innerHTML = '';
  if (S.prodTimer) clearInterval(S.prodTimer);
  S.prodTimer = setInterval(() => {
    if (S.tab !== 'production' || !$('#prodPane')) { clearInterval(S.prodTimer); S.prodTimer = null; return; }
    const playing = [...document.querySelectorAll('#prodPane video, #prodPane audio')].some(m => !m.paused);
    if (S.prodBusy && !playing && !document.querySelector('#prodPane :is(input,textarea,select):focus')) renderProduction(episodes.find(e => e.id === S.episodeId), true).catch(() => {});
    renderBoard().catch(() => {});
    if (!document.querySelector('#prodPick :is(input[type=number]):focus') && (S.prodTick = (S.prodTick || 0) + 1) % 2 === 0) renderPicker(episodes).catch(() => {});   // 화별 현황도 16초마다
  }, 8000);
}

async function renderProduction(ep, quietRefresh = false) {
  const pane = $('#prodPane'); if (!pane || !ep) return;
  const seq = S.prodSeq = (S.prodSeq || 0) + 1;   // 늦게 끝난 옛 그리기가 새 화면을 덮어쓰지 않게
  const open = new Set([...pane.querySelectorAll('details[data-scene][open]')].map(d => d.dataset.scene));
  const [versions, cuts, tasks, pkgs, props, agents, costSet, gen] = await Promise.all([
    q(S.sb.from('script_versions').select('id,status,version_no,created_at,note').eq('episode_id', ep.id).order('created_at', { ascending: false })),
    q(S.sb.from('production_cuts').select('*').eq('episode_id', ep.id).order('scene_no').order('cut_no')),
    q(S.sb.from('pipeline_tasks').select('id,kind,status,progress,result,error,scene_no,cut_id,take_id,payload,platform,series_id,episode_id,created_at,started_at,finished_at,devices(name)').eq('episode_id', ep.id).order('created_at', { ascending: false }).limit(40)),
    q(S.sb.from('scene_packages').select('*').eq('episode_id', ep.id)),
    q(S.sb.from('story_proposals').select('id').eq('episode_id', ep.id).eq('status', 'proposed')),
    agentRows(),
    q(S.sb.from('cost_settings').select('krw_per_usd').eq('id', 1).maybeSingle()),
    q(S.sb.from('app_settings').select('key,value').in('key', ['generation', 'storage'])),
  ]);
  const rate = costSet?.krw_per_usd || 1340;
  // PPL 메모가 들어온 뒤에도 그 전에 만든 컷이 남아 있으면 알려 준다(이미 생성된 컷은 비용 때문에 자동으로 다시 만들지 않음)
  const pplNotes = await q(S.sb.from('episode_notes').select('scene_no,content,created_at').eq('episode_id', ep.id).ilike('content', '%PPL%')).catch(() => []);
  try {
    const chars = await q(S.sb.from('bible_entries').select('name,bible_versions(voice_id,status)').eq('series_id', S.seriesId).eq('category', 'character'));
    S.noVoice = chars.filter(c => !(c.bible_versions || []).some(v => v.status === 'active' && v.voice_id)).map(c => c.name);
  } catch { S.noVoice = []; }
  const G = Object.fromEntries(gen.map(r => [r.key, r.value]));
  const takes = cuts.length ? await q(S.sb.from('production_takes').select('*').in('cut_id', cuts.map(c => c.id)).order('take_no')) : [];
  const urls = await signTakeUrls(takes, cuts);
  const confirmed = versions.find(v => v.status === 'confirmed');
  const drafts = versions.filter(v => v.status === 'draft');
  const openTasks = tasks.filter(t => ['queued', 'running'].includes(t.status));
  // 아직 해결 안 된 실패: 같은 일이 그 뒤에 다시 성공·진행 중이면 빼고, 같은 일은 마지막 것만
  const fseen = new Set();
  const failedNow = tasks.filter(t => t.status === 'failed' && !tasks.some(o => o.kind === t.kind && (o.cut_id || null) === (t.cut_id || null) && (o.scene_no || null) === (t.scene_no || null)
      && o.created_at > t.created_at && o.status !== 'failed' && o.status !== 'cancelled'))
    .filter(t => { const k = t.kind + '|' + (t.cut_id || '') + '|' + (t.scene_no || ''); if (fseen.has(k)) return false; fseen.add(k); return true; });
  const seriesTitle = (await q(S.sb.from('series').select('title').eq('id', S.seriesId).maybeSingle()).catch(() => null))?.title || '';
  if (seq !== S.prodSeq || !document.contains(pane)) return;
  S.prodBusy = openTasks.length > 0;
  const online = agents.filter(a => a.alive);
  const hasWin = agents.some(a => a.role === 'server');
  const passed = cuts.filter(c => c.status === 'passed').length;
  const step = !versions.length ? 0 : !confirmed ? 1 : !cuts.length ? 2 : !cuts.some(c => c.status !== 'designed') ? 3 : passed < cuts.length ? 4 : 5;

  const scenes = {};
  cuts.forEach(c => (scenes[c.scene_no] = scenes[c.scene_no] || []).push(c));
  const stale = cuts.filter(c => ['generating', 'reviewing', 'passed', 'failed', 'approved'].includes(c.status)
    && pplNotes.some(n => Number(n.scene_no) === Number(c.scene_no) && new Date(n.created_at) > new Date(c.created_at)));
  const designedCost = cuts.filter(c => ['designed', 'failed', 'hold'].includes(c.status)).reduce((s, c) => s + Number(c.est_usd || 0), 0);
  // 씬 순서: 확정 대본의 씬 전체(컷이 아직 없는 씬도) + 컷이 있는 씬, 번호 순
  const scText = confirmed ? await scriptTextOf(confirmed.id) : '';
  if (seq !== S.prodSeq || !document.contains(pane)) return;
  const scInfo = parseSceneList(scText);
  const sceneNos = [...new Set([...Object.keys(scInfo).map(Number), ...Object.keys(scenes).map(Number)])].filter(n => n > 0 || scenes[n]).sort((a, b) => a - b);
  const totalSec = cuts.reduce((s, c) => s + (c.seconds || 0), 0);
  const busyKinds = new Set(openTasks.map(t => t.kind));
  const inProg = cuts.filter(c => ['approved', 'generating', 'reviewing'].includes(c.status)).length;
  const btn = (id, label, on, primary) => `<button class="btn ${primary ? 'primary' : 'small'}" id="${id}" ${on ? '' : 'disabled'}>${label}</button>`;
  // 감수 현황: 작가실이 가져온 컷(설계 단계)을 제작 전에 감정감수자·영상감수자가 본다
  const toReview = cuts.filter(c => ['designed', 'failed', 'hold'].includes(c.status));
  // 생성된 영상이 있는 컷(통과·불합격 포함) → 영상·음성·감정 감수는 이 컷들만
  const madeCuts = cuts.filter(c => c.best_take_id || takes.some(t => t.cut_id === c.id && (t.files?.preview || t.remote_url)));
  const srTask = tasks.filter(t => t.kind === 'cut_review' && t.payload?.mode === 'script').sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
  let srRes = null; try { srRes = srTask?.status === 'done' ? JSON.parse(srTask.result || 'null') : null; } catch (e) {}
  const srBusy = srTask && ['queued', 'running'].includes(srTask.status);
  const afterBtn = (id, m, label) => btn(id, `${label}${madeCuts.length ? ` (${madeCuts.filter(c => c.reviews?.['after_' + m]).length}/${madeCuts.length})` : ''}`, madeCuts.length > 0, false);
  const B = {
    wr: p => btn('pWr', versions.length ? '작가실 정리 실행' : '작가실 정리(원고 필요)', versions.length, p),
    scr: p => btn('pScr', srBusy ? '대본 감수 중…' : '대본 감수', versions.length > 1 && !srBusy, p),
    avid: () => afterBtn('pAVid', 'video', '영상 감수'), avoi: () => afterBtn('pAVoi', 'voice', '음성 감수'), aemo: () => afterBtn('pAEmo', 'emotion', '감정 감수'),
    prep: p => { const n = toReview.filter(c => ['none', 'failed', 'fix'].includes(c.prep_status)).length;
      return n ? btn('pPrep', `사진·목소리 준비 (${n}컷)`, !busyKinds.has('prep_cut'), p) : ''; },
    dir: p => btn('pDir', `컷 ${cuts.length ? '다시 설계' : '설계'}`, !!confirmed, p),
    ap: p => designedCost ? btn('pApproveAll', `승인 대기 컷 전체 생성 · 예상 ${usdKrw(designedCost, rate)}`, true, p) : '',
    ed: p => passed ? btn('pEdit', `편집실 열기 (통과 ${passed}컷)`, true, p) : '',
  };
  // 다음 할 일: 지금 단계에서 대표가 눌러야 할 것 하나만 크게
  const next = !versions.length ? { t: '대본 탭에서 원고 넣기', d: `${ep.number}화 원고가 아직 없습니다`, go: 'scripts' }
    : busyKinds.has('writers_room') ? { t: '작가실이 정리하는 중', d: '끝나면 대본 탭에서 정리본을 확인·확정합니다' }
    : !confirmed && drafts.length ? { t: '대본 탭에서 정리본 확정', d: `정리본 ${drafts.length}개가 확정을 기다립니다${props.length ? ` · 흐름 변경 제안 ${props.length}건` : ''}`, go: 'scripts' }
    : !confirmed ? { t: '작가실 정리 실행', d: '원고를 장소별 씬으로 나누고 감정선을 다듬습니다 → 확정하면 컷 설계까지 이어집니다(Claude 비용, 수백 원)', k: 'wr' }
    : busyKinds.has('director') ? { t: `감독이 ${ep.number}화 컷을 설계하는 중`, d: '끝나면 아래 씬 순서에 컷이 채워집니다' }

  </div>`
    : `<div class="card quiet">${confirmed ? '확정 대본에서 씬(S#)을 찾지 못했습니다. 대본 탭에서 씬 머리(S#1 | …)를 확인하세요.' : '대본을 확정하면 여기 씬 순서가 나오고, 감독이 씬마다 컷을 설계합니다. 원고만 있으면 "작가실 정리 실행"부터 누르세요.'}</div>`}`;

  const ca = $('#pCloseAll'); if (ca) ca.onclick = () => pane.querySelectorAll('details.scene').forEach(d => { d.open = false; });

    const d = pane.querySelector(`[data-scene="${a.dataset.sgo}"]`); if (!d) return; if (d.tagName === 'DETAILS') d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); });

}

// 확정 대본 글(씬 순서·요약용). 같은 대본은 한 번만 받아 둔다
async function scriptTextOf(id) {
  S.scTxt = S.scTxt || {};
  if (S.scTxt[id] == null) S.scTxt[id] = (await q(S.sb.from('script_versions').select('content').eq('id', id).maybeSingle()).catch(() => null))?.content || '';
  return S.scTxt[id];
}
// 대본에서 씬 목록: { 번호: { time, place, cast, summary } } — "S#3 | 01:08–01:50 | 대기실 | 낮 / 등장: 서윤" 머리 + 첫 문장
function parseSceneList(text) {
  const out = {}; let cur = null, tn = 0;
  const lines = String(text || '').split(/\r?\n/);
  // S# 머리가 없으면 대표 원고 형식 "00:12–00:48 | 장소" 줄을 순서대로 S#1, S#2…로 본다(에이전트와 같은 규칙)
  const timeOnly = !lines.some(l => /^[*#>\[\s]*S#\s*\d+/.test(l.trim()));
  // 나뉜 씬(S#2-1, S#2-2…)이 있거나 번호가 겹치면 씬 순서대로 1, 2, 3…(에이전트와 같은 규칙)
  const sh = lines.map(l => l.trim().match(/^[*#>\[\s]*S#\s*(\d+)((?:\s*-\s*\d+)*)/)).filter(Boolean);
  const renum = sh.some(m => m[2]) || new Set(sh.map(m => m[1])).size !== sh.length;
  for (const raw of lines) {
    const line = raw.trim(); if (!line) continue;
    const tm = timeOnly && line.match(/^[*#>\[\s]*(\d{1,2}:\d{2}(?::\d{2})?\s*[–—\-~]\s*\d{1,2}:\d{2}(?::\d{2})?\s*\|.*)$/);
    const sm = !tm && renum && line.match(/^[*#>\[\s]*S#\s*\d+(?:\s*-\s*\d+)*\s*(.*)$/);
    const m = tm ? [null, String(++tn), '| ' + tm[1]] : sm ? [null, String(++tn), sm[1]] : line.match(/^[*#>\[\s]*S#\s*(\d+)\s*(.*)$/);
    if (m) {
      const parts = m[2].replace(/[*\]]+/g, '').split('|').map(s => s.trim()).filter(Boolean);
      const tail = parts.slice(2).join(' | ');
      const [where, cast] = tail.split(/\/?\s*등장\s*[:：]\s*/);
      cur = out[+m[1]] = out[+m[1]] || { time: parts[0] && /\d/.test(parts[0]) ? parts[0] : '', place: [parts[1] || (parts[0] && !/\d/.test(parts[0]) ? parts[0] : ''), (where || '').replace(/\/\s*$/, '').trim()].filter(Boolean).join(' · '), cast: (cast || '').trim(), summary: '' };
      continue;
    }
    const who = line.match(/^등장\s*[:：]\s*(.+)$/);
    if (cur && who) { if (!cur.cast) cur.cast = who[1].trim(); continue; }
    if (cur && !cur.summary) { const s = line.replace(/^[*>\-\s\[]+/, '').replace(/\]\s*$/, '').replace(/\*\*/g, ''); cur.summary = s.slice(0, 90) + (s.length > 90 ? '…' : ''); }
  }
  return out;
}
// 씬 상태: [글, 색] — 컷이 없으면 설계 전
function sceneState(cs) {
  cs = cs || []; if (!cs.length) return ['설계 전', ''];
  const n = k => cs.filter(c => (Array.isArray(k) ? k : [k]).includes(c.status)).length;
  if (n('failed')) return [`불합격 ${n('failed')}`, 'bad'];
  if (n(['approved', 'generating', 'reviewing'])) return [`영상 만드는 중 ${n('passed')}/${cs.length}`, 'warn'];
  if (n(['designed', 'hold'])) return [`승인 대기 ${n(['designed', 'hold'])}`, 'accent'];
  if (n('passed') === cs.length) return [`완성 ${cs.length}/${cs.length}`, 'good'];
  return [`컷 ${cs.length}`, ''];
}
function sceneCard(no, cs, takes, urls, pkg, rate, hasWin, isOpen, info, last) {
  info = info || {};
  const h = (cs[0]?.scene_heading || pkg?.heading || '').replace(/^\S*S#\s*\d+\s*\|?\s*/, '').split('|').map(s => s.trim()).filter(Boolean);
  const place = info.place || h.slice(1).join(' · ') || h[0] || '';
  const time = info.time || (h[0] && /\d/.test(h[0]) ? h[0] : '');
  const [stLabel, stKind] = sceneState(cs);
  const num = `<div class="num ${stKind} ${last ? 'last' : ''}"><span>S${no}</span></div>`;
  const head = `<div class="sc-head"><span class="pl">${esc(place || `${no}번 씬`)}</span>
      <span class="meta">${[time, cs.length ? `컷 ${cs.length} · ${cs.reduce((s, c) => s + (c.seconds || 0), 0)}초` : '', info.cast ? `등장: ${info.cast}` : ''].filter(Boolean).map(esc).join(' · ')}</span>
      <span class="st ${stKind}">${esc(stLabel)}</span></div>
    ${info.summary || cs[0]?.summary ? `<div class="sc-sum">${esc(info.summary || cs[0].summary)}</div>` : ''}`;
  if (!cs.length) return `${num}<div class="body" data-scene="${no}">${head}</div>`;
  const anyTake = cs.map(c => takes.filter(t => t.cut_id === c.id && t.status !== 'failed').at(-1)).filter(Boolean);
  const winDone = anyTake.filter(t => t.files?.windows).length;
  const voices = anyTake.filter(t => t.files?.voice_preview || t.files?.mac?.voice || t.files?.windows?.voice).length;
  const pend = cs.filter(c => ['designed', 'failed', 'hold'].includes(c.status));
  const cost = pend.reduce((s, c) => s + Number(c.est_usd || 0), 0);
  return `${num}<details class="scene body" data-scene="${no}" ${isOpen ? 'open' : ''}>
    <summary><span class="car"></span>${head}</summary>
    <div class="stems">
      <span class="stem ${anyTake.length === cs.length ? 'ok' : anyTake.length ? 'part' : ''}">영상(무음) ${anyTake.length}/${cs.length}</span>
      <span class="stem ${voices && voices === cs.length ? 'ok' : voices ? 'part' : ''}">대사·현장음 ${voices}/${cs.length}</span>
      <span class="stem" title="음악 생성 도구(ElevenLabs 등) 연결 후 씬마다 따로 만듭니다">배경음악 ${pkg?.bgm?.status === 'ready' ? '준비됨' : '음악 도구 연결 후'}</span>
      <span class="stem ${hasWin && winDone && winDone === anyTake.length ? 'ok' : winDone ? 'part' : ''}">집 PC ${hasWin ? `${winDone}/${anyTake.length}` : '미설치'}</span>
      ${pkg?.folder?.windows ? `<span class="quiet path" title="${esc(pkg.folder.windows)}">${esc(pkg.folder.windows)}</span>` : pkg?.folder?.mac ? `<span class="quiet path" title="${esc(pkg.folder.mac)}">맥: ${esc(pkg.folder.mac)}</span>` : ''}
    </div>
    <div class="row" style="margin:8px 0 10px">
      ${pend.length ? `<button class="btn small primary" data-approve-scene="${no}">이 씬 ${pend.length}컷 생성 승인 · 예상 ${usdKrw(cost, rate)}</button>` : ''}
      <button class="btn small" data-redesign="${no}">이 씬 컷 다시 설계</button>
    </div>
    <div class="cutgrid">${cs.map(c => cutCard(c, takes.filter(t => t.cut_id === c.id), urls, rate)).join('')}</div>
  </details>`;
}

const PREP = { none: ['준비 전', ''], preparing: ['준비 중', 'warn'], ready: ['사진·목소리 확인됨', 'good'], fix: ['감수 지적 있음', 'bad'], failed: ['준비 실패', 'bad'] };
// 컷 설계 ②③: 대사 미리 듣기 + 장면 사진(첫·끝) + 사전 감수
function prepBlock(c, urls) {
  const ff = c.frame_first || {}, fl = c.frame_last || {}, pr = c.prep_review || {};
  const lines = (c.voice_lines || []).length ? c.voice_lines : parseDlg(c.dialogue);
  if (!lines.length && !ff.prompt && c.prep_status === 'none') return '';
  const heard = lines.filter(l => l.path && urls[l.path]).length;
  const [pl, pk] = PREP[c.prep_status] || [c.prep_status, ''];
  const frame = (f, label) => f.path && urls[f.path] ? `<a href="${esc(urls[f.path])}" target="_blank" class="kf"><img src="${esc(urls[f.path])}"><span>${label}</span></a>`
    : f.status === 'failed' ? `<div class="kf ph" title="${esc(f.error || '')}">${label}<br>실패</div>` : f.prompt ? `<div class="kf ph">${label}<br>${c.prep_status === 'preparing' ? '<span class="spin"></span>' : '대기'}</div>` : '';
  const iss = [...((pr.video || {}).issues || []).map(i => '영상감수: ' + i), ...((pr.emotion || {}).issues || []).map(i => '감정감수: ' + i), ...(pr.problems || [])].filter(Boolean);
  return `<div class="prep"><div class="row" style="gap:6px"><b style="font-size:13px">사진·목소리</b>${pill(pl, pk)}${lines.length ? `<span class="quiet">대사 ${heard}/${lines.length}줄 들을 수 있음</span>` : ''}${c.continue_prev ? pill('앞 컷에서 이어짐') : ''}${c.use_end_frame ? pill('끝 장면 고정') : ''}</div>
    ${ff.prompt || fl.prompt ? `<div class="kfs">${frame(ff, '첫 장면')}${c.use_end_frame ? frame(fl, '끝 장면') : ''}</div>` : ''}
    ${lines.map(l => `<div class="vline"><span class="sp">${esc(l.speaker || '')}</span><span class="tx">${esc(l.text || '')}</span>
      ${l.direction || l.tags ? `<span class="quiet dir">${esc(l.direction || '')} ${l.tags ? `<code>${esc(l.tags)}</code>` : ''}</span>` : ''}
      ${l.path && urls[l.path] ? `<audio src="${esc(urls[l.path])}" controls preload="none"></audio>` : l.error ? `<span class="quiet" style="color:var(--bad)">${esc(l.error)}</span>`
        : `<span class="quiet dir">🔊 미리 듣기 ${c.prep_status === 'preparing' ? '만드는 중 <span class="spin"></span>' : '아직 없음'}</span>`}
      ${l.voice_note ? `<span class="quiet dir">🎙 ${esc(l.voice_note)}</span>` : ''}
      ${l.analysis?.per_second?.length ? `<span class="curve" title="1초마다 소리 크기">${l.analysis.per_second.map(p => `<i style="height:${Math.max(8, Math.min(100, (p.db + 50) * 2))}%"></i>`).join('')}</span>` : ''}</div>`).join('')}
    ${pr.summary || iss.length ? `<div class="quiet" style="margin-top:4px">${esc(pr.summary || '')}${iss.length ? `<ul>${iss.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : ''}${(pr.auto_fixed || []).length ? ` · 스스로 고친 것: ${esc(pr.auto_fixed.join(', '))}` : ''}</div>` : ''}
  </div>`;
}

// 컷 대사 → 줄별(화자: 대사). 목소리 준비 전에도 어떤 대사가 들어가는지 보이게
function parseDlg(d) {
  return String(d || '').split('\n').map(s => s.match(/^\s*([^:：]{1,15})[:：]\s*(.+)/)).filter(Boolean)
    .map(m => ({ speaker: m[1].trim(), text: m[2].replace(/\([^)]*\)/g, '').trim(), direction: (m[2].match(/\(([^)]*)\)/g) || []).join(' ') })).filter(l => l.text);
}
// 컷 코드 풀이: E01-S01-C04 → "1화 · 1씬 · 4번째 컷"
function codeMeaning(c) {
  const m = String(c.code || '').match(/E(\d+)\D*S(\d+)\D*C(\d+)/i);
  const [e, s, n] = m ? [+m[1], +m[2], +m[3]] : [null, +c.scene_no, +c.cut_no];
  return `${e ? e + '화 · ' : ''}${s}씬 · ${n}번째 컷`;
}
function cutCard(c, ts, urls, rate) {
  const [label, kind] = CUT_STATUS[c.status] || [c.status, ''];
  const shown = ts.find(t => t.id === c.best_take_id) || ts.filter(t => t.files?.preview || t.files?.poster).at(-1);
  const u = shown ? urls[shown.files?.preview] : null, poster = shown ? urls[shown.files?.poster] : null, voice = shown ? urls[shown.files?.voice_preview] : null;
  const beats = Array.isArray(c.expression_beats) ? c.expression_beats : [];
  const rv = shown?.review;
  const canApprove = ['designed', 'failed', 'hold'].includes(c.status);
  // 카드 안에는 작은 영상 칸을 두지 않는다 → '제작된 영상 보기'를 누르면 크게 띄운다
  const vidTitle = `${c.cut_no}번째 컷 · ${c.seconds}초${shown?.take_no ? ` · 테이크 ${shown.take_no}` : ''}`;
  return `<div class="cut nomedia">
    <div class="body">
      <div class="row chead"><b class="cno" title="${esc(codeMeaning(c))}">${c.cut_no}번째 컷</b><span class="quiet" title="이 컷의 길이">⏱ ${c.seconds}초</span>${pill(label, kind)}
        ${c.status === 'generating' ? `<span class="quiet"><span class="spin"></span> ${esc(etaText('generate'))}</span>` : ''}
        <span class="quiet code" title="${esc(codeMeaning(c))}">${esc(c.code || '')} · ${esc(c.resolution || '')}</span>
        ${shown?.score != null ? pill(shown.score + '점', shown.verdict === 'pass' ? 'good' : 'bad') : ''}</div>
      ${['video', 'voice', 'emotion'].some(m => c.reviews?.['after_' + m]) ? `<div class="rvbadges">${[['video', '영상'], ['voice', '음성'], ['emotion', '감정']].map(([m, nm]) => { const r = c.reviews?.['after_' + m];
        return r ? `<span class="rvb ${r.verdict === 'pass' ? 'ok' : 'bad'}" title="${esc(r.summary || '')}">${nm} ${r.verdict === 'pass' ? '✓' : '⚠'}${r.score != null ? ' ' + r.score + '점' : ''}</span>` : ''; }).join('')}
        ${['video', 'voice', 'emotion'].some(m => (c.reviews?.['after_' + m]?.issues || []).length) ? `<details><summary class="quiet">감수 내용</summary>${[['video', '영상'], ['voice', '음성'], ['emotion', '감정']].filter(([m]) => c.reviews?.['after_' + m]).map(([m, nm]) => { const r = c.reviews['after_' + m];
          return `<div class="quiet"><b>${nm}</b> ${esc(r.summary || '')}${(r.issues || []).length ? `<ul>${r.issues.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>`; }).join('')}</details>` : ''}</div>` : ''}
      <div class="sum">${esc(c.summary || '')}</div>
      ${c.dialogue && !(c.voice_lines || []).length && !parseDlg(c.dialogue).length ? `<div class="dlg">${esc(c.dialogue)}</div>` : ''}
      ${beats.length ? `<div class="beats">${beats.map(b => `<span title="${esc(b.who || '')}"><i>${esc(b.t)}초</i>${esc(b.face || '')}</span>`).join('')}</div>` : ''}
      ${prepBlock(c, urls)}
      ${voice ? `<label style="margin:6px 0 0">영상의 대사·현장음만</label><audio src="${esc(voice)}" controls preload="none"></audio>` : ''}
      ${rv ? `<div class="rv ${shown.verdict === 'pass' ? 'ok' : 'bad'}"><b>영상·소리 감수</b> ${esc(rv.summary || '')}
        ${rv.sound?.heard_text ? `<div class="quiet">들린 대사: "${esc(rv.sound.heard_text)}"</div>` : ''}
        ${(rv.issues || []).length ? `<ul>${rv.issues.map(i => `<li>${esc(i.t ? i.t + ' · ' : '')}${esc(i.problem || '')}${i.fix ? ` → ${esc(i.fix)}` : ''}</li>`).join('')}</ul>` : ''}</div>`
        : c.review?.issues?.length ? `<div class="rv"><b>감정 감수(설계)</b> ${esc(c.review.verdict === 'revised' ? '지적 반영함' : '')}: ${esc(c.review.issues.join(' / '))}</div>` : ''}
      ${c.fix_request ? `<div class="rv"><b>대표 요청</b> ${esc(c.fix_request)}</div>` : ''}
      <details class="more"><summary>프롬프트·참고 사진${ts.length > 1 ? ` · 테이크 ${ts.length}개` : ''}</summary>
        <pre class="doc" style="max-height:220px;font-size:12.5px">${esc(c.prompt || '')}</pre>
        <div class="quiet">참고 사진: ${esc((c.reference_names || []).join(', ') || '없음(글로만 생성)')} · 카메라: ${esc(c.camera || '-')}</div>
        ${c.director_note ? `<div class="quiet">감독 메모: ${esc(c.director_note)}</div>` : ''}
        ${ts.length ? `<table style="margin-top:6px">${ts.map(t => `<tr><td>테이크 ${t.take_no}</td><td>${pill(t.verdict === 'pass' ? '통과' : t.verdict === 'fail' ? '불합격' : t.status, t.verdict === 'pass' ? 'good' : t.verdict === 'fail' || t.status === 'failed' ? 'bad' : '')}</td>
          <td class="quiet">${t.score != null ? t.score + '점 · ' : ''}${usdKrw(t.usd, rate)}${t.files?.windows ? ' · 집 PC 보관' : ''}</td>
          <td>${urls[t.files?.preview] && t.id !== shown?.id ? `<button class="btn small" data-vplay="${esc(urls[t.files.preview])}" data-vposter="${esc(urls[t.files?.poster] || '')}" data-vtitle="${esc(c.cut_no + '번째 컷 · 테이크 ' + t.take_no)}">▶ 보기</button>` : ''}
            ${t.status === 'completed' && t.id !== c.best_take_id ? `<button class="btn small" data-best="${c.id}" data-take="${t.id}">이걸로 채택</button>` : ''}</td></tr>`).join('')}</table>` : ''}
      </details>
      <div class="cacts">
        ${canApprove ? `<button class="btn small primary" data-approve="${c.id}">${ts.length ? '🎬 다시 생성' : '🎬 생성'} · ${usdKrw(c.est_usd, rate)}</button>`
          : c.status === 'approved' ? `<button class="btn small" data-unapprove="${c.id}">생성 대기 · 취소</button>`
          : ['generating', 'reviewing'].includes(c.status) ? `<button class="btn small" disabled><span class="spin"></span> ${c.status === 'generating' ? '생성 중' : '감수 중'}</button>` : ''}
        ${[['video', '영상 감수'], ['voice', '음성 감수'], ['emotion', '감정 감수']].map(([m, l]) => `<button class="btn small" ${u ? `data-after="${m}" data-cut="${c.id}"` : 'disabled title="영상이 생성되면 켜집니다"'}>${l}</button>`).join('')}
        ${['designed', 'failed', 'passed', 'hold'].includes(c.status) ? `<button class="btn small" data-fix="${c.id}" title="감독에게 고칠 점을 적어 보내면 이 컷만 다시 설계합니다">✏️ 보완 요청</button>` : ''}
        <button class="btn small ${(u || poster) && !canApprove ? 'primary' : ''}" ${u || poster ? `data-vplay="${esc(u || '')}" data-vposter="${esc(poster || '')}" data-vtitle="${esc(vidTitle)}"` : 'disabled title="아직 만든 영상이 없습니다"'}>▶ 영상 보기</button>
        ${canApprove ? `<details class="cmore"><summary>⋯</summary><div>
          <button class="btn small" data-prep="${c.id}">${c.prep_status === 'none' ? '사진·목소리 준비' : '사진·목소리 다시'}</button>
          ${c.status === 'designed' ? `<button class="btn small" data-hold="${c.id}">보류</button>` : ''}</div></details>` : ''}
      </div>
    </div>
  </div>`;
}

async function signTakeUrls(takes, cuts = []) {
  const paths = [...new Set([...takes.flatMap(t => [t.files?.preview, t.files?.poster, t.files?.voice_preview]),
    ...cuts.flatMap(c => [c.frame_first?.path, c.frame_last?.path, ...(c.voice_lines || []).map(l => l.path)])].filter(Boolean))];
  if (!paths.length) return {};
  const key = paths.join('|');
  if (S.signCache && S.signCache.key === key && Date.now() - S.signCache.at < 40 * 60 * 1000) return S.signCache.urls;
  const { data } = await S.sb.storage.from('takes').createSignedUrls(paths, 3600);
  const urls = {};
  (data || []).forEach(d => { if (d.signedUrl) urls[d.path] = d.signedUrl; });
  S.signCache = { key, at: Date.now(), urls };
  return urls;
}

function bindProduction(ep, ctx) {
  const pane = $('#prodPane');
  const hasOpen = kind => ctx.tasks.some(t => t.kind === kind && !t.cut_id);
  const addTask = async row => {   // 보류된 시리즈·화면 서버가 일을 바로 취소한다 → '맡겼습니다'로 착각하지 않게 알려 주고 멈춘다
    const r = await q(S.sb.from('pipeline_tasks').insert({ episode_id: ep.id, ...row }).select('id,status').single());
    if (r?.status === 'cancelled') throw new Error('보류 중인 시리즈·화라 일을 맡기지 않았습니다. 보류를 풀고 다시 눌러 주세요');
    return r;
  };
  const again = () => renderProduction(ep).catch(e => toast('오류: ' + errText(e)));
  $('#pSet').onclick = e => { e.preventDefault(); go('settings'); };
  const pe = $('#pEdit'); if (pe) pe.onclick = () => go('edit');
  const pv = $('#pVoice'); if (pv) pv.onclick = e => { e.preventDefault(); go('bible'); };
  $('#pWr').onclick = guard(async () => {
    if (hasOpen('writers_room')) return toast('작가실이 이미 일하고 있습니다');
    if (!confirm('작가실이 원고를 장소별 씬으로 나누고(한 씬 30초 이하), 흐름은 그대로 둔 채 감정선을 다듬은 정리본을 만듭니다.\n정리본을 확정하면 컷 설계까지 바로 이어집니다. 옆의 \'대본 감수\'로 원고와 정리본이 씬 순서대로 빠짐없이 맞는지 확인한 뒤 제작(생성)하세요.\n(Claude 비용, 한 화에 수백 원 수준)')) return;
    await addTask({ kind: 'writers_room', payload: {} }); toast('작가실에 맡겼습니다'); again();
  });
  const ps = $('#pScr'); if (ps) ps.onclick = guard(async () => {
    if (ctx.tasks.some(t => t.kind === 'cut_review' && t.payload?.mode === 'script')) return toast('대본감수자가 이미 감수하고 있습니다');
    if (!confirm('대본감수자가 대표 원고 → 작가실 정리본(→ 컷 설계)이 씬 순서대로 빠짐없이 옮겨졌는지 대조합니다.\n씬 번호·순서, 빠진 씬·대사, 장소별 씬 구분, 컷이 대사를 모두 담았는지 봅니다(Claude 비용, 수백 원).')) return;
    await addTask({ kind: 'cut_review', payload: { mode: 'script' } }); toast('대본 감수를 맡겼습니다'); again();
  });
  const pp1 = $('#pPrep'); if (pp1) pp1.onclick = guard(async () => {
    const todo = ctx.cuts.filter(c => ['designed', 'failed', 'hold'].includes(c.status) && ['none', 'failed', 'fix'].includes(c.prep_status));
    const scenes = [...new Set(todo.map(c => c.scene_no))];
    if (!scenes.length) return toast('준비할 컷이 없습니다');
    if (!confirm(`컷 ${todo.length}개(${scenes.length}씬)의 대사 미리 듣기와 첫 장면 사진을 만듭니다.\n바이블에 목소리가 없는 인물은 추천 목소리로 먼저 들려 드립니다(ElevenLabs·사진 비용 소액).`)) return;
    for (const sc of scenes) await addTask({ kind: 'prep_cut', scene_no: sc, payload: {} });
    toast('사진·목소리 준비를 맡겼습니다'); again();
  });
  // 생성된 영상 감수: 영상(화면)·음성(대사·목소리)·감정. 컷 상태는 바꾸지 않고 결과만 남긴다
  const FOC = { video: '영상', voice: '음성', emotion: '감정' };
  const takeOf = c => c.best_take_id || ctx.takes.filter(t => t.cut_id === c.id && (t.files?.preview || t.remote_url)).at(-1)?.id;
  const runAfter = async (list, mode) => {
    const todo = list.map(c => [c, takeOf(c)]).filter(([, tk]) => tk);
    if (!todo.length) return toast('생성된 영상이 있는 컷이 없습니다');
    const busy = new Set(ctx.tasks.filter(t => t.kind === 'video_review' && t.payload?.mode === mode).map(t => t.cut_id));
    const go1 = todo.filter(([c]) => !busy.has(c.id));
    if (!go1.length) return toast('이미 감수하고 있습니다');
    if (go1.length > 1 && !confirm(`${FOC[mode]} 감수를 컷 ${go1.length}개에 맡깁니다(컷마다 Claude 비용 수십~백 원${mode !== 'video' ? ', 받아쓰기 소액' : ''}).`)) return;
    for (const [c, tk] of go1) await addTask({ kind: 'video_review', scene_no: c.scene_no, cut_id: c.id, take_id: tk, payload: { mode } });
    toast(`${FOC[mode]} 감수를 맡겼습니다`); again();
  };
  [['pAVid', 'video'], ['pAVoi', 'voice'], ['pAEmo', 'emotion']].forEach(([id, m]) => { const b = $('#' + id); if (b) b.onclick = guard(() => runAfter(ctx.cuts.filter(c => takeOf(c)), m)); });
  pane.querySelectorAll('[data-after]').forEach(b => b.onclick = guard(() => runAfter(ctx.cuts.filter(c => c.id === b.dataset.cut), b.dataset.after)));
  $('#pDir').onclick = guard(async () => {
    if (hasOpen('director')) return toast('감독이 이미 컷을 설계하고 있습니다');
    if (ctx.cuts.length && !confirm('승인 전인 컷은 새로 설계합니다. 이미 승인·생성된 컷은 그대로 둡니다. 진행할까요?')) return;
    await addTask({ kind: 'director', payload: { script_version_id: ctx.confirmed.id } }); toast('감독에게 맡겼습니다'); again();
  });
  const approve = async list => {
    const cost = list.reduce((s, c) => s + Number(c.est_usd || 0), 0);
    if (!list.length) return;
    const notReady = list.filter(c => c.prep_status !== 'ready').length;
    if (notReady && !confirm(`${notReady}개 컷은 사진·목소리 확인이 끝나지 않았습니다(준비 전·감수 지적·실패).\n그래도 생성할까요? 사진이 없으면 바이블 사진을 참고로만 만듭니다.`)) return;
    if (!confirm(`컷 ${list.length}개 영상을 생성합니다.\n예상 비용 ${usdKrw(cost, ctx.rate)} (Higgsfield 잔액에서 빠집니다)\n생성 → 영상 감수 → 씬 폴더 보관까지 자동으로 이어집니다.`)) return;
    // 화면이 몇 초 늦어도 같은 컷을 두 번 결제하지 않게: 지금도 대기 상태인 컷만 승인하고, 이미 생성 일이 걸린 컷은 뺀다
    const busy = new Set((await q(S.sb.from('pipeline_tasks').select('cut_id').eq('kind', 'generate').in('status', ['queued', 'running']).in('cut_id', list.map(c => c.id)))).map(r => r.cut_id));
    const ids = list.map(c => c.id).filter(id => !busy.has(id));
    const got = ids.length ? await q(S.sb.from('production_cuts').update({ status: 'approved' }).in('id', ids).in('status', ['designed', 'failed', 'hold']).select('id,scene_no')) : [];
    if (!got.length) { toast('이미 생성 중이거나 승인된 컷입니다'); return again(); }
    const made = await q(S.sb.from('pipeline_tasks').insert(got.map(c => ({ kind: 'generate', episode_id: ep.id, scene_no: c.scene_no, cut_id: c.id }))).select('id,status,cut_id'));
    const held = made.filter(t => t.status === 'cancelled');
    if (held.length) {   // 보류된 시리즈·화: 서버가 일을 취소함 → 컷을 원래대로
      await q(S.sb.from('production_cuts').update({ status: 'designed' }).in('id', held.map(t => t.cut_id)).eq('status', 'approved'));
      toast(`보류 중인 시리즈·화라 ${held.length}개 컷은 생성하지 않았습니다(보류를 풀고 다시 승인)`);
    } else toast(`컷 ${got.length}개 생성을 맡겼습니다`);
    again();
  };
  const pendingOf = arr => arr.filter(c => ['designed', 'failed', 'hold'].includes(c.status));
  const ap = $('#pApproveAll'); if (ap) ap.onclick = guard(() => approve(pendingOf(ctx.cuts)));
  pane.querySelectorAll('[data-approve-scene]').forEach(b => b.onclick = guard(() => approve(pendingOf(ctx.cuts.filter(c => c.scene_no === +b.dataset.approveScene)))));
  pane.querySelectorAll('[data-approve]').forEach(b => b.onclick = guard(() => approve(ctx.cuts.filter(c => c.id === b.dataset.approve))));
  pane.querySelectorAll('[data-prep]').forEach(b => b.onclick = guard(async () => {
    const c = ctx.cuts.find(x => x.id === b.dataset.prep);
    await q(S.sb.from('pipeline_tasks').insert({ kind: 'prep_cut', episode_id: ep.id, scene_no: c.scene_no, cut_id: c.id, payload: { force: true } }));
    toast('장면 사진과 대사 미리 듣기를 만드는 중입니다'); again();
  }));
  pane.querySelectorAll('[data-pplredo]').forEach(b => b.onclick = guard(async () => {
    const sc = +b.dataset.pplredo;
    if (!confirm(`S${sc}의 기존 컷을 버리고 PPL 수정본으로 감독이 다시 설계합니다.\n이미 만든 영상 파일은 폴더에 남지만 제작 화면에서는 사라지고, 새 컷은 다시 생성 승인이 필요합니다(비용).`)) return;
    await q(S.sb.from('production_cuts').update({ status: 'cancelled' }).eq('episode_id', ep.id).eq('scene_no', sc));
    await addTask({ kind: 'director', scene_no: sc, payload: { script_version_id: ctx.confirmed?.id, scenes: [sc] } });
    toast('감독에게 맡겼습니다'); again();
  }));
  pane.querySelectorAll('[data-redesign]').forEach(b => b.onclick = guard(async () => {
    if (!confirm(`S${b.dataset.redesign} 씬의 승인 전 컷을 감독이 다시 설계합니다. 진행할까요?`)) return;
    await addTask({ kind: 'director', scene_no: +b.dataset.redesign, payload: { script_version_id: ctx.confirmed?.id, scenes: [+b.dataset.redesign] } });
    toast('감독에게 맡겼습니다'); again();
  }));
  pane.querySelectorAll('[data-fix]').forEach(b => b.onclick = guard(async () => {
    const c = ctx.cuts.find(x => x.id === b.dataset.fix);
    const auto = ['video', 'voice', 'emotion'].map(m => c.reviews?.['after_' + m]).filter(r => r && r.verdict !== 'pass' && r.fix).map(r => r.fix).join(' / ');
    const text = prompt(`${c.code} — 감독에게 고칠 점을 적어 주세요 (대사는 바뀌지 않습니다)\n예: 린 표정을 더 크게, 카메라를 천천히 다가가게${auto ? '\n(영상·음성·감정 감수 의견을 미리 넣어 두었습니다)' : ''}`, c.fix_request || auto || '');
    if (text == null) return;
    await q(S.sb.from('production_cuts').update({ fix_request: text.trim() || '영상 감수 의견대로 고쳐 주세요', status: c.status === 'passed' ? 'designed' : c.status }).eq('id', c.id));
    await addTask({ kind: 'director', scene_no: c.scene_no, cut_id: c.id, payload: { cut_id: c.id } });
    toast('감독에게 수정 요청을 보냈습니다'); again();
  }));

// ------------------------------------------------------------------
// 편집실: 타임라인(영상·대사·음악·자막) 편집 → 에이전트가 ffmpeg로 조립
// ------------------------------------------------------------------
const ED = { tl: null, proj: null, ep: null, cuts: [], takes: {}, urls: {}, sel: null, pps: 40, t: 0, playing: false,
  hist: [], fut: [], saveTimer: null, saving: false, dirty: false, pollTimer: null, gapTimer: null, raf: 0 };
const rid = p => p + Math.random().toString(36).slice(2, 8);
const r3 = n => Math.round(n * 1000) / 1000;
const fmtT = s => { s = Math.max(0, s || 0); const m = Math.floor(s / 60); return `${String(m).padStart(2, '0')}:${(s - m * 60).toFixed(1).padStart(4, '0')}`; };

function edLayout(tl = ED.tl) {
  let t = 0; const clips = [];
  for (const c of tl.clips || []) {
    const dur = (+c.out || 0) - (+c.in || 0); if (dur < 0.2) continue;
    t += Math.max(0, +c.gap || 0); clips.push({ c, start: t, dur }); t += dur;
  }
  const pos = Object.fromEntries(clips.map(x => [x.c.id, x]));
  const subs = (tl.subs || []).map(s => {
    if (s.clip_id) { const x = pos[s.clip_id]; if (!x) return null; return { s, start: x.start + Math.max(0, +s.rs || 0), end: x.start + Math.min(x.dur, +s.re || x.dur) }; }
    return { s, start: +s.start || 0, end: +s.end || 0 };
  }).filter(x => x && x.end - x.start > 0.05);
  return { clips, subs, total: t, pos };
}

// 대사 → 자막 (화자 이름·괄호 지문 빼고, 컷 길이에 고르게)
function subsFromDialogue(clipId, dialogue, dur) {
  const lines = String(dialogue || '').split('\n').map(l => l.replace(/^\s*[^:：]{1,12}[:：]\s*/, '').replace(/\([^)]*\)|\[[^\]]*\]/g, '').trim()).filter(Boolean);
  if (!lines.length) return [];
  const span = Math.max(0.6, (dur - 0.3) / lines.length);
  return lines.map((text, i) => ({ id: rid('s'), clip_id: clipId, rs: r3(0.15 + i * span), re: r3(Math.min(dur, 0.15 + (i + 1) * span - 0.05)), text }));
}

async function edLoad() {
  const [cuts, proj] = await Promise.all([
    q(S.sb.from('production_cuts').select('id,code,scene_no,cut_no,seconds,status,best_take_id,dialogue,summary,scene_heading').eq('episode_id', ED.ep.id).order('scene_no').order('cut_no')),
    q(S.sb.from('edit_projects').select('*').eq('episode_id', ED.ep.id).maybeSingle()),
  ]);
  ED.cuts = cuts;
  const takes = cuts.length ? await q(S.sb.from('production_takes').select('id,cut_id,take_no,status,verdict,score,seconds,files').in('cut_id', cuts.map(c => c.id)).order('take_no')) : [];
  ED.takes = Object.fromEntries(takes.map(t => [t.id, t]));
  ED.proj = proj; ED.tl = proj?.timeline || { clips: [], music: [], subs: [], settings: {} };
  ['clips', 'music', 'subs'].forEach(k => ED.tl[k] = ED.tl[k] || []); ED.tl.settings = ED.tl.settings || {};
  ED.hist = []; ED.fut = []; ED.sel = null; ED.t = 0;
  await edSign();
  edRender();
  edPollRenders();
}

async function edSign() {
  const paths = new Set();
  Object.values(ED.takes).forEach(t => { if (t.files?.preview) paths.add(t.files.preview); if (t.files?.poster) paths.add(t.files.poster); });
  ED.tl.music.forEach(m => m.path && paths.add(m.path));
  const need = [...paths].filter(p => !ED.urls[p]);
  if (!need.length) return;
  const { data } = await S.sb.storage.from('takes').createSignedUrls(need, 6 * 3600);
  (data || []).forEach(d => { if (d.signedUrl) ED.urls[d.path] = d.signedUrl; });
}

const cutOf = clip => ED.cuts.find(c => c.id === clip.cut_id) || {};
const takeOf = clip => ED.takes[clip.take_id] || {};
const clipCode = clip => (cutOf(clip).code || '').replace(/^E\d+-/, '').replace('-', ' ') || '컷';

// ---------------- 변경·저장·되돌리기
function edChange(fn, { keepSel = true } = {}) {
  ED.hist.push(JSON.stringify(ED.tl)); if (ED.hist.length > 120) ED.hist.shift(); ED.fut = [];
  fn(ED.tl);
  if (!keepSel) ED.sel = null;
  edRefresh(); edQueueSave();
}
// 화면 전체를 다시 그리지 않고 타임라인·자세히 보기만 고친다(재생·스크롤 유지)
function edRefresh() {
  if (!$('#eCanvas') || !ED.tl.clips.length) return edRender();
  edLiveTracks();
  const L = ED.L, cv = $('#eCanvas');
  cv.style.width = Math.ceil(L.total * ED.pps) + 200 + 'px';
  $('#eRuler').innerHTML = edRuler(L.total);
  const sum = $('#eSum'); if (sum) sum.textContent = `${L.clips.length}컷 · ${fmtT(L.total)}`;
  if (ED.t > L.total) ED.t = L.total;
  edInspector(); edUiTime(); edSaveLabel();
  if (!ED.playing) edShowFrame();
}
function edUndo() { if (!ED.hist.length) return toast('되돌릴 것이 없습니다'); ED.fut.push(JSON.stringify(ED.tl)); ED.tl = JSON.parse(ED.hist.pop()); edRefresh(); edQueueSave(); }
function edRedo() { if (!ED.fut.length) return; ED.hist.push(JSON.stringify(ED.tl)); ED.tl = JSON.parse(ED.fut.pop()); edRefresh(); edQueueSave(); }
function edQueueSave() {
  ED.dirty = true; edSaveLabel();
  clearTimeout(ED.saveTimer); ED.saveTimer = setTimeout(edSave, 700);
}
async function edSave() {
  if (!ED.dirty || ED.saving) return;
  ED.saving = true; ED.dirty = false; edSaveLabel();
  try {
    if (!ED.proj) ED.proj = await q(S.sb.from('edit_projects').insert({ episode_id: ED.ep.id, timeline: ED.tl }).select('*').single());
    else ED.proj = await q(S.sb.from('edit_projects').update({ timeline: ED.tl, rev: (ED.proj.rev || 1) + 1, updated_at: new Date().toISOString() }).eq('id', ED.proj.id).select('*').single());
  } catch (e) { ED.dirty = true; toast('저장 실패: ' + errText(e)); }
  ED.saving = false; edSaveLabel();
  if (ED.dirty) edQueueSave();
}
function edSaveLabel() { const el = $('#eSave'); if (el) el.textContent = ED.saving ? '저장 중…' : ED.dirty ? '변경됨' : ED.proj ? `저장됨 · 버전 ${ED.proj.rev}` : ''; }

// ---------------- 구성
function edBuild(onlyPassed = true) {
  const clips = [], subs = [];
  for (const c of ED.cuts) {
    const ts = Object.values(ED.takes).filter(t => t.cut_id === c.id && ['completed', 'stored'].includes(t.status));
    const tk = ED.takes[c.best_take_id] || (!onlyPassed ? ts.at(-1) : null);
    if (!tk) continue;
    const len = +tk.seconds || +c.seconds || 5;
    const id = rid('c');
    clips.push({ id, cut_id: c.id, take_id: tk.id, in: 0, out: len, src_len: len, gap: 0, voice_offset: 0, voice_gain: 1 });
    subs.push(...subsFromDialogue(id, c.dialogue, len));
  }
  return { clips, subs };
}
function edMissing() {
  const inTl = new Set(ED.tl.clips.map(c => c.cut_id));
  return ED.cuts.filter(c => c.best_take_id && ED.takes[c.best_take_id] && !inTl.has(c.id));
}
function edInsertMissing() {
  const miss = edMissing(); if (!miss.length) return;
  edChange(tl => {
    for (const c of miss) {
      const tk = ED.takes[c.best_take_id]; const len = +tk.seconds || +c.seconds || 5; const id = rid('c');
      const key = x => { const cc = ED.cuts.find(y => y.id === x.cut_id) || {}; return (cc.scene_no || 0) * 1000 + (cc.cut_no || 0); };
      const me = c.scene_no * 1000 + c.cut_no;
      let idx = tl.clips.findIndex(x => key(x) > me); if (idx < 0) idx = tl.clips.length;
      tl.clips.splice(idx, 0, { id, cut_id: c.id, take_id: tk.id, in: 0, out: len, src_len: len, gap: 0, voice_offset: 0, voice_gain: 1 });
      tl.subs.push(...subsFromDialogue(id, c.dialogue, len));
    }
  });
  toast(`통과 컷 ${miss.length}개를 제자리에 넣었습니다`);
}

  <div class="ed-top">

        <span id="eTime" class="ed-time">${fmtT(ED.t)} / ${fmtT(L.total)}</span>
        <label class="ed-chk"><input type="checkbox" id="eShowSub" ${ED.showSub !== false ? 'checked' : ''}> 자막</label>
        <span class="seg" id="eMode">${[['full', '전체'], ['voice', '대사만'], ['music', '음악만']].map(([k, l]) => `<button data-mode="${k}" class="${(ED.mode || 'full') === k ? 'on' : ''}">${l}</button>`).join('')}</span>
      </div>
      <div class="quiet ed-note">빠른 재생입니다(대사 위치 이동·음악 페이드는 "정확한 미리보기"에서 확인).</div>
    </div>
    <div class="ed-insp card" id="eInsp"></div>
  </div>
  <div class="card ed-tlcard">
    <div class="row ed-tools">
      <span class="quiet">확대</span><input type="range" id="eZoom" min="4" max="160" value="${ED.pps}" style="width:120px">
      <button class="btn small" id="eFit">전체 보기</button>
