      <div><b class="quiet">단계별</b>${stageTable(d.failed_by_stage)}</div>
    </div>
    ${d.failed_items.length ? `<b class="quiet">실패 내역 (금액 큰 순${d.failed_items.length >= 40 ? ', 상위 40건' : ''})</b><table>
      <tr><th>컷</th><th>단계</th><th>시도</th><th>원인</th><th>이유</th><th style="text-align:right">금액</th></tr>${d.failed_items.map(f => `
      <tr><td style="white-space:nowrap">${esc(f.cut_id || '-')}</td><td>${esc(f.stage)}</td><td>${f.attempt_no ? f.attempt_no + '회차' : '-'}</td>
      <td>${esc(f.cause)}</td><td class="quiet">${esc(f.reason || '')}</td><td style="text-align:right;white-space:nowrap">${won(f.krw)}</td></tr>`).join('')}</table>` : ''}
    <h3>3. 진행 중 · 보류</h3>
    <table><tr><td>진행 중 (결과 대기)</td><td style="text-align:right">${won(t.pending)}</td></tr>
      <tr><td>보류된 컷에 쓴 비용</td><td style="text-align:right">${won(t.hold)}</td></tr></table>
    <h3>4. 합계</h3>
    <table>
      <tr><td>순수 제작비</td><td style="text-align:right">${won(t.pure)}</td></tr>
      <tr><td>+ 실패로 버려진 비용</td><td style="text-align:right">${won(t.leak)}</td></tr>
      <tr><td>+ 진행 중 · 보류</td><td style="text-align:right">${won(t.pending + t.hold)}</td></tr>
      <tr><td><b>총 사용액</b></td><td style="text-align:right"><b>${won(t.total)}</b></td></tr>
      ${d.revenue != null ? `<tr><td>매출</td><td style="text-align:right">${won(d.revenue)}</td></tr>
      <tr><td><b>매출 − 총 사용액</b></td><td style="text-align:right;color:${profit >= 0 ? 'var(--good)' : 'var(--bad)'}"><b>${won(profit)}</b></td></tr>
      <tr><td>매출 대비 비용</td><td style="text-align:right">${d.revenue ? (t.total / d.revenue * 100).toFixed(1) + '%' : '-'}</td></tr>` : ''}
    </table>`;
}

async function viewCosts(main) {
  const [eps, settings, prices] = await Promise.all([
    q(S.sb.from('episodes').select('id,number,title,series(title)').order('number')),
    q(S.sb.from('cost_settings').select('krw_per_usd').eq('id', 1).maybeSingle()),
    q(S.sb.from('price_book').select('*').order('provider').order('model')),
  ]);
  const fx = Number(settings?.krw_per_usd || 1340);
  S.costEp = S.costEp || 'all'; S.costOut = S.costOut || 'all'; S.costPage = S.costPage || 0;
  if (S.costEp !== 'all' && !eps.some(e => e.id === S.costEp)) S.costEp = 'all';
  let qy = S.sb.from('cost_events').select('*').order('occurred_at', { ascending: false }).limit(5000);
  if (S.costEp !== 'all') qy = qy.eq('episode_id', S.costEp);
  const events = await q(qy);
  const ep = eps.find(e => e.id === S.costEp);
  const fin = ep ? await q(S.sb.from('episode_finance').select('*').eq('episode_id', ep.id).maybeSingle()) : null;
  const finals = ep ? await q(S.sb.from('final_invoices').select('id,label,created_at,snapshot').eq('episode_id', ep.id).order('created_at', { ascending: false })) : [];
  const title = ep ? `${ep.series?.title || ''} ${ep.number}화 ${ep.title || ''}`.trim() : '전체 작품';
  const inv = buildInvoice(events, { title, krw_per_usd: fx, revenue: fin?.revenue_krw ?? null });
  const shown = S.costOut === 'all' ? events : events.filter(e => e.outcome === S.costOut);
  const PER = 50, pages = Math.max(1, Math.ceil(shown.length / PER)); if (S.costPage >= pages) S.costPage = 0;
  const pageRows = shown.slice(S.costPage * PER, S.costPage * PER + PER);
  const missing = prices.filter(p => p.usd == null);
  // 완성된 컷만 기준으로: 그 컷들에 영상 생성을 평균 몇 번 했나
  const doneCuts = new Set(events.filter(e => e.stage === 'video' && e.outcome === 'success' && e.cut_id).map(e => e.cut_id));
  const realCuts = doneCuts.size;
  const realTries = realCuts ? events.filter(e => e.stage === 'video' && doneCuts.has(e.cut_id)).length / realCuts : null;
  const aiPerCut = realCuts ? sum(events.filter(e => !['video', 'keyframe', 'fixed'].includes(e.stage))) / realCuts : null;
  const chip = (k, l, n, krw) => `<button class="btn small ${S.costOut === k ? 'primary' : ''}" data-co="${k}">${l} ${n}건 · ${won(krw)}</button>`;

  main.innerHTML = `
  <h2>비용 · 견적서</h2>
  <p class="quiet">모든 지출을 한 줄씩 기록합니다. 최종 결과에 쓰인 비용은 <b>순수 제작비</b>, 실패해서 버려진 비용은 <b>누수</b>로 나눠 봅니다.</p>
  <div class="card noprint"><div class="row">
    <select id="cep" style="width:auto;min-width:200px"><option value="all">전체 작품</option>${eps.map(e =>
      `<option value="${esc(e.id)}" ${e.id === S.costEp ? 'selected' : ''}>${esc(e.series?.title || '')} ${e.number}화 ${esc(e.title || '')}</option>`).join('')}</select>
    <span class="quiet" style="margin-left:auto">환율 1$ =</span><input id="cfx" value="${fx}" inputmode="decimal" style="width:90px"><span class="quiet">원</span>
    <button class="btn small" id="cfxs">환율 저장</button></div></div>
  ${missing.length ? `<div class="msg err noprint" style="background:rgba(183,121,31,.12);color:var(--warn)">단가가 비어 있는 항목 ${missing.length}개(${missing.map(p => esc(p.label || p.model)).join(', ')}): 아래 단가표에서 넣어 주세요. 비어 있으면 그 비용은 0원으로 계산됩니다.</div>` : ''}
  <div class="card" id="invoice">${events.length ? invoiceHtml(inv) : `<h3 style="margin-top:0">견적서 · ${esc(title)}</h3>
    <p class="quiet">아직 기록된 비용이 없습니다. AI 직원과 영상 생성이 시작되면 자동으로 쌓이고, 직접 쓴 비용은 아래에서 손으로 넣을 수 있습니다.</p>`}
    <div class="row noprint" style="margin-top:12px">
      <button class="btn" id="cprint">견적서 인쇄 · PDF</button>
      ${ep ? `<label style="margin:0">매출(원)</label><input id="crev" inputmode="numeric" value="${fin?.revenue_krw ?? ''}" style="width:140px" placeholder="수익화 후 입력">
        <button class="btn small" id="crevs">매출 저장</button>
        <button class="btn primary" id="cfinal" style="margin-left:auto">배포 시점 최종 견적서로 확정</button>` : '<span class="quiet">화를 고르면 매출 입력과 최종 견적서 확정을 할 수 있습니다.</span>'}
    </div>
    ${finals.length ? `<div class="noprint" style="margin-top:10px"><b class="quiet">확정된 최종 견적서</b>${finals.map(f =>
      `<div class="row" style="margin-top:6px"><span>${esc(f.label)}</span><span class="quiet">${fmt(f.created_at)} · ${won(f.snapshot?.totals?.total)}</span>
      <button class="btn small" data-fv="${esc(f.id)}">보기</button></div>`).join('')}</div>` : ''}
  </div>
  <div id="finalView"></div>

  <div class="card noprint">
    <div class="row"><b>비용 장부</b><span class="quiet">최근 것부터</span></div>
    <div class="row" style="margin:10px 0">
      ${chip('all', '전체', events.length, sum(events))}
      ${Object.entries(OUTCOME).map(([k, [l]]) => chip(k, l, events.filter(e => e.outcome === k).length, sum(events.filter(e => e.outcome === k)))).join('')}
    </div>
    ${pageRows.length ? `<table><tr><th>시각</th><th>컷</th><th>단계</th><th class="hide-m">사용량</th><th>결과</th><th class="hide-m">이유</th><th style="text-align:right">금액</th></tr>${pageRows.map(e => `
      <tr><td class="quiet" style="white-space:nowrap">${fmt(e.occurred_at)}</td><td style="white-space:nowrap">${esc(e.cut_id || '-')}${e.attempt_no ? ` <span class="quiet">${e.attempt_no}회차</span>` : ''}</td>
      <td>${esc(STAGE[e.stage] || e.stage)}${e.source === 'manual' ? ' ' + pill('수동') : ''}</td><td class="quiet hide-m">${esc(qtyText(e.qty))}</td>
      <td>${pill(OUTCOME[e.outcome]?.[0] || e.outcome, OUTCOME[e.outcome]?.[1])}</td>
      <td class="quiet hide-m">${esc([CAUSE[e.failure_cause], e.failure_reason, e.note].filter(Boolean).join(' · '))}</td>
      <td style="text-align:right;white-space:nowrap">${won(e.krw)}${e.usd != null ? `<br><span class="quiet">${usdf(e.usd)}</span>` : ''}</td></tr>`).join('')}</table>
      ${pages > 1 ? `<div class="row" style="margin-top:8px"><button class="btn small" id="cprev" ${S.costPage === 0 ? 'disabled' : ''}>이전</button>
        <span class="quiet">${S.costPage + 1} / ${pages}</span><button class="btn small" id="cnext" ${S.costPage >= pages - 1 ? 'disabled' : ''}>다음</button></div>` : ''}`
      : '<p class="quiet">해당하는 기록이 없습니다.</p>'}
  </div>

  <div class="card noprint">
    <b>사전 견적: 만들기 전에 예상 비용 계산</b>
    <p class="quiet" style="margin:4px 0 8px">재시도 횟수와 AI 직원 비용은 쌓인 기록이 있으면 실제 평균을 기본값으로 씁니다.</p>
    <div class="row" style="align-items:flex-end">
      <div style="width:110px"><label>컷 수</label><input id="eCuts" inputmode="numeric" value="40"></div>
      <div style="width:120px"><label>컷 평균 길이(초)</label><input id="eSec" inputmode="decimal" value="10"></div>
      <div style="flex:1;min-width:170px"><label>영상 모델</label><select id="eModel">${prices.filter(p => p.unit === 'per_second').map(p =>
        `<option value="${p.usd ?? 0}">${esc(p.label || p.model)} (${p.usd != null ? '$' + p.usd : '단가 미입력'}/초)</option>`).join('')}</select></div>
      <div style="width:150px"><label>컷당 영상 생성 횟수</label><input id="eTries" inputmode="decimal" value="${realTries ? realTries.toFixed(2) : '1.3'}"></div>
      <div style="width:150px"><label>키프레임 1장($)</label><input id="eKf" inputmode="decimal" value="0"></div>
      <div style="width:170px"><label>AI 직원 비용/컷(원)</label><input id="eAi" inputmode="numeric" value="${aiPerCut ? Math.round(aiPerCut) : 0}"></div>
    </div>
    <div id="eOut" style="margin-top:10px"></div>
  </div>

  <div class="card noprint">
    <b>단가표</b>
    <table style="margin-top:6px"><tr><th>항목</th><th>단위</th><th>단가($)</th><th class="hide-m">출처</th><th></th></tr>${prices.map(p => `
      <tr><td>${esc(p.label || p.model)}<br><span class="quiet">${esc(p.provider)} · ${esc(p.model)}</span></td><td>${UNIT[p.unit] || p.unit}</td>
      <td><input data-pu="${esc(p.id)}" value="${p.usd ?? ''}" placeholder="미입력" inputmode="decimal" style="width:100px"></td>
      <td class="quiet hide-m">${esc(p.source || '')}</td><td><button class="btn small" data-ps="${esc(p.id)}">저장</button></td></tr>`).join('')}</table>
    <div class="row" style="margin-top:10px;align-items:flex-end">
      <div style="width:120px"><label>회사</label><input id="pProv" placeholder="higgsfield"></div>
      <div style="width:150px"><label>모델</label><input id="pModel" placeholder="kling-4.0-720p"></div>
      <div style="width:170px"><label>단위</label><select id="pUnit">${Object.entries(UNIT).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
      <div style="width:110px"><label>단가($)</label><input id="pUsd" inputmode="decimal"></div>
      <div style="flex:1;min-width:140px"><label>표시 이름</label><input id="pLabel"></div>

  <div class="card noprint">

    <p class="quiet" style="margin:4px 0 8px">Higgsfield 웹에서 직접 만든 영상, 구독료처럼 에이전트가 모르는 비용을 넣습니다.</p>
    <div class="row" style="align-items:flex-end">
      <div style="flex:1;min-width:170px"><label>화</label><select id="mEp"><option value="">화 없음(공통)</option>${eps.map(e =>
        `<option value="${esc(e.id)}" ${e.id === S.costEp ? 'selected' : ''}>${esc(e.series?.title || '')} ${e.number}화</option>`).join('')}</select></div>
      <div style="width:140px"><label>컷 ID (선택)</label><input id="mCut" placeholder="E01-S03-C02"></div>
      <div style="width:180px"><label>단계</label><select id="mStage">${Object.entries(STAGE).map(([k, l]) => `<option value="${k}" ${k === 'video' ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div style="width:140px"><label>결과</label><select id="mOut">${Object.entries(OUTCOME).map(([k, [l]]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
      <div style="width:130px"><label>금액</label><input id="mAmt" inputmode="decimal"></div>
      <div style="width:90px"><label>단위</label><select id="mCur"><option value="krw">원</option><option value="usd">$</option></select></div>
    </div>
    <label>메모 / 실패 이유</label><input id="mNote" placeholder="예: Higgsfield 웹에서 직접 생성, 얼굴이 달라서 폐기">
    <div class="row" style="margin-top:8px"><button class="btn primary" id="mAdd">기록</button></div>
  </div>`;

  $('#cep').onchange = e => { S.costEp = e.target.value; S.costPage = 0; go('costs'); };
  main.querySelectorAll('[data-co]').forEach(b => b.onclick = () => { S.costOut = b.dataset.co; S.costPage = 0; go('costs'); });
  if ($('#cprev')) $('#cprev').onclick = () => { S.costPage--; go('costs'); };
  if ($('#cnext')) $('#cnext').onclick = () => { S.costPage++; go('costs'); };
  $('#cfxs').onclick = guard(async () => {
    const v = Number($('#cfx').value); if (!(v > 0)) return toast('환율을 숫자로 넣어 주세요');

    toast('매출을 저장했습니다'); go('costs');
  });
  if ($('#cfinal')) $('#cfinal').onclick = guard(async () => {
    const label = prompt('최종 견적서 이름', `${ep.number}화 배포본 (${new Date().toLocaleDateString('ko-KR')})`); if (!label) return;

  });
  main.querySelectorAll('[data-fv]').forEach(b => b.onclick = () => {
    const f = finals.find(x => x.id === b.dataset.fv);
    $('#finalView').innerHTML = `<div class="card" style="border-color:var(--accent)"><div class="row noprint"><b>확정본: ${esc(f.label)}</b>

    $('#fvClose').onclick = () => { $('#finalView').innerHTML = ''; };
    $('#finalView').scrollIntoView({ behavior: 'smooth' });
  });
  const est = () => {
    const n = id => Number($(id).value) || 0;
    const cuts = n('#eCuts'), sec = n('#eSec'), perSec = n('#eModel'), tries = Math.max(1, n('#eTries')), kf = n('#eKf'), ai = n('#eAi');
    const videoMin = cuts * sec * perSec * fx, video = videoMin * tries, kfCost = cuts * kf * fx * Math.max(1, (tries + 1) / 2), aiCost = cuts * ai;
    const total = video + kfCost + aiCost, ideal = videoMin + cuts * kf * fx + aiCost;
    $('#eOut').innerHTML = `<table>
      <tr><td>영상 생성 (${cuts}컷 × ${sec}초 × ${tries}회)</td><td style="text-align:right">${won(video)}</td></tr>
      <tr><td>키프레임</td><td style="text-align:right">${won(kfCost)}</td></tr>
      <tr><td>AI 직원 (감독·감수·평가)</td><td style="text-align:right">${won(aiCost)}</td></tr>
      <tr><td><b>예상 합계</b></td><td style="text-align:right"><b>${won(total)}</b> <span class="quiet">(${usdf(total / fx)})</span></td></tr>
      <tr><td class="quiet">한 번에 모두 성공했을 때(최소)</td><td style="text-align:right" class="quiet">${won(ideal)}</td></tr>
      <tr><td class="quiet">재시도로 늘어나는 예상 금액</td><td style="text-align:right" class="quiet">${won(total - ideal)}</td></tr></table>
      ${perSec === 0 ? '<p class="quiet">선택한 모델의 단가가 비어 있습니다.</p>' : ''}`;
  };
  ['#eCuts', '#eSec', '#eModel', '#eTries', '#eKf', '#eAi'].forEach(id => $(id).oninput = $(id).onchange = est); est();
  main.querySelectorAll('[data-ps]').forEach(b => b.onclick = guard(async () => {
    const raw = main.querySelector(`[data-pu="${b.dataset.ps}"]`).value.trim();
    const v = raw === '' ? null : Number(raw); if (raw !== '' && !(v >= 0)) return toast('단가를 숫자로 넣어 주세요');
    await q(S.sb.from('price_book').update({ usd: v, updated_at: new Date().toISOString(), source: '대표 입력' }).eq('id', b.dataset.ps));
    toast('단가를 저장했습니다'); go('costs');
  }));
  $('#pAdd').onclick = guard(async () => {
    const provider = $('#pProv').value.trim(), model = $('#pModel').value.trim(); if (!provider || !model) return toast('회사와 모델을 넣어 주세요');
    const usd = $('#pUsd').value.trim() === '' ? null : Number($('#pUsd').value);
    await q(S.sb.from('price_book').insert({ provider, model, unit: $('#pUnit').value, usd, label: $('#pLabel').value.trim() || null, source: '대표 입력' }));
    toast('단가를 추가했습니다'); go('costs');
  });
  $('#mAdd').onclick = guard(async () => {
    const amt = Number($('#mAmt').value.replace(/,/g, '')); if (!(amt > 0)) return toast('금액을 넣어 주세요');
    const usd = $('#mCur').value === 'usd' ? amt : null, krw = $('#mCur').value === 'krw' ? amt : null;
    const out = $('#mOut').value, note = $('#mNote').value.trim() || null;
    await q(S.sb.from('cost_events').insert({ episode_id: $('#mEp').value || null, cut_id: $('#mCut').value.trim() || null, stage: $('#mStage').value,
      outcome: out, usd, krw, source: 'manual', note: out === 'failed' ? null : note, failure_reason: out === 'failed' ? note : null }));
    toast('비용을 기록했습니다'); go('costs');
  });
}

    if ($('#fdev').value) qy = qy.eq('device', $('#fdev').value);
    if ($('#fwho').value === '대표') qy = qy.eq('actor', '대표');
    if ($('#fwho').value === '!대표') qy = qy.neq('actor', '대표');
    const t = $('#ftxt').value.trim().replace(/[%,()]/g, ' ');
    if (t) qy = qy.ilike('summary', `%${t}%`);
    const rows = await q(qy);
    $('#logBox').innerHTML = activityTable(rows);
    $('#fmore').style.display = rows.length < limit ? 'none' : '';
  });
  $('#fgo').onclick = () => { limit = 100; load(); };
  $('#ftxt').onkeydown = e => { if (e.key === 'Enter') { limit = 100; load(); } };
  $('#fdev').onchange = $('#fwho').onchange = () => { limit = 100; load(); };
  $('#fmore').onclick = () => { limit += 100; load(); };
  await load();
}

  ['higgsfield_key_id', 'Higgsfield Key ID', '', '영상 생성에 씁니다. console.higgsfield.ai에서 키를 만들면 ID와 Secret이 나옵니다'],
  ['higgsfield_key_secret', 'Higgsfield Key Secret', '', ''],

];
async function renderKeys() {
  const box = $('#keyBox'); if (!box) return;
  const [meta, agents, cmds] = await Promise.all([
    q(S.sb.from('app_secret_meta').select('*')),

  box.innerHTML = `<b>API 키</b>
    <p class="quiet" style="margin:4px 0 8px">넣은 키는 암호화해 보관하고 화면에는 마지막 4자리만 보입니다. 에이전트만 꺼내 쓸 수 있습니다. 바꾸려면 새 키를 넣고 저장하세요.</p>
    <table>${KEYS.map(([n, label, ph, help]) => `<tr><td style="white-space:nowrap"><b>${label}</b>${help ? `<br><span class="quiet">${help}</span>` : ''}</td>
      <td>${m(n) ? pill('등록됨 …' + m(n).last4, 'good') + `<br><span class="quiet">${fmt(m(n).updated_at)}</span>` : pill('미등록', 'warn')}</td>
      <td><input type="password" autocomplete="off" data-key="${n}" placeholder="${ph || '새 값 붙여 넣기'}" style="min-width:200px"></td></tr>`).join('')}</table>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="kSave">입력한 키 저장</button>
      <button class="btn" id="kTest" ${online.length ? '' : 'disabled'}>연결 시험 (비용 없음)</button>
      <span class="quiet">${online.length ? `시험은 ${esc(online[0].devices?.name || '에이전트')}가 합니다` : '연결 시험은 켜져 있는 에이전트가 있어야 합니다'}</span></div>
    ${last ? `<div class="msg ${last.status === 'done' ? 'ok' : last.status === 'failed' ? 'err' : ''}" style="margin-top:10px">${last.status === 'queued' || last.status === 'sent' ? '시험 중… (15초 안에 결과가 나옵니다)' : esc(last.result || '')}
      <span class="quiet"> · ${fmt(last.done_at || last.created_at)}</span></div>` : ''}`;
  $('#kSave').onclick = guard(async () => {
    const inputs = [...box.querySelectorAll('[data-key]')].filter(i => i.value.trim());
    if (!inputs.length) return toast('저장할 키를 입력하세요');
    for (const i of inputs) await q(S.sb.rpc('set_secret', { p_name: i.dataset.key, p_value: i.value.trim() }));
    toast(`키 ${inputs.length}개를 저장했습니다`); renderKeys();
  });
  $('#kTest').onclick = guard(async () => {
    if (online.some(a => a.version && verNum(a.version) < verNum('1.3.0')) && !online.some(a => verNum(a.version || '0') >= verNum('1.3.0')))
      return toast('에이전트가 아직 v1.3.0이 아닙니다. 에이전트 탭에서 "업데이트"를 눌러 주세요');
    const a = online.find(x => verNum(x.version || '0') >= verNum('1.3.0')) || online[0];
    await q(S.sb.from('agent_commands').insert({ device_id: a.device_id, command: 'test_keys' }));
    toast('연결 시험을 보냈습니다'); renderKeys();
    setTimeout(() => { if (S.tab === 'settings') renderKeys().catch(() => {}); }, 18000);
  });
}

// 제작: 작가실 → 감독 컷 설계 → 생성 승인 → 영상·감수 → 씬별 보관
// ------------------------------------------------------------------
const CUT_STATUS = {
  designed: ['설계됨 · 승인 대기', 'accent'], approved: ['승인 · 생성 대기', 'warn'], generating: ['생성 중', 'warn'],
  reviewing: ['감수 중', 'warn'], passed: ['통과', 'good'], failed: ['불합격·실패', 'bad'], hold: ['보류', ''], cancelled: ['취소', ''],
};
const TASK_LABEL = { assemble: '편집본 조립', edit_command: '말로 편집', voice_cast: '시리즈 목소리 설계', voice_design: '목소리 후보', voice_save: '목소리 저장', writers_room: '작가실 정리', director: '감독 컷 설계', generate: '영상 생성', store: '집 PC 보관', video_review: '영상 감수', bgm: '배경음악' };
const PROD_STEPS = [['원고', '대본 탭에서 넣기'], ['작가실', '감정선 정리본'], ['컷 설계', '감독 + 대본감수'], ['생성 승인', '대표가 컷별로'], ['영상·감수', 'Seedance + 영상감수'], ['씬 보관', '집 PC · OneDrive']];
const usdKrw = (usd, rate) => usd == null ? '-' : won(usd * (rate || 1340));

async function viewProduction(main) {
  const series = await q(S.sb.from('series').select('id,title').order('created_at'));
  if (!S.seriesId || !series.some(s => s.id === S.seriesId)) S.seriesId = series[0]?.id || null;
  const episodes = S.seriesId ? await q(S.sb.from('episodes').select('id,number,title').eq('series_id', S.seriesId).order('number')) : [];
  if (!S.episodeId || !episodes.some(e => e.id === S.episodeId)) S.episodeId = episodes[0]?.id || null;
  main.innerHTML = `
    <div class="row" style="margin-bottom:12px">
      <h2 style="margin:0 12px 0 0">제작</h2>
      <select id="pSer" style="width:auto">${series.map(s => `<option value="${esc(s.id)}" ${s.id === S.seriesId ? 'selected' : ''}>${esc(s.title)}</option>`).join('')}</select>
      <div class="epchips">${episodes.map(e => `<button class="chip ${e.id === S.episodeId ? 'on' : ''}" data-pep="${esc(e.id)}">${e.number}화</button>`).join('') || '<span class="quiet">대본 탭에서 화를 먼저 만드세요</span>'}</div>
    </div>
    <div id="prodPane"><p class="quiet">불러오는 중…</p></div>`;
  $('#pSer').onchange = e => { S.seriesId = e.target.value; S.episodeId = null; go('production'); };
  main.querySelectorAll('[data-pep]').forEach(b => b.onclick = () => { S.episodeId = b.dataset.pep; go('production'); });
  if (S.episodeId) await renderProduction(episodes.find(e => e.id === S.episodeId));
  else $('#prodPane').innerHTML = '';
  if (S.prodTimer) clearInterval(S.prodTimer);
  S.prodTimer = setInterval(() => {
    if (S.tab !== 'production' || !$('#prodPane')) { clearInterval(S.prodTimer); S.prodTimer = null; return; }
    const playing = [...document.querySelectorAll('#prodPane video, #prodPane audio')].some(m => !m.paused);
    if (S.prodBusy && !playing && !document.querySelector('#prodPane :focus')) renderProduction(episodes.find(e => e.id === S.episodeId), true).catch(() => {});
  }, 8000);
}

async function renderProduction(ep, quietRefresh = false) {
  const pane = $('#prodPane'); if (!pane || !ep) return;
  const open = new Set([...pane.querySelectorAll('details[data-scene][open]')].map(d => d.dataset.scene));
  const [versions, cuts, tasks, pkgs, props, agents, costSet, gen] = await Promise.all([
    q(S.sb.from('script_versions').select('id,status,version_no,created_at,note').eq('episode_id', ep.id).order('created_at', { ascending: false })),
    q(S.sb.from('production_cuts').select('*').eq('episode_id', ep.id).order('scene_no').order('cut_no')),
    q(S.sb.from('pipeline_tasks').select('id,kind,status,progress,result,error,scene_no,cut_id,created_at,finished_at,devices(name)').eq('episode_id', ep.id).order('created_at', { ascending: false }).limit(40)),
    q(S.sb.from('scene_packages').select('*').eq('episode_id', ep.id)),
    q(S.sb.from('story_proposals').select('id').eq('episode_id', ep.id).eq('status', 'proposed')),
    agentRows(),
    q(S.sb.from('cost_settings').select('krw_per_usd').eq('id', 1).maybeSingle()),
    q(S.sb.from('app_settings').select('key,value').in('key', ['generation', 'storage'])),
  ]);
  const rate = costSet?.krw_per_usd || 1340;
  try {
    const chars = await q(S.sb.from('bible_entries').select('name,bible_versions(voice_id,status)').eq('series_id', S.seriesId).eq('category', 'character'));
    S.noVoice = chars.filter(c => !(c.bible_versions || []).some(v => v.status === 'active' && v.voice_id)).map(c => c.name);
  } catch { S.noVoice = []; }
  const G = Object.fromEntries(gen.map(r => [r.key, r.value]));
  const takes = cuts.length ? await q(S.sb.from('production_takes').select('*').in('cut_id', cuts.map(c => c.id)).order('take_no')) : [];
  const urls = await signTakeUrls(takes);
  const confirmed = versions.find(v => v.status === 'confirmed');
  const drafts = versions.filter(v => v.status === 'draft');
  const openTasks = tasks.filter(t => ['queued', 'running'].includes(t.status));
  S.prodBusy = openTasks.length > 0;
  const online = agents.filter(a => a.alive);
  const hasWin = agents.some(a => a.role === 'server');
  const passed = cuts.filter(c => c.status === 'passed').length;
  const step = !versions.length ? 0 : !confirmed ? 1 : !cuts.length ? 2 : !cuts.some(c => c.status !== 'designed') ? 3 : passed < cuts.length ? 4 : 5;

  const scenes = {};
  cuts.forEach(c => (scenes[c.scene_no] = scenes[c.scene_no] || []).push(c));
  const designedCost = cuts.filter(c => ['designed', 'failed', 'hold'].includes(c.status)).reduce((s, c) => s + Number(c.est_usd || 0), 0);

  pane.innerHTML = `
  <div class="card">
    <div class="steps" style="grid-template-columns:repeat(6,1fr)">${PROD_STEPS.map(([t, d], i) =>
      `<div class="step ${i < step ? 'done' : i === step ? 'now' : ''}"><div class="dot">${i + 1}</div><div class="t">${t}</div><div class="d">${d}</div></div>`).join('')}</div>
    <div class="row" style="margin-top:12px">
      <button class="btn ${step <= 1 ? 'primary' : ''}" id="pWr" ${versions.length ? '' : 'disabled'}>작가실 정리 실행</button>
      <button class="btn ${step === 2 ? 'primary' : ''}" id="pDir" ${confirmed ? '' : 'disabled'}>감독: 컷 설계${cuts.length ? ' 다시' : ''}</button>
      ${passed ? `<button class="btn ${step >= 4 ? 'primary' : ''}" id="pEdit">편집실 열기 (통과 ${passed}컷)</button>` : ''}
      ${designedCost ? `<button class="btn ${step === 3 ? 'primary' : ''}" id="pApproveAll">승인 대기 컷 전체 생성 (예상 ${usdKrw(designedCost, rate)})</button>` : ''}
      <span class="quiet" style="margin-left:auto">${confirmed ? `대본 v${confirmed.version_no} 확정` : drafts.length ? `초안 ${drafts.length}개 · 확정본 없음` : '원고 없음'}
        ${props.length ? ` · <a href="#scripts" class="warnlink">흐름 변경 제안 ${props.length}건 승인 대기</a>` : ''}</span>
    </div>
    <div class="quiet" style="margin-top:8px">생성 설정: Seedance 2.5 · ${esc(G.generation?.resolution || '480p')} · 화면 ${esc(G.generation?.aspect_ratio || '9:16')} · 배경음악 없이 대사·현장음만
      · 보관: ${hasWin ? '집 PC(OneDrive)' : '<b>집 PC 에이전트 미설치</b> — 생성한 컴퓨터에만 저장'} · <a href="#settings" id="pSet">바꾸기</a></div>
    ${S.noVoice?.length ? `<div class="msg" style="background:var(--accent-soft)">목소리가 정해지지 않은 인물: <b>${esc(S.noVoice.join(', '))}</b> — <a href="#bible" id="pVoice">바이블에서 한꺼번에 만들기</a></div>` : ''}
    ${online.length ? '' : '<div class="msg err">켜져 있는 에이전트가 없습니다. 버튼을 눌러도 에이전트가 켜질 때까지 기다립니다.</div>'}
  </div>

  ${openTasks.length || tasks.length ? `<div class="card"><div class="row"><b>진행 중인 일</b><span class="quiet">8초마다 새로 고침</span></div>
    <table>${tasks.slice(0, openTasks.length ? Math.max(openTasks.length, 3) : 4).map(t => `<tr>
      <td style="white-space:nowrap">${pill(TASK_LABEL[t.kind] || t.kind, t.status === 'failed' ? 'bad' : t.status === 'done' ? 'good' : 'warn')}</td>
      <td>${t.status === 'running' ? '<span class="spin"></span>' : ''}${esc(t.status === 'failed' ? (t.error || '실패') : t.status === 'done' ? (t.result || '완료') : (t.progress || (t.status === 'queued' ? '에이전트 대기 중' : '처리 중')))}</td>
      <td class="quiet hide-m" style="white-space:nowrap">${esc(t.devices?.name || '')} ${fmt(t.finished_at || t.created_at)}</td></tr>`).join('')}</table></div>` : ''}

  ${cuts.length ? Object.entries(scenes).map(([no, cs]) => sceneCard(no, cs, takes, urls, pkgs.find(p => p.scene_no === +no), rate, hasWin, open.has(no) || (!quietRefresh && (Object.keys(scenes).length <= 2 || no === Object.keys(scenes)[0])))).join('')
    : `<div class="card quiet">${confirmed ? '아직 컷이 없습니다. "감독: 컷 설계"를 누르면 감독이 씬마다 4~15초 컷으로 나누고 감정감수자가 감수합니다. (Claude 비용만, 수백 원 수준)' : '대본을 확정하면 감독이 컷을 설계합니다. 원고만 있으면 "작가실 정리 실행"부터 누르세요.'}</div>`}`;

  bindProduction(ep, { confirmed, cuts, tasks: openTasks, rate });
}

function sceneCard(no, cs, takes, urls, pkg, rate, hasWin, isOpen) {
  const head = cs[0]?.scene_heading || pkg?.heading || '';
  const n = k => cs.filter(c => c.status === k).length;
  const best = cs.map(c => takes.find(t => t.id === c.best_take_id)).filter(Boolean);
  const anyTake = cs.map(c => takes.filter(t => t.cut_id === c.id && t.status !== 'failed').at(-1)).filter(Boolean);
  const winDone = anyTake.filter(t => t.files?.windows).length;
  const voices = anyTake.filter(t => t.files?.voice_preview || t.files?.mac?.voice || t.files?.windows?.voice).length;
  const pend = cs.filter(c => ['designed', 'failed', 'hold'].includes(c.status));
  const cost = pend.reduce((s, c) => s + Number(c.est_usd || 0), 0);
  const secs = cs.reduce((s, c) => s + (c.seconds || 0), 0);
  return `<details class="card scene" data-scene="${no}" ${isOpen ? 'open' : ''}>
    <summary><div class="row" style="gap:10px">
      <b>S${String(no).padStart(2, '0')}</b><span>${esc(head.replace(/^S#\d+\s*\|\s*/, ''))}</span>
      <span class="quiet">컷 ${cs.length} · ${secs}초</span>
      <span style="margin-left:auto" class="row">
        ${n('passed') ? pill('통과 ' + n('passed'), 'good') : ''}${n('failed') ? pill('불합격 ' + n('failed'), 'bad') : ''}
        ${n('generating') + n('reviewing') + n('approved') ? pill('진행 ' + (n('generating') + n('reviewing') + n('approved')), 'warn') : ''}
        ${n('designed') ? pill('승인 대기 ' + n('designed'), 'accent') : ''}</span></div>
      <div class="stems">
        <span class="stem ${anyTake.length === cs.length ? 'ok' : anyTake.length ? 'part' : ''}">영상(무음) ${anyTake.length}/${cs.length}</span>
        <span class="stem ${voices && voices === cs.length ? 'ok' : voices ? 'part' : ''}">대사·현장음 ${voices}/${cs.length}</span>
        <span class="stem" title="음악 생성 도구(ElevenLabs 등) 연결 후 씬마다 따로 만듭니다">배경음악 ${pkg?.bgm?.status === 'ready' ? '준비됨' : '음악 도구 연결 후'}</span>
        <span class="stem ${hasWin && winDone && winDone === anyTake.length ? 'ok' : winDone ? 'part' : ''}">집 PC ${hasWin ? `${winDone}/${anyTake.length}` : '미설치'}</span>
        ${pkg?.folder?.windows ? `<span class="quiet path" title="${esc(pkg.folder.windows)}">${esc(pkg.folder.windows)}</span>` : pkg?.folder?.mac ? `<span class="quiet path" title="${esc(pkg.folder.mac)}">맥: ${esc(pkg.folder.mac)}</span>` : ''}
      </div>
    </summary>
    <div class="row" style="margin:6px 0 10px">
      ${pend.length ? `<button class="btn small primary" data-approve-scene="${no}">이 씬 ${pend.length}컷 생성 승인 · 예상 ${usdKrw(cost, rate)}</button>` : ''}
      <button class="btn small" data-redesign="${no}">이 씬 컷 다시 설계</button>
    </div>
    <div class="cutgrid">${cs.map(c => cutCard(c, takes.filter(t => t.cut_id === c.id), urls, rate)).join('')}</div>
  </details>`;
}

function cutCard(c, ts, urls, rate) {
  const [label, kind] = CUT_STATUS[c.status] || [c.status, ''];
  const shown = ts.find(t => t.id === c.best_take_id) || ts.filter(t => t.files?.preview || t.files?.poster).at(-1);
  const u = shown ? urls[shown.files?.preview] : null, poster = shown ? urls[shown.files?.poster] : null, voice = shown ? urls[shown.files?.voice_preview] : null;
  const beats = Array.isArray(c.expression_beats) ? c.expression_beats : [];
  const rv = shown?.review;
  const canApprove = ['designed', 'failed', 'hold'].includes(c.status);
  return `<div class="cut">
    <div class="media">${u ? `<video src="${esc(u)}" ${poster ? `poster="${esc(poster)}"` : ''} controls preload="none" playsinline></video>`
      : poster ? `<img src="${esc(poster)}">` : `<div class="ph">${c.status === 'generating' ? '<span class="spin"></span> 생성 중' : `${c.seconds}초`}</div>`}</div>
    <div class="body">
      <div class="row"><b>${esc(c.code || `C${c.cut_no}`)}</b>${pill(label, kind)}<span class="quiet">${c.seconds}초 · ${esc(c.resolution)}</span>
        ${shown?.score != null ? pill(shown.score + '점', shown.verdict === 'pass' ? 'good' : 'bad') : ''}</div>
      <div class="sum">${esc(c.summary || '')}</div>
      ${c.dialogue ? `<div class="dlg">${esc(c.dialogue)}</div>` : ''}
      ${beats.length ? `<div class="beats">${beats.map(b => `<span title="${esc(b.who || '')}"><i>${esc(b.t)}초</i>${esc(b.face || '')}</span>`).join('')}</div>` : ''}
      ${voice ? `<label style="margin:6px 0 0">대사·현장음만</label><audio src="${esc(voice)}" controls preload="none"></audio>` : ''}
      ${rv ? `<div class="rv ${shown.verdict === 'pass' ? 'ok' : 'bad'}"><b>영상 감수</b> ${esc(rv.summary || '')}
        ${(rv.issues || []).length ? `<ul>${rv.issues.map(i => `<li>${esc(i.t ? i.t + ' · ' : '')}${esc(i.problem || '')}${i.fix ? ` → ${esc(i.fix)}` : ''}</li>`).join('')}</ul>` : ''}</div>`
        : c.review?.issues?.length ? `<div class="rv"><b>대본 감수</b> ${esc(c.review.verdict === 'revised' ? '지적 반영함' : '')}: ${esc(c.review.issues.join(' / '))}</div>` : ''}
      ${c.fix_request ? `<div class="rv"><b>대표 요청</b> ${esc(c.fix_request)}</div>` : ''}
      <details class="more"><summary>프롬프트·참고 사진${ts.length > 1 ? ` · 테이크 ${ts.length}개` : ''}</summary>
        <pre class="doc" style="max-height:220px;font-size:12.5px">${esc(c.prompt || '')}</pre>
        <div class="quiet">참고 사진: ${esc((c.reference_names || []).join(', ') || '없음(글로만 생성)')} · 카메라: ${esc(c.camera || '-')}</div>
        ${c.director_note ? `<div class="quiet">감독 메모: ${esc(c.director_note)}</div>` : ''}
        ${ts.length ? `<table style="margin-top:6px">${ts.map(t => `<tr><td>테이크 ${t.take_no}</td><td>${pill(t.verdict === 'pass' ? '통과' : t.verdict === 'fail' ? '불합격' : t.status, t.verdict === 'pass' ? 'good' : t.verdict === 'fail' || t.status === 'failed' ? 'bad' : '')}</td>
          <td class="quiet">${t.score != null ? t.score + '점 · ' : ''}${usdKrw(t.usd, rate)}${t.files?.windows ? ' · 집 PC 보관' : ''}</td>
          <td>${urls[t.files?.preview] && t.id !== shown?.id ? `<a href="${esc(urls[t.files.preview])}" target="_blank">보기</a>` : ''}

      </details>
      <div class="row" style="margin-top:8px">
        ${canApprove ? `<button class="btn small primary" data-approve="${c.id}">${ts.length ? '다시 생성' : '생성 승인'} · ${usdKrw(c.est_usd, rate)}</button>` : ''}
        ${['designed', 'failed', 'passed', 'hold'].includes(c.status) ? `<button class="btn small" data-fix="${c.id}">감독에게 수정 요청</button>` : ''}
        ${c.status === 'designed' ? `<button class="btn small" data-hold="${c.id}">보류</button>` : ''}
        ${c.status === 'approved' ? `<button class="btn small" data-unapprove="${c.id}">승인 취소</button>` : ''}
      </div>
    </div>
  </div>`;
}

async function signTakeUrls(takes) {
  const paths = [...new Set(takes.flatMap(t => [t.files?.preview, t.files?.poster, t.files?.voice_preview]).filter(Boolean))];
  if (!paths.length) return {};
  const key = paths.join('|');
  if (S.signCache && S.signCache.key === key && Date.now() - S.signCache.at < 40 * 60 * 1000) return S.signCache.urls;
  const { data } = await S.sb.storage.from('takes').createSignedUrls(paths, 3600);
  const urls = {};
  (data || []).forEach(d => { if (d.signedUrl) urls[d.path] = d.signedUrl; });
  S.signCache = { key, at: Date.now(), urls };
  return urls;
}

  pane.querySelectorAll('[data-approve-scene]').forEach(b => b.onclick = guard(() => approve(pendingOf(ctx.cuts.filter(c => c.scene_no === +b.dataset.approveScene)))));
  pane.querySelectorAll('[data-approve]').forEach(b => b.onclick = guard(() => approve(ctx.cuts.filter(c => c.id === b.dataset.approve))));

    toast('감독에게 맡겼습니다'); again();

  pane.querySelectorAll('[data-fix]').forEach(b => b.onclick = guard(async () => {
    const c = ctx.cuts.find(x => x.id === b.dataset.fix);

  }));

    await q(S.sb.from('production_cuts').update({ best_take_id: b.dataset.take, status: 'passed' }).eq('id', b.dataset.best)); toast('채택했습니다'); again();
  }));

// 편집실: 타임라인(영상·대사·음악·자막) 편집 → 에이전트가 ffmpeg로 조립
// ------------------------------------------------------------------
const ED = { tl: null, proj: null, ep: null, cuts: [], takes: {}, urls: {}, sel: null, pps: 40, t: 0, playing: false,
  hist: [], fut: [], saveTimer: null, saving: false, dirty: false, pollTimer: null, gapTimer: null, raf: 0 };
const rid = p => p + Math.random().toString(36).slice(2, 8);
const r3 = n => Math.round(n * 1000) / 1000;
const fmtT = s => { s = Math.max(0, s || 0); const m = Math.floor(s / 60); return `${String(m).padStart(2, '0')}:${(s - m * 60).toFixed(1).padStart(4, '0')}`; };

function edLayout(tl = ED.tl) {
  let t = 0; const clips = [];
  for (const c of tl.clips || []) {
    const dur = (+c.out || 0) - (+c.in || 0); if (dur < 0.2) continue;
    t += Math.max(0, +c.gap || 0); clips.push({ c, start: t, dur }); t += dur;
  }
  const pos = Object.fromEntries(clips.map(x => [x.c.id, x]));
  const subs = (tl.subs || []).map(s => {
    if (s.clip_id) { const x = pos[s.clip_id]; if (!x) return null; return { s, start: x.start + Math.max(0, +s.rs || 0), end: x.start + Math.min(x.dur, +s.re || x.dur) }; }
    return { s, start: +s.start || 0, end: +s.end || 0 };
  }).filter(x => x && x.end - x.start > 0.05);
  return { clips, subs, total: t, pos };
}

// 대사 → 자막 (화자 이름·괄호 지문 빼고, 컷 길이에 고르게)
function subsFromDialogue(clipId, dialogue, dur) {
  const lines = String(dialogue || '').split('\n').map(l => l.replace(/^\s*[^:：]{1,12}[:：]\s*/, '').replace(/\([^)]*\)|\[[^\]]*\]/g, '').trim()).filter(Boolean);
  if (!lines.length) return [];
  const span = Math.max(0.6, (dur - 0.3) / lines.length);
  return lines.map((text, i) => ({ id: rid('s'), clip_id: clipId, rs: r3(0.15 + i * span), re: r3(Math.min(dur, 0.15 + (i + 1) * span - 0.05)), text }));
}

async function edLoad() {
  const [cuts, proj] = await Promise.all([
    q(S.sb.from('production_cuts').select('id,code,scene_no,cut_no,seconds,status,best_take_id,dialogue,summary,scene_heading').eq('episode_id', ED.ep.id).order('scene_no').order('cut_no')),
    q(S.sb.from('edit_projects').select('*').eq('episode_id', ED.ep.id).maybeSingle()),
  ]);
  ED.cuts = cuts;
  const takes = cuts.length ? await q(S.sb.from('production_takes').select('id,cut_id,take_no,status,verdict,score,seconds,files').in('cut_id', cuts.map(c => c.id)).order('take_no')) : [];
  ED.takes = Object.fromEntries(takes.map(t => [t.id, t]));
  ED.proj = proj; ED.tl = proj?.timeline || { clips: [], music: [], subs: [], settings: {} };
  ['clips', 'music', 'subs'].forEach(k => ED.tl[k] = ED.tl[k] || []); ED.tl.settings = ED.tl.settings || {};
  ED.hist = []; ED.fut = []; ED.sel = null; ED.t = 0;
  await edSign();
  edRender();
  edPollRenders();
}

async function edSign() {
  const paths = new Set();
  Object.values(ED.takes).forEach(t => { if (t.files?.preview) paths.add(t.files.preview); if (t.files?.poster) paths.add(t.files.poster); });
  ED.tl.music.forEach(m => m.path && paths.add(m.path));
  const need = [...paths].filter(p => !ED.urls[p]);
  if (!need.length) return;
  const { data } = await S.sb.storage.from('takes').createSignedUrls(need, 6 * 3600);
  (data || []).forEach(d => { if (d.signedUrl) ED.urls[d.path] = d.signedUrl; });
}

const cutOf = clip => ED.cuts.find(c => c.id === clip.cut_id) || {};
const takeOf = clip => ED.takes[clip.take_id] || {};
const clipCode = clip => (cutOf(clip).code || '').replace(/^E\d+-/, '').replace('-', ' ') || '컷';

// ---------------- 변경·저장·되돌리기
function edChange(fn, { keepSel = true } = {}) {
  ED.hist.push(JSON.stringify(ED.tl)); if (ED.hist.length > 120) ED.hist.shift(); ED.fut = [];
  fn(ED.tl);
  if (!keepSel) ED.sel = null;
  edRefresh(); edQueueSave();
}
// 화면 전체를 다시 그리지 않고 타임라인·자세히 보기만 고친다(재생·스크롤 유지)
function edRefresh() {
  if (!$('#eCanvas') || !ED.tl.clips.length) return edRender();
  edLiveTracks();
  const L = ED.L, cv = $('#eCanvas');
  cv.style.width = Math.ceil(L.total * ED.pps) + 200 + 'px';
  $('#eRuler').innerHTML = edRuler(L.total);
  const sum = $('#eSum'); if (sum) sum.textContent = `${L.clips.length}컷 · ${fmtT(L.total)}`;
  if (ED.t > L.total) ED.t = L.total;
  edInspector(); edUiTime(); edSaveLabel();
  if (!ED.playing) edShowFrame();
}
function edUndo() { if (!ED.hist.length) return toast('되돌릴 것이 없습니다'); ED.fut.push(JSON.stringify(ED.tl)); ED.tl = JSON.parse(ED.hist.pop()); edRefresh(); edQueueSave(); }
function edRedo() { if (!ED.fut.length) return; ED.hist.push(JSON.stringify(ED.tl)); ED.tl = JSON.parse(ED.fut.pop()); edRefresh(); edQueueSave(); }
function edQueueSave() {
  ED.dirty = true; edSaveLabel();
  clearTimeout(ED.saveTimer); ED.saveTimer = setTimeout(edSave, 700);
}
async function edSave() {
  if (!ED.dirty || ED.saving) return;
  ED.saving = true; ED.dirty = false; edSaveLabel();
  try {
    if (!ED.proj) ED.proj = await q(S.sb.from('edit_projects').insert({ episode_id: ED.ep.id, timeline: ED.tl }).select('*').single());
    else ED.proj = await q(S.sb.from('edit_projects').update({ timeline: ED.tl, rev: (ED.proj.rev || 1) + 1, updated_at: new Date().toISOString() }).eq('id', ED.proj.id).select('*').single());
  } catch (e) { ED.dirty = true; toast('저장 실패: ' + errText(e)); }
  ED.saving = false; edSaveLabel();
  if (ED.dirty) edQueueSave();
}
function edSaveLabel() { const el = $('#eSave'); if (el) el.textContent = ED.saving ? '저장 중…' : ED.dirty ? '변경됨' : ED.proj ? `저장됨 · 버전 ${ED.proj.rev}` : ''; }

// ---------------- 구성
function edBuild(onlyPassed = true) {
  const clips = [], subs = [];
  for (const c of ED.cuts) {
    const ts = Object.values(ED.takes).filter(t => t.cut_id === c.id && ['completed', 'stored'].includes(t.status));
    const tk = ED.takes[c.best_take_id] || (!onlyPassed ? ts.at(-1) : null);
    if (!tk) continue;
    const len = +tk.seconds || +c.seconds || 5;
    const id = rid('c');
    clips.push({ id, cut_id: c.id, take_id: tk.id, in: 0, out: len, src_len: len, gap: 0, voice_offset: 0, voice_gain: 1 });
    subs.push(...subsFromDialogue(id, c.dialogue, len));
  }
  return { clips, subs };
}
function edMissing() {
  const inTl = new Set(ED.tl.clips.map(c => c.cut_id));
  return ED.cuts.filter(c => c.best_take_id && ED.takes[c.best_take_id] && !inTl.has(c.id));
}
function edInsertMissing() {
  const miss = edMissing(); if (!miss.length) return;
  edChange(tl => {
    for (const c of miss) {
      const tk = ED.takes[c.best_take_id]; const len = +tk.seconds || +c.seconds || 5; const id = rid('c');
      const key = x => { const cc = ED.cuts.find(y => y.id === x.cut_id) || {}; return (cc.scene_no || 0) * 1000 + (cc.cut_no || 0); };
      const me = c.scene_no * 1000 + c.cut_no;
      let idx = tl.clips.findIndex(x => key(x) > me); if (idx < 0) idx = tl.clips.length;
      tl.clips.splice(idx, 0, { id, cut_id: c.id, take_id: tk.id, in: 0, out: len, src_len: len, gap: 0, voice_offset: 0, voice_gain: 1 });
      tl.subs.push(...subsFromDialogue(id, c.dialogue, len));
    }
  });
  toast(`통과 컷 ${miss.length}개를 제자리에 넣었습니다`);
}

      </div>

    <div id="eAskRes" class="quiet" style="margin-top:6px"></div>

function edRuler(total) {
  const step = ED.pps > 60 ? 1 : ED.pps > 25 ? 2 : ED.pps > 12 ? 5 : 10;
  let h = ''; for (let s = 0; s <= total + step; s += step) h += `<span style="left:${s * ED.pps}px">${fmtT(s).replace(/\.0$/, '')}</span>`;
  return h;
}
function edClipBlock(x) {
  const c = x.c, tk = takeOf(c), cut = cutOf(c), poster = ED.urls[tk.files?.poster];
  const sel = ED.sel?.type === 'clip' && ED.sel.id === c.id;
  const warn = cut.best_take_id && cut.best_take_id !== c.take_id ? ' ed-newtake' : tk.verdict !== 'pass' ? ' ed-unpassed' : '';
  return `${+c.gap > 0 ? `<div class="ed-gap" data-gap="${c.id}" style="left:${(x.start - c.gap) * ED.pps}px;width:${c.gap * ED.pps}px" title="정적 ${c.gap}초"></div>` : ''}
    <div class="ed-clip${sel ? ' sel' : ''}${warn}" data-clip="${c.id}" style="left:${x.start * ED.pps}px;width:${Math.max(4, x.dur * ED.pps - 2)}px;${poster ? `background-image:url('${poster}')` : ''}">
      <i class="h l" data-trim="in"></i><span>${esc(clipCode(c))}<small>${x.dur.toFixed(1)}s</small></span><i class="h r" data-trim="out"></i></div>`;
}
function edVoiceBlock(x) {
  const c = x.c, off = +c.voice_offset || 0, g = c.voice_gain ?? 1;
  const sel = ED.sel?.type === 'clip' && ED.sel.id === c.id;
  return `<div class="ed-voice${sel ? ' sel' : ''}${off ? ' moved' : ''}" data-voice="${c.id}" style="left:${(x.start + off) * ED.pps}px;width:${Math.max(4, x.dur * ED.pps - 2)}px;opacity:${0.45 + Math.min(1, g) * 0.55}">
    <span>${off ? (off < 0 ? `◀ ${Math.abs(off).toFixed(1)}s 먼저` : `${off.toFixed(1)}s 나중 ▶`) : ''}${g !== 1 ? ` ${Math.round(g * 100)}%` : ''}</span></div>`;
}
function edMusicBlock(m) {
  const dur = Math.max(0.5, (+m.out || 0) - (+m.in || 0));
  const sel = ED.sel?.type === 'music' && ED.sel.id === m.id;
  return `<div class="ed-music${sel ? ' sel' : ''}" data-music="${m.id}" style="left:${(+m.start || 0) * ED.pps}px;width:${dur * ED.pps}px">
    <i class="h l" data-trim="in"></i><span>♪ ${esc(m.name || '음악')} ${Math.round((m.gain ?? 0.6) * 100)}%</span><i class="h r" data-trim="out"></i></div>`;
}
function edSubBlock(x) {
  const sel = ED.sel?.type === 'sub' && ED.sel.id === x.s.id;
  return `<div class="ed-subb${sel ? ' sel' : ''}" data-sub="${x.s.id}" style="left:${x.start * ED.pps}px;width:${Math.max(4, (x.end - x.start) * ED.pps - 1)}px" title="${esc(x.s.text)}">
    <i class="h l" data-trim="in"></i><span>${esc(x.s.text)}</span><i class="h r" data-trim="out"></i></div>`;
}

// ---------------- 인스펙터(선택한 것 자세히)
function edInspector() {
  const box = $('#eInsp'); if (!box) return;
  const L = ED.L, sel = ED.sel;
  const num = (id, v, step = 0.1, min = '', max = '') => `<div class="ed-num"><button class="btn small" data-nd="${id}" data-d="${-step}">−</button><input id="${id}" type="number" step="${step}" value="${v}" ${min !== '' ? `min="${min}"` : ''} ${max !== '' ? `max="${max}"` : ''}><button class="btn small" data-nd="${id}" data-d="${step}">+</button></div>`;
  if (sel?.type === 'clip') {
    const x = L.clips.find(y => y.c.id === sel.id); if (!x) { ED.sel = null; return edInspector(); }
    const c = x.c, cut = cutOf(c), tk = takeOf(c);
    const ts = Object.values(ED.takes).filter(t => t.cut_id === c.cut_id && ['completed', 'stored'].includes(t.status));
    box.innerHTML = `<div class="row"><b>${esc(cut.code || '컷')}</b>${pill(tk.verdict === 'pass' ? '통과' : tk.verdict === 'fail' ? '불합격' : '감수 전', tk.verdict === 'pass' ? 'good' : tk.verdict === 'fail' ? 'bad' : 'warn')}
        <span class="quiet">타임라인 ${fmtT(x.start)} · ${x.dur.toFixed(1)}초</span></div>
      ${cut.dialogue ? `<div class="dlg" style="margin-top:6px">${esc(cut.dialogue)}</div>` : `<div class="quiet" style="margin-top:6px">${esc(cut.summary || '')}</div>`}
      ${ts.length > 1 ? `<label>테이크</label><select id="iTake">${ts.map(t => `<option value="${t.id}" ${t.id === c.take_id ? 'selected' : ''}>테이크 ${t.take_no}${t.score != null ? ` · ${t.score}점` : ''}${t.id === cut.best_take_id ? ' · 채택' : ''}</option>`).join('')}</select>` : ''}
      ${cut.best_take_id && cut.best_take_id !== c.take_id ? `<div class="msg" style="background:var(--accent-soft)">새로 채택된 테이크가 있습니다 <button class="btn small" id="iBest">바꾸기</button></div>` : ''}
      <div class="ed-grid2">

      <label>이 컷 앞 정적 (검은 화면, 초)</label>${num('iGap', (+c.gap || 0).toFixed(1), 0.5, 0, 10)}
      <label>대사 위치: <b id="iOffV">${edOffLabel(+c.voice_offset || 0)}</b></label>
      <input type="range" id="iOff" min="-2" max="2" step="0.05" value="${+c.voice_offset || 0}">
      <div class="ed-scale"><span>대사 먼저 (앞 컷에 걸침)</span><span>0</span><span>대사 나중</span></div>
      <label>대사·현장음 크기: <b id="iGainV">${Math.round((c.voice_gain ?? 1) * 100)}%</b></label>
      <input type="range" id="iGain" min="0" max="2" step="0.05" value="${c.voice_gain ?? 1}">
      <div class="row" style="margin-top:12px">
        <button class="btn small" id="iPlay">이 컷만 재생</button>
        <button class="btn small" id="iFix">감독에게 다시 요청</button>
        <button class="btn small danger" id="iDel" style="margin-left:auto">이 컷 빼기</button></div>`;
    const setNum = (id, fn) => { const el = $('#' + id); el.onchange = () => edChange(() => fn(+el.value)); };
    setNum('iIn', v => { c.in = r3(Math.max(0, Math.min(+c.out - 0.3, v))); });
    setNum('iOut', v => { c.out = r3(Math.min(+c.src_len || v, Math.max(+c.in + 0.3, v))); });
    setNum('iGap', v => { c.gap = Math.max(0, Math.min(10, r3(v))); });
    box.querySelectorAll('[data-nd]').forEach(b => b.onclick = () => { const el = $('#' + b.dataset.nd); el.value = r3(+el.value + +b.dataset.d); el.onchange(); });
    $('#iSetIn').onclick = () => { const rel = ED.t - x.start; if (rel <= 0 || rel >= x.dur) return toast('재생 위치를 이 컷 안에 두세요'); edChange(() => { c.in = r3(+c.in + rel); }); };
    $('#iSetOut').onclick = () => { const rel = ED.t - x.start; if (rel <= 0 || rel >= x.dur) return toast('재생 위치를 이 컷 안에 두세요'); edChange(() => { c.out = r3(+c.in + rel); }); };
    const off = $('#iOff'); off.oninput = () => { $('#iOffV').textContent = edOffLabel(+off.value); }; off.onchange = () => edChange(() => { c.voice_offset = r3(+off.value); });
    const g = $('#iGain'); g.oninput = () => { $('#iGainV').textContent = Math.round(+g.value * 100) + '%'; }; g.onchange = () => edChange(() => { c.voice_gain = r3(+g.value); });
    const ts2 = $('#iTake'); if (ts2) ts2.onchange = () => edChange(() => { const t = ED.takes[ts2.value]; c.take_id = t.id; c.src_len = +t.seconds || c.src_len; c.out = Math.min(+c.out, c.src_len); });
    const bb = $('#iBest'); if (bb) bb.onclick = () => edChange(() => { const t = ED.takes[cut.best_take_id]; c.take_id = t.id; c.src_len = +t.seconds || c.src_len; c.in = 0; c.out = c.src_len; });
    $('#iPlay').onclick = () => { edSeek(x.start); edPlay(x.start + x.dur); };
    $('#iDel').onclick = () => edDelete();
    $('#iFix').onclick = guard(async () => {
      const text = prompt(`${cut.code} — 감독에게 고칠 점 (대사는 그대로)\n새 테이크가 통과하면 여기 "바꾸기"로 교체할 수 있습니다`, ''); if (!text) return;
      await q(S.sb.from('production_cuts').update({ fix_request: text.trim(), status: 'designed' }).eq('id', cut.id));
      await q(S.sb.from('pipeline_tasks').insert({ kind: 'director', episode_id: ED.ep.id, scene_no: cut.scene_no, cut_id: cut.id, payload: { cut_id: cut.id } }));
      toast('감독에게 보냈습니다. 고친 뒤 제작 탭에서 다시 생성 승인을 눌러 주세요');
    });

        <div><label>음악의 어디부터 (초)</label>${num('mIn', (+m.in).toFixed(1), 0.5, 0)}</div></div>
      <label>음악의 어디까지 (초)</label>${num('mOut', (+m.out).toFixed(1), 0.5, 0, m.src_len || '')}
      <label>크기: <b id="mGainV">${Math.round((m.gain ?? 0.6) * 100)}%</b> <span class="quiet">(대사 밑에 깔리면 30~50% 권장)</span></label>
      <input type="range" id="mGain" min="0" max="1.5" step="0.05" value="${m.gain ?? 0.6}">
      <div class="ed-grid2"><div><label>시작 페이드 (초)</label>${num('mFi', (+m.fade_in || 0).toFixed(1), 0.5, 0, 10)}</div>
        <div><label>끝 페이드 (초)</label>${num('mFo', (+m.fade_out || 0).toFixed(1), 0.5, 0, 10)}</div></div>
      <div class="row" style="margin-top:10px"><button class="btn small" id="mHere">재생 위치에서 시작</button><button class="btn small danger" id="mDel" style="margin-left:auto">음악 빼기</button></div>`;
    const set = (id, fn) => { const el = $('#' + id); el.onchange = () => edChange(() => fn(+el.value)); };
    set('mStart', v => { m.start = Math.max(0, r3(v)); }); set('mIn', v => { m.in = Math.max(0, Math.min(+m.out - 0.5, r3(v))); });

// ---------------- 타임라인 조작(끌기·자르기·선택)

    const b = edBuild(true); edChange(tl => { tl.clips = b.clips; tl.subs = b.subs; }, { keepSel: false }); };
  $('#eMusic').onchange = guard(async e => {

    $('#eAsk').value = ''; $('#eAskRes').innerHTML = '<span class="spin"></span>편집 보조가 읽는 중… (보통 10~20초)';

  const toSec = ev => (ev.clientX - canvas.getBoundingClientRect().left) / ED.pps;
  canvas.onpointerdown = ev => {
    const el = ev.target.closest('[data-clip],[data-voice],[data-music],[data-sub],[data-gap]');
    const trim = ev.target.dataset.trim;
    if (!el) { edSeek(Math.max(0, Math.min(ED.L.total, toSec(ev)))); return; }
    ev.preventDefault();

    const x0 = ev.clientX, snap = JSON.stringify(ED.tl); let moved = false;

    const c = tl.clips.find(y => y.id === id), m = tl.music.find(y => y.id === id), s = tl.subs.find(y => y.id === id);

}

function edSplit() {

// ---------------- 빠른 재생(컷 미리보기 파일을 이어서 재생)
const edMusicEls = {};
function edSeek(t, keepPlay = true) {

}
function edAt(t) { return ED.L.clips.find(x => t >= x.start - 0.0005 && t < x.start + x.dur - 0.02); }
function edShowFrame() {
  const v = $('#eVid'); if (!v) return;
  const x = edAt(ED.t);
  $('#eBlack').hidden = !!x;
  if (!x) { v.style.visibility = 'hidden'; v.pause(); edSyncSub(); return; }
  v.style.visibility = 'visible';
  const url = ED.urls[takeOf(x.c).files?.preview];
  if (!url) { $('#eBlack').hidden = false; $('#eBlack').textContent = '미리보기 파일 없음'; return; }
  if (v.dataset.src !== url) { v.src = url; v.dataset.src = url; }

  const apply = () => { try { v.currentTime = pos; } catch {} };

  edSyncSub();
}
function edSyncSub() {
  const el = $('#eSub'); if (!el) return;
  const s = ED.showSub === false ? null : ED.L.subs.find(x => ED.t >= x.start && ED.t < x.end);

}
function edUiTime() {
  const h = $('#eHead'); if (h) h.style.left = ED.t * ED.pps + 'px';
  const tm = $('#eTime'); if (tm) tm.textContent = `${fmtT(ED.t)} / ${fmtT(ED.L.total)}`;
  const sc = $('#eScroll'); if (sc && ED.playing) { const px = ED.t * ED.pps; if (px < sc.scrollLeft || px > sc.scrollLeft + sc.clientWidth - 40) sc.scrollLeft = px - 60; }
}
function edPlay(stopAt) {

    } else if (!x) { ED.t += (now - last) / 1000; const nx = edAt(ED.t); if (nx) { edShowFrame(); v.play().catch(() => {}); } }

function edMusicSync() {
  for (const m of ED.tl.music) {
    const url = ED.urls[m.path]; if (!url) continue;
    const a = edMusicEls[m.id] || (edMusicEls[m.id] = Object.assign(new Audio(url), { preload: 'auto' }));
    const rel = ED.t - (+m.start || 0), dur = (+m.out || 0) - (+m.in || 0);

}
function edStop() { edPause(); clearInterval(ED.pollTimer); ED.pollTimer = null; edMicOff(); }

// 듣기 방식: 전체 / 대사만 / 음악만 (빠른 재생과 결과물 플레이어 모두)

  const v = $('#eVid'); if (v) v.muted = mode === 'music';

}

// 말로 재생 (비용 없음, 화면에서 바로): 재생·멈춤·대사만·음악만·씬/컷/초로 이동
function edLocalCommand(text) {
  const t = text.replace(/\s+/g, ' ');
  const edit = /(빼|줄여|줄이|늘려|늘리|잘라|자르|옮겨|옮기|넣어|넣고|바꿔|바꾸|키워|낮춰|올려|크게|작게|페이드|정적|순서|지워|삭제|추가|맞춰|당겨|밀어)/.test(t);
  const stop = /(멈춰|멈춤|정지|스톱|그만|일시\s*정지)/.test(t);
  const play = /(재생|틀어|들려|들어|보여|플레이|play|시작)/i.test(t);
  const mode = /대사\s*만|목소리\s*만/.test(t) ? 'voice' : /(배경\s*)?음악\s*만|bgm\s*만/i.test(t) ? 'music' : /(전체|다\s*같이|모두\s*같이|원래대로|섞어서)/.test(t) ? 'full' : null;

  const target = /(미리\s*보기|완성본|결과물)/.test(t) ? 'result' : 'timeline';
  if (stop) { edPause(); const rv = $('#eRVid'); if (rv) rv.pause(); return '멈췄습니다'; }

    const rv = $('#eRVid'); if (!rv) return '아직 결과물이 없습니다';

    if (sc != null && cn != null) x = xs.find(y => cutOf(y.c).scene_no === sc && cutOf(y.c).cut_no === cn);
    else if (sc != null) x = xs.find(y => cutOf(y.c).scene_no === sc);
    else if (/번째/.test(t)) x = xs[cn - 1];
    else x = xs.find(y => cutOf(y.c).cut_no === cn && cutOf(y.c).scene_no === cutOf((edAt(ED.t) || xs[0]).c).scene_no) || xs[cn - 1];
    if (!x) return `${sm ? 'S' + (sm[1] || sm[2]) : ''}${cm ? ' C' + (cm[1] || cm[2]) : ''}을(를) 타임라인에서 찾지 못했습니다`;
    at = x.start; done.unshift(`${clipCode(x.c)}부터`);
    if (cn != null && /(만|하나만|그\s*컷만)/.test(t.replace(/대사\s*만|음악\s*만/g, ''))) { edSeek(at); edPlay(x.start + x.dur); return `${clipCode(x.c)}만 ${done.slice(1).join(' ')} 재생`; }
  } else if (/처음/.test(t)) { at = 0; done.unshift('처음부터'); }
  else if (secm) { at = +secm[1]; done.unshift(`${secm[1]}초부터`); }
  if (at != null) edSeek(at);
  if (play || at != null || mode) { if (!ED.playing) edPlay(); }
  return `${done.join(' ')} 재생`.trim();
}

const AD_KIND = { shorts: '쇼츠', hook: '갈고리 장면', trailer: '예고편', compilation: '몰아보기(합본)', episode: '본편', thumbnail: '썸네일·제목', other: '기타' };

const AD_M = [['impressions', '노출'], ['views', '조회'], ['clicks', '클릭'], ['subs', '구독'], ['watch_hours', '시청 시간(시간)'], ['avg_view_pct', '평균 시청 비율(%)'], ['next_ep_rate', '다음 화 이동(%)'], ['revenue_krw', '광고 수익(원)']];
const n0 = v => +v || 0;
const pct = v => v == null || !isFinite(v) ? '-' : (v * 100).toFixed(1) + '%';
const num = v => v == null || !isFinite(v) ? '-' : Math.round(v).toLocaleString('ko-KR');

function adAgg(runs) {
  const a = { runs: runs.length, spend: 0, impressions: 0, views: 0, clicks: 0, subs: 0, watch_hours: 0, revenue: 0, vpct_w: 0, next_w: 0, first: null, last: null, pviews: 0, psubs: 0, pimp: 0, pclicks: 0, rviews: 0, vv: 0, nv: 0 };
  for (const r of runs) {
    const m = r.metrics || {};
    a.spend += n0(r.spend_krw); a.impressions += n0(m.impressions); a.views += n0(m.views); a.clicks += n0(m.clicks); a.subs += n0(m.subs);
    a.watch_hours += n0(m.watch_hours); a.revenue += n0(m.revenue_krw);
    if (m.avg_view_pct != null) { a.vpct_w += n0(m.avg_view_pct) * n0(m.views); a.vv += n0(m.views); }
    if (m.next_ep_rate != null) { a.next_w += n0(m.next_ep_rate) * n0(m.views); a.nv += n0(m.views); }
    if (n0(r.spend_krw) > 0) { a.pviews += n0(m.views); a.psubs += n0(m.subs); a.pimp += n0(m.impressions); a.pclicks += n0(m.clicks); }
    if (n0(m.revenue_krw) > 0) a.rviews += n0(m.views);
    if (r.started_at && (!a.first || r.started_at < a.first)) a.first = r.started_at;
    const e = r.ended_at || r.started_at; if (e && (!a.last || e > a.last)) a.last = e;
  }
  // 비용 지표는 돈을 쓴 집행만, 수익 지표는 수익이 난 집행만으로 계산
  a.cpv = a.pviews ? a.spend / a.pviews : null; a.cps = a.psubs ? a.spend / a.psubs : null;
  a.ctr = a.pimp ? a.pclicks / a.pimp : null; a.rpm = a.rviews && a.revenue ? a.revenue / a.rviews * 1000 : null;
  a.avg_view = a.vv ? a.vpct_w / a.vv / 100 : null; a.next_ep = a.nv ? a.next_w / a.nv / 100 : null;
  a.roas = a.spend && a.revenue ? a.revenue / a.spend : null;
  return a;
}
// 비교 기준: 수익 집행만 있으면 1,000회당 수익(높을수록), 구독이 있으면 구독당 비용(낮을수록), 아니면 조회당 비용(낮을수록)
function adKey(a) {
  if (a.rpm != null && !a.spend) return { k: 'rpm', v: a.rpm, better: 'high', label: '1,000회당 수익' };
  if (a.cps != null) return { k: 'cps', v: a.cps, better: 'low', label: '구독당 비용' };
  if (a.cpv != null) return { k: 'cpv', v: a.cpv, better: 'low', label: '조회당 비용' };
  return null;
}
function adWinRates(contents, runsBy) {
  const keys = Object.fromEntries(contents.map(c => [c.id, adKey(adAgg(runsBy[c.id] || []))]));
  const out = {};
  for (const c of contents) {
    const me = keys[c.id]; if (!me) { out[c.id] = null; continue; }
    let w = 0, l = 0;
    for (const o of contents) {
      const ot = keys[o.id]; if (o.id === c.id || !ot || ot.k !== me.k) continue;
      if (me.v === ot.v) continue;
      ((me.better === 'low' ? me.v < ot.v : me.v > ot.v) ? w++ : l++);
    }
    out[c.id] = w + l ? { w, l, rate: w / (w + l), key: me } : { w: 0, l: 0, rate: null, key: me };
  }
  return out;
}

  </div>
  ${contents.length ? `<div class="split ad-split">
    <div class="card ad-list">${groups.map(g => `<div class="ad-grp">${g.ep ? `${g.ep.number}화 「${esc(g.ep.title || '')}」` : '시리즈 전체'}</div>
      ${g.items.map(c => { const a = adAgg(runsBy[c.id] || []), wr = wins[c.id], k = adKey(a);
        return `<div class="ad-item ${c.id === S.adSel ? 'on' : ''}" data-ad="${c.id}">
          <div class="row" style="gap:6px"><b>${esc(c.title)}</b></div>
          <div class="row" style="gap:6px;margin-top:3px">${pill(AD_KIND[c.kind] || c.kind)}${pill(...(AD_STATUS[c.status] || [c.status, '']))}
            ${wr?.rate != null ? pill(`승률 ${Math.round(wr.rate * 100)}%`, wr.rate >= 0.5 ? 'good' : 'bad') : ''}</div>
          <div class="quiet" style="margin-top:3px">${a.runs ? `${a.runs}회 · ${won(a.spend)}${k ? ` · ${k.label} ${adKeyText(k)}` : ''}` : '아직 집행 안 함'}</div></div>`; }).join('')}`).join('')}</div>
    <div id="adDetail"></div></div>`
  : `<div class="card ad-emptyc"><h3 style="margin-top:0">아직 광고 콘텐츠가 없습니다</h3>
      <p>쇼츠, 갈고리 장면, 예고편, 몰아보기(합본)처럼 <b>광고나 홍보에 쓰는 영상</b>을 여기서 시리즈·화별로 관리합니다.
      유튜브·Google Ads를 연결하면 광고 담당이 만들고 결과를 자동으로 기록하고, 지금은 <b>+ 광고 콘텐츠</b>로 직접 넣을 수 있습니다.</p></div>`}
  <div id="adForm"></div>`;
  $('#aSer').onchange = e => { S.seriesId = e.target.value; S.adSel = null; go('ads'); };
  $('#aSet').onclick = e => { e.preventDefault(); go('settings'); };
  $('#aNew').onclick = () => adContentForm(episodes);
  main.querySelectorAll('[data-ad]').forEach(el => el.onclick = () => { S.adSel = el.dataset.ad; main.querySelectorAll('.ad-item').forEach(x => x.classList.toggle('on', x === el)); adDetail(); });
  const ctx = { sorted, runsBy, wins, episodes, epOf };
  S.adCtx = ctx;
  adDetail();
}

function adDetail() {
  const box = $('#adDetail'); if (!box) return;
  const { sorted, runsBy, wins, episodes, epOf } = S.adCtx;
  const c = sorted.find(x => x.id === S.adSel); if (!c) { box.innerHTML = ''; return; }
  const runs = runsBy[c.id] || [], a = adAgg(runs), k = adKey(a), wr = wins[c.id];
  const i = sorted.indexOf(c), prev = sorted[i - 1], next = sorted[i + 1];
  const cmpRow = (label, f, fmtv, better) => {
    const me = f(a), cell = o => { if (!o) return '<td class="quiet">-</td>'; const v = f(adAgg(runsBy[o.id] || []));
      if (v == null || me == null) return `<td>${fmtv(v)}</td>`;
      const good = better === 'low' ? me < v : me > v; return `<td>${fmtv(v)} <span class="${me === v ? 'quiet' : good ? 'up' : 'down'}">${me === v ? '=' : good ? '▲ 이쪽이 나음' : '▼'}</span></td>`; };
    return `<tr><td>${label}</td><td><b>${fmtv(me)}</b></td>${cell(prev)}${cell(next)}</tr>`;
  };
  const place = {}; runs.filter(r => r.placement && AD_PLACE[r.placement]).forEach(r => (place[r.placement] = place[r.placement] || []).push(r));
  const rank = sorted.filter(o => wins[o.id]?.rate != null && wins[o.id].key.k === k?.k).sort((x, y) => wins[y.id].rate - wins[x.id].rate);
  const delta = (cur, prv, key, better) => { if (cur == null || prv == null || !prv) return ''; const d = (cur - prv) / prv; const good = better === 'low' ? d < 0 : d > 0;
    return ` <span class="${good ? 'up' : 'down'}">${d > 0 ? '+' : ''}${(d * 100).toFixed(0)}%</span>`; };
  box.innerHTML = `<div class="card">
    <div class="row"><h3 style="margin:0">${esc(c.title)}</h3>${pill(AD_KIND[c.kind] || c.kind)}
      <select id="adStat" style="width:auto;margin-left:auto">${Object.entries(AD_STATUS).map(([s, [l]]) => `<option value="${s}" ${s === c.status ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="quiet" style="margin-top:4px">${epOf(c.episode_id) ? `${epOf(c.episode_id).number}화에서` : '시리즈 전체'} · ${esc(c.created_by || '대표')} · ${fmt(c.created_at)}${c.media?.youtube_id ? ` · <a href="https://youtu.be/${esc(c.media.youtube_id)}" target="_blank">유튜브에서 보기</a>` : ''}</div>
    ${c.description ? `<div class="bdesc">${esc(c.description)}</div>` : ''}

    <h4 class="ad-h">누적 성과 ${a.first ? `<span class="quiet">${a.first} ~ ${a.last || ''}</span>` : ''}</h4>
    ${a.runs ? `<div class="ad-kpis">
      <div><b>${won(a.spend)}</b><span>광고비 (${a.runs}회)</span></div>
      <div><b>${num(a.views)}</b><span>조회 · ${a.cpv != null ? won(a.cpv) : '-'}/회</span></div>
      <div><b>${num(a.subs)}</b><span>구독 · ${a.cps != null ? won(a.cps) : '-'}/명</span></div>
      <div><b>${pct(a.ctr)}</b><span>클릭률</span></div>
      <div><b>${pct(a.avg_view)}</b><span>평균 시청 비율</span></div>
      <div><b>${pct(a.next_ep)}</b><span>다음 화 이동</span></div>
      <div><b>${won(a.revenue)}</b><span>수익 ${a.rpm != null ? `· 1,000회당 ${won(a.rpm)}` : ''}</span></div>
      <div><b>${wr?.rate != null ? Math.round(wr.rate * 100) + '%' : '-'}</b><span>승률 ${wr?.rate != null ? `(${wr.w}승 ${wr.l}패)` : ''}</span></div>
    </div>` : '<p class="quiet">아직 집행 기록이 없습니다. 아래 "+ 집행 기록"으로 넣거나, 광고 연결 후 자동으로 쌓입니다.</p>'}

    <h4 class="ad-h">언제, 어떻게 돌렸고 결과는</h4>
    ${runs.length ? `<div class="ad-runs">${runs.map((r, j) => { const m = r.metrics || {}, ra = adAgg([r]), pa = j ? adAgg([runs[j - 1]]) : null;
      return `<div class="ad-run"><div class="row"><b>${esc(r.started_at || '날짜 미정')}${r.ended_at ? ` ~ ${esc(r.ended_at)}` : ''}</b>
        ${pill(AD_PLATFORM[r.platform] || r.platform, r.platform === 'youtube_monetization' ? 'good' : 'accent')}${pill('목표: ' + (AD_OBJ[r.objective] || r.objective))}
        ${r.placement ? pill(AD_FORM[r.placement] || r.placement) : ''}${r.position_sec != null ? pill(fmtT(+r.position_sec) + ' 위치') : ''}
        ${r.source === 'agent' ? '<span class="quiet">광고 담당 기록</span>' : ''}
        <button class="btn small" data-rdel="${r.id}" style="margin-left:auto">삭제</button></div>
        ${r.targeting ? `<div class="quiet">대상: ${esc(r.targeting)}</div>` : ''}
        <div class="ad-mline">광고비 <b>${won(r.spend_krw)}</b>${r.budget_krw ? ` / 예산 ${won(r.budget_krw)}` : ''} · 노출 ${num(m.impressions)} · 조회 ${num(m.views)}
          · 구독 ${num(m.subs)} · 조회당 <b>${ra.cpv != null ? won(ra.cpv) : '-'}</b>${delta(ra.cpv, pa?.cpv, 'cpv', 'low')}
          · 구독당 <b>${ra.cps != null ? won(ra.cps) : '-'}</b>${delta(ra.cps, pa?.cps, 'cps', 'low')}
          ${m.avg_view_pct != null ? ` · 평균 시청 ${m.avg_view_pct}%` : ''}${m.next_ep_rate != null ? ` · 다음 화 ${m.next_ep_rate}%` : ''}${m.revenue_krw ? ` · 수익 ${won(m.revenue_krw)}` : ''}</div>
        ${r.note ? `<div class="quiet">메모: ${esc(r.note)}</div>` : ''}${j ? '<div class="quiet" style="font-size:12px">% 표시는 바로 앞 집행 대비</div>' : ''}</div>`; }).join('')}</div>` : ''}
    <button class="btn small" id="adRunAdd" style="margin-top:8px">+ 집행 기록</button>

    <h4 class="ad-h">앞뒤 콘텐츠와 비교 <span class="quiet">스토리 순서 기준</span></h4>
    <table class="ad-cmp"><tr><th></th><th>이 콘텐츠</th><th>앞: ${prev ? esc(prev.title) : '-'}</th><th>뒤: ${next ? esc(next.title) : '-'}</th></tr>
      ${cmpRow('조회당 비용', x => x.cpv, v => v == null ? '-' : won(v), 'low')}
      ${cmpRow('구독당 비용', x => x.cps, v => v == null ? '-' : won(v), 'low')}
      ${cmpRow('평균 시청 비율', x => x.avg_view, pct, 'high')}
      ${cmpRow('다음 화 이동', x => x.next_ep, pct, 'high')}
      ${cmpRow('1,000회당 수익', x => x.rpm, v => v == null ? '-' : won(v), 'high')}</table>
    ${Object.keys(place).length ? `<h4 class="ad-h">수익 광고 위치별 비교 (앞·중간·뒤)</h4><table class="ad-cmp"><tr><th>위치</th><th>집행</th><th>1,000회당 수익</th><th>평균 시청 비율</th></tr>
      ${['pre', 'mid', 'post'].filter(p => place[p]).map(p => { const pa = adAgg(place[p]); return `<tr><td>${AD_PLACE[p]}</td><td>${place[p].length}회</td><td>${pa.rpm != null ? won(pa.rpm) : '-'}</td><td>${pct(pa.avg_view)}</td></tr>`; }).join('')}</table>` : ''}

    <h4 class="ad-h">다른 콘텐츠와 비교한 승률</h4>
    ${wr?.rate != null ? `<p style="margin:4px 0">기준: <b>${esc(wr.key.label)}</b>(${wr.key.better === 'low' ? '낮을수록' : '높을수록'} 이김). 같은 기준을 가진 다른 콘텐츠 ${wr.w + wr.l}개와 1:1로 비교해 <b>${wr.w}승 ${wr.l}패, 승률 ${Math.round(wr.rate * 100)}%</b>.</p>
      <table class="ad-cmp"><tr><th>순위</th><th>콘텐츠</th><th>${esc(wr.key.label)}</th><th>승률</th></tr>${rank.map((o, r) => `<tr ${o.id === c.id ? 'class="me"' : ''}><td>${r + 1}</td><td>${esc(o.title)}</td><td>${adKeyText(wins[o.id].key)}</td><td>${Math.round(wins[o.id].rate * 100)}%</td></tr>`).join('')}</table>`
      : '<p class="quiet">비교할 집행 기록이 부족합니다. 같은 목표로 집행한 콘텐츠가 2개 이상 생기면 계산됩니다.</p>'}
    <div class="row" style="margin-top:14px"><button class="btn small" id="adEdit">내용 고치기</button><button class="btn small danger" id="adDel" style="margin-left:auto">콘텐츠 삭제</button></div>
  </div>`;
  $('#adStat').onchange = guard(async e => { await q(S.sb.from('ad_contents').update({ status: e.target.value }).eq('id', c.id)); toast('상태를 바꿨습니다'); go('ads'); });
  $('#adRunAdd').onclick = () => adRunForm(c);
  $('#adEdit').onclick = () => adContentForm(episodes, c);
  $('#adDel').onclick = guard(async () => { if (!confirm(`"${c.title}"과 집행 기록을 모두 삭제할까요?`)) return; await q(S.sb.from('ad_contents').delete().eq('id', c.id)); S.adSel = null; go('ads'); });
  box.querySelectorAll('[data-rdel]').forEach(b => b.onclick = guard(async () => { if (!confirm('이 집행 기록을 삭제할까요?')) return; await q(S.sb.from('ad_runs').delete().eq('id', b.dataset.rdel)); go('ads'); }));
}

function adContentForm(episodes, c) {
  const box = $('#adForm'); if (!box) return;
  box.innerHTML = `<div class="card" style="border-color:var(--accent)"><b>${c ? '광고 콘텐츠 고치기' : '새 광고 콘텐츠'}</b>
    <div class="ed-grid2"><div><label>제목</label><input id="fT" value="${esc(c?.title || '')}" placeholder="예: 1화 공항 갈고리 쇼츠"></div>
      <div><label>종류</label><select id="fK">${Object.entries(AD_KIND).map(([k, l]) => `<option value="${k}" ${k === (c?.kind || 'shorts') ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
    <div class="ed-grid2"><div><label>어느 화(스토리)</label><select id="fE"><option value="">시리즈 전체</option>${episodes.map(e => `<option value="${e.id}" ${e.id === c?.episode_id ? 'selected' : ''}>${e.number}화 ${esc(e.title || '')}</option>`).join('')}</select></div>
      <div><label>유튜브 영상 ID (선택)</label><input id="fY" value="${esc(c?.media?.youtube_id || '')}" placeholder="youtu.be/ 뒤의 11자리"></div></div>
    <label>설명 (어떤 장면·어떤 의도인지)</label><textarea id="fD" style="min-height:70px;font-family:inherit">${esc(c?.description || '')}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="fGo">저장</button><button class="btn" id="fX">취소</button></div></div>`;
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('#fX').onclick = () => { box.innerHTML = ''; };
  $('#fGo').onclick = guard(async () => {
    const title = $('#fT').value.trim(); if (!title) return toast('제목을 적어 주세요');
    const row = { title, kind: $('#fK').value, episode_id: $('#fE').value || null, description: $('#fD').value.trim() || null,
      media: { ...(c?.media || {}), youtube_id: $('#fY').value.trim().replace(/.*(?:youtu\.be\/|v=|shorts\/)/, '').slice(0, 11) || undefined } };
    if (c) await q(S.sb.from('ad_contents').update(row).eq('id', c.id));
    else { const r = await q(S.sb.from('ad_contents').insert({ ...row, series_id: S.seriesId, created_by: '대표' }).select('id').single()); S.adSel = r.id; }
    toast('저장했습니다'); go('ads');
  });
}

function adRunForm(c) {
  const box = $('#adForm'); if (!box) return;
  const today = new Date().toISOString().slice(0, 10);
  box.innerHTML = `<div class="card" style="border-color:var(--accent)"><b>집행 기록 추가 · ${esc(c.title)}</b>
    <p class="quiet" style="margin:4px 0">광고를 연결하면 광고 담당이 자동으로 기록합니다. 지금은 광고 관리자·유튜브 스튜디오 숫자를 옮겨 적으면 됩니다. 모르는 칸은 비워 두세요.</p>
    <div class="ed-grid2"><div><label>어디에</label><select id="rP">${Object.entries(AD_PLATFORM).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
      <div><label>목표</label><select id="rO">${Object.entries(AD_OBJ).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div></div>
    <div class="ed-grid2"><div><label>시작일</label><input id="rS" type="date" value="${today}"></div><div><label>종료일</label><input id="rE" type="date"></div></div>
    <div class="ed-grid2"><div><label>광고 형태·위치</label><select id="rPl"><option value="">-</option><option value="pre">앞 광고</option><option value="mid">중간 광고</option><option value="post">뒤 광고</option>
        <option value="instream">인스트림</option><option value="shorts">쇼츠 피드</option><option value="discovery">검색·추천</option></select></div>
      <div><label>중간 광고 위치(초, 수익 광고일 때)</label><input id="rPos" type="number" step="1"></div></div>
    <label>대상 (나라·나이·관심사)</label><input id="rT" placeholder="예: 한국·일본 18-34 · K팝·드라마 관심">
    <div class="ed-grid2"><div><label>예산(원)</label><input id="rB" type="number"></div><div><label>실제 쓴 돈(원)</label><input id="rSp" type="number"></div></div>
    <div class="ad-mform">${AD_M.map(([k, l]) => `<div><label>${l}</label><input data-m="${k}" type="number" step="any"></div>`).join('')}</div>
    <label>메모</label><input id="rN" placeholder="예: 썸네일 B안, 첫 3초 공항 장면">
    <div class="row" style="margin-top:10px"><button class="btn primary" id="rGo">기록</button><button class="btn" id="rX">취소</button></div></div>`;
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('#rX').onclick = () => { box.innerHTML = ''; };
  $('#rGo').onclick = guard(async () => {
    const metrics = {}; box.querySelectorAll('[data-m]').forEach(i => { if (i.value !== '') metrics[i.dataset.m] = +i.value; });
    const v = id => $('#' + id).value.trim();
    await q(S.sb.from('ad_runs').insert({ content_id: c.id, platform: v('rP'), objective: v('rO'), placement: v('rPl') || null, position_sec: v('rPos') ? +v('rPos') : null,
      targeting: v('rT') || null, started_at: v('rS') || null, ended_at: v('rE') || null, budget_krw: v('rB') ? +v('rB') : null, spend_krw: v('rSp') ? +v('rSp') : null,
      metrics, note: v('rN') || null }));
    toast('기록했습니다'); go('ads');
  });
}

  guide: ['안내 사용법', `<p>회사 구조(누가 무슨 일을 하는지)와 제작 흐름을 그림으로 설명한 페이지입니다. 처음 쓰시거나 흐름이 헷갈릴 때 읽어 보세요.

  scripts: ['대본 사용법', `
