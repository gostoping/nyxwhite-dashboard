  ③ <b>자동 로그인</b>을 켜 두세요(에이전트와 OneDrive는 로그인해야 켜집니다. 정전·업데이트로 재부팅돼도 자동으로 다시 일함),
  ④ Windows 업데이트의 <b>사용 시간</b>을 넓게 지정해 낮에 재부팅하지 않게.</li></ul>
<h4>버튼</h4>
<ul><li><b>연결 시험</b> · <b>일시정지</b>(새 일을 가져가지 않음) · <b>재시작</b> · <b>업데이트</b>(원래는 10분마다 스스로) · <b>설치 명령 다시 받기</b> · <b>연결 해제</b></li></ul>`],

  costs: ['비용 사용법', `
<p>모든 유료 호출(Claude, Seedance, ElevenLabs)이 자동으로 장부에 기록됩니다.</p>
<ul>
<li><b>순수 제작비</b> = 최종 결과에 쓰인 돈, <b>누수</b> = 불합격·실패로 버려진 돈. 누수 비율이 줄어드는지가 감독이 배우고 있는지의 지표입니다.</li>
<li>결과 필터: 성공 · 실패 · 진행 중 · 보류.</li>
<li><b>견적서</b>: 화별 비용을 단계별로 정리해 인쇄·PDF로 뽑을 수 있습니다. 배포할 때 <b>최종 견적서로 확정</b>하면 그 시점 숫자가 고정 보관됩니다.</li>
<li><b>매출</b>을 넣으면 매출 대비 비용이 계산됩니다.</li>
<li><b>사전 견적</b>: 컷 수·길이·재시도 횟수로 만들기 전 예상 비용을 계산합니다.</li>
<li><b>단가표</b>: 공식 가격이 바뀌면 여기서 고칩니다. <b>환율</b>도 여기서.</li>
<li>외부에서 쓴 돈(Suno 구독 등)은 <b>비용 직접 입력</b>으로 넣으세요.</li>
</ul>`],

  log: ['기록 사용법', `<p>대표·AI 직원·컴퓨터가 한 모든 일이 시간순으로 남습니다. 검색어(인물 이름, 컷 번호, "실패" 등)로 찾고 <b>더 보기</b>로 이전 기록을 봅니다.
"언제 누가 바이블을 바꿨지?", "이 컷은 왜 다시 만들었지?"를 확인할 때 씁니다.</p>`],

  settings: ['설정 사용법', `
<ul>
<li><b>이 기기</b> — 이 브라우저의 이름(기록에 "어느 기기에서"로 남음).</li>
<li><b>2단계 인증</b> — 꼭 켜 두세요. 휴대폰 인증 앱 숫자가 있어야 로그인됩니다.</li>
<li><b>브라우저 알림</b> — 다른 창을 보고 있어도 알림 창을 띄웁니다.</li>
<li><b>API 키</b> — Claude·Higgsfield·ElevenLabs 키. 넣은 키는 암호화돼 마지막 4자리만 보입니다. <b>연결 시험</b>은 비용 없이 키만 확인합니다. 키는 채팅에 붙이지 마세요.</li>
<li><b>제작</b> — 해상도(처음엔 480p 권장), 화면 비율(9:16 세로 / 16:9 가로), 집 PC 보관 폴더(OneDrive 안이면 자동 백업), 맥 작업 폴더. 새로 설계하는 컷부터 적용됩니다.</li>
<li><b>작가실</b> — 정리본 자동 확정 켜기/끄기. 켜면 흐름 변경 제안이 없는 정리본은 바로 확정되고 감독 컷 설계로 이어집니다.</li>
<li><b>배포</b> — 공개 시점·편수를 배포 담당이 시청자 반응을 보고 스스로 정할지(기본 켬), 하루 최대 편수(알림 한도 때문에 3 이하), 기본 시간, 재고 최소 일수. 공개할 수 있는 것은 대표가 확정한 완성본뿐입니다.</li>
<li><b>광고</b> — 월 광고 한도. 0원이면 돈이 드는 제안은 하지 않습니다.</li>
<li><b>다국어</b> — 언어별 등급(마스터 / 립싱크 / 더빙 / 자막 / 사용 안 함).</li>
</ul>`],
};

function openHelp() {
  const [title, html] = HELP[S.tab] || ['사용법', '<p>이 화면의 설명이 아직 없습니다.</p>'];
  closeHelp();
  const d = document.createElement('div'); d.id = 'helpDrawer'; d.className = 'helpdrawer';
  d.innerHTML = `<div class="hhead"><b>${esc(title)}</b>
      <select id="hTab" style="width:auto;margin-left:auto">${TABS.map(([k, l]) => `<option value="${k}" ${k === S.tab ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
      <button class="btn small" id="hClose">닫기</button></div><div class="hbody">${html}</div>`;
  const bg = document.createElement('div'); bg.id = 'helpBg'; bg.className = 'helpbg'; bg.onclick = closeHelp;
  document.body.append(bg, d);
  $('#hClose').onclick = closeHelp;
  $('#hTab').onchange = e => { const [t, h] = HELP[e.target.value] || ['사용법', '']; d.querySelector('.hhead b').textContent = t; d.querySelector('.hbody').innerHTML = h; d.querySelector('.hbody').scrollTop = 0; };
}
function closeHelp() { $('#helpDrawer')?.remove(); $('#helpBg')?.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHelp(); });

// ------------------------------------------------------------------
// 설정: 기기, 2단계 인증, 로그아웃
// ------------------------------------------------------------------
async function viewSettings(main) {
  const factors = await S.sb.auth.mfa.listFactors();
  const verified = factors.data?.totp?.filter(f => f.status === 'verified') || [];
  main.innerHTML = `
  <h2>설정</h2>
  <div class="card"><b>이 기기</b><p>${esc(S.device.name)} <span class="quiet">(${esc(S.device.kind)})</span></p>
    <button class="btn small" id="chdev">다른 기기 이름으로 바꾸기</button></div>
  <div class="card"><b>2단계 인증</b>
    ${verified.length ? `<p>${pill('켜짐', 'good')} 로그인할 때 인증 앱 숫자를 함께 입력합니다.</p>`
      : `<p>${pill('꺼짐', 'bad')} 휴대폰 인증 앱(Google Authenticator 등)으로 켜 두세요. 대본과 모든 기록을 보호합니다.</p>
         <button class="btn primary" id="mfa">2단계 인증 켜기</button>`}
    <div id="mfaBox"></div></div>
  <div class="card"><b>브라우저 알림</b>
    <p class="quiet">이 화면이 열려 있지만 다른 창을 보고 있을 때도 알림 창을 띄웁니다. 화면을 완전히 닫았을 때의 휴대폰 알림은 다음 단계(푸시 알림)에서 추가됩니다.</p>
    <div class="row">${'Notification' in window ? (Notification.permission === 'granted' ? pill('허용됨', 'good')
      : `<button class="btn" id="perm">알림 허용하기</button>`) : '<span class="quiet">이 브라우저는 알림을 지원하지 않습니다.</span>'}</div></div>
  <div class="card" id="keyBox"><b>API 키</b><p class="quiet">불러오는 중…</p></div>
  <div class="card" id="prodSetBox"><b>제작</b><p class="quiet">불러오는 중…</p></div>
  <div class="card" id="relSetBox"><b>배포</b><p class="quiet">불러오는 중…</p></div>
  <div class="card" id="adSetBox"><b>광고</b><p class="quiet">불러오는 중…</p></div>
  <div class="card" id="wrBox"><b>작가실</b><p class="quiet">불러오는 중…</p></div>
  <div class="card" id="langBox"><b>다국어</b><p class="quiet">불러오는 중…</p></div>
  <div class="card"><b>계정</b><p class="quiet">${esc(S.user.email)}</p>
    <div class="row"><button class="btn" id="out">로그아웃</button><button class="btn small" id="cfg" style="margin-left:auto">서버 설정 초기화</button></div></div>`;
  renderKeys().catch(e => { const b = $('#keyBox'); if (b) b.innerHTML = `<b>API 키</b><div class="msg err">${esc(errText(e))}</div>`; });
  (async () => { const box = $('#relSetBox'); if (!box) return;
    try { const row = await q(S.sb.from('app_settings').select('value').eq('key', 'release').maybeSingle()); const v = row?.value || {};
      box.innerHTML = `<b>배포</b><p class="quiet" style="margin:4px 0 8px">유튜브는 한 채널에서 24시간에 최대 3개의 새 영상 알림만 보냅니다. 배포 담당은 이 한도 안에서 시청자 반응을 보고 공개 시점과 편수를 정합니다. 공개할 수 있는 것은 대표님이 확정한 완성본뿐이고, 결정할 때마다 알림으로 알려 드립니다.</p>
        <label class="ed-chk"><input type="checkbox" id="relAuto" ${v.auto_decide !== false ? 'checked' : ''}> 공개 시점·편수는 배포 담당이 반응을 보고 스스로 결정</label>
        <div class="row" style="align-items:flex-end;margin-top:8px"><div style="width:150px"><label>하루 최대 (알림 있는 편)</label><select id="relPer">${[1, 2, 3].map(n => `<option ${n === (v.per_day || 3) ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
          <div style="width:240px"><label>기본 시간 (반응 보며 조정)</label><input id="relTimes" value="${esc((v.times || ['12:00', '18:00', '21:00']).join(', '))}"></div>
          <div style="width:150px"><label>재고 최소 (일)</label><input id="relBuf" type="number" min="1" value="${v.buffer_days || 3}"></div>
          <button class="btn" id="relSave">저장</button></div>`;
      $('#relSave').onclick = guard(async () => { await q(S.sb.from('app_settings').upsert({ key: 'release', value: { ...v, auto_decide: $('#relAuto').checked, per_day: +$('#relPer').value,
        times: $('#relTimes').value.split(/[,\s]+/).filter(t => /^\d{1,2}:\d{2}$/.test(t)), buffer_days: Math.max(1, +$('#relBuf').value || 3) }, updated_at: new Date().toISOString() })); toast('배포 설정을 저장했습니다'); });
    } catch (e) { box.innerHTML = `<b>배포</b><div class="msg err">${esc(errText(e))}</div>`; } })();
  (async () => { const box = $('#adSetBox'); if (!box) return;
    try { const row = await q(S.sb.from('app_settings').select('value').eq('key', 'ads').maybeSingle()); const v = row?.value || {};
      box.innerHTML = `<b>광고</b><p class="quiet" style="margin:4px 0 8px">광고 담당은 이 한도 안에서만 광고비를 제안합니다. 0이면 돈이 드는 제안은 하지 않고, 제목·썸네일·쇼츠처럼 무료 개선만 제안합니다. 모든 지출은 승인 버튼을 눌러야 실행됩니다.</p>
        <div class="row" style="align-items:flex-end"><div style="width:220px"><label>월 광고 한도 (원)</label><input id="adBud" type="number" step="10000" value="${v.monthly_budget_krw || 0}"></div>
        <button class="btn" id="adBudSave">저장</button></div>`;
      $('#adBudSave').onclick = guard(async () => { await q(S.sb.from('app_settings').upsert({ key: 'ads', value: { ...v, monthly_budget_krw: Math.max(0, +$('#adBud').value || 0) }, updated_at: new Date().toISOString() })); toast('월 광고 한도를 저장했습니다'); });
    } catch (e) { box.innerHTML = `<b>광고</b><div class="msg err">${esc(errText(e))}</div>`; } })();
  renderProdSettings().catch(e => { const b = $('#prodSetBox'); if (b) b.innerHTML = `<b>제작</b><div class="msg err">${esc(errText(e))}</div>`; });
  (async () => {
    const box = $('#wrBox'); if (!box) return;
    try {
      const row = await q(S.sb.from('app_settings').select('value').eq('key', 'writers_room_auto_confirm').maybeSingle());
      const on = row?.value === true;
      box.innerHTML = `<b>작가실</b>
        <p class="quiet" style="margin:4px 0 8px">원고를 올리면 작가실이 흐름은 그대로 두고 감정선과 감정 연결 장치만 다듬어 정리본을 만듭니다. 흐름을 바꾸는 것은 제안으로만 올라옵니다(대본 탭에서 승인).</p>
        <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="wrAuto" style="width:auto" ${on ? 'checked' : ''}>
          정리본 자동 확정: 흐름 제안이 없는 정리본은 바로 확정하고 변경 요약만 알림으로 받기</label>`;
      $('#wrAuto').onchange = guard(async e => {
        await q(S.sb.from('app_settings').upsert({ key: 'writers_room_auto_confirm', value: e.target.checked, updated_at: new Date().toISOString() }));
        toast(e.target.checked ? '정리본을 자동으로 확정합니다' : '정리본을 확정하기 전에 직접 확인합니다');
      });
    } catch (e) { box.innerHTML = `<b>작가실</b><div class="msg err">${esc(errText(e))}</div>`; }
  })();
  renderLanguages().catch(e => { const b = $('#langBox'); if (b) b.innerHTML = `<b>다국어</b><div class="msg err">${esc(errText(e))}</div>`; });
  if ($('#perm')) $('#perm').onclick = async () => {
    const r = await Notification.requestPermission();
    toast(r === 'granted' ? '알림을 허용했습니다' : '알림이 허용되지 않았습니다. 브라우저 설정에서 바꿀 수 있습니다'); go('settings');
  };
  $('#chdev').onclick = () => { localStorage.removeItem(LS.device); location.reload(); };
  $('#out').onclick = async () => { await signOutAll(); location.hash = ''; boot(); };
  $('#cfg').onclick = async () => { if (!confirm('서버 설정을 지우고 처음 화면으로 갈까요?')) return; await signOutAll(); localStorage.removeItem(LS.cfg); resetClient(); boot(); };
  if ($('#mfa')) $('#mfa').onclick = guard(async () => {
    for (const f of factors.data?.all || []) if (f.status !== 'verified') await S.sb.auth.mfa.unenroll({ factorId: f.id });
    const { data, error } = await S.sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'NYX ' + Date.now() });
    if (error) throw error;
    $('#mfaBox').innerHTML = `
      <p>1. 인증 앱으로 아래 QR을 찍으세요.</p><img src="${esc(data.totp.qr_code)}" alt="QR" style="width:200px;height:200px;background:#fff;padding:6px;border-radius:8px">
      <p class="quiet">QR을 못 찍으면 이 키를 직접 입력: <code>${esc(data.totp.secret)}</code></p>
      <p>2. 앱에 나온 6자리 숫자를 입력하세요.</p>
      <div class="row"><input id="mcode" inputmode="numeric" maxlength="6" style="width:140px"><button class="btn primary" id="mok">확인</button></div>`;
    $('#mok').onclick = guard(async () => {
      const r = await S.sb.auth.mfa.challengeAndVerify({ factorId: data.id, code: $('#mcode').value.trim() });
      if (r.error) return toast('숫자가 맞지 않습니다');
      toast('2단계 인증을 켰습니다'); go('settings');
    });
  });
}

boot().catch(e => { console.error(e); $('#app').innerHTML = `<div class="center card"><div class="msg err">${esc(errText(e))}</div>
  <button class="btn" onclick="localStorage.clear();location.reload()">처음부터 다시</button></div>`; });
</script>
</body>
</html>
