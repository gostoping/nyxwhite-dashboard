      change_reason: '임시 기준 사진(자동)을 확정', status: 'proposed' }).select('id').single());
    await q(S.sb.rpc('activate_bible_version', { p_id: v.id }));
    toast(`${e.name}: 임시 사진을 기준 사진으로 확정했습니다`); go('bible');
  }));
  main.querySelectorAll('[data-same]').forEach(sel => sel.onchange = guard(async () => {
    const e = entryOf(sel.dataset.same); const to = sel.value || null;
    await q(S.sb.from('bible_entries').update({ same_as: to }).eq('id', e.id));
    const t = to && entryOf(to);
    toast(t ? `${e.name} = ${t.name} (동일인). 목소리를 물려받고, 사진이 없으면 ${t.name} 사진을 참고합니다` : `${e.name}: 동일인 연결을 풀었습니다`);
    go('bible');
  }));
  main.querySelectorAll('[data-psrc] button').forEach(btn => btn.onclick = guard(async () => {
    const seg = btn.parentElement, id = seg.dataset.psrc, v = btn.dataset.v;
    const e = entryOf(id); if (!e || e.photo_source === v) return;
    await q(S.sb.from('bible_entries').update({ photo_source: v }).eq('id', id));
    e.photo_source = v;
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    const card = main.querySelector(`[data-card="${id}"]`);
    if (card) { card.classList.toggle('ps-up', v === 'upload'); card.classList.toggle('ps-auto', v !== 'upload'); }
    toast(v === 'upload' ? `${e.name}: 직접 올리기. 사진을 올리면 코디네이터가 사진을 보고 묘사·영어 프롬프트를 씁니다` : `${e.name}: 자동으로 만들기. '사진 만들기'로 후보를 만듭니다`);
  }));
  // 외부 사진 올리기: 지금 적용본(없으면 작가실 수정안) 묘사에 사진을 붙여 새 버전으로 바로 적용한다
  main.querySelectorAll('[data-pup]').forEach(inp => inp.onchange = guard(async () => {
    const files = [...inp.files]; inp.value = '';
    if (!files.length) return;
    if (files.some(f => f.size > 15e6)) return toast('사진이 너무 큽니다 (15MB까지)');
    const e = entryOf(inp.dataset.pup); if (!e) return;
    const active = cur(e.id), prop = proposals.find(p => p.entry_id === e.id);
    const base = active || prop;
    if (!confirm(`${e.name}에 사진 ${files.length}장을 넣고 바로 적용합니다.${!active && prop ? '\n아직 적용 안 된 작가실 묘사도 함께 적용됩니다.' : ''}${active?.image_paths?.length ? `\n기존 사진 ${active.image_paths.length}장은 그대로 두고 덧붙입니다.` : ''}`)) return;
    toast('사진 올리는 중…');
    const added = [];
    for (const f of files) added.push(await uploadBibleFile(e.id, f));
    const v = await q(S.sb.from('bible_versions').insert({
      entry_id: e.id, description: base?.description || e.summary || e.name, details: base?.details || null,
      voice_id: base?.voice_id || null, soul_id: base?.soul_id || null, voice_path: base?.voice_path || null,
      image_paths: [...(base?.image_paths || []), ...added], change_reason: '대표가 사진 직접 올림', status: 'proposed',
    }).select('id,version_no').single());
    await q(S.sb.rpc('activate_bible_version', { p_id: v.id }));
    if (!active && prop) await q(S.sb.from('bible_versions').update({ status: 'rejected' }).eq('id', prop.id).eq('status', 'proposed'));
    if (hasPhotoSrc && e.photo_source !== 'upload') await q(S.sb.from('bible_entries').update({ photo_source: 'upload' }).eq('id', e.id)).catch(() => {});
    await queueDescribe(e.id, v.id);
    toast(`${e.name} 사진 ${files.length}장 적용했습니다 (v${v.version_no}). 코디네이터가 사진을 보고 묘사·영어 프롬프트를 씁니다`); go('bible');
  }));
  const ballgo = $('#ballgo');
  if (ballgo) ballgo.onclick = guard(async () => {
    const list = extractProps;
    const manual = list.filter(p => entryOf(p.entry_id)?.photo_source === 'upload').length;
    const nonEss = list.filter(p => entryOf(p.entry_id)?.essential === false).length;
    if (!confirm(`대본에서 찾은 ${catLabel ? catLabel + ' ' : ''}${list.length}개 항목을 바이블에 적용하고, 사진이 없는 인물·협찬은 사진 후보를 만듭니다(인물은 Soul 2 실사 4장).${nonEss ? `\n장소·소품·배경 ${nonEss}개는 사진 없이 묘사로 적용되고, 제작하며 나온 장면 사진이 참고로 쌓입니다.` : ''}${manual ? `\n'직접 올리기'로 정한 ${manual}개는 적용만 하고 사진은 만들지 않습니다.` : ''}\n직접 사진을 넣을 항목은 먼저 그 카드에서 '사진: 직접 올리기'로 바꾸거나 '사진 올리기'로 사진을 넣어 주세요.`)) return;
    for (const p of list) await q(S.sb.rpc('activate_bible_version', { p_id: p.id }));
    const fresh = await q(S.sb.from('bible_versions').select('id,entry_id,description,image_paths,status').in('entry_id', list.map(p => p.entry_id)).eq('status', 'active'));
    const n = await queuePhotos(entries, id => fresh.find(v => v.entry_id === id), new Set(list.map(p => p.entry_id)));
    toast(`${list.length}개 적용 · 사진 후보 ${n}건 만드는 중`); go('bible');
  });
  ($('#bcoord') || {}).onclick = guard(async () => {
    const act = entries.filter(e => (e.category === 'character' || e.origin === 'sponsor') && cur(e.id))
      .filter(e => !['queued', 'running'].includes((S.cvTask || {})[e.id]?.status));
    if (!act.length) return toast('감수할 항목이 없습니다(이미 감수 대기·진행 중)');
    if (!confirm(`코디네이터가 적용 중인 ${act.length}개 항목을 처음부터 다시 감수합니다(묘사·영어 프롬프트·대본·기준 사진, 항목당 수십 원). 이상이 있는 항목은 카드에 표시되고 위에 모아 보여 드립니다.`)) return;
    await q(S.sb.from('pipeline_tasks').insert(act.map(e => ({ kind: 'coord_review', series_id: S.seriesId, payload: { entry_id: e.id, version_id: cur(e.id).id } }))));
    toast(`${act.length}개 항목 감수를 맡겼습니다`); go('bible');
  });
  ($('#bcast') || {}).onclick = guard(async () => {
    const chars = entries.filter(e => e.category === 'character');
    if (!chars.length) return toast('먼저 캐릭터를 바이블에 등록해 주세요 (+ 항목 추가)');
    const main1 = chars.filter(e => !e.same_as);   // 동일인의 다른 모습은 원래 인물 목소리를 같이 씀
    const had = main1.filter(e => cur(e.id)?.voice_id).length;
    if (!confirm(`인물 ${main1.length}명 목소리를 기본(20대 초중반 · 젊고 나긋하고 부드러운 · 사람 같은 목소리)에 인물별 감정선을 얹어 새로 추천합니다.\n인물마다 후보 3개를 만들고 1번을 바로 바이블에 넣습니다${had ? `(이미 정한 ${had}명 목소리도 바뀝니다 · 나중에 후보 바꾸기 가능)` : ''}.\n동일인 카드는 같은 목소리로 같이 바뀝니다.\n(Claude 수십 원 + ElevenLabs 크레딧 인물당 후보 3개분)`)) return;
    await q(S.sb.from('pipeline_tasks').insert({ kind: 'voice_cast', series_id: S.seriesId, payload: { series_id: S.seriesId, redo: true, auto: true, force: true } }));
    toast('작가실에 맡겼습니다. 몇 분 뒤 인물 카드에 새 목소리가 들어갑니다');
  });
  main.querySelectorAll('[data-bedit]').forEach(b => b.onclick = () => {
    const e = entries.find(x => x.id === b.dataset.bedit); openBibleEditor({ entry: e, base: cur(e.id), urls });
  });
  main.querySelectorAll('[data-bfix]').forEach(b => b.onclick = () => {
    const p = versions.find(v => v.id === b.dataset.bfix);
    openBibleEditor({ entry: entries.find(x => x.id === p.entry_id), base: p, urls, fromId: p.id });
  });
  main.querySelectorAll('[data-bact]').forEach(b => b.onclick = activate(b.dataset.bact));
  main.querySelectorAll('[data-brej]').forEach(b => b.onclick = guard(async () => {
    await q(S.sb.from('bible_versions').update({ status: 'rejected' }).eq('id', b.dataset.brej)); toast('반려했습니다'); go('bible');
  }));
  main.querySelectorAll('[data-pd]').forEach(b => b.onclick = () => {
    const e = entries.find(x => x.id === b.dataset.pd); openPhotoDesign(e, cur(e.id), true);
  });
  const pds = entries.length ? await q(S.sb.from('photo_designs').select('entry_id,created_at').in('entry_id', entries.map(e => e.id))
    .in('status', ['queued', 'ready', 'training', 'set_ready', 'failed']).order('created_at', { ascending: false })) : [];
  // 얼굴이 고정된 인물은, 고정한 뒤에 새로 요청한 사진(고쳐쓰기에서 '후보 새로 만들기')이 있을 때만 사진 칸을 연다
  const locked = e => cur(e.id)?.soul_id;
  const lockAt = e => new Date(cur(e.id)?.decided_at || cur(e.id)?.created_at || 0);
  [...new Set(pds.map(d => d.entry_id))].forEach(id => {
    const e = entries.find(x => x.id === id); if (!e) return;
    const latest = pds.find(d => d.entry_id === id);
    if (locked(e) && new Date(latest.created_at) < lockAt(e)) return;
    openPhotoDesign(e, cur(e.id), false);
  });
  main.querySelectorAll('[data-vlisten]').forEach(b => b.onclick = () => {
    const e = entries.find(x => x.id === b.dataset.vlisten); openVoiceDesign(e, cur(e.id), false, true);
  });
  main.querySelectorAll('[data-vup]').forEach(inp => inp.onchange = guard(async () => {
    const f = inp.files[0]; if (!f) return; inp.value = '';
    const e = entries.find(x => x.id === inp.dataset.vup);
    if (f.size > 20 * 1024 * 1024) return toast('20MB 이하 파일로 올려 주세요');
    if (!confirm(`${e.name} 목소리를 이 파일(${f.name})로 만듭니다.\n본인 목소리이거나 사용 권리가 있는 녹음만 올려 주세요. ElevenLabs가 바로 목소리를 만들고 바이블에 넣습니다.`)) return;
    const ext = (f.name.split('.').pop() || 'mp3').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp3';
    const path = `voices/upload/${e.id}/${Date.now()}.${ext}`;
    toast('목소리 파일 올리는 중…');
    const { error } = await S.sb.storage.from('takes').upload(path, f, { contentType: f.type || 'audio/mpeg' }); if (error) throw error;
    const c0 = cur(e.id);
    const r = await q(S.sb.from('voice_designs').insert({ entry_id: e.id, description: [e.summary, c0?.description].filter(Boolean).join(' / ').slice(0, 900) || e.name,
      sample_text: vdSample(e.name), sample_path: path }).select('id').single());
    await q(S.sb.from('pipeline_tasks').insert({ kind: 'voice_design', payload: { design_id: r.id } }));
    toast('ElevenLabs가 목소리를 만들고 있습니다'); openVoiceDesign(e, c0, false);
  }));
  main.querySelectorAll('[data-vd]').forEach(b => b.onclick = () => {
    const e = entries.find(x => x.id === b.dataset.vd); openVoiceDesign(e, cur(e.id), true);
  });
  const vdsAll = entries.length ? await q(S.sb.from('voice_designs').select('*').in('entry_id', entries.map(e => e.id)).order('created_at', { ascending: false })) : [];
  fillVoiceRows(entries, cur, vdsAll).catch(e => console.warn('목소리 줄', e));
  const vds = vdsAll.filter(d => ['queued', 'ready', 'saving', 'failed'].includes(d.status) && vdsAll.find(x => x.entry_id === d.entry_id) === d);
  const inherited = id => { const e = entries.find(x => x.id === id); return !!(e?.same_as && entries.some(x => x.id === e.same_as) && cur(id)?.voice_id); };
  S.vgroup = {}; entries.forEach(e => { const r = e.same_as && entries.some(x => x.id === e.same_as) ? e.same_as : e.id; S.vgroup[e.id] = entries.filter(x => x.id === r || x.same_as === r).map(x => x.id); });
  [...new Set(vds.map(d => d.entry_id))].filter(id => !inherited(id)).forEach(id => { const e = entries.find(x => x.id === id); if (e) openVoiceDesign(e, cur(e.id), false); });
  main.querySelectorAll('[data-bhist]').forEach(b => b.onclick = () => {
    const box = document.getElementById('bh-' + b.dataset.bhist);
    if (box.innerHTML) { box.innerHTML = ''; return; }
    const hist = versions.filter(v => v.entry_id === b.dataset.bhist && v.status !== 'proposed');
    box.innerHTML = `<table style="margin-top:8px">${hist.map(v => `<tr><td>v${v.version_no}</td>
      <td>${pill(G_STATUS[v.status] || v.status, v.status === 'active' ? 'good' : '')}</td>
      <td>${esc(v.change_reason || '')}<br><span class="quiet">${esc(v.proposed_by || '')} · ${esc(v.devices?.name || '')}</span></td>
      <td class="quiet">${fmt(v.decided_at || v.created_at)}</td>
      <td>${v.status === 'retired' ? `<button class="btn small" data-bact2="${esc(v.id)}">되돌리기</button>` : ''}</td></tr>`).join('')}</table>`;
    box.querySelectorAll('[data-bact2]').forEach(x => x.onclick = activate(x.dataset.bact2));
  });
  await renderContinuity(entries, episodes);
}

// 사진 디자인: 인물은 Soul 2 실사 후보 → 고르기 → Soul ID 얼굴 학습 → 같은 얼굴 기준 사진 세트 → 바이블 적용
const PD_STATUS = { queued: ['후보 만드는 중', 'warn'], ready: ['골라 주세요', 'accent'], training: ['얼굴 학습 중', 'warn'], set_ready: ['기준 사진 확인', 'accent'], failed: ['실패', 'bad'] };
async function openPhotoDesign(entry, cur, fresh) {
  const box = document.getElementById('pd-' + entry.id); if (!box) return;
  S.pdTimer = S.pdTimer || {}; clearTimeout(S.pdTimer[entry.id]);   // 이 항목의 이전 새로 고침 예약은 취소(겹쳐 쌓여 요청이 폭주하던 문제)
  const isChar = entry.category === 'character';
  const [d] = await q(S.sb.from('photo_designs').select('*').eq('entry_id', entry.id).order('created_at', { ascending: false }).limit(1));
  if (fresh || !d || d.status === 'linked') {
    // 늘 지금 바이블(최신 적용본)에서 채운다: 예전 요청의 프롬프트를 다시 쓰면 바이블을 고쳐도 같은 사진이 나옴
    const prompt = cur?.prompt_en || [entry.summary, cur?.description].filter(Boolean).join('. ') || d?.prompt || '';
    const pending = !cur?.prompt_en && /[가-힣]/.test(cur?.description || '');
    const has = (cur?.image_paths || []).length;
    box.innerHTML = `<div class="vdbox"><b>${isChar ? '실사 사진·얼굴 고정' : '사진 디자인'}</b>
      <p class="quiet" style="margin:4px 0">${isChar ? '인물 묘사를 적으면 설정한 모델(기본 <b>Seedream 5.0 Pro</b>)이 후보 4장을 만듭니다. 마음에 드는 사진을 고르면 그 얼굴로 <b>Soul ID</b>를 학습하고, 같은 얼굴의 기준 사진(정면·3/4·전신·감정 표정)을 만들어 바이블에 넣습니다. 컷 설계의 장면 사진은 이 기준 사진들을 참고로 그립니다.'
        : `${BIBLE_CAT[entry.category] || ''} 묘사를 적으면 후보 2장을 만듭니다. 고르면 바이블 기준 사진이 됩니다.`}</p>
      <label>묘사 (영어로 적으면 더 정확: 나이·국적·얼굴형·머리·체형·분위기${isChar ? '' : '·시간대·빛'})</label>
      <textarea id="pdP-${entry.id}" style="min-height:90px;font-family:inherit">${esc(prompt)}</textarea>
      <p class="quiet" style="margin:2px 0 0">${cur?.prompt_en ? '바이블의 최신 영어 프롬프트로 채웠습니다. 바이블을 고친 뒤 만들면 고친 내용으로 나옵니다.' : pending ? '작가실이 바이블 최신 묘사를 영어 프롬프트로 옮기는 중입니다. 지금 눌러도 영어 프롬프트가 나온 뒤에 만듭니다.' : ''}</p>
      <div class="row" style="margin-top:8px"><button class="btn primary small" id="pdGo-${entry.id}">${isChar ? '후보 4장 만들기' : '후보 2장 만들기'}</button>
        ${isChar && has ? `<button class="btn small" id="pdOwn-${entry.id}">지금 바이블 사진 ${has}장으로 얼굴 학습</button>` : ''}
        <button class="btn small" id="pdX-${entry.id}" style="margin-left:auto">닫기</button></div></div>`;
    document.getElementById('pdX-' + entry.id).onclick = () => { box.innerHTML = ''; };
    document.getElementById('pdGo-' + entry.id).onclick = guard(async () => {
      const p = document.getElementById('pdP-' + entry.id).value.trim();
      if (p.length < 20) return toast('묘사를 20자 이상 적어 주세요');
      const useBible = p === prompt.trim();   // 칸을 손대지 않았으면: 만들 때의 바이블 최신 영어 프롬프트로
      const r = await q(S.sb.from('photo_designs').insert({ entry_id: entry.id, prompt: p, use_bible: useBible }).select('id').single())
        .catch(() => q(S.sb.from('photo_designs').insert({ entry_id: entry.id, prompt: p }).select('id').single()));
      await q(S.sb.from('pipeline_tasks').insert({ kind: 'photo_design', payload: { design_id: r.id } }));
      const pend = await q(S.sb.from('pipeline_tasks').select('id', { count: 'exact', head: true }).in('kind', ['bible_prompt', 'coord_review'])
        .in('status', ['queued', 'running']).eq('payload->>entry_id', entry.id)).catch(() => null);
      toast(pend ? '영어 프롬프트 반영·감수가 먼저 끝난 뒤, 반영된 프롬프트로 사진을 만듭니다' : '사진 후보를 만들고 있습니다'); openPhotoDesign(entry, cur, false);
    });
    const own = document.getElementById('pdOwn-' + entry.id);
    if (own) own.onclick = guard(async () => {
      const p = document.getElementById('pdP-' + entry.id).value.trim() || entry.name;
      const chosen = cur.image_paths.map(path => ({ bucket: 'bible', path }));
      const r = await q(S.sb.from('photo_designs').insert({ entry_id: entry.id, prompt: p, chosen, status: 'training', previews: chosen }).select('id').single());
      await q(S.sb.from('pipeline_tasks').insert({ kind: 'photo_set', payload: { design_id: r.id } }));
      toast('얼굴 학습을 시작했습니다(수 분)'); openPhotoDesign(entry, cur, false);
    });
    return;
  }
  const all = [...(d.previews || []), ...(d.ref_set || [])];
  const byBucket = b => all.filter(x => (x.bucket || 'takes') === b).map(x => x.path);
  const urls = {};
  for (const b of ['takes', 'bible']) {
    const ps = byBucket(b); if (!ps.length) continue;
    const { data } = await S.sb.storage.from(b).createSignedUrls(ps, 3600);
    (data || []).forEach(x => { if (x.signedUrl) urls[x.path] = x.signedUrl; });
  }
  const busy = ['queued', 'training'].includes(d.status);
  await loadEta();
  if (!S.agentsNow) S.agentsNow = await q(S.sb.from('agent_status').select('device_id,version,info,last_seen_at,state,current_job,devices(name)')).catch(() => []);
  const [pl, pk] = PD_STATUS[d.status] || [d.status, ''];
  // 코디네이터 사진 확인(프롬프트와 일치·글자/이름표·다른 사람): 장마다 표시
  S.designs = S.designs || {}; S.designs[entry.id] = d;

  const [pdTask] = busy || d.status === 'failed' ? await q(S.sb.from('pipeline_tasks').select('id,kind,status,progress,error,attempts,started_at,created_at,not_before,devices(name)')

  const MODEL_NM = { seedream: 'Seedream 5.0 Pro', soul2: 'Soul 2', kling: 'Kling Image 4.0', nano: '나노바나나 프로', grok: 'Grok Imagine' };

  const pdCheck = await q(S.sb.from('pipeline_tasks').select('id,status').eq('kind', 'coord_review').eq('payload->>design_id', d.id).order('created_at', { ascending: false }).limit(1)).catch(() => []);

        ${d.review.prompt_improved ? `<details><summary class="quiet">고친 프롬프트 보기</summary><div class="quiet">${esc(d.review.prompt_improved)}</div></details>` : ''}</div>` : ''}
      <button class="btn small" data-pdrecheck="${esc(d.id)}" style="margin-top:4px">다시 확인</button></div>`
      : `<div class="row quiet" style="margin:6px 0">${pdCheck[0] && ['queued', 'running'].includes(pdCheck[0].status) ? '<span class="spin"></span> 코디네이터가 사진이 프롬프트와 맞는지 확인하는 중…' : `아직 코디네이터 확인 전입니다. <button class="btn small" data-pdrecheck="${esc(d.id)}">확인 맡기기</button>`}</div>`) : '';
  box.innerHTML = `<div class="vdbox"><div class="row"><b>${isChar ? '실사 사진·얼굴 고정' : '사진 디자인'}</b>${pill(pl, pk)}

    ${busy ? `<p><span class="spin"></span>${d.status === 'training' ? '고른 사진으로 얼굴을 학습하고 같은 얼굴의 기준 사진을 만드는 중입니다.' : 'Higgsfield에서 후보를 만드는 중입니다.'} 끝나면 알림이 옵니다.

    ${d.status === 'failed' ? `<div class="msg err">${esc(explainFail(pdTask?.kind || 'photo_design', d.error || pdTask?.error).what)} ${esc(explainFail(pdTask?.kind || 'photo_design', d.error || pdTask?.error).how)}

    ${tries ? `<div class="quiet" style="font-size:12px">이 인물 사진 요청 <b>${tries}번째</b> · 이번 모델: ${esc(MODEL_NM[d.model || 'soul2'] || d.model || 'Soul 2')}</div>` : ''}
    ${['ready', 'failed', 'set_ready'].includes(d.status) ? wmNote + otherModels : ''}
    ${d.status === 'ready' ? `<p class="quiet" style="margin:4px 0">${isChar ? '같은 사람으로 쓸 사진을 1~4장 고르세요(여러 장이면 얼굴이 더 안정적). 사진을 누르면 크게 보고, 크게 본 채로 고를 수 있습니다. 고르기는 체크칸.' : '바이블에 넣을 사진을 고르세요.'}</p>
      ${rvLine}<div class="pdgrid">${(d.previews || []).map(x => img(x, true)).join('')}</div>
      <div class="row" style="margin-top:8px"><button class="btn small primary" id="pdPick-${entry.id}">${isChar ? '이 얼굴로 학습 + 기준 사진 만들기' : '바이블에 적용'}</button>
        ${designPicks(d).length ? `<button class="btn small" data-recgo="${esc(entry.id)}" title="고르지 않아도 코디네이터가 확인해 추천한 사진으로 진행합니다">코디네이터 추천(${designPicks(d).map(x => (d.previews || []).indexOf(x) + 1).join('·')}번)으로 ${isChar ? '학습' : '적용'}</button>` : ''}
        ${isChar ? '<span class="quiet">얼굴 학습 1회 + 기준 사진 4장</span>' : ''}</div>` : ''}
    ${d.status === 'set_ready' ? `<p class="quiet" style="margin:4px 0">같은 얼굴로 만든 기준 사진입니다. 적용하면 바이블 기준 사진이 이 세트로 바뀌고 Soul ID가 함께 저장됩니다.</p>
      ${rvLine}<div class="pdgrid">${[...(d.chosen || []), ...(d.ref_set || [])].map(x => img(x, false)).join('')}</div>
      <div class="row" style="margin-top:8px"><button class="btn small primary" id="pdLink-${entry.id}">바이블에 적용${(() => { const all = [...(d.chosen || []), ...(d.ref_set || [])], k = okOnly(d, all).length; return k < all.length ? ` (⚠ ${all.length - k}장 빼고 ${k}장)` : ''; })()}</button>
        <span class="quiet">⚠ 사진은 자동으로 빼고 적용합니다. 쓸 만한 사진이 너무 적거나 얼굴이 다르면 "새로 만들기"(코디네이터가 고친 프롬프트로)</span></div>` : ''}</div>`;
  document.getElementById('pdNew-' + entry.id).onclick = () => openPhotoDesign(entry, cur, true);
  box.querySelectorAll('[data-pdmodel]').forEach(b => b.onclick = guard(async () => {
    const m = b.dataset.pdmodel;
    if (!confirm(`${entry.name}: ${MODEL_NM[m]}(으)로 실사 사진 후보 4장을 새로 만듭니다(Higgsfield 비용). 고른 사진으로 얼굴 학습은 그대로 됩니다.`)) return;
    const r = await q(S.sb.from('photo_designs').insert({ entry_id: entry.id, prompt: (cur?.prompt_en || cur?.description || d.prompt || '').slice(0, 1800), use_bible: true, model: m }).select('id').single());
    await q(S.sb.from('pipeline_tasks').insert({ kind: 'photo_design', payload: { design_id: r.id } }));
    toast(`${MODEL_NM[m]}(으)로 후보를 만들고 있습니다`); openPhotoDesign(entry, cur, false);
  }));
  const toBible = async list => {
    const out = [];
    for (const x of list) {
      if ((x.bucket || 'takes') === 'bible') { out.push(x.path); continue; }
      const { data, error } = await S.sb.storage.from('takes').download(x.path);
      if (error) throw error;
      out.push(await uploadBibleFile(entry.id, new File([data], 'photo.jpg', { type: 'image/jpeg' })));
    }
    return out;
  };
  const apply = async (paths, soul_id, reason) => {
    const v = await q(S.sb.from('bible_versions').insert({
      entry_id: entry.id, description: cur?.description || d.prompt, details: cur?.details || null, voice_id: cur?.voice_id || null,
      voice_path: cur?.voice_path || null, image_paths: paths, soul_id: soul_id || cur?.soul_id || null, change_reason: reason, status: 'proposed' }).select('id').single());
    await q(S.sb.rpc('activate_bible_version', { p_id: v.id }));
    await q(S.sb.from('photo_designs').update({ status: 'linked' }).eq('id', d.id));
    toast(`${entry.name} 사진을 바이블에 적용했습니다`); go('bible');
  };
  const pick = document.getElementById('pdPick-' + entry.id);
  if (pick) pick.onclick = guard(async () => {
    const chosen = [...box.querySelectorAll('[data-pdc]:checked')].map(c => ({ bucket: c.dataset.b, path: c.dataset.pdc }));
    if (!chosen.length) return toast('사진을 하나 이상 골라 주세요');
    const badPicked = chosen.length - okOnly(d, chosen).length;
    if (badPicked && !confirm(`고른 사진 중 ${badPicked}장은 코디네이터가 ⚠로 표시한 사진입니다(글자·다른 사람 등). 그래도 쓸까요?\n[취소]를 누르면 ⚠ 사진은 빼고 진행합니다.`)) {
      chosen.splice(0, chosen.length, ...okOnly(d, chosen)); if (!chosen.length) return toast('남은 사진이 없습니다. 다른 사진을 고르거나 "새로 만들기"');
    }
    if (!isChar) return apply(await toBible(chosen), null, '사진 디자인으로 기준 사진');
    await q(S.sb.from('photo_designs').update({ chosen, status: 'training' }).eq('id', d.id));
    await q(S.sb.from('pipeline_tasks').insert({ kind: 'photo_set', payload: { design_id: d.id } }));
    toast('얼굴 학습을 시작했습니다(5~20분)'); openPhotoDesign(entry, cur, false);
  });
  const link = document.getElementById('pdLink-' + entry.id);
  if (link) link.onclick = guard(async () => {
    link.disabled = true; link.textContent = '바이블로 옮기는 중…';

    if (!keep.length) { link.disabled = false; link.textContent = '바이블에 적용'; return toast('기준 사진이 모두 코디네이터 확인에서 ⚠입니다. "새로 만들기"로 다시 만들어 주세요'); }
    apply(await toBible(keep), d.soul_id, `Soul 2 실사 사진 + Soul ID 얼굴 고정${keep.length < all.length ? ` (⚠ ${all.length - keep.length}장 제외)` : ''}`);
  });

  if (busy) S.pdTimer[entry.id] = setTimeout(() => { if (S.tab === 'bible' && document.contains(box)) openPhotoDesign(entry, cur, false).catch(() => {}); }, 10000);

// 목소리 디자인: 설명 → ElevenLabs 후보 3개 → 듣고 고르기 → 바이블 새 버전으로 적용
const vdSample = full => { const name = full.replace(/\s*\(.*?\)\s*/g, '').trim(); return `안녕하세요, 저는 ${name}예요. 오늘 처음으로 무대에 서는 날이라 너무 떨려요. 그래도 여기까지 온 이유를 잊지 않을 거예요. 끝까지 해 볼게요. 지켜봐 주세요!`; };
// 바이블 카드 '목소리' 줄: 지금 쓰는 목소리를 바로 들을 수 있게(재생기) + 만드는 중·실패 이유를 그 자리에서
async function fillVoiceRows(entries, cur, vds) {
  // 동일인은 목소리 하나: 관리는 언제나 '원래 인물' 카드에서(어느 카드에서 만들었든). 다른 모습 카드는 듣기만.
  const root = e => (e.same_as && entries.some(x => x.id === e.same_as)) ? e.same_as : e.id;
  const grpOf = e => entries.filter(x => root(x) === root(e)).map(x => x.id);
  const latest = {}; entries.forEach(e => { const g = grpOf(e); latest[e.id] = vds.find(d => g.includes(d.entry_id)); });
  const inUse = {}, from = {};
  entries.forEach(e => { const vid = cur(e.id)?.voice_id;
    if (vid && root(e) !== e.id) from[e.id] = root(e);
    if (!vid) return;
    const g = grpOf(e), d = vds.find(x => g.includes(x.entry_id) && x.voice_id === vid);
    if (d) inUse[e.id] = d.preview_path || (d.previews || []).find(p => p.generated_voice_id === d.chosen_generated_id)?.path || null; });
  const paths = Object.values(inUse).filter(Boolean);
  const urls = {};
  if (paths.length) { const { data } = await S.sb.storage.from('takes').createSignedUrls(paths, 3600); (data || []).forEach(x => { if (x.signedUrl) urls[x.path] = x.signedUrl; }); }
  entries.forEach(e => {
    const el = document.getElementById('vlive-' + e.id); if (!el) return;
    const d = latest[e.id], c = cur(e.id), u = inUse[e.id] && urls[inUse[e.id]];
    const busy = d && ['queued', 'saving'].includes(d.status);
    const fail = d && d.status === 'failed';
    if (from[e.id]) {   // 동일인의 다른 카드에서 정한 목소리 → 여기서는 듣기만, 디자인 칸은 없앤다
      const src = entries.find(x => x.id === from[e.id]);
      el.parentElement.querySelectorAll('[data-vd],[data-vlisten],[data-vnew],label').forEach(x => x.remove());
      [...el.parentElement.querySelectorAll('span.quiet')].filter(x => !el.contains(x)).forEach(x => x.remove());
      document.getElementById('vd-' + e.id)?.replaceChildren();
      el.innerHTML = `${u ? `<audio controls preload="none" src="${esc(u)}"></audio>` : ''}<span class="quiet">원래 인물 <b>${esc(src?.name || '')}</b> 카드와 같은 목소리 · 바꾸거나 새로 만들기는 ${esc(src?.name || '')} 카드에서</span>`;
      return;
    }
    el.innerHTML = `${u ? `<audio controls preload="none" src="${esc(u)}" title="지금 바이블에 적용된 목소리"></audio>`
        : c?.voice_id ? `<span class="quiet">목소리 적용됨 · 들을 샘플이 없음(후보 보기에서 다시 만들기)</span>` : ''}
      ${busy ? `<span class="quiet"><span class="spin"></span> ${d.sample_path ? '올린 파일로 ElevenLabs가 목소리를 만드는 중' : d.status === 'saving' ? '목소리 저장 중' : '목소리 후보 만드는 중'}</span>` : ''}
      ${fail ? `<span class="vfail">❌ ${d.sample_path ? '올린 목소리' : '목소리'} 실패: ${esc(explainFail('voice_design', d.error).what)} <span class="quiet">${esc((d.error || '').slice(0, 220))}</span></span>` : ''}`;
  });
}
// 추천하기 / 새로 만들기: 작가실·코디네이터가 목소리를 설계 → 후보 3개 → 1번을 바로 바이블에. 설계 일이 실패하면 그 이유를 상자에 바로 보여 준다
async function recommendVoice(entry, cur) {
  const box = document.getElementById('vd-' + entry.id); if (!box) return;
  if (cur?.voice_id && !confirm(`${entry.name} 목소리를 새로 만듭니다(기본: 젊고 나긋한 사람 목소리 + 이 인물 감정선).\n후보 3개를 만들고 1번을 바로 넣습니다. 지금 목소리는 바뀌고, 나중에 다른 후보로 바꿀 수 있습니다.\n(Claude 수십 원 + ElevenLabs 크레딧 후보 3개분)`)) return;
  const t = await q(S.sb.from('pipeline_tasks').insert({ kind: 'voice_cast', series_id: S.seriesId, payload: { series_id: S.seriesId, entry_ids: [entry.id], redo: true, auto: true, force: true } }).select('id,created_at').single());
  box.innerHTML = '<div class="vdbox"><span class="spin"></span> 작가실·코디네이터가 대본을 읽고 목소리를 설계하는 중입니다. 후보 1번이 바로 바이블에 들어갑니다(1~2분).</div>';
  toast(`${entry.name} 새 목소리를 만들고 있습니다`);
  const poll = n => setTimeout(async () => { if (S.tab !== 'bible' || !document.contains(box)) return;
    const [tk] = await q(S.sb.from('pipeline_tasks').select('status,error,result').eq('id', t.id));
    const [x] = await q(S.sb.from('voice_designs').select('id,created_at').eq('entry_id', entry.id).gte('created_at', t.created_at).order('created_at', { ascending: false }).limit(1));

    if (!description) description = '(작가실이 사진을 보고 쓰는 중) ' + ($('#bsum').value.trim() || $('#bname')?.value.trim() || entry?.name || '');
    if (isNew && !$('#bname').value.trim()) return toast('이름을 적어 주세요');
    const files = [...$('#bimg').files], voice = $('#bvoice').files[0];
    if (files.some(f => f.size > 15e6) || (voice && voice.size > 30e6)) return toast('파일이 너무 큽니다 (사진 15MB, 음성 30MB까지)');
    const btn = $('#bsave'); btn.disabled = true; btn.textContent = '저장 중…';
    try {
      const summary = $('#bsum').value.trim() || null;
      let entryId = entry?.id;
      if (isNew) {
        entryId = (await q(S.sb.from('bible_entries').insert({ series_id: S.seriesId, category: $('#bcat').value, name: $('#bname').value.trim(), summary })
          .select('id').single())).id;
      } else if (summary !== (entry.summary || null)) {
        await q(S.sb.from('bible_entries').update({ summary }).eq('id', entryId));
      }
      if ((entry?.category || $('#bcat')?.value) === 'character' && $('#bvarBox')) {
        const eps = parseEps($('#bapply').value);
        await q(S.sb.from('bible_entries').update({ same_as: sameId, apply_eps: eps.length ? eps : null, change_note: chg || null }).eq('id', entryId))
          .catch(e => toast('동일인·나오는 화 저장 실패(DB 업데이트 전일 수 있음): ' + errText(e)));
      }
      if ((entry?.category || $('#bcat')?.value) === 'music') {
        const epsN = [...new Set(($('#bmeps').value.match(/\d+/g) || []).map(Number))];
        await q(S.sb.from('bible_entries').update({ appears: epsN.map(n => ({ ep: n, scene: null })) }).eq('id', entryId));
      }
      const kept = imgs.filter((_, i) => document.querySelector(`[data-keep="${i}"]`)?.checked);
      const added = [];
      for (const f of files) added.push(await uploadBibleFile(entryId, f));
      const voicePath = voice ? await uploadBibleFile(entryId, voice) : ($('#bkeepv')?.checked ? base.voice_path : null);
      const v = await q(S.sb.from('bible_versions').insert({
        entry_id: entryId, description, details: $('#bdet').value.trim() || null, voice_id: $('#bvid').value.trim() || null, soul_id: base?.soul_id || null,
        image_paths: [...kept, ...added], voice_path: voicePath, change_reason: $('#breason').value.trim() || null, status: 'proposed',
      }).select('id,version_no').single());
      await q(S.sb.rpc('activate_bible_version', { p_id: v.id }));
      if (fromId) await q(S.sb.from('bible_versions').update({ status: 'rejected' }).eq('id', fromId).eq('status', 'proposed'));
      const reasonTxt = $('#breason').value.trim();
      const sameText = description === (base?.description || '').trim() && ($('#bdet').value.trim() || '') === (base?.details || '').trim();
      if (reasonTxt && sameText && !autoDesc && !description.startsWith('(작가실이 사진을 보고 쓰는 중)')) {
        // 묘사는 그대로 두고 이유(요청)만 적었으면: 작가실이 요청을 묘사에 반영하고 영어 프롬프트를 새로 쓴다
        // 작업은 DB가 바로 넣는다(적용되는 순간 트리거) — 여기서는 안내만
        toast(`v${v.version_no} 적용했습니다. 작가실이 "${reasonTxt.slice(0, 30)}"을(를) 묘사와 영어 프롬프트에 반영합니다(1~2분)`);
      } else if (autoDesc || description.startsWith('(작가실이 사진을 보고 쓰는 중)')) {
        await q(S.sb.from('pipeline_tasks').insert({ kind: 'photo_describe', series_id: S.seriesId, payload: { entry_id: entryId, version_id: v.id } }));
        toast(`v${v.version_no} 적용했습니다. 코디네이터가 사진을 보고 묘사·영어 프롬프트를 씁니다`);
      } else toast(`v${v.version_no} 적용했습니다`);
      if ($('#bredo')?.checked) {   // 고쳐쓰기에서 체크했을 때만: 새 묘사(영어 프롬프트 반영 뒤)로 후보 4장
        const r = await q(S.sb.from('photo_designs').insert({ entry_id: entryId, prompt: description.slice(0, 1800), use_bible: true }).select('id').single());
        await q(S.sb.from('pipeline_tasks').insert({ kind: 'photo_design', payload: { design_id: r.id } }));
        toast('새 묘사로 실사 사진 후보 4장을 만듭니다(영어 프롬프트 반영 뒤)');
      }
      go('bible');
    } finally {
      const b = $('#bsave'); if (b) { b.disabled = false; b.textContent = '저장하고 바로 적용'; }
    }
  });
  host.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function renderContinuity(entries, episodes) {
  const box = $('#contBox'); if (!box) return;
  if (!episodes.length) { box.innerHTML = '<p class="quiet">아직 화가 없습니다. 대본 탭에서 화를 추가하세요.</p>'; return; }
  if (!entries.length) { box.innerHTML = '<p class="quiet">바이블 항목을 먼저 등록하세요.</p>'; return; }
  if (!S.contEp || !episodes.some(e => e.id === S.contEp)) S.contEp = episodes.at(-1).id;
  const idx = episodes.findIndex(e => e.id === S.contEp), ep = episodes[idx], prev = episodes[idx - 1];
  const logs = await q(S.sb.from('continuity_logs').select('id,episode_id,entry_id,scene_no,state,source,created_at,devices(name)')
    .in('episode_id', [ep.id, prev?.id].filter(Boolean)).order('created_at'));
  const name = id => esc(entries.find(e => e.id === id)?.name || '(삭제된 항목)');
  const lastPrev = {};
  logs.filter(l => prev && l.episode_id === prev.id).forEach(l => { lastPrev[l.entry_id] = l; });
  const mine = logs.filter(l => l.episode_id === ep.id);
  const order = ['character', 'prop', 'location', 'background', 'style', 'voice'];
  const sorted = [...entries].sort((a, b) => order.indexOf(a.category) - order.indexOf(b.category));
  box.innerHTML = `
    <div class="row"><select id="cep" style="width:auto">${episodes.map(e =>
      `<option value="${esc(e.id)}" ${e.id === ep.id ? 'selected' : ''}>${e.number}화 ${esc(e.title || '')}</option>`).join('')}</select></div>
    ${prev ? `<h3>${prev.number}화가 끝났을 때 상태 <span class="quiet">(${ep.number}화 시작 기준)</span></h3>
      ${Object.keys(lastPrev).length ? `<table>${Object.values(lastPrev).map(l => `<tr><td style="white-space:nowrap"><b>${name(l.entry_id)}</b></td>
        <td>${esc(l.state)}</td><td class="quiet">${l.scene_no ? 'S#' + l.scene_no : ''}</td></tr>`).join('')}</table>`
        : '<p class="quiet">기록이 없습니다.</p>'}` : '<p class="quiet" style="margin-top:10px">첫 화라 이전 기록이 없습니다.</p>'}
    <h3>${ep.number}화 기록</h3>
    ${mine.length ? `<table><tr><th>항목</th><th>상태</th><th>씬</th><th class="hide-m">남긴 곳</th><th></th></tr>${mine.map(l => `<tr>
      <td style="white-space:nowrap"><b>${name(l.entry_id)}</b></td><td>${esc(l.state)}</td><td class="quiet">${l.scene_no ? 'S#' + l.scene_no : ''}</td>
      <td class="quiet hide-m">${esc(l.source || '')} · ${esc(l.devices?.name || '')}<br>${fmt(l.created_at)}</td>
      <td><button class="btn small danger" data-cdel="${esc(l.id)}">삭제</button></td></tr>`).join('')}</table>`
      : '<p class="quiet">아직 기록이 없습니다.</p>'}
    <div class="row" style="margin-top:10px;align-items:flex-end">
      <div style="flex:1;min-width:140px"><label>항목</label><select id="cent">${sorted.map(e =>
        `<option value="${esc(e.id)}">${esc(BIBLE_CAT[e.category])} · ${esc(e.name)}</option>`).join('')}</select></div>
      <div style="width:90px"><label>씬 (선택)</label><input id="csc" inputmode="numeric"></div>
      <div style="flex:2;min-width:200px"><label>상태</label><input id="cst" placeholder="예: 연습복, 머리 묶음, 왼손에 붕대"></div>
      <button class="btn primary" id="cadd">기록</button></div>`;
  const redraw = () => renderContinuity(entries, episodes).catch(e => toast('오류: ' + errText(e)));
  $('#cep').onchange = e => { S.contEp = e.target.value; redraw(); };
  const add = guard(async () => {
    const state = $('#cst').value.trim(); if (!state) return toast('상태를 적어 주세요');
    const sc = parseInt($('#csc').value, 10);
    await q(S.sb.from('continuity_logs').insert({ episode_id: ep.id, entry_id: $('#cent').value, scene_no: Number.isFinite(sc) ? sc : null, state }));
    toast('기록했습니다'); redraw();
  });
  $('#cadd').onclick = add;
  $('#cst').onkeydown = e => { if (e.key === 'Enter') add(); };
  box.querySelectorAll('[data-cdel]').forEach(b => b.onclick = guard(async () => {
    if (!confirm('이 기록을 지울까요?')) return;
    await q(S.sb.from('continuity_logs').delete().eq('id', b.dataset.cdel)); redraw();
  }));
}

// 감독 노하우(교훈) 기록
const LCAT = { face: '얼굴', costume: '의상', location: '장소', prop: '소품', continuity: '연속성', expression: '표정', emotion_tone: '감정·톤',
  dialogue: '대사', camera: '카메라', motion: '움직임', prompt: '프롬프트', localization: '현지화', other: '기타' };
const LST = { active: ['적용 중', 'good'], candidate: ['후보', 'warn'], retired: ['꺼짐', ''] };
async function renderLessons() {
  const box = $('#lessonBox'); if (!box) return;
  const [lessons, series] = await Promise.all([
    q(S.sb.from('director_lessons').select('*').order('hit_count', { ascending: false }).order('last_seen_at', { ascending: false }).limit(500)),
    q(S.sb.from('series').select('id,title').order('created_at')),
  ]);
  S.lessonSt = S.lessonSt || 'active';
  const cnt = k => lessons.filter(l => l.status === k).length;
  const shown = lessons.filter(l => S.lessonSt === 'all' || l.status === S.lessonSt);
  const sname = id => id ? (series.find(x => x.id === id)?.title || '시리즈') : '모든 시리즈 공통';
  box.innerHTML = `<div class="card" style="border-color:var(--accent)">
    <div class="row"><b>감독 노하우 (교훈 기록)</b>
      <span class="quiet">감수자·평가자·대표에게 받은 지적이 쌓이고, 감독은 작업 전에 '적용 중' 교훈을 먼저 읽고 적용합니다.</span></div>
    <p class="quiet" style="margin:6px 0">같은 문제가 두 번 나오면 자동으로 '적용 중'이 되고, 3번 넘게 반복되면 평가자가 지침 수정안으로 올립니다. 지침과 바이블이 항상 우선합니다.</p>
    <div class="row" style="margin:8px 0">${[['active', `적용 중 ${cnt('active')}`], ['candidate', `후보 ${cnt('candidate')}`], ['retired', `꺼짐 ${cnt('retired')}`], ['all', `전체 ${lessons.length}`]].map(([k, l]) =>
      `<button class="btn small ${S.lessonSt === k ? 'primary' : ''}" data-lst="${k}">${l}</button>`).join('')}</div>
    ${shown.length ? `<table><tr><th>분류</th><th>앞으로의 규칙</th><th class="hide-m">근거</th><th style="text-align:right">반복</th><th></th></tr>${shown.map(l => `<tr>
      <td style="white-space:nowrap">${pill(LCAT[l.category] || l.category)}<br><span class="quiet">${esc(sname(l.series_id))}</span></td>
      <td><b>${esc(l.rule)}</b><div class="quiet" style="margin-top:2px">문제: ${esc(l.problem)}</div>
        ${l.bad_example || l.good_example ? `<div class="quiet" style="margin-top:2px">${l.bad_example ? '실패: ' + esc(l.bad_example) : ''}${l.good_example ? ' → 통과: ' + esc(l.good_example) : ''}</div>` : ''}</td>
      <td class="quiet hide-m">${esc((l.sources || []).join(', '))}${(l.cut_refs || []).length ? '<br>' + esc(l.cut_refs.slice(0, 4).join(', ')) + (l.cut_refs.length > 4 ? ` 외 ${l.cut_refs.length - 4}` : '') : ''}</td>
      <td style="text-align:right;white-space:nowrap">${l.hit_count}회${l.applied_ok ? `<br><span class="quiet">효과 ${l.applied_ok}회</span>` : ''}</td>
      <td style="text-align:right;white-space:nowrap">${pill(LST[l.status][0], LST[l.status][1])}<br>
        ${l.status !== 'active' ? `<button class="btn small" data-lset="active" data-lid="${esc(l.id)}">적용</button>` : ''}
        ${l.status !== 'retired' ? `<button class="btn small" data-lset="retired" data-lid="${esc(l.id)}">끄기</button>` : ''}</td></tr>`).join('')}</table>`
      : '<p class="quiet">아직 교훈이 없습니다. 제작이 시작되면 평가자가 컷마다 정리해 쌓습니다. 대표님이 직접 가르칠 내용도 아래에 넣을 수 있습니다.</p>'}
    <div class="row" style="margin-top:12px;align-items:flex-end">
      <div style="width:130px"><label>분류</label><select id="lCat">${Object.entries(LCAT).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
      <div style="width:180px"><label>범위</label><select id="lSer"><option value="">모든 시리즈 공통</option>${series.map(x => `<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</select></div>
      <div style="flex:1;min-width:200px"><label>문제 (무엇이 아쉬웠나)</label><input id="lProb" placeholder="예: 대사할 때 표정이 거의 변하지 않음"></div>
    </div>
    <label>앞으로의 규칙 (감독이 그대로 따를 한 문장)</label><input id="lRule" placeholder="예: 대사 컷은 2초마다 눈썹·입꼬리 변화를 표정 타임라인에 적는다">
    <div class="row" style="margin-top:8px"><button class="btn primary" id="lAdd">대표 가르침으로 추가 (바로 적용)</button></div>
  </div>`;
  box.querySelectorAll('[data-lst]').forEach(b => b.onclick = () => { S.lessonSt = b.dataset.lst; renderLessons(); });
  box.querySelectorAll('[data-lset]').forEach(b => b.onclick = guard(async () => {
    await q(S.sb.from('director_lessons').update({ status: b.dataset.lset, updated_at: new Date().toISOString() }).eq('id', b.dataset.lid));
    toast(b.dataset.lset === 'active' ? '적용 중으로 바꿨습니다' : '껐습니다. 감독이 더 이상 참고하지 않습니다'); renderLessons();
  }));
  $('#lAdd').onclick = guard(async () => {
    const problem = $('#lProb').value.trim(), rule = $('#lRule').value.trim();
    if (!problem || !rule) return toast('문제와 규칙을 모두 적어 주세요');
    await q(S.sb.from('director_lessons').insert({ series_id: $('#lSer').value || null, category: $('#lCat').value, problem, rule,
      fingerprint: 'owner:' + Date.now().toString(36), sources: ['대표'], status: 'active' }));
    toast('감독 노하우에 추가했습니다'); renderLessons();
  });
}

const INBOX_SRC = { staff: ['직원', 'accent'], script: ['대본', 'warn'], bible: ['바이블', 'good'], fail: ['실패', 'bad'] };
async function loadInbox() {
  const [guides, staff, drafts, confs, props, bvers, eps, ents, pds, vds] = await Promise.all([
    q(S.sb.from('staff_guidelines').select('id,staff_id,version_no,content,change_reason,proposed_by,created_at').eq('status', 'proposed')),
    q(S.sb.from('staff').select('id,name')),
    q(S.sb.from('script_versions').select('id,episode_id,version_no,note,change_summary,created_at').eq('status', 'draft')),
    q(S.sb.from('script_versions').select('episode_id,confirmed_at,created_at').eq('status', 'confirmed')),
    q(S.sb.from('story_proposals').select('id,episode_id,scene_no,kind,proposed_text,reason,created_at').eq('status', 'proposed')),
    q(S.sb.from('bible_versions').select('id,entry_id,version_no,description,change_reason,proposed_by,created_at').eq('status', 'proposed')),
    q(S.sb.from('episodes').select('id,number,title,series_id,series(title)')),
    q(S.sb.from('bible_entries').select('id,name,category,series_id')),
    q(S.sb.from('photo_designs').select('entry_id,status').in('status', ['ready', 'set_ready'])).catch(() => []),
    q(S.sb.from('voice_designs').select('entry_id,status').eq('status', 'ready')).catch(() => []),
  ]);
  // 최근 14일 실패한 작업(같은 일이 여러 번 실패했으면 마지막 것만): 원인과 함께 보여 주고 다시 시도·지우기
  const since = new Date(Date.now() - 14 * 864e5).toISOString();
  const fails = await q(S.sb.from('pipeline_tasks').select('id,kind,status,error,payload,episode_id,series_id,scene_no,cut_id,take_id,platform,created_at,finished_at')
    .eq('status', 'failed').gte('created_at', since).order('created_at', { ascending: false }).limit(300)).catch(() => []);
  const pds2 = fails.some(f => f.payload?.design_id) ? await q(S.sb.from('photo_designs').select('id,entry_id').in('id', fails.map(f => f.payload?.design_id).filter(Boolean))).catch(() => []) : [];
  const epOf = id => eps.find(e => e.id === id), entOf = id => ents.find(e => e.id === id);
  const serTitles = {}; eps.forEach(e => { if (e.series?.title) serTitles[e.series_id] = e.series.title; });
  const serName = sid => serTitles[sid] ? `[${serTitles[sid]}] ` : '';
  const epName = e => e ? `${e.series?.title || ''} ${e.number}화` : '';
  const lastConf = {}; confs.forEach(c => { const t = c.confirmed_at || c.created_at; if (!lastConf[c.episode_id] || t > lastConf[c.episode_id]) lastConf[c.episode_id] = t; });
  const items = [];
  guides.forEach(g => items.push({ src: 'staff', type: 'guide', id: g.id, key: 'g' + g.staff_id, at: g.created_at,
    title: `${staff.find(s => s.id === g.staff_id)?.name || '직원'} 지침 v${g.version_no || ''}`, sub: g.change_reason || g.proposed_by || '', tab: 'staff' }));
  drafts.filter(d => !lastConf[d.episode_id] || d.created_at > lastConf[d.episode_id]).forEach(d => items.push({ src: 'script', type: 'draft', id: d.id, key: 'd' + d.episode_id,
    at: d.created_at, title: `${epName(epOf(d.episode_id))} 대본 확정`, sub: d.change_summary || d.note || '초안', tab: 'scripts', ep: d.episode_id }));
  props.forEach(p => items.push({ src: 'script', type: 'story', id: p.id, key: 'p' + p.id, at: p.created_at,
    title: `${epName(epOf(p.episode_id))}${p.scene_no ? ' S#' + p.scene_no : ''} 흐름 변경: ${PKIND[p.kind] || p.kind}`, sub: p.proposed_text + (p.reason ? ` · 이유: ${p.reason}` : ''), tab: 'scripts', ep: p.episode_id }));
  bvers.forEach(v => { const e = entOf(v.entry_id); items.push({ src: 'bible', type: 'bible', id: v.id, key: 'b' + v.entry_id, at: v.created_at,
    title: `${serName(e?.series_id)}${e?.name || '항목'} (${BIBLE_CAT[e?.category] || ''}) v${v.version_no || ''} 수정안`, sub: v.change_reason || (v.description || '').slice(0, 120), tab: 'bible', ser: e?.series_id }); });
  const seen = new Set();
  fails.forEach(f => {
    const p = f.payload || {}, k = f.kind + '|' + (p.version_id || p.entry_id || p.design_id || f.cut_id || f.episode_id || f.series_id || f.id);
    if (seen.has(k)) return; seen.add(k);
    const ent = entOf(p.entry_id || pds2.find(d => d.id === p.design_id)?.entry_id), ep = epOf(f.episode_id);
    const target = ent ? `${serName(ent.series_id)}${ent.name}${BIBLE_CAT[ent.category] ? ' (' + BIBLE_CAT[ent.category] + ')' : ''}` : ep ? epName(ep) + (f.scene_no ? ` S${f.scene_no}` : '') : '';
    items.push({ src: 'fail', type: 'fail', id: f.id, key: 'f' + k, at: f.finished_at || f.created_at, task: f,
      title: `${TASK_LABEL[f.kind] || f.kind} 실패${target ? ' — ' + target : ''}`, sub: (() => { const x = explainFail(f.kind, f.error); return `${x.what} → ${x.how} (원인: ${(f.error || '기록 없음').slice(0, 120)})`; })(),
      tab: ['bible_prompt', 'photo_describe', 'bible_place', 'photo_design', 'photo_set', 'bible_extract', 'bible_suggest', 'voice_cast', 'voice_design'].includes(f.kind) ? 'bible'
        : f.kind === 'assemble' || f.kind === 'bgm' ? 'edit' : f.kind === 'upscale' ? 'release' : 'production', ep: f.episode_id, ser: ent?.series_id || f.series_id });
  });
  items.sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  const picks = [...new Set([...pds, ...vds].map(x => x.entry_id))].map(entOf).filter(Boolean);
  return { items, picks, pdN: pds.length, vdN: vds.length };
}

  box.querySelectorAll('[data-ibf]').forEach(b => b.onclick = () => { S.inboxF = b.dataset.ibf; renderInbox(); });

  box.querySelectorAll('[data-ibgo]').forEach(a => a.onclick = e => {
    e.preventDefault(); e.stopPropagation(); const it = shown[+a.dataset.ibgo];
    if (it.ep) { S.episodeId = it.ep; S.versionId = it.type === 'draft' ? it.id : null; }
    if (it.ser) S.seriesId = it.ser;
    go(it.tab);
  });
  const retryFail = async it => {
    const f = it.task;
    await q(S.sb.from('pipeline_tasks').insert({ kind: f.kind, payload: f.payload || {}, episode_id: f.episode_id, series_id: f.series_id, scene_no: f.scene_no,
      cut_id: f.cut_id, take_id: f.take_id, platform: f.platform }));
    await q(S.sb.from('pipeline_tasks').update({ status: 'cancelled' }).eq('kind', f.kind).eq('status', 'failed')
      .eq(f.payload?.version_id ? 'payload->>version_id' : 'id', f.payload?.version_id || f.id));
  };
  box.querySelectorAll('[data-ibre]').forEach(a => a.onclick = guard(async e => {
    e.preventDefault(); e.stopPropagation(); await retryFail(shown[+a.dataset.ibre]); toast('다시 맡겼습니다'); renderInbox();
  }));
  const sel = () => [...box.querySelectorAll('[data-ib]:checked')].map(c => shown[+c.dataset.ib]);
  const upd = () => { const n = sel().length; ['#ibApply', '#ibReject'].forEach(s => { const b = $(s); if (b) b.disabled = !n; }); const o = $('#ibSel'); if (o) o.textContent = n ? `${n}건 선택` : ''; };
  box.querySelectorAll('[data-ib]').forEach(c => c.onchange = upd);
  const all = $('#ibAll'); if (all) all.onchange = () => { box.querySelectorAll('[data-ib]').forEach(c => { c.checked = all.checked; }); upd(); };
  const run = apply => guard(async () => {
    let list = sel(); if (!list.length) return;
    // 같은 대상(같은 직원·같은 화 대본·같은 바이블 항목)에 여러 건이면 적용은 가장 최근 것 하나만, 나머지는 반려
    const newest = {}; list.forEach(it => { if (!['story', 'fail'].includes(it.type) && (!newest[it.key] || it.at > newest[it.key].at)) newest[it.key] = it; });
    const dup = apply ? list.filter(it => !['story', 'fail'].includes(it.type) && newest[it.key] !== it) : [];
    if (!confirm(`${list.length}건을 ${apply ? '적용' : '반려'}합니다.${dup.length ? `\n같은 대상의 예전 수정안 ${dup.length}건은 최신 것만 적용하고 반려합니다.` : ''}${apply && list.some(i => i.type === 'draft') ? '\n대본을 확정하면 감독 컷 설계가 이어서 시작될 수 있습니다.' : ''}`)) return;
    const btns = ['#ibApply', '#ibReject'].map(s => $(s)); btns.forEach(b => b && (b.disabled = true));
    let ok = 0, fail = 0; const errs = [];
    for (const it of list) {
      const yes = apply && !dup.includes(it);
      try {
        if (it.type === 'fail') { yes ? await retryFail(it) : await q(S.sb.from('pipeline_tasks').update({ status: 'cancelled' }).eq('id', it.id)); ok++; continue; }
        if (it.type === 'guide') yes ? await q(S.sb.rpc('activate_guideline', { p_id: it.id })) : await q(S.sb.from('staff_guidelines').update({ status: 'rejected' }).eq('id', it.id));
        if (it.type === 'draft') yes ? await q(S.sb.rpc('confirm_script_version', { p_id: it.id, p_note: null })) : await q(S.sb.from('script_versions').update({ status: 'superseded' }).eq('id', it.id));
        if (it.type === 'story') await q(S.sb.from('story_proposals').update({ status: yes ? 'approved' : 'rejected', decided_at: new Date().toISOString() }).eq('id', it.id));
        if (it.type === 'bible') yes ? await q(S.sb.rpc('activate_bible_version', { p_id: it.id })) : await q(S.sb.from('bible_versions').update({ status: 'rejected' }).eq('id', it.id));
        ok++;
      } catch (e) { console.error(e); fail++; errs.push(`${it.title}: ${errText(e)}`); }
    }
    toast(`${apply ? '적용' : '반려'} ${ok}건${fail ? ` · 실패 ${fail}건` : ''}`);
    await renderInbox();
    // 적용하다 실패한 건: 원인을 목록 위에 남긴다(그 항목은 목록에 그대로 남아 다시 시도할 수 있음)
    if (errs.length) box.insertAdjacentHTML('afterbegin', `<div class="msg err"><b>${apply ? '적용' : '반려'}하지 못한 ${errs.length}건</b> — 목록에 그대로 남아 있습니다. 원인:<ul style="margin:4px 0 0">${errs.slice(0, 20).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`);
  });
  const ap = $('#ibApply'); if (ap) ap.onclick = run(true);
  const rj = $('#ibReject'); if (rj) rj.onclick = run(false);
}

function directiveCard(d) {
  const who = d.assigned_to_label || d.staff?.name;
  const order = ['received', 'assigned', 'in_progress', 'done'];
  const endBad = d.status === 'rejected' || d.status === 'cancelled';
  const at = endBad ? 3 : order.indexOf(d.status);
  const st = (i, title, desc) => {
    const cls = i < at || (i === 3 && d.status === 'done') ? 'done' : i === at ? (endBad ? 'fail' : 'now') : '';
    return `<div class="step ${cls}"><div class="dot">${cls === 'done' ? '✓' : cls === 'fail' ? '!' : i + 1}</div>
      <div class="t">${title}</div><div class="d">${desc}</div></div>`;
  };
  const statusLine = {
    received: '에이전트가 지시를 읽고 담당 직원을 정하는 중입니다.',
    assigned: `${esc(who)}에게 배정되었고 곧 처리를 시작합니다.`,
    in_progress: `${esc(who)}이(가) 처리하고 있습니다${d.progress_note ? ': ' + esc(d.progress_note) : '.'}`,
    done: `완료되었습니다${d.result_note ? ': ' + esc(d.result_note) : '.'}`,
    rejected: `처리하지 못했습니다${d.result_note ? ': ' + esc(d.result_note) : '.'}`,
    cancelled: '대표가 취소한 지시입니다.',
  }[d.status];
  return `<div class="card dcard" data-dir="${esc(d.id)}">
    <div class="row"><b style="font-size:15.5px;flex:1;min-width:200px">${esc(d.content)}</b>
      ${pill(DIR_STATUS[d.status] || d.status, d.status === 'done' ? 'good' : endBad ? 'bad' : 'accent')}</div>
    ${d.summary ? `<div class="quiet" style="margin-top:2px">요약: ${esc(d.summary)}</div>` : ''}
    <div class="route" style="margin-top:10px">
      <span class="node"><b>보낸 사람</b> 대표 · ${esc(d.devices?.name || '기기 미상')}</span><span class="arrow">→</span>
      <span class="node"><b>받는 사람</b> ${who ? esc(who) : '<span class="quiet">배정 전</span>'}</span>
      ${d.episodes ? `<span class="node">${esc(d.episodes.series?.title)} ${d.episodes.number}화${d.scene_no ? ' S#' + d.scene_no : ''}</span>` : ''}
    </div>
    <div class="steps">
      ${st(0, '접수', fmt(d.created_at))}
      ${st(1, '배정', d.assigned_at ? esc(who || '') + '<br>' + fmt(d.assigned_at) + (d.assigned_reason ? '<br>' + esc(d.assigned_reason) : '') : '담당 직원 정하기')}
      ${st(2, '처리 중', d.started_at ? (d.progress_note ? esc(d.progress_note) + '<br>' : '') + fmt(d.started_at) : '작업 진행')}
      ${st(3, endBad ? (d.status === 'cancelled' ? '취소' : '반려') : '완료', d.completed_at ? fmt(d.completed_at) : '결과 보고')}
    </div>
    <p style="margin:10px 0 6px"><b>지금 상태:</b> ${statusLine}</p>
    <div class="row"><button class="btn small" data-more="${esc(d.id)}">진행 기록 자세히</button>
      ${['received', 'assigned', 'in_progress'].includes(d.status) ? `<button class="btn small danger" data-cancel="${esc(d.id)}">지시 취소</button>` : ''}</div>
    <div id="more-${esc(d.id)}"></div>
  </div>`;
}

async function latestAgentVersion() {
  try {
    const t = await fetch(AGENT_GH + '/agent.py', { cache: 'no-store' }).then(r => r.ok ? r.text() : '');
    return (t.match(/^VERSION = "([^"]+)"/m) || [])[1] || null;
  } catch { return null; }
}
const ONLINE_SEC = 60;
const verNum = v => String(v || '0').split('.').map(n => n.padStart(4, '0')).join('.');

function installCommand(platform, token) {
  const { url, key } = loadJSON(LS.cfg);
  return platform === 'mac'
    ? `curl -fsSL "${AGENT_GH}/install.sh" | bash -s -- "${url}" "${key}" "${token}"`
    : `$env:NYX_URL='${url}'; $env:NYX_KEY='${key}'; $env:NYX_TOKEN='${token}'; iex ([Text.Encoding]::UTF8.GetString((Invoke-WebRequest '${AGENT_GH}/install.ps1' -UseBasicParsing).RawContentStream.ToArray()))`;
}
function installBox(platform, name, token) {
  const cmd = installCommand(platform, token);
  const how = platform === 'mac'
    ? '<b>맥</b>: ⌘+스페이스 → "터미널" 입력 → Enter로 터미널을 엽니다. 아래 명령을 붙여 넣고(⌘V) Enter를 누르세요.'
    : '<b>Windows</b>: 시작 메뉴에서 "PowerShell"을 검색해 엽니다. 아래 명령을 붙여 넣고(마우스 오른쪽 클릭) Enter를 누르세요.';
  return `<div class="card" style="border-color:var(--accent)">
    <b>${esc(name)} 설치 명령</b>
    <p>${how}</p>
    <pre class="doc" id="icmd" style="max-height:160px">${esc(cmd)}</pre>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="icopy">명령 복사</button>
      <span class="quiet">설치하는 컴퓨터에서 이 대시보드를 열고 복사하면 편합니다.</span></div>
    <p class="quiet" style="margin-top:10px">⚠️ 이 명령에는 이 기기 전용 열쇠(토큰)가 들어 있어 <b>지금 한 번만</b> 보입니다. 다른 사람에게 보내지 마세요.
    다시 필요하면 "설치 명령 다시 받기"를 누르면 됩니다(새 열쇠가 나오고 이전 설치는 끊깁니다). 1~3분 걸리며 관리자 비밀번호는 필요 없습니다.</p>
  </div>`;
}
function bindCopy() {
  const b = $('#icopy'); if (!b) return;
  b.onclick = async () => {
    try { await navigator.clipboard.writeText($('#icmd').textContent); toast('복사했습니다'); }
    catch { const r = document.createRange(); r.selectNodeContents($('#icmd')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('선택해 두었습니다. 복사하기(⌘C / Ctrl+C)를 누르세요'); }
  };
}

  server: ['서버(보관)', 'good', '영상을 OneDrive 씬 폴더에 보관하고 완성본을 만듭니다. 항상 켜 둡니다'],
  mobile: ['이동용', '', '들고 다니는 노트북: 작가실·감독·목소리·말로 편집 같은 가벼운 일만 합니다(덮개를 닫아도 문제없게)'],

const AGENT_PRESETS = [
  { name: '회사 맥', platform: 'mac', role: 'office' }, { name: '집 윈도우 (서버)', platform: 'windows', role: 'server' },
  { name: '이동용 맥', platform: 'mac', role: 'mobile' }, { name: '이동용 윈도우', platform: 'windows', role: 'mobile' },
];
async function viewAgents(main) {

  main.innerHTML = `
  <h2>에이전트</h2>
  <p class="quiet">각 컴퓨터에서 일하는 프로그램입니다. 설치는 컴퓨터마다 처음 한 번만 하고, 그 뒤로는 여기 버튼으로 통제합니다.</p>

    <p class="quiet" style="margin:6px 0 0">새 버전이 GitHub에 올라가면 켜져 있는 에이전트가 <b>10분 안에 스스로</b> 받아서, 하던 작업을 마친 뒤 갈아 끼웁니다.
    새 버전이 시작에 실패하면 자동으로 이전 버전으로 되돌립니다. 지금 바로 받게 하려면 기기의 "업데이트"를 누르세요.</p>
    ${storedVer && storedVer !== AGENT_VERSION ? `<p class="quiet" style="margin:6px 0 0">v1.0.0 에이전트는 자동 업데이트 기능이 없어 한 번만 손으로 올려야 합니다: "예전 에이전트용 배포" → 해당 기기 "업데이트".</p>` : ''}
  </div>
  <div id="agList"><p class="quiet">불러오는 중…</p></div>
  <div class="card">
    <b>에이전트 추가</b>
    <div class="row" style="margin:8px 0 2px">${AGENT_PRESETS.map((p, i) => `<button class="btn small" data-preset="${i}">${esc(p.name)}</button>`).join('')}</div>
    <p class="quiet" style="margin:2px 0 0">자주 쓰는 구성을 누르면 이름·종류·역할이 채워집니다.</p>
    <div class="row" style="align-items:flex-end">
      <div style="flex:2;min-width:160px"><label>이름</label><input id="aname" placeholder="예: Windows 본부 PC, 회사 맥북"></div>
      <div style="flex:1;min-width:130px"><label>종류</label><select id="aplat"><option value="windows">Windows</option>
        <option value="mac" ${guessKind() === 'mac_browser' ? 'selected' : ''}>맥</option></select></div>
      <div style="flex:1;min-width:150px"><label>역할</label><select id="arole">${Object.entries(ROLE).map(([k, [l]]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
      <button class="btn primary" id="aadd">추가하고 설치 명령 받기</button></div>
  </div>
  <div id="ainstall"></div>`;

  main.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { const p = AGENT_PRESETS[+b.dataset.preset];
    $('#aname').value = p.name; $('#aplat').value = p.platform; $('#arole').value = p.role; $('#aname').focus(); });
  $('#deploy').onclick = guard(async () => {
    const btn = $('#deploy'); btn.disabled = true; btn.textContent = '배포 중…';
    try {
      for (const name of AGENT_FILES) {
        const text = agentFile(name); if (!text) throw new Error(name + ' 내용이 비어 있습니다');
        const { error } = await S.sb.storage.from('agent').upload(name, new Blob([text], { type: 'text/plain;charset=utf-8' }),
          { upsert: true, contentType: 'text/plain; charset=utf-8', cacheControl: '0' });
        if (error) throw error;
      }
      const { error } = await S.sb.storage.from('agent').upload('version.txt', new Blob([AGENT_VERSION], { type: 'text/plain' }),

  await renderAgentList(newest);
  if (S.agentTimer) clearInterval(S.agentTimer);
  S.agentTimer = setInterval(() => {
    if (S.tab !== 'agents' || !$('#agList')) { clearInterval(S.agentTimer); S.agentTimer = null; return; }
    renderAgentList(newest).catch(() => {});

}

async function renderAgentList(newest) {
  const box = $('#agList'); if (!box) return;
  const [st, cmds] = await Promise.all([
    q(S.sb.from('agent_status').select('*,devices(name,kind)')),
    q(S.sb.from('agent_commands').select('id,device_id,command,status,result,created_at,done_at').order('created_at', { ascending: false }).limit(60)),
  ]);
  const list = st.filter(a => a.state !== 'removed').sort((a, b) => (a.devices?.name || '').localeCompare(b.devices?.name || ''));
  if (!list.length) { box.innerHTML = '<div class="card quiet">아직 에이전트가 없습니다. 아래에서 추가하세요.</div>'; return; }
  const CMD = { ping: '연결 시험', restart: '재시작', update: '업데이트', test_keys: 'API 키 시험' };
  const CST = { queued: ['전달 대기', ''], sent: ['처리 중', 'accent'], done: ['완료', 'good'], failed: ['실패', 'bad'] };
  box.innerHTML = list.map(a => {
    const age = a.last_seen_at ? (Date.now() - new Date(a.last_seen_at)) / 1000 : null;
    const online = age != null && age < ONLINE_SEC;
    const conn = a.last_seen_at == null ? pill('설치 전', 'warn') : online ? pill('온라인', 'good') : pill('오프라인', 'bad');
    const state = !online ? '' : a.paused ? pill('일시정지', 'warn') : a.current_job ? pill('작업 중', 'accent')
      : a.state === 'error' ? pill('오류', 'bad') : pill('대기 중', '');
    const old = newest && a.version && verNum(a.version) < verNum(newest);
    const recent = cmds.filter(c => c.device_id === a.device_id).slice(0, 3);
    return `<div class="card">
      <div class="row"><b style="font-size:16px">${esc(a.devices?.name || '이름 없음')}</b>
        ${pill(a.platform === 'mac' ? '맥' : a.platform === 'windows' ? 'Windows' : (a.platform || '-'))}${pill(ROLE[a.role || 'office'][0], ROLE[a.role || 'office'][1])}${conn}${state}
        ${a.version ? pill('v' + a.version, old ? 'warn' : '') : ''}${old ? `<span class="quiet">새 버전 v${esc(newest)} ${a.info?.auto_update_minutes ? '· 곧 자동 업데이트' : '· "업데이트"를 한 번 눌러 주세요'}</span>` : ''}</div>
      ${a.info?.rolled_back_from ? `<div class="msg err" style="margin:8px 0 0">v${esc(a.info.rolled_back_from)} 업데이트가 이 기기에서 시작에 실패해 이전 버전으로 되돌렸습니다. 다음 버전이 나오면 다시 시도합니다.</div>` : ''}
      <div class="quiet" style="margin-top:6px">마지막 통신 ${fmt(a.last_seen_at)}${a.info?.hostname ? ` · ${esc(a.info.hostname)} · ${esc(a.info.os || '')}` : ''}
        ${a.current_job ? `<br>지금 하는 일: <b>${esc(JOB_NAME[a.current_job] || a.current_job)}</b>` : ''}</div>
      ${a.last_error ? `<div class="msg err" style="margin:8px 0 0">${esc(a.last_error)}</div>` : ''}
      <div class="row" style="margin-top:8px"><span class="quiet">역할</span><select data-role="${esc(a.device_id)}" style="width:auto">${Object.entries(ROLE).map(([k, [l]]) => `<option value="${k}" ${k === (a.role || 'office') ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <span class="quiet">${esc(ROLE[a.role || 'office'][2])}</span></div>
      <div class="row" style="margin-top:10px">
        <button class="btn small" data-cmd="ping" data-dev="${esc(a.device_id)}">연결 시험</button>
        <button class="btn small" data-pause="${esc(a.device_id)}" data-v="${a.paused ? '0' : '1'}">${a.paused ? '다시 시작' : '일시정지'}</button>
        <button class="btn small" data-cmd="restart" data-dev="${esc(a.device_id)}">재시작</button>
        <button class="btn small ${old ? 'primary' : ''}" data-cmd="update" data-dev="${esc(a.device_id)}">업데이트</button>
        <button class="btn small" data-reissue="${esc(a.device_id)}" data-plat="${esc(a.platform || 'windows')}" data-name="${esc(a.devices?.name || '')}">설치 명령 다시 받기</button>
        <button class="btn small danger" data-remove="${esc(a.device_id)}">연결 해제</button></div>
      ${recent.length ? `<table style="margin-top:8px">${recent.map(c => `<tr><td class="quiet hide-m" style="white-space:nowrap">${fmt(c.created_at)}</td>
        <td style="white-space:nowrap">${esc(CMD[c.command] || c.command)}</td><td>${pill(CST[c.status][0], CST[c.status][1])}</td>
        <td class="quiet">${esc(c.result || '')}</td></tr>`).join('')}</table>` : ''}
      ${!online && a.last_seen_at == null ? '<p class="quiet" style="margin:8px 0 0">설치 명령을 실행하면 1분 안에 온라인으로 바뀝니다.</p>' : ''}
      ${!online && a.last_seen_at != null ? '<p class="quiet" style="margin:8px 0 0">컴퓨터가 꺼졌거나 잠들었거나 인터넷이 끊겼습니다. 명령은 다시 연결되면 처리됩니다.</p>' : ''}
    </div>`;
  }).join('');
  box.querySelectorAll('[data-cmd]').forEach(b => b.onclick = guard(async () => {
    await q(S.sb.from('agent_commands').insert({ device_id: b.dataset.dev, command: b.dataset.cmd }));
    toast(`${CMD[b.dataset.cmd]} 명령을 보냈습니다. 15초 안에 처리됩니다`); renderAgentList(newest);
  }));
  box.querySelectorAll('[data-role]').forEach(s => s.onchange = guard(async () => {
    if (s.value === 'server' && list.some(x => x.role === 'server' && x.device_id !== s.dataset.role) && !confirm('이미 서버가 있습니다. 서버를 둘로 두면 영상이 두 곳에 나뉘어 보관될 수 있습니다. 계속할까요?')) { s.value = list.find(x => x.device_id === s.dataset.role)?.role || 'office'; return; }
    await q(S.sb.from('agent_status').update({ role: s.value }).eq('device_id', s.dataset.role));
    toast(`역할을 "${ROLE[s.value][0]}"(으)로 바꿨습니다`); renderAgentList(newest);
  }));
  box.querySelectorAll('[data-pause]').forEach(b => b.onclick = guard(async () => {
    const paused = b.dataset.v === '1';
    await q(S.sb.from('agent_status').update({ paused }).eq('device_id', b.dataset.pause));
    toast(paused ? '일시정지했습니다. 하던 작업은 끝내고 멈춥니다' : '다시 시작했습니다'); renderAgentList(newest);
  }));
  box.querySelectorAll('[data-reissue]').forEach(b => b.onclick = guard(async () => {
    if (!confirm('새 설치 명령을 만들까요? 이 기기에 이미 설치된 에이전트는 연결이 끊기고, 새 명령으로 다시 설치해야 합니다.')) return;
    const token = await q(S.sb.rpc('reissue_agent_token', { p_device: b.dataset.reissue }));
    $('#ainstall').innerHTML = installBox(b.dataset.plat, b.dataset.name, token); bindCopy();
    $('#ainstall').scrollIntoView({ behavior: 'smooth' });
  }));
  box.querySelectorAll('[data-remove]').forEach(b => b.onclick = guard(async () => {
    if (!confirm('이 에이전트의 연결을 끊을까요? 그 컴퓨터의 프로그램은 더 이상 일을 받지 못합니다.')) return;
    await q(S.sb.rpc('remove_agent', { p_device: b.dataset.remove })); toast('연결을 끊었습니다'); renderAgentList(newest);
  }));
}

// 비용·견적서: 장부(모든 지출 한 줄씩), 순수 제작비 vs 누수 비용, 화별 견적서, 사전 견적
// ------------------------------------------------------------------
const STAGE = { script_revision: '대본 수정·변경 요약', cut_card: '컷 카드·프롬프트(감독)', prompt_review: '프롬프트 감수',
  keyframe: '키프레임 생성', keyframe_review: '키프레임 검사', video: '영상 생성(Higgsfield)', video_review: '영상 검사',
  final_review: '최종 감수', evaluate: '채점(평가자)', upscale: '업스케일(맥)', subtitle: '자막(맥)', audio: '음량·음성(맥)',
  edit: '편집(쌤컷)', directive: '지시 처리', localization: '현지화(자막·더빙·립싱크)', fixed: '고정비(구독 등)', other: '기타' };
const OUTCOME = { success: ['순수 제작비', 'good'], failed: ['실패(누수)', 'bad'], pending: ['진행 중', 'accent'], hold: ['보류', 'warn'] };
const CAUSE = { director: '감독(프롬프트)', tool: '영상 도구 한계', script: '대본', standard: '기준', other: '기타' };
const UNIT = { per_second: '초당', per_1m_input_tokens: '입력 100만 토큰당', per_1m_output_tokens: '출력 100만 토큰당', per_image: '이미지 1장당', per_call: '1회당', per_month: '월' };
const won = n => n == null || isNaN(n) ? '-' : Math.round(n).toLocaleString('ko-KR') + '원';
const usdf = n => n == null || isNaN(n) ? '-' : '$' + Number(n).toFixed(2);
const sum = (rows, f = r => r.krw) => rows.reduce((a, r) => a + (Number(f(r)) || 0), 0);
const qtyText = q => !q ? '' : [q.seconds && `${q.seconds}초`, q.images && `${q.images}장`, q.calls && `${q.calls}회`,
  q.input_tokens && `입력 ${Number(q.input_tokens).toLocaleString()}`, q.output_tokens && `출력 ${Number(q.output_tokens).toLocaleString()}`].filter(Boolean).join(' · ');
const groupBy = (rows, key) => rows.reduce((m, r) => { const k = key(r) ?? '-'; (m[k] = m[k] || []).push(r); return m; }, {});

const PROVIDER = { higgsfield: 'Higgsfield (영상·장면 사진·인물 사진·얼굴 학습)', elevenlabs: 'ElevenLabs (대사·목소리·배경음악)', anthropic: 'Claude (AI 직원)', manual: '직접 입력', other: '기타' };
function buildInvoice(events, meta) {
  const by = o => events.filter(e => e.outcome === o);
  const success = by('success'), failed = by('failed'), pending = by('pending'), hold = by('hold');
  const stageRows = rows => Object.entries(groupBy(rows, r => r.stage)).map(([k, rs]) => ({
    stage: k, label: STAGE[k] || k, count: rs.length, krw: sum(rs), usd: sum(rs, r => r.usd),
    seconds: sum(rs, r => r.qty?.seconds), tokens: sum(rs, r => (r.qty?.input_tokens || 0) + (r.qty?.output_tokens || 0)),
  })).sort((a, b) => b.krw - a.krw);
  const total = sum(events), pure = sum(success), leak = sum(failed);
  const successCuts = new Set(success.filter(e => e.stage === 'video' && e.cut_id).map(e => e.cut_id)).size;
  return {
    title: meta.title, generated_at: new Date().toISOString(), krw_per_usd: meta.krw_per_usd,
    totals: { total, pure, leak, pending: sum(pending), hold: sum(hold), count: events.length,
      leak_rate: total ? leak / total : 0, success_cuts: successCuts, per_cut: successCuts ? pure / successCuts : null },
    success_by_stage: stageRows(success), failed_by_stage: stageRows(failed),
    failed_by_cause: Object.entries(groupBy(failed, r => r.failure_cause || 'other')).map(([k, rs]) => ({ cause: CAUSE[k] || k, count: rs.length, krw: sum(rs) }))
      .sort((a, b) => b.krw - a.krw),
    failed_items: failed.slice().sort((a, b) => (b.krw || 0) - (a.krw || 0)).slice(0, 40).map(e => ({
      cut_id: e.cut_id, stage: STAGE[e.stage] || e.stage, attempt_no: e.attempt_no, reason: e.failure_reason,
      cause: CAUSE[e.failure_cause] || '', krw: e.krw, at: e.occurred_at })),
    pending_by_stage: stageRows(pending), hold_by_stage: stageRows(hold),
    // 회사별: Higgsfield(영상·사진·얼굴 학습) / ElevenLabs(목소리·음악) / Claude(AI 직원) / 직접 입력 — 대기 중(감수 전) 금액도 함께
    by_provider: Object.entries(groupBy(events.filter(e => e.provider !== 'local'), r => r.source === 'manual' ? 'manual' : (r.provider || 'other'))).map(([k, rs]) => ({
      provider: k, label: PROVIDER[k] || k, count: rs.length, krw: sum(rs), pending: sum(rs.filter(r => r.outcome === 'pending')),
      noprice: rs.filter(r => r.usd == null && r.krw == null).length,
      stages: Object.entries(groupBy(rs, r => r.stage)).map(([s, xs]) => `${STAGE[s] || s} ${xs.length}건 ${won(sum(xs))}`).join(' · '),
    })).sort((a, b) => b.krw - a.krw),
    has_edit: events.some(e => e.stage === 'edit'), revenue: meta.revenue ?? null,
  };
}

      <div><b class="quiet">원인별</b>${d.failed_by_cause.length ? `<table>${d.failed_by_cause.map(r => `<tr><td>${esc(r.cause)}</td>
        <td style="text-align:right">${r.count}건</td><td style="text-align:right">${won(r.krw)}</td></tr>`).join('')}</table>` : '<p class="quiet">없음</p>'}</div>
      <div><b class="quiet">단계별</b>${stageTable(d.failed_by_stage)}</div>

      <tr><th>컷</th><th>단계</th><th>시도</th><th>원인</th><th>이유</th><th style="text-align:right">금액</th></tr>${d.failed_items.map(f => `

      <tr><td><b>총 사용액</b></td><td style="text-align:right"><b>${won(t.total)}</b></td></tr>

// 비용 탭 맨 위: 에이전트가 API로 받아 온 잔액(ElevenLabs 남은 글자 수 · Higgsfield 잔액(조회 가능하면)) + 이번 달 서비스별 사용액
async function loadBalances(events, force) {
  const body = document.getElementById('balBody'); if (!body) return;
  const [last] = await q(S.sb.from('pipeline_tasks').select('id,status,result,error,finished_at,created_at').eq('kind', 'balance_check')
    .order('created_at', { ascending: false }).limit(1));
  const fresh = last && (last.status === 'queued' || last.status === 'running' || (last.finished_at && Date.now() - new Date(last.finished_at) < 10 * 60e3));
  if (force || !fresh) {
    if (!last || !['queued', 'running'].includes(last.status)) await q(S.sb.from('pipeline_tasks').insert({ kind: 'balance_check', payload: {} }));
  }
  const done = (await q(S.sb.from('pipeline_tasks').select('result,finished_at').eq('kind', 'balance_check').eq('status', 'done')
    .order('finished_at', { ascending: false }).limit(1)))[0];
  let r = {}; try { r = JSON.parse(done?.result || '{}'); } catch (e) {}
  const month = new Date(); month.setDate(1); month.setHours(0, 0, 0, 0);
  const spent = p => events.filter(e => new Date(e.occurred_at) >= month && (e.provider || '').toLowerCase().includes(p)).reduce((s, e) => s + Number(e.krw || 0), 0);
  const el = r.elevenlabs || {}, hf = r.higgsfield || {};
  const pct = el.ok && el.limit ? Math.round(el.left / el.limit * 100) : null;
  const row = (name, main, sub, kind, link) => `<div class="balrow"><b>${name}</b><span class="${kind || ''}">${main}</span><span class="quiet">${sub}</span>${link ? `<a href="${link}" target="_blank" rel="noopener" class="quiet">충전하기 ↗</a>` : ''}</div>`;
  body.innerHTML = `
    ${row('ElevenLabs (목소리)', el.ok ? `남은 글자 ${el.left.toLocaleString()} / ${el.limit.toLocaleString()} (${pct}%)` : done ? '조회 실패' : '조회 중…',
      el.ok ? `${esc(el.tier || '')}${el.reset ? ` · ${new Date(el.reset * 1000).toLocaleDateString('ko-KR')} 초기화` : ''} · 이번 달 기록 ${won(spent('eleven'))}` : esc(el.error || ''),
      el.ok ? (pct < 10 ? 'bad' : pct < 30 ? 'warn' : 'good') : 'warn', 'https://elevenlabs.io/app/subscription')}
    ${row('Higgsfield (사진·영상)', hf.ok ? `${hf.unit === 'USD' ? '$' + hf.value.toFixed(2) + ` (약 ${won(hf.value * (S.fx || 1340))})` : hf.value.toLocaleString() + ' ' + hf.unit}` : '사이트에서 확인',
      (hf.ok ? '' : 'Higgsfield API가 잔액 조회를 열어 두지 않았습니다 · ') + `이번 달 기록 ${won(spent('higgs'))}`, hf.ok ? 'good' : '', 'https://higgsfield.ai')}
    ${row('Claude (작가실·감독·감수)', '콘솔에서 확인', `Anthropic은 잔액 조회 API가 없습니다 · 이번 달 기록 ${won(spent('anthropic') + spent('claude'))}`, '', 'https://console.anthropic.com/settings/billing')}`;
  const at = document.getElementById('balAt');
  if (at) at.textContent = last && ['queued', 'running'].includes(last.status) ? '· 에이전트가 조회하는 중' : done ? `· ${fmt(done.finished_at)} 기준` : '';
  if (last && ['queued', 'running'].includes(last.status) && S.tab === 'costs') { clearTimeout(S.balTimer); S.balTimer = setTimeout(() => loadBalances(events, false).catch(() => {}), 5000); }
}

  let qy = S.sb.from('cost_events').select('*').order('occurred_at', { ascending: false }).limit(5000);
  if (S.costEp !== 'all') qy = qy.eq('episode_id', S.costEp);
  const events = (await q(qy)).filter(e => e.provider !== 'local');   // 편집·맥 로컬 처리(무료)는 비용에서 뺀다
  const ep = eps.find(e => e.id === S.costEp);

  const finals = ep ? await q(S.sb.from('final_invoices').select('id,label,created_at,snapshot').eq('episode_id', ep.id).order('created_at', { ascending: false })) : [];
  const title = ep ? `${ep.series?.title || ''} ${ep.number}화 ${ep.title || ''}`.trim() : '전체 작품';
  const inv = buildInvoice(events, { title, krw_per_usd: fx, revenue: fin?.revenue_krw ?? null });
  const shown = S.costOut === 'all' ? events : events.filter(e => e.outcome === S.costOut);

  const pageRows = shown.slice(S.costPage * PER, S.costPage * PER + PER);
  const missing = prices.filter(p => p.usd == null);

  const realTries = realCuts ? events.filter(e => e.stage === 'video' && doneCuts.has(e.cut_id)).length / realCuts : null;
  const aiPerCut = realCuts ? sum(events.filter(e => !['video', 'keyframe', 'fixed'].includes(e.stage))) / realCuts : null;
  const chip = (k, l, n, krw) => `<button class="btn small ${S.costOut === k ? 'primary' : ''}" data-co="${k}">${l} ${n}건 · ${won(krw)}</button>`;

  main.innerHTML = `

  <p class="quiet">모든 지출을 한 줄씩 기록합니다. 최종 결과에 쓰인 비용은 <b>순수 제작비</b>, 실패해서 버려진 비용은 <b>누수</b>로 나눠 봅니다.</p>

    <button class="btn small" id="balGo" style="margin-left:auto">지금 다시 조회</button></div><div id="balBody" class="quiet">불러오는 중…</div></div>

    <select id="cep" style="width:auto;min-width:200px"><option value="all">전체 작품</option>${eps.map(e =>
      `<option value="${esc(e.id)}" ${e.id === S.costEp ? 'selected' : ''}>${esc(e.series?.title || '')} ${e.number}화 ${esc(e.title || '')}</option>`).join('')}</select>
    <span class="quiet" style="margin-left:auto">환율 1$ =</span><input id="cfx" value="${fx}" inputmode="decimal" style="width:90px"><span class="quiet">원</span>
    <button class="btn small" id="cfxs">환율 저장</button></div></div>
  ${missing.length ? `<div class="msg err noprint" style="background:rgba(183,121,31,.12);color:var(--warn)">단가가 비어 있는 항목 ${missing.length}개(${missing.map(p => esc(p.label || p.model)).join(', ')}): 아래 단가표에서 넣어 주세요. 비어 있으면 그 비용은 0원으로 계산됩니다.</div>` : ''}

  });
  if ($('#cfinal')) $('#cfinal').onclick = guard(async () => {

    await q(S.sb.from('final_invoices').insert({ episode_id: ep.id, label, snapshot: inv }));
    toast('최종 견적서를 확정해 보관했습니다'); go('costs');
  });
  main.querySelectorAll('[data-fv]').forEach(b => b.onclick = () => {
    const f = finals.find(x => x.id === b.dataset.fv);

      <tr><td>영상 생성 (${cuts}컷 × ${sec}초 × ${tries}회)</td><td style="text-align:right">${won(video)}</td></tr>

      <tr><td>AI 직원 (감독·감수·평가)</td><td style="text-align:right">${won(aiCost)}</td></tr>
      <tr><td><b>예상 합계</b></td><td style="text-align:right"><b>${won(total)}</b> <span class="quiet">(${usdf(total / fx)})</span></td></tr>
      <tr><td class="quiet">한 번에 모두 성공했을 때(최소)</td><td style="text-align:right" class="quiet">${won(ideal)}</td></tr>
      <tr><td class="quiet">재시도로 늘어나는 예상 금액</td><td style="text-align:right" class="quiet">${won(total - ideal)}</td></tr></table>

  };
  ['#eCuts', '#eSec', '#eModel', '#eTries', '#eKf', '#eAi'].forEach(id => $(id).oninput = $(id).onchange = est); est();
  main.querySelectorAll('[data-ps]').forEach(b => b.onclick = guard(async () => {
    const raw = main.querySelector(`[data-pu="${b.dataset.ps}"]`).value.trim();
    const v = raw === '' ? null : Number(raw); if (raw !== '' && !(v >= 0)) return toast('단가를 숫자로 넣어 주세요');
    await q(S.sb.from('price_book').update({ usd: v, updated_at: new Date().toISOString(), source: '대표 입력' }).eq('id', b.dataset.ps));

  $('#pAdd').onclick = guard(async () => {
    const provider = $('#pProv').value.trim(), model = $('#pModel').value.trim(); if (!provider || !model) return toast('회사와 모델을 넣어 주세요');
    const usd = $('#pUsd').value.trim() === '' ? null : Number($('#pUsd').value);
    await q(S.sb.from('price_book').insert({ provider, model, unit: $('#pUnit').value, usd, label: $('#pLabel').value.trim() || null, source: '대표 입력' }));
    toast('단가를 추가했습니다'); go('costs');
  });
  $('#mAdd').onclick = guard(async () => {
    const amt = Number($('#mAmt').value.replace(/,/g, '')); if (!(amt > 0)) return toast('금액을 넣어 주세요');
    const usd = $('#mCur').value === 'usd' ? amt : null, krw = $('#mCur').value === 'krw' ? amt : null;
    const out = $('#mOut').value, note = $('#mNote').value.trim() || null;
    await q(S.sb.from('cost_events').insert({ episode_id: $('#mEp').value || null, cut_id: $('#mCut').value.trim() || null, stage: $('#mStage').value,
      outcome: out, usd, krw, source: 'manual', note: out === 'failed' ? null : note, failure_reason: out === 'failed' ? note : null }));
    toast('비용을 기록했습니다'); go('costs');
  });
}
