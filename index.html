답 형식: <json>{{"ops": [...], "summary": "무엇을 바꿨는지 한두 줄(한국어)"}}</json>"""
    user = f"[대표 지시]\n{p.get('text')}\n\n[클립 {len(table)}개, 전체 {total:.1f}초]\n{json.dumps(table, ensure_ascii=False)}\n\n[음악]\n{json.dumps(music, ensure_ascii=False)}\n\n[자막]\n{json.dumps(subs, ensure_ascii=False)}"
    text, _ = claude("claude-sonnet-5-5", system, user, max_tokens=3000, stage="edit", episode_id=(ed.get("episode") or {}).get("id"), note="말로 편집")
    res = pick_json(text)
    done = apply_ops(tl, res.get("ops"))
    if done:
        rpc("agent_save_edit", p_token=TOKEN, p_project=p["project_id"], p_timeline=tl)
    return (res.get("summary") or "") + f" (명령 {len(done)}개 적용)"


def run_task(tk):
    kind = tk["kind"]
    CURRENT["task"] = tk
    log(f"제작 작업 시작: {kind} ({tk['id']})")
    try:
        result = TASKS[kind](tk)
        rpc("agent_task_update", p_token=TOKEN, p_id=tk["id"], p_status="done", p_progress="완료", p_result=str(result or "완료"))
        log(f"제작 작업 완료: {kind} · {result}")
    except Exception as e:
        log(f"제작 작업 실패: {kind}: {e}\n{traceback.format_exc()}")
        retry = 120 if (tk.get("attempts") or 1) < 2 and kind in ("store", "video_review") else None
        rpc("agent_task_update", p_token=TOKEN, p_id=tk["id"], p_status="failed", p_error=str(e)[:1500], p_retry_in=retry)
        if kind in ("writers_room", "director") or retry is None:
            notify(f"작업 실패: {TASK_NAME.get(kind, kind)}", str(e)[:300], "warning")
    finally:
        CURRENT["task"] = None


TASK_NAME = {"assemble": "편집본 조립", "edit_command": "말로 편집", "voice_cast": "시리즈 목소리 설계", "voice_design": "목소리 후보 만들기", "voice_save": "목소리 저장", "writers_room": "작가실 정리", "director": "감독 컷 설계", "generate": "영상 생성", "store": "윈도우 보관", "video_review": "영상 감수"}


class Beat:
    """오래 걸리는 작업 중에도 15초마다 살아 있음 신호를 보내고, 간단한 명령은 바로 처리한다."""
    def __init__(self, info):
        self.info, self.stop, self.restart_after = info, threading.Event(), False
        self.th = threading.Thread(target=self.loop, daemon=True)

    def loop(self):
        while not self.stop.wait(BEAT_SECONDS):
            try:
                t = CURRENT.get("task") or {}
                hb = rpc("agent_heartbeat", p_token=TOKEN, p_platform=PLATFORM, p_version=VERSION, p_state="busy",
                         p_current_job=t.get("kind"), p_last_error=None, p_info=self.info)
                for c in hb.get("commands") or []:
                    if c["command"] in ("restart", "update"):
                        self.restart_after = True
                        rpc("agent_command_done", p_token=TOKEN, p_id=c["id"], p_ok=True, p_result="지금 작업이 끝나면 바로 처리합니다")
                    else:
                        handle_command(c)
            except Exception as e:
                log(f"작업 중 신호 실패: {e}")

    def __enter__(self):
        self.th.start()
        return self

    def __exit__(self, *a):
        self.stop.set()


# ------------------------------------------------------------------ 본체
def main():
    global DEVICE_ID
    log(f"NYX 에이전트 v{VERSION} 시작 ({PLATFORM}, {socket.gethostname()})")
    keep_awake()
    last_error, paused = None, False
    info = {"hostname": socket.gethostname(), "os": f"{platform.system()} {platform.release()}",
            "python": platform.python_version(), "started_at": STARTED, "jobs": sorted(HANDLERS), "tasks": sorted(TASKS),
            "auto_update_minutes": UPDATE_EVERY // 60}
    try:
        with open(os.path.join(HOME, "rollback.json"), encoding="utf-8") as f:
            rb = json.load(f)
        info["rolled_back_from"] = rb.get("from")
        log(f"주의: v{rb.get('from')} 업데이트가 시작에 실패해 이전 버전으로 되돌렸습니다")
    except Exception:
        pass
    while True:
        busy = False
        try:
            info["latest_seen"] = LATEST_SEEN
            hb = rpc("agent_heartbeat", p_token=TOKEN, p_platform=PLATFORM, p_version=VERSION,
                     p_state="error" if last_error else ("paused" if paused else "idle"),
                     p_current_job=None, p_last_error=last_error, p_info=info)
            DEVICE_ID, paused = hb.get("device_id"), bool(hb.get("paused"))
            last_error = None
            if os.path.exists(PENDING):  # 새 버전이 정상적으로 연결됨 → 업데이트 확정
                os.remove(PENDING)
                log(f"v{VERSION} 업데이트 확정")
            for c in hb.get("commands") or []:
                handle_command(c)
            if not paused:
                tk = rpc("agent_claim_task", p_token=TOKEN, p_kinds=sorted(TASKS), p_platform=PLATFORM)
                if tk and tk.get("id"):
                    busy = True
                    with Beat(info) as beat:
                        run_task(tk)
                    if beat.restart_after:
                        check_update(force=True)
                        raise Restart()
                else:
                    j = rpc("agent_claim_job", p_token=TOKEN, p_types=sorted(HANDLERS))
                    if j and j.get("id"):
                        busy = True
                        run_job(j)
        except Restart:
            log("재시작")
            sys.exit(0)  # 자동 시작 장치(맥 launchd / Windows 실행기)가 다시 켭니다
        except Exception as e:
            last_error = str(e)[:500]
            log(f"오류: {last_error}")
            if "invalid agent token" in last_error:
                log("토큰이 맞지 않습니다. 대시보드에서 토큰을 다시 발급하고 설치 명령을 다시 실행하세요.")
                time.sleep(300)
                continue
        if not busy:
            try:
                if check_update():
                    log("새 버전으로 재시작")
                    sys.exit(0)
            except SystemExit:
                raise
            except Exception as e:
                log(f"업데이트 확인 실패(다음에 다시 시도): {e}")
            time.sleep(BEAT_SECONDS)


if __name__ == "__main__":
    try:
        main()
    except KeyboardInterrupt:
        log("사용자가 중지함")
</script>

const TABS = [
  ['home', '홈'], ['guide', '안내'], ['scripts', '대본'], ['production', '제작'], ['edit', '편집'], ['ads', '광고'], ['bible', '바이블'], ['staff', '직원'], ['directives', '지시'], ['agents', '에이전트'], ['costs', '비용'], ['log', '기록'], ['settings', '설정'],
];

const CHANGE = { added: '추가', modified: '수정', removed: '삭제', unchanged: '변화 없음' };

const BUCKET = 'bible';

const S = { sb: null, user: null, device: null, tab: 'home', seriesId: null, episodeId: null, versionId: null };

const $ = (sel, root = document) => root.querySelector(sel);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = t => t ? new Date(t).toLocaleString('ko-KR', { year: '2-digit', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-';
const loadJSON = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
const saveJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

function toast(text) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function errText(e) {
  const m = e?.message || String(e);
  if (/row-level security/i.test(m)) return '권한이 없습니다. 대표 계정으로 로그인했는지 확인하세요.';
  if (/Failed to fetch/i.test(m)) return '서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요.';
  if (/Could not find the (table|function)|schema cache|does not exist|Bucket not found/i.test(m))
    return '필요한 표가 아직 없습니다. Supabase SQL Editor에서 nyx_bible.sql(바이블 추가 스크립트)을 실행했는지 확인하세요.';
  if (/duplicate key/i.test(m)) return '같은 이름이 이미 있습니다.';
  return m;
}
async function q(promise) {
  const { data, error } = await promise;
  if (error) throw error;
  return data;
}
function guard(fn) {
  return async (...a) => { try { await fn(...a); } catch (e) { console.error(e); toast('오류: ' + errText(e)); } };
}

// 서버 연결은 하나만 만든다(여러 개를 만들면 로그인 처리가 서로 기다리며 멈출 수 있음).
// 기기 표시(x-device-id)는 요청할 때마다 붙인다.
function makeClient(cfg) {
  const withDevice = (input, init = {}) => {
    const headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
    const dev = loadJSON(LS.device);
    if (dev?.id) headers.set('x-device-id', dev.id);
    return fetch(input, { ...init, headers });
  };
  return createClient(cfg.url, cfg.key, {
    global: { fetch: withDevice },
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'nix.auth' },
  });
}
function resetClient() { S.sb = null; }

// ------------------------------------------------------------------
// 시작: 설정 → 로그인 → 2단계 인증 → 대표 확인 → 기기 등록
// ------------------------------------------------------------------
async function boot() {
  const cfg = loadJSON(LS.cfg);
  if (!cfg?.url || !cfg?.key) return renderSetup();
  const dev = loadJSON(LS.device);
  if (!S.sb) S.sb = makeClient(cfg);
  const { data: { session } } = await S.sb.auth.getSession();
  if (!session) return renderLogin();
  S.user = session.user;

  const aal = await S.sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal.data && aal.data.nextLevel === 'aal2' && aal.data.currentLevel !== 'aal2') return renderMfaChallenge();

  const member = await q(S.sb.from('app_members').select('role,label').eq('user_id', S.user.id).maybeSingle());
  if (!member || member.role !== 'owner') return renderNotOwner();

  if (dev?.id) {
    const found = await q(S.sb.from('devices').select('id,name,kind').eq('id', dev.id).maybeSingle());
    if (found) { S.device = found; return renderShell(); }
  }
  renderDeviceSetup();
}

function atobSafe(s) { try { return atob(s.replace(/-/g, '+').replace(/_/g, '/')); } catch { return ''; } }

    <div class="row" style="margin-top:14px"><button class="btn primary" id="go">로그인</button>
      <button class="btn small" id="reset" style="margin-left:auto">서버 설정 바꾸기</button></div>
  </div>`;
  const go = async () => {
    const btn = $('#go'); if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '로그인 중…'; $('#m').innerHTML = '';
    try {
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('TIMEOUT')), 20000));
      const { error } = await Promise.race([
        S.sb.auth.signInWithPassword({ email: $('#e').value.trim(), password: $('#p').value }), timeout]);
      if (error) {
        const m = error.message || '';
        const text = /Invalid login credentials/i.test(m) ? '이메일 또는 비밀번호가 틀립니다'
          : /Email not confirmed/i.test(m) ? '이메일 인증이 안 된 계정입니다. Supabase에서 계정을 만들 때 Auto Confirm을 체크했는지 확인하세요'
          : /Invalid API key|No API key/i.test(m) ? '공개용 키가 맞지 않습니다. "서버 설정 바꾸기"로 키를 다시 넣으세요'
          : m;
        $('#m').innerHTML = `<div class="msg err">로그인 실패: ${esc(text)}</div>`;
        return;
      }
      await boot();
    } catch (e) {
      console.error(e);
      $('#m').innerHTML = `<div class="msg err">${e.message === 'TIMEOUT'
        ? '서버 응답이 없습니다. 인터넷 연결과 Project URL을 확인하세요.' : esc(errText(e))}</div>`;
    } finally {
      const b = $('#go'); if (b) { b.disabled = false; b.textContent = '로그인'; }
    }
  };
  $('#go').onclick = go;
  $('#p').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#reset').onclick = () => { localStorage.removeItem(LS.cfg); resetClient(); boot(); };
}

async function refreshBadge() {
  const { count } = await S.sb.from('notifications').select('id', { count: 'exact', head: true }).is('read_at', null);
  const b = $('#badge'); if (!b) return;
  b.hidden = !count; b.textContent = count > 99 ? '99+' : String(count || '');
}
function showSystemNotification(n) {
  try {
    if ('Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible') {
      const sn = new Notification('NYX · ' + n.title, { body: n.body || '', tag: n.id });
      sn.onclick = () => { window.focus(); openNotification(n); sn.close(); };
    }
  } catch {}
}
function startNotifications() {
  refreshBadge().catch(() => {});
  if (S.notifTimer) clearInterval(S.notifTimer);
  S.notifTimer = setInterval(() => refreshBadge().catch(() => {}), 60000);
  try {
    if (S.notifChannel) S.sb.removeChannel(S.notifChannel);
    S.notifChannel = S.sb.channel('nyx-notifications')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, ({ new: n }) => {
        toast(n.title + ' — ' + (n.body || ''));
        showSystemNotification(n);
        refreshBadge().catch(() => {});
        // 지시를 쓰는 중이면 화면을 다시 그리지 않는다(쓰던 글이 지워지지 않도록)
        const typing = $('#dtxt')?.value.trim() || ['TEXTAREA', 'INPUT'].includes(document.activeElement?.tagName);
        if (S.tab === 'directives' && n.directive_id && !typing) go('directives');
        if ($('#npanel').innerHTML) renderNotifPanel();
      })
      .subscribe();
  } catch (e) { console.warn('실시간 알림 연결 실패, 1분마다 확인합니다', e); }
}
function stopNotifications() {
  if (S.notifTimer) clearInterval(S.notifTimer);
  S.notifTimer = null;
  try { if (S.notifChannel) S.sb.removeChannel(S.notifChannel); } catch {}
  S.notifChannel = null;
}
async function signOutAll() { stopNotifications(); await S.sb.auth.signOut(); }
async function renderNotifPanel() {
  const list = await q(S.sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(40));
  $('#npanel').innerHTML = `<div class="npanel">
    <div class="row" style="padding:10px 14px;border-bottom:1px solid var(--line)"><b>알림</b>
      <button class="btn small" id="readAll" style="margin-left:auto">모두 읽음</button></div>
    ${list.length ? list.map(n => `<div class="it ${n.read_at ? '' : 'unread'}" data-n="${esc(n.id)}">
      <b class="lvl-${esc(n.level)}">${esc(n.title)}</b> <span class="quiet">${fmt(n.created_at)}</span>
      <div style="font-size:13.5px">${esc(n.body || '')}</div></div>`).join('')
      : '<div class="it quiet">알림이 없습니다.</div>'}</div>`;
  $('#readAll').onclick = guard(async () => {
    await q(S.sb.from('notifications').update({ read_at: new Date().toISOString() }).is('read_at', null));
    refreshBadge(); renderNotifPanel();
  });
  $('#npanel').querySelectorAll('[data-n]').forEach(el => el.onclick = () => openNotification(list.find(n => n.id === el.dataset.n)));

function toggleNotifPanel() {

async function openNotification(n) {

}

// 에이전트 상태: agent_status(새 방식) 기준으로 이름·온라인 여부를 만든다
async function agentRows() {
  const rows = await q(S.sb.from('agent_status').select('device_id,platform,role,paused,current_job,last_seen_at,state,devices(name)'));
  return rows.filter(r => r.state !== 'removed').map(r => ({
    name: r.devices?.name || '이름 없음', platform: r.platform, role: r.role || 'office', paused: r.paused,
    current_job: r.current_job ? (JOB_NAME[r.current_job] || r.current_job) : null, last_seen_at: r.last_seen_at,
    alive: !!r.last_seen_at && (Date.now() - new Date(r.last_seen_at)) / 1000 < 60,
  }));
}

function human(text) {
  let t = String(text ?? '');
  for (const [k, v] of Object.entries(JOB_NAME)) t = t.split(k).join(v);
  const W = { queued: '대기', running: '실행 중', done: '완료', failed: '실패', cancelled: '취소', on_hold: '보류',
    offline: '꺼짐', online: '켜짐', busy: '작업 중', error: '오류', proposed: '수정안', active: '적용', retired: '이전', rejected: '반려' };
  return t.replace(/\b(queued|running|done|failed|cancelled|on_hold|offline|online|busy|error|proposed|active|retired|rejected)\b/g, m => W[m]);
}
function activityTable(rows) {
  if (!rows.length) return '<p class="quiet">기록이 없습니다.</p>';
  return `<table><tr><th>시각</th><th>누가</th><th>기기</th><th>내용</th></tr>${rows.map(r => `
    <tr><td class="quiet" style="white-space:nowrap">${fmt(r.occurred_at)}</td><td>${esc(r.actor)}</td>
    <td>${esc(r.device)}</td><td>${esc(human(r.summary))}</td></tr>`).join('')}</table>`;
}

function svgPipeline() {

  ];
  const y = i => 8 + i * 54, yc = i => y(i) + 20;
  const box = ([t, o, c], i) => `<rect x="64" y="${y(i)}" width="260" height="40" rx="8" fill="var(--panel)" stroke="var(--line)"/>
    <rect x="64" y="${y(i)}" width="8" height="40" rx="3" fill="${SC[c]}"/>

    <text x="82" y="${y(i) + 33}" font-size="12" fill="${SC[c]}">${o}</text>`;
  const arrow = i => `<line x1="194" y1="${y(i) + 40}" x2="194" y2="${y(i + 1) - 1}" stroke="var(--quiet)" stroke-width="1.3" marker-end="url(#gb)"/>`;
  const loop = (from, to, l1, l2) => `<path d="M64 ${yc(from)}H40V${yc(to)}H62" fill="none" stroke="var(--warn)" stroke-width="1.5" marker-end="url(#gw)"/>
    <text x="332" y="${(yc(from) + yc(to)) / 2 - 2}" font-size="11.5" fill="var(--warn)">${l1}</text>
    <text x="332" y="${(yc(from) + yc(to)) / 2 + 13}" font-size="11.5" fill="var(--warn)">${l2}</text>`;
  return `<svg viewBox="0 0 410 548" role="img" aria-label="씬 하나가 만들어지는 10단계">
  <defs><marker id="gb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--quiet)"/></marker>
  <marker id="gw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--warn)"/></marker></defs>
  ${steps.slice(0, -1).map((_, i) => arrow(i)).join('')}
  ${loop(2, 1, '반려 시', '최대 3회')}${loop(4, 3, '불합격 시', '최대 2회')}${loop(7, 5, '미달 시', '재생성 1회')}
  ${steps.map(box).join('')}
  </svg>`;
}

// 대본: 시리즈 → 화 → 버전

async function viewScripts(main) {
  const series = await q(S.sb.from('series').select('id,title').order('created_at'));
  if (!S.seriesId || !series.some(s => s.id === S.seriesId)) S.seriesId = series[0]?.id || null;
  const episodes = S.seriesId ? await q(S.sb.from('episodes').select('id,number,title,status').eq('series_id', S.seriesId).order('number')) : [];
  const latest = episodes.length ? await q(S.sb.from('v_script_versions').select('episode_id,version_no,status')
    .in('episode_id', episodes.map(e => e.id)).eq('status', 'confirmed')) : [];
  const drafts = episodes.length ? await q(S.sb.from('script_versions').select('episode_id').eq('status', 'draft')
    .in('episode_id', episodes.map(e => e.id))) : [];

  main.innerHTML = `
  <div class="split">
    <div>
      <div class="card">
        <label style="margin-top:0">시리즈</label>
        <div class="row"><select id="ser" style="flex:1">${series.map(s => `<option value="${esc(s.id)}" ${s.id === S.seriesId ? 'selected' : ''}>${esc(s.title)}</option>`).join('')}</select>
        <button class="btn small" id="addSer">+</button></div>
      </div>
      <div class="card">
        <div class="row"><b>화 목록</b><button class="btn small" id="bulk" style="margin-left:auto">파일로 여러 화 넣기</button><button class="btn small" id="addEp">+ 화 추가</button></div>
        ${episodes.length ? `<table>${episodes.map(e => {
          const v = latest.find(l => l.episode_id === e.id);
          const d = drafts.filter(x => x.episode_id === e.id).length;
          return `<tr class="click" data-ep="${esc(e.id)}" ${e.id === S.episodeId ? 'style="background:var(--accent-soft)"' : ''}>
            <td><b>${e.number}화</b> ${esc(e.title || '')}<br><span class="quiet">${v ? 'v' + v.version_no + ' 확정' : '확정본 없음'}${d ? ' · 초안 ' + d : ''}</span></td>
            <td style="text-align:right">${pill(EP_STATUS[e.status] || e.status)}</td></tr>`; }).join('')}</table>`
          : '<p class="quiet">아직 화가 없습니다. "+ 화 추가"를 누르세요.</p>'}
      </div>
    </div>
    <div id="epPane">${S.episodeId && episodes.some(e => e.id === S.episodeId) ? '' : '<div class="card quiet">왼쪽에서 화를 고르세요.</div>'}</div>
  </div>`;
  $('#ser').onchange = e => { S.seriesId = e.target.value; S.episodeId = null; go('scripts'); };
  $('#addSer').onclick = guard(async () => {
    const title = prompt('새 시리즈 제목'); if (!title) return;
    const r = await q(S.sb.from('series').insert({ title }).select('id').single());
    S.seriesId = r.id; go('scripts');
  });
  $('#addEp').onclick = guard(async () => {
    if (!S.seriesId) return toast('먼저 시리즈를 만드세요');
    const next = (episodes.at(-1)?.number || 0) + 1;
    const num = Number(prompt('몇 화인가요?', String(next))); if (!num) return;
    const title = prompt('화 제목 (없으면 비워 두세요)', '') || null;
    const r = await q(S.sb.from('episodes').insert({ series_id: S.seriesId, number: num, title }).select('id').single());
    S.episodeId = r.id; S.versionId = null; go('scripts');
  });
  main.querySelectorAll('tr[data-ep]').forEach(tr => tr.onclick = () => { S.episodeId = tr.dataset.ep; S.versionId = null; go('scripts'); });
  $('#bulk').onclick = () => { if (!S.seriesId) return toast('먼저 시리즈를 만드세요 (+ 버튼)'); S.episodeId = null; viewBulkImport($('#epPane'), series, episodes); };
  if (S.episodeId && episodes.some(e => e.id === S.episodeId)) await viewEpisode($('#epPane'), episodes.find(e => e.id === S.episodeId));
}

// 여러 화가 들어 있는 대본 파일을 화별로 나눈다 ("EP.01 — 제목" 형식)
function parseBulkScript(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  const epRe = /^\s*EP\.?\s*0*(\d{1,3})\s*[—–\-:]\s*(.+?)\s*$/;
  const idx = [];
  lines.forEach((l, i) => { const m = l.match(epRe); if (m) idx.push({ i, n: +m[1], title: m[2] }); });
  // 마지막 화 뒤에 붙은 체크리스트 구역(있으면)부터는 대본이 아니다
  const lastEp = idx.length ? idx[idx.length - 1].i : -1;
  const endIdx = lines.findIndex((l, i) => i > lastEp && /체크리스트/.test(l) && !/^\s*☐/.test(l));
  const episodes = idx.map((e, k) => {
    const stop = k + 1 < idx.length ? idx[k + 1].i : (endIdx > e.i ? endIdx : lines.length);
    const body = lines.slice(e.i, stop).join('\n').replace(/\n{3,}/g, '\n\n').trim();
    const scenes = body.split('\n').filter(l => /^\s*\d{1,2}:\d{2}\s*[–\-~]\s*\d{1,2}:\d{2}/.test(l)).length;
    return { n: e.n, title: e.title, body, scenes };
  });
  const pl = (idx.length ? lines.slice(0, idx[0].i) : []).map(s => s.trim()).filter(Boolean);
  const toc = {};
  for (let i = 0; i < pl.length - 1; i++) {
    const m = pl[i].match(/^(\d{1,3})화$/);
    if (m && !/^\d{1,3}화$/.test(pl[i + 1]) && !/공통 제작 기준/.test(pl[i + 1])) toc[+m[1]] = pl[i + 1];
  }
  const ci = pl.findIndex(l => /공통 제작 기준/.test(l));
  const common = ci >= 0 ? pl.slice(ci + 1).join('\n\n') : '';
  const checklist = {};
  if (endIdx >= 0) lines.slice(endIdx).forEach(l => {
    const m = l.match(/EP\s*0*(\d{1,3})(?:\s*[~\-–]\s*(?:EP\s*)?0*(\d{1,3}))?\s+(.+)$/);
    if (m) { const a = +m[1], b = m[2] ? +m[2] : a; for (let n = a; n <= b; n++) (checklist[n] = checklist[n] || []).push(m[3].trim()); }
  });
  return { episodes, toc, common, checklist };
}

async function loadMammoth() {
  if (window.mammoth) return window.mammoth;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js';
    s.onload = res; s.onerror = () => rej(new Error('Word 파일 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'));
    document.head.appendChild(s);
  });
  return window.mammoth;
}
async function readScriptFile(f) {
  if (/\.docx$/i.test(f.name)) {
    const m = await loadMammoth();
    const r = await m.extractRawText({ arrayBuffer: await f.arrayBuffer() });
    return r.value;
  }
  return await f.text();
}

async function viewBulkImport(pane, series, episodes) {

    <div class="row"><h2 style="margin:0">파일로 여러 화 넣기</h2><button class="btn small" id="bkClose" style="margin-left:auto">닫기</button></div>

    각 화에는 <b>초안</b>으로 들어가고, 화마다 읽어 보신 뒤 "확정"을 누르면 제작이 시작됩니다. 대본은 이 브라우저에서 Supabase로 바로 가며 GitHub에는 올라가지 않습니다.</p>
    <input type="file" id="bkFile" accept=".docx,.txt,.md,text/plain">
    <div id="bkPrev" style="margin-top:12px"></div></div>`;
  $('#bkClose').onclick = () => go('scripts');
  $('#bkFile').onchange = guard(async e => {
    const f = e.target.files[0]; if (!f) return;
    $('#bkPrev').innerHTML = '<p class="quiet">읽는 중…</p>';
    const parsed = parseBulkScript(await readScriptFile(f));
    if (!parsed.episodes.length) { $('#bkPrev').innerHTML = '<div class="msg err">"EP.01 — 제목" 형식의 화 구분을 찾지 못했습니다.</div>'; return; }
    const exist = n => episodes.find(e => e.number === n);
    const notes = n => (parsed.toc[n] ? 1 : 0) + (parsed.checklist[n] || []).length;
    $('#bkPrev').innerHTML = `
      <table><tr><th>화</th><th>제목</th><th style="text-align:right">씬</th><th style="text-align:right">글자</th><th>연출 메모</th><th>대시보드</th></tr>${parsed.episodes.map(e => `
        <tr><td><b>${e.n}화</b></td><td>${esc(e.title)}</td><td style="text-align:right">${e.scenes}</td><td style="text-align:right">${e.body.length.toLocaleString()}</td>
        <td class="quiet">${notes(e.n) ? notes(e.n) + '건' : '-'}</td><td>${exist(e.n) ? pill('있는 화에 초안 추가') : pill('새 화 만들기', 'accent')}</td></tr>`).join('')}</table>
      <label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin-top:12px"><input type="checkbox" id="bkDrafts" style="width:auto" checked>
        각 화에 <b>대본 초안</b> 넣기 <span class="quiet">(끄면 아래 메모·공통 기준만 가져옵니다)</span></label>
      <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="bkNotes" style="width:auto" checked>
        앞쪽 "화별 핵심"과 뒤쪽 "연속성 체크리스트"를 각 화의 <b>대표 연출 메모(필수)</b>로 넣기</label>
      ${parsed.common ? `<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="bkCommon" style="width:auto" checked>
        "전 회차 공통 제작 기준"을 바이블의 <b>스타일·톤</b> 항목으로 넣기 (${parsed.common.length}자)</label>` : ''}
      ${!parsed.common && !Object.keys(parsed.toc).length && !Object.keys(parsed.checklist).length ? '<p class="quiet">이 파일에는 화별 핵심·공통 기준·체크리스트가 없어 원고만 들어갑니다.</p>' : ''}
      <div class="row" style="margin-top:12px"><button class="btn primary" id="bkGo">${parsed.episodes.length}개 화 넣기</button>
        <span class="quiet">같은 내용의 초안이 이미 있으면 건너뜁니다.</span></div>
      <div id="bkLog"></div>`;
    $('#bkGo').onclick = guard(async () => {
      const btn = $('#bkGo'); btn.disabled = true; btn.textContent = '넣는 중…';
      const log = m => { $('#bkLog').insertAdjacentHTML('beforeend', `<div class="quiet">${esc(m)}</div>`); };
      const withNotes = $('#bkNotes').checked, withDrafts = $('#bkDrafts').checked;
      let made = 0, drafts = 0, skipped = 0, noteCount = 0;
      for (const ep of parsed.episodes) {
        let row = episodes.find(e => e.number === ep.n);
        if (!row) {
          row = await q(S.sb.from('episodes').insert({ series_id: S.seriesId, number: ep.n, title: ep.title }).select('id,number,title').single());
          episodes.push(row); made++;
        } else if (!row.title) {
          await q(S.sb.from('episodes').update({ title: ep.title }).eq('id', row.id));
        }
        if (withDrafts) {
          const same = await q(S.sb.from('script_versions').select('id').eq('episode_id', row.id).eq('content', ep.body).limit(1));
          if (same.length) { skipped++; log(`${ep.n}화: 같은 대본이 이미 있어 대본은 건너뜀`); }
          else { await q(S.sb.from('script_versions').insert({ episode_id: row.id, content: ep.body, note: `원고: ${f.name}` })); drafts++; }
        }
        if (withNotes) {
          const items = [];
          if (parsed.toc[ep.n]) items.push('이 화에서 분명히 보여야 할 것: ' + parsed.toc[ep.n]);
          (parsed.checklist[ep.n] || []).forEach(c => items.push('연속성 체크: ' + c));
          const have = (await q(S.sb.from('episode_notes').select('content').eq('episode_id', row.id))).map(n => n.content);
          for (const c of items.filter(c => !have.includes(c))) {
            await q(S.sb.from('episode_notes').insert({ episode_id: row.id, scene_no: null, priority: 'must', important: false, content: c }));
            noteCount++;
          }
        }
        log(`${ep.n}화 「${ep.title}」: ${withDrafts ? `원고 초안 (씬 ${ep.scenes}개)` : '메모만'} 처리`);
      }
      if ($('#bkCommon')?.checked) {
        const name = '전 회차 공통 제작 기준';
        let entry = (await q(S.sb.from('bible_entries').select('id').eq('series_id', S.seriesId).eq('category', 'style').eq('name', name).limit(1)))[0];
        if (!entry) entry = await q(S.sb.from('bible_entries').insert({ series_id: S.seriesId, category: 'style', name, summary: '대본 파일의 공통 제작 기준' }).select('id').single());
        const cur = (await q(S.sb.from('bible_versions').select('description').eq('entry_id', entry.id).eq('status', 'active').limit(1)))[0];
        if (cur?.description === parsed.common) log('바이블: 공통 제작 기준이 이미 같은 내용으로 적용되어 있음');
        else {
          const v = await q(S.sb.from('bible_versions').insert({ entry_id: entry.id, description: parsed.common, change_reason: `${f.name}에서 가져옴`, status: 'proposed' }).select('id').single());
          await q(S.sb.rpc('activate_bible_version', { p_id: v.id }));
          log('바이블: 스타일·톤 "전 회차 공통 제작 기준" 적용');
        }
      }
      toast(`완료: 새 화 ${made}개, 초안 ${drafts}개, 연출 메모 ${noteCount}건${skipped ? `, 건너뜀 ${skipped}` : ''}`);
      btn.textContent = '완료'; log('끝났습니다. 왼쪽 화 목록에서 각 화를 열어 초안을 읽고 "확정"을 누르세요.');
      setTimeout(() => go('scripts'), 2500);
    });
  });
}

// 작가실 흐름 변경 제안: 대표가 승인해야 반영된다
const PKIND = { add_scene: '장면 추가', remove_scene: '장면 삭제', reorder: '순서 변경', event_timing: '사건 시점', reveal: '반전·정보 공개',

const PST = { proposed: ['승인 대기', 'warn'], approved: ['승인됨', 'good'], rejected: ['반려', ''], applied: ['반영 완료', 'accent'] };
async function renderProposals(ep) {
  const box = $('#propBox'); if (!box) return;
  const list = await q(S.sb.from('story_proposals').select('*').eq('episode_id', ep.id).order('created_at', { ascending: false }));
  if (!list.length) { box.innerHTML = ''; return; }
  const open = list.filter(p => p.status === 'proposed');
  box.innerHTML = `<div class="card" style="border-color:${open.length ? 'var(--warn)' : 'var(--line)'}">
    <b>작가실 흐름 변경 제안${open.length ? ` · 승인 대기 ${open.length}건` : ''}</b>
    <p class="quiet" style="margin:4px 0 8px">작가실은 흐름을 직접 바꾸지 않습니다. 승인하면 작가실이 반영한 새 정리본을 만들고, 반려하면 다시 올리지 않습니다.</p>
    ${list.map(p => `<div style="border-top:1px solid var(--line);padding:10px 0">
      <div class="row">${pill(PKIND[p.kind] || p.kind)}${p.scene_no ? `<b>S#${p.scene_no}</b>` : ''}${pill(PST[p.status][0], PST[p.status][1])}<span class="quiet">${fmt(p.created_at)}</span></div>

      <div class="quiet" style="margin-top:4px">이유: ${esc(p.reason)}${p.impact ? ` · 영향: ${esc(p.impact)}` : ''}</div>
      ${p.owner_note ? `<div class="quiet" style="margin-top:4px">대표 의견: ${esc(p.owner_note)}</div>` : ''}
      ${p.status === 'proposed' ? `<div class="row" style="margin-top:8px"><input data-pnote="${esc(p.id)}" placeholder="의견(선택): 이렇게 바꿔서 반영해 줘" style="flex:1;min-width:200px">

// 줄 단위 비교 (LCS)
function lineDiff(a, b) {
  const A = a.split(/\r?\n/), B = b.split(/\r?\n/);
  if (A.length * B.length > 4_000_000) return null;
  const n = A.length, m = B.length, L = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { out.push([' ', A[i]]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out.push(['-', A[i++]]);
    else out.push(['+', B[j++]]);
  }
  while (i < n) out.push(['-', A[i++]]);
  while (j < m) out.push(['+', B[j++]]);
  return out;
}
async function compareVersions(aId, bId) {
  const [a, b] = await Promise.all([aId, bId].map(id => q(S.sb.from('script_versions').select('version_no,content').eq('id', id).single())));
  const d = lineDiff(a.content, b.content);
  const added = d ? d.filter(x => x[0] === '+').length : 0, removed = d ? d.filter(x => x[0] === '-').length : 0;
  $('#detail').innerHTML = `<div class="card">
    <div class="row"><b>v${a.version_no} → v${b.version_no}</b><span class="quiet">추가 ${added}줄 · 삭제 ${removed}줄</span>
    <label class="quiet" style="margin:0 0 0 auto"><input type="checkbox" id="onlyCh" style="width:auto" checked> 바뀐 부분만</label></div>
    <div class="diff" id="diffBox" style="margin-top:10px"></div></div>`;
  const draw = () => {
    if (!d) return $('#diffBox').innerHTML = '<div>대본이 너무 길어 화면 비교를 할 수 없습니다.</div>';
    const only = $('#onlyCh').checked;
    const rows = d.map((x, k) => ({ x, k })).filter(({ x, k }) => !only || x[0] !== ' ' ||
      d.slice(Math.max(0, k - 2), k + 3).some(y => y[0] !== ' '));
    $('#diffBox').innerHTML = rows.length ? rows.map(({ x }) =>
      `<div class="${x[0] === '+' ? 'add' : x[0] === '-' ? 'del' : ''}">${x[0] === ' ' ? '  ' : x[0] + ' '}${esc(x[1]) || '&nbsp;'}</div>`).join('')
      : '<div>두 버전의 내용이 같습니다.</div>';
  };
  $('#onlyCh').onchange = draw; draw();
  $('#detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function signedUrls(paths) {
  if (!paths.length) return {};
  const { data, error } = await S.sb.storage.from(BUCKET).createSignedUrls(paths, 3600);
  if (error || !data) return {};
  return Object.fromEntries(data.filter(d => d.signedUrl).map(d => [d.path, d.signedUrl]));
}
async function uploadBibleFile(entryId, file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'bin';
  const path = `${S.seriesId}/${entryId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await S.sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || undefined, upsert: false });
  if (error) throw error;
  return path;
}

  <p class="quiet">화가 끝났을 때 인물·소품의 상태(헤어, 의상, 상처, 들고 있는 물건)를 남깁니다. 다음 화의 감독은 직전 화의 마지막 상태를 먼저 읽고 시작합니다.</p>
  <div class="card" id="contBox"><p class="quiet">불러오는 중…</p></div>`;

  const activate = id => guard(async () => {
    if (!confirm('이 버전을 적용할까요? 현재 버전은 이전 버전으로 보관됩니다.')) return;
    await q(S.sb.rpc('activate_bible_version', { p_id: id })); toast('적용했습니다'); go('bible');
  });
  $('#bser').onchange = e => { S.seriesId = e.target.value; S.episodeId = null; S.contEp = null; go('bible'); };
  main.querySelectorAll('[data-bc]').forEach(b => b.onclick = () => { S.bibleCat = b.dataset.bc; go('bible'); });
  $('#bnew').onclick = () => openBibleEditor({ urls });
  $('#bcast').onclick = guard(async () => {
    const chars = entries.filter(e => e.category === 'character');
    if (!chars.length) return toast('먼저 캐릭터를 바이블에 등록해 주세요 (+ 항목 추가)');
    const noVoice = chars.filter(e => !cur(e.id)?.voice_id);
    const redo = !noVoice.length && confirm('모든 인물에 목소리가 정해져 있습니다. 전부 새로 디자인할까요?');
    if (!noVoice.length && !redo) return;
    if (noVoice.length && !confirm(`목소리가 없는 인물 ${noVoice.length}명(${noVoice.map(e => e.name).join(', ')})의 목소리를 만듭니다.\n작가실이 대본을 읽고 인물별 설명·시험 대사를 쓰고, 인물마다 후보 3개를 만듭니다.\n(Claude 수십 원 + ElevenLabs 크레딧 약간)`)) return;
    await q(S.sb.from('pipeline_tasks').insert({ kind: 'voice_cast', series_id: S.seriesId, payload: { series_id: S.seriesId, redo } }));
    toast('작가실에 맡겼습니다. 몇 분 뒤 인물 카드에 후보가 나타납니다');
  });
  main.querySelectorAll('[data-bedit]').forEach(b => b.onclick = () => {
    const e = entries.find(x => x.id === b.dataset.bedit); openBibleEditor({ entry: e, base: cur(e.id), urls });
  });
  main.querySelectorAll('[data-bfix]').forEach(b => b.onclick = () => {
    const p = versions.find(v => v.id === b.dataset.bfix);
    openBibleEditor({ entry: entries.find(x => x.id === p.entry_id), base: p, urls, fromId: p.id });
  });
  main.querySelectorAll('[data-bact]').forEach(b => b.onclick = activate(b.dataset.bact));
  main.querySelectorAll('[data-brej]').forEach(b => b.onclick = guard(async () => {
    await q(S.sb.from('bible_versions').update({ status: 'rejected' }).eq('id', b.dataset.brej)); toast('반려했습니다'); go('bible');
  }));
  main.querySelectorAll('[data-vd]').forEach(b => b.onclick = () => {
    const e = entries.find(x => x.id === b.dataset.vd); openVoiceDesign(e, cur(e.id), true);
  });
  const vds = entries.length ? await q(S.sb.from('voice_designs').select('*').in('entry_id', entries.map(e => e.id))
    .in('status', ['queued', 'ready', 'saving', 'saved', 'failed']).order('created_at', { ascending: false })) : [];
  [...new Set(vds.map(d => d.entry_id))].forEach(id => { const e = entries.find(x => x.id === id); if (e) openVoiceDesign(e, cur(e.id), false); });
  main.querySelectorAll('[data-bhist]').forEach(b => b.onclick = () => {
    const box = document.getElementById('bh-' + b.dataset.bhist);
    if (box.innerHTML) { box.innerHTML = ''; return; }
    const hist = versions.filter(v => v.entry_id === b.dataset.bhist && v.status !== 'proposed');
    box.innerHTML = `<table style="margin-top:8px">${hist.map(v => `<tr><td>v${v.version_no}</td>
      <td>${pill(G_STATUS[v.status] || v.status, v.status === 'active' ? 'good' : '')}</td>
      <td>${esc(v.change_reason || '')}<br><span class="quiet">${esc(v.proposed_by || '')} · ${esc(v.devices?.name || '')}</span></td>
      <td class="quiet">${fmt(v.decided_at || v.created_at)}</td>
      <td>${v.status === 'retired' ? `<button class="btn small" data-bact2="${esc(v.id)}">되돌리기</button>` : ''}</td></tr>`).join('')}</table>`;
    box.querySelectorAll('[data-bact2]').forEach(x => x.onclick = activate(x.dataset.bact2));
  });
  await renderContinuity(entries, episodes);
}

// 목소리 디자인: 설명 → ElevenLabs 후보 3개 → 듣고 고르기 → 바이블 새 버전으로 적용
const vdSample = full => { const name = full.replace(/\s*\(.*?\)\s*/g, '').trim(); return `안녕하세요, 저는 ${name}예요. 오늘 처음으로 무대에 서는 날이라 너무 떨려요. 그래도 여기까지 온 이유를 잊지 않을 거예요. 끝까지 해 볼게요. 지켜봐 주세요!`; };
async function openVoiceDesign(entry, cur, fresh) {
  const box = document.getElementById('vd-' + entry.id); if (!box) return;
  const [d] = await q(S.sb.from('voice_designs').select('*').eq('entry_id', entry.id).order('created_at', { ascending: false }).limit(1));
  const showForm = fresh || !d || d.status === 'linked';
  if (showForm) {
    const desc = d?.description || [entry.summary, cur?.description].filter(Boolean).join(' / ');
    box.innerHTML = `<div class="vdbox"><b>목소리 디자인</b>
      <p class="quiet" style="margin:4px 0">나이·성별·출신·음색·말버릇을 적으면 ElevenLabs가 후보 3개를 만듭니다. 노래 Persona가 있으면 그 음색과 비슷하게 적어 주세요.</p>
      <label>목소리 설명 (20자 이상, 영어로 적으면 더 정확)</label>
      <textarea id="vdDesc-${entry.id}" style="min-height:80px;font-family:inherit">${esc(desc)}</textarea>
      <label>들어 볼 대사 (100자 이상, 한국어)</label>
      <textarea id="vdText-${entry.id}" style="min-height:70px;font-family:inherit">${esc(d?.sample_text || vdSample(entry.name))}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn primary small" id="vdGo-${entry.id}">후보 3개 만들기</button>
        <span class="quiet">ElevenLabs 크레딧 약간 사용 · 1분 안팎</span>
        ${d && !fresh ? '' : `<button class="btn small" id="vdX-${entry.id}" style="margin-left:auto">닫기</button>`}</div></div>`;
    const x = document.getElementById('vdX-' + entry.id); if (x) x.onclick = () => { box.innerHTML = ''; };
    document.getElementById('vdGo-' + entry.id).onclick = guard(async () => {
      const description = document.getElementById('vdDesc-' + entry.id).value.trim();
      const sample_text = document.getElementById('vdText-' + entry.id).value.trim();
      if (description.length < 20) return toast('목소리 설명을 20자 이상 적어 주세요');
      if (sample_text.length < 100) return toast('들어 볼 대사를 100자 이상 적어 주세요');
      const r = await q(S.sb.from('voice_designs').insert({ entry_id: entry.id, description, sample_text }).select('id').single());
      await q(S.sb.from('pipeline_tasks').insert({ kind: 'voice_design', payload: { design_id: r.id } }));
      toast('후보를 만들고 있습니다'); openVoiceDesign(entry, cur, false);
    });
    return;
  }
  let urls = {};
  if (d.previews?.length) {
    const { data } = await S.sb.storage.from('takes').createSignedUrls(d.previews.map(p => p.path), 3600);
    (data || []).forEach(x => { if (x.signedUrl) urls[x.path] = x.signedUrl; });
  }
  const busy = ['queued', 'saving'].includes(d.status);
  box.innerHTML = `<div class="vdbox"><div class="row"><b>목소리 디자인</b>${pill({ queued: '후보 만드는 중', ready: '골라 주세요', saving: '저장 중', saved: '저장됨 · 적용 대기', failed: '실패' }[d.status] || d.status,
      d.status === 'failed' ? 'bad' : d.status === 'ready' || d.status === 'saved' ? 'accent' : 'warn')}
      <button class="btn small" id="vdNew-${entry.id}" style="margin-left:auto">새로 만들기</button></div>
    <div class="quiet" style="margin:4px 0">${esc(d.description)}</div>
    ${busy ? '<p><span class="spin"></span>ElevenLabs에서 작업 중입니다. 잠시 뒤 자동으로 새로 고칩니다.</p>' : ''}
    ${d.status === 'failed' ? `<div class="msg err">${esc(d.error || '실패')}</div>` : ''}
    ${d.status === 'ready' ? (d.previews || []).map((p, i) => `<div class="vdp"><b>후보 ${i + 1}</b>
      <audio controls preload="none" src="${esc(urls[p.path] || '')}"></audio>
      <button class="btn small primary" data-pick="${esc(p.generated_voice_id)}">이 목소리로 정하기</button></div>`).join('') : ''}
    ${d.status === 'saved' ? `<p>ElevenLabs에 저장됐습니다 (<code>${esc(d.voice_id)}</code>). 바이블에 적용하면 감독·목소리 고정 작업이 이 목소리를 씁니다.</p>
      <button class="btn small primary" id="vdLink-${entry.id}">바이블에 적용</button>` : ''}</div>`;
  document.getElementById('vdNew-' + entry.id).onclick = () => openVoiceDesign(entry, cur, true);
  box.querySelectorAll('[data-pick]').forEach(b => b.onclick = guard(async () => {
    await q(S.sb.from('voice_designs').update({ chosen_generated_id: b.dataset.pick, status: 'saving' }).eq('id', d.id));
    await q(S.sb.from('pipeline_tasks').insert({ kind: 'voice_save', payload: { design_id: d.id } }));
    toast('목소리를 저장하고 있습니다'); openVoiceDesign(entry, cur, false);
  }));
  const link = document.getElementById('vdLink-' + entry.id);
  if (link) link.onclick = guard(async () => {
    const v = await q(S.sb.from('bible_versions').insert({
      entry_id: entry.id, description: cur?.description || entry.summary || entry.name, details: cur?.details || null,
      image_paths: cur?.image_paths || [], voice_path: cur?.voice_path || null, voice_id: d.voice_id,
      change_reason: '목소리 디자인으로 목소리 고정', status: 'proposed' }).select('id').single());
    await q(S.sb.rpc('activate_bible_version', { p_id: v.id }));
    await q(S.sb.from('voice_designs').update({ status: 'linked' }).eq('id', d.id));
    toast(`${entry.name} 목소리를 바이블에 적용했습니다`); go('bible');
  });
  if (busy) setTimeout(() => { if (S.tab === 'bible' && document.getElementById('vd-' + entry.id)) openVoiceDesign(entry, cur, false).catch(() => {}); }, 6000);
}

function openBibleEditor({ entry, base, urls, fromId }) {
  const isNew = !entry;
  const imgs = base?.image_paths || [];
  $('#bEditor').innerHTML = `<div class="card" style="border-color:var(--accent)">
    <b>${isNew ? '새 바이블 항목' : esc(entry.name) + ' 새 버전 작성'}</b>
    ${isNew ? `<div class="row"><div style="flex:2;min-width:160px"><label>이름</label><input id="bname" placeholder="예: 주인공 이름 (영문 표기)"></div>
      <div style="flex:1;min-width:120px"><label>분류</label><select id="bcat">${Object.entries(BIBLE_CAT).map(([k, l]) =>
        `<option value="${k}" ${S.bibleCat === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>` : ''}
    <label>한 줄 설명 (화면 표시용)</label><input id="bsum" value="${esc(entry?.summary || '')}" placeholder="예: 주인공. 태국에서 온 연습생">
    <label>고정 묘사 문장: 감독이 프롬프트에 그대로 넣는 문장입니다</label>
    <textarea id="bdesc" style="min-height:120px" placeholder="예: early-20s woman, shoulder-length straight black hair, almond eyes, slim build, ...">${esc(base?.description || '')}</textarea>
    <label>세부 사항 (화별 의상, 바뀌면 안 되는 특징, 금지 사항)</label>
    <textarea id="bdet" style="min-height:100px">${esc(base?.details || '')}</textarea>
    <label>목소리 ID (음성 도구에서 고정한 목소리 번호, 선택)</label><input id="bvid" value="${esc(base?.voice_id || '')}">
    <label>기준 사진${imgs.length ? ': 체크를 풀면 이번 버전에서 뺍니다' : ' (정면·측면·전신 권장)'}</label>
    ${imgs.length ? `<div class="thumbs">${imgs.map((p, i) => `<label class="keep"><input type="checkbox" data-keep="${i}" checked>${urls[p]
      ? `<img src="${esc(urls[p])}" alt="">` : '<span class="quiet">사진</span>'}</label>`).join('')}</div>` : ''}
    <input type="file" id="bimg" accept="image/*" multiple>
    <label>목소리 샘플 (선택)</label>
    ${base?.voice_path ? `<label class="quiet" style="margin:0 0 6px"><input type="checkbox" id="bkeepv" style="width:auto" checked> 기존 샘플 유지</label>` : ''}
    <input type="file" id="bvoice" accept="audio/*">
    <label>바꾸는 이유</label><input id="breason" value="${esc(fromId ? base?.change_reason || '' : '')}" placeholder="예: 1화 키프레임에서 눈매가 달라져 묘사 보강">
    <div class="row" style="margin-top:10px"><button class="btn primary" id="bsave">저장하고 바로 적용</button><button class="btn" id="bcancel">취소</button></div></div>`;
  $('#bcancel').onclick = () => { $('#bEditor').innerHTML = ''; };
  $('#bsave').onclick = guard(async () => {
    const description = $('#bdesc').value.trim();
    if (!description) return toast('고정 묘사 문장을 적어 주세요');
    if (isNew && !$('#bname').value.trim()) return toast('이름을 적어 주세요');
    const files = [...$('#bimg').files], voice = $('#bvoice').files[0];
    if (files.some(f => f.size > 15e6) || (voice && voice.size > 30e6)) return toast('파일이 너무 큽니다 (사진 15MB, 음성 30MB까지)');
    const btn = $('#bsave'); btn.disabled = true; btn.textContent = '저장 중…';
    try {
      const summary = $('#bsum').value.trim() || null;
      let entryId = entry?.id;
      if (isNew) {
        entryId = (await q(S.sb.from('bible_entries').insert({ series_id: S.seriesId, category: $('#bcat').value, name: $('#bname').value.trim(), summary })
          .select('id').single())).id;
      } else if (summary !== (entry.summary || null)) {
        await q(S.sb.from('bible_entries').update({ summary }).eq('id', entryId));
      }
      const kept = imgs.filter((_, i) => document.querySelector(`[data-keep="${i}"]`)?.checked);
      const added = [];
      for (const f of files) added.push(await uploadBibleFile(entryId, f));
      const voicePath = voice ? await uploadBibleFile(entryId, voice) : ($('#bkeepv')?.checked ? base.voice_path : null);
      const v = await q(S.sb.from('bible_versions').insert({
        entry_id: entryId, description, details: $('#bdet').value.trim() || null, voice_id: $('#bvid').value.trim() || null,
        image_paths: [...kept, ...added], voice_path: voicePath, change_reason: $('#breason').value.trim() || null, status: 'proposed',
      }).select('id,version_no').single());
      await q(S.sb.rpc('activate_bible_version', { p_id: v.id }));
      if (fromId) await q(S.sb.from('bible_versions').update({ status: 'rejected' }).eq('id', fromId).eq('status', 'proposed'));
      toast(`v${v.version_no} 적용했습니다`); go('bible');
    } finally {
      const b = $('#bsave'); if (b) { b.disabled = false; b.textContent = '저장하고 바로 적용'; }
    }
  });
  $('#bEditor').scrollIntoView({ behavior: 'smooth' });
}

async function renderContinuity(entries, episodes) {
  const box = $('#contBox'); if (!box) return;
  if (!episodes.length) { box.innerHTML = '<p class="quiet">아직 화가 없습니다. 대본 탭에서 화를 추가하세요.</p>'; return; }
  if (!entries.length) { box.innerHTML = '<p class="quiet">바이블 항목을 먼저 등록하세요.</p>'; return; }
  if (!S.contEp || !episodes.some(e => e.id === S.contEp)) S.contEp = episodes.at(-1).id;
  const idx = episodes.findIndex(e => e.id === S.contEp), ep = episodes[idx], prev = episodes[idx - 1];
  const logs = await q(S.sb.from('continuity_logs').select('id,episode_id,entry_id,scene_no,state,source,created_at,devices(name)')
    .in('episode_id', [ep.id, prev?.id].filter(Boolean)).order('created_at'));
  const name = id => esc(entries.find(e => e.id === id)?.name || '(삭제된 항목)');
  const lastPrev = {};
  logs.filter(l => prev && l.episode_id === prev.id).forEach(l => { lastPrev[l.entry_id] = l; });
  const mine = logs.filter(l => l.episode_id === ep.id);
  const order = ['character', 'prop', 'location', 'style', 'voice'];
  const sorted = [...entries].sort((a, b) => order.indexOf(a.category) - order.indexOf(b.category));
  box.innerHTML = `
    <div class="row"><select id="cep" style="width:auto">${episodes.map(e =>
      `<option value="${esc(e.id)}" ${e.id === ep.id ? 'selected' : ''}>${e.number}화 ${esc(e.title || '')}</option>`).join('')}</select></div>
    ${prev ? `<h3>${prev.number}화가 끝났을 때 상태 <span class="quiet">(${ep.number}화 시작 기준)</span></h3>
      ${Object.keys(lastPrev).length ? `<table>${Object.values(lastPrev).map(l => `<tr><td style="white-space:nowrap"><b>${name(l.entry_id)}</b></td>
        <td>${esc(l.state)}</td><td class="quiet">${l.scene_no ? 'S#' + l.scene_no : ''}</td></tr>`).join('')}</table>`
        : '<p class="quiet">기록이 없습니다.</p>'}` : '<p class="quiet" style="margin-top:10px">첫 화라 이전 기록이 없습니다.</p>'}
    <h3>${ep.number}화 기록</h3>
    ${mine.length ? `<table><tr><th>항목</th><th>상태</th><th>씬</th><th class="hide-m">남긴 곳</th><th></th></tr>${mine.map(l => `<tr>
      <td style="white-space:nowrap"><b>${name(l.entry_id)}</b></td><td>${esc(l.state)}</td><td class="quiet">${l.scene_no ? 'S#' + l.scene_no : ''}</td>
      <td class="quiet hide-m">${esc(l.source || '')} · ${esc(l.devices?.name || '')}<br>${fmt(l.created_at)}</td>
      <td><button class="btn small danger" data-cdel="${esc(l.id)}">삭제</button></td></tr>`).join('')}</table>`
      : '<p class="quiet">아직 기록이 없습니다.</p>'}
    <div class="row" style="margin-top:10px;align-items:flex-end">
      <div style="flex:1;min-width:140px"><label>항목</label><select id="cent">${sorted.map(e =>
        `<option value="${esc(e.id)}">${esc(BIBLE_CAT[e.category])} · ${esc(e.name)}</option>`).join('')}</select></div>
      <div style="width:90px"><label>씬 (선택)</label><input id="csc" inputmode="numeric"></div>
      <div style="flex:2;min-width:200px"><label>상태</label><input id="cst" placeholder="예: 연습복, 머리 묶음, 왼손에 붕대"></div>
      <button class="btn primary" id="cadd">기록</button></div>`;
  const redraw = () => renderContinuity(entries, episodes).catch(e => toast('오류: ' + errText(e)));
  $('#cep').onchange = e => { S.contEp = e.target.value; redraw(); };
  const add = guard(async () => {
    const state = $('#cst').value.trim(); if (!state) return toast('상태를 적어 주세요');
    const sc = parseInt($('#csc').value, 10);
    await q(S.sb.from('continuity_logs').insert({ episode_id: ep.id, entry_id: $('#cent').value, scene_no: Number.isFinite(sc) ? sc : null, state }));
    toast('기록했습니다'); redraw();
  });
  $('#cadd').onclick = add;
  $('#cst').onkeydown = e => { if (e.key === 'Enter') add(); };
  box.querySelectorAll('[data-cdel]').forEach(b => b.onclick = guard(async () => {
    if (!confirm('이 기록을 지울까요?')) return;
    await q(S.sb.from('continuity_logs').delete().eq('id', b.dataset.cdel)); redraw();
  }));
}

// 감독 노하우(교훈) 기록
const LCAT = { face: '얼굴', costume: '의상', location: '장소', prop: '소품', continuity: '연속성', expression: '표정', emotion_tone: '감정·톤',
  dialogue: '대사', camera: '카메라', motion: '움직임', prompt: '프롬프트', localization: '현지화', other: '기타' };
const LST = { active: ['적용 중', 'good'], candidate: ['후보', 'warn'], retired: ['꺼짐', ''] };
async function renderLessons() {
  const box = $('#lessonBox'); if (!box) return;
  const [lessons, series] = await Promise.all([
    q(S.sb.from('director_lessons').select('*').order('hit_count', { ascending: false }).order('last_seen_at', { ascending: false }).limit(500)),
    q(S.sb.from('series').select('id,title').order('created_at')),
  ]);
  S.lessonSt = S.lessonSt || 'active';
  const cnt = k => lessons.filter(l => l.status === k).length;
  const shown = lessons.filter(l => S.lessonSt === 'all' || l.status === S.lessonSt);
  const sname = id => id ? (series.find(x => x.id === id)?.title || '시리즈') : '모든 시리즈 공통';
  box.innerHTML = `<div class="card" style="border-color:var(--accent)">
    <div class="row"><b>감독 노하우 (교훈 기록)</b>
      <span class="quiet">감수자·평가자·대표에게 받은 지적이 쌓이고, 감독은 작업 전에 '적용 중' 교훈을 먼저 읽고 적용합니다.</span></div>
    <p class="quiet" style="margin:6px 0">같은 문제가 두 번 나오면 자동으로 '적용 중'이 되고, 3번 넘게 반복되면 평가자가 지침 수정안으로 올립니다. 지침과 바이블이 항상 우선합니다.</p>
    <div class="row" style="margin:8px 0">${[['active', `적용 중 ${cnt('active')}`], ['candidate', `후보 ${cnt('candidate')}`], ['retired', `꺼짐 ${cnt('retired')}`], ['all', `전체 ${lessons.length}`]].map(([k, l]) =>
      `<button class="btn small ${S.lessonSt === k ? 'primary' : ''}" data-lst="${k}">${l}</button>`).join('')}</div>
    ${shown.length ? `<table><tr><th>분류</th><th>앞으로의 규칙</th><th class="hide-m">근거</th><th style="text-align:right">반복</th><th></th></tr>${shown.map(l => `<tr>
      <td style="white-space:nowrap">${pill(LCAT[l.category] || l.category)}<br><span class="quiet">${esc(sname(l.series_id))}</span></td>
      <td><b>${esc(l.rule)}</b><div class="quiet" style="margin-top:2px">문제: ${esc(l.problem)}</div>
        ${l.bad_example || l.good_example ? `<div class="quiet" style="margin-top:2px">${l.bad_example ? '실패: ' + esc(l.bad_example) : ''}${l.good_example ? ' → 통과: ' + esc(l.good_example) : ''}</div>` : ''}</td>
      <td class="quiet hide-m">${esc((l.sources || []).join(', '))}${(l.cut_refs || []).length ? '<br>' + esc(l.cut_refs.slice(0, 4).join(', ')) + (l.cut_refs.length > 4 ? ` 외 ${l.cut_refs.length - 4}` : '') : ''}</td>
      <td style="text-align:right;white-space:nowrap">${l.hit_count}회${l.applied_ok ? `<br><span class="quiet">효과 ${l.applied_ok}회</span>` : ''}</td>
      <td style="text-align:right;white-space:nowrap">${pill(LST[l.status][0], LST[l.status][1])}<br>
        ${l.status !== 'active' ? `<button class="btn small" data-lset="active" data-lid="${esc(l.id)}">적용</button>` : ''}
        ${l.status !== 'retired' ? `<button class="btn small" data-lset="retired" data-lid="${esc(l.id)}">끄기</button>` : ''}</td></tr>`).join('')}</table>`
      : '<p class="quiet">아직 교훈이 없습니다. 제작이 시작되면 평가자가 컷마다 정리해 쌓습니다. 대표님이 직접 가르칠 내용도 아래에 넣을 수 있습니다.</p>'}
    <div class="row" style="margin-top:12px;align-items:flex-end">
      <div style="width:130px"><label>분류</label><select id="lCat">${Object.entries(LCAT).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
      <div style="width:180px"><label>범위</label><select id="lSer"><option value="">모든 시리즈 공통</option>${series.map(x => `<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</select></div>
      <div style="flex:1;min-width:200px"><label>문제 (무엇이 아쉬웠나)</label><input id="lProb" placeholder="예: 대사할 때 표정이 거의 변하지 않음"></div>
    </div>
    <label>앞으로의 규칙 (감독이 그대로 따를 한 문장)</label><input id="lRule" placeholder="예: 대사 컷은 2초마다 눈썹·입꼬리 변화를 표정 타임라인에 적는다">
    <div class="row" style="margin-top:8px"><button class="btn primary" id="lAdd">대표 가르침으로 추가 (바로 적용)</button></div>
  </div>`;
  box.querySelectorAll('[data-lst]').forEach(b => b.onclick = () => { S.lessonSt = b.dataset.lst; renderLessons(); });
  box.querySelectorAll('[data-lset]').forEach(b => b.onclick = guard(async () => {
    await q(S.sb.from('director_lessons').update({ status: b.dataset.lset, updated_at: new Date().toISOString() }).eq('id', b.dataset.lid));
    toast(b.dataset.lset === 'active' ? '적용 중으로 바꿨습니다' : '껐습니다. 감독이 더 이상 참고하지 않습니다'); renderLessons();
  }));
  $('#lAdd').onclick = guard(async () => {
    const problem = $('#lProb').value.trim(), rule = $('#lRule').value.trim();
    if (!problem || !rule) return toast('문제와 규칙을 모두 적어 주세요');
    await q(S.sb.from('director_lessons').insert({ series_id: $('#lSer').value || null, category: $('#lCat').value, problem, rule,
      fingerprint: 'owner:' + Date.now().toString(36), sources: ['대표'], status: 'active' }));
    toast('감독 노하우에 추가했습니다'); renderLessons();
  });
}

async function viewDirectives(main) {
  const [list, eps, agents] = await Promise.all([
    q(S.sb.from('directives').select('id,content,summary,status,result_note,progress_note,assigned_to_label,assigned_reason,assigned_at,started_at,completed_at,scene_no,created_at,created_by,devices(name),staff(name),episodes(number,series(title))')
      .order('created_at', { ascending: false }).limit(200)),
    q(S.sb.from('episodes').select('id,number,title,series(title)').order('number')),
    agentRows(),
  ]);
  const winAlive = agents.some(a => a.platform === 'windows' && a.alive);
  const open = list.filter(d => ['received', 'assigned', 'in_progress'].includes(d.status));
  S.dirFilter = S.dirFilter || 'open';
  const shown = S.dirFilter === 'open' ? open : S.dirFilter === 'closed' ? list.filter(d => !open.includes(d)) : list;

  main.innerHTML = `
  <h2>대표 지시</h2>
  <div class="card">
    <label style="margin-top:0">지시 내용</label>
    <textarea id="dtxt" style="min-height:90px" placeholder="예: 1화 3씬에서 주인공 의상을 연습복으로 통일해줘"></textarea>
    <div class="row">
      <div style="flex:2;min-width:180px"><label>관련 화 (선택)</label><select id="dep"><option value="">없음</option>
        ${eps.map(e => `<option value="${esc(e.id)}">${esc(e.series?.title)} ${e.number}화</option>`).join('')}</select></div>
      <div style="flex:1;min-width:100px"><label>씬 번호 (선택)</label><input id="dsc" inputmode="numeric"></div>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="dgo">지시 보내기</button>
      <span class="quiet">단계가 바뀔 때마다 알림(위의 종 모양)으로 알려 드립니다.</span></div>
  </div>
  ${!winAlive && open.length ? `<div class="msg err" style="background:rgba(183,121,31,.12);color:var(--warn)">
    Windows 에이전트가 꺼져 있어 지시 ${open.length}건이 <b>접수</b> 상태로 기다리고 있습니다. 에이전트가 켜지면 자동으로 이어서 처리됩니다.</div>` : ''}
  <div class="row" style="margin:6px 0 10px">
    ${[['open', `진행 중 ${open.length}`], ['closed', '끝난 지시'], ['all', `전체 ${list.length}`]].map(([k, l]) =>
      `<button class="btn small ${S.dirFilter === k ? 'primary' : ''}" data-f="${k}">${l}</button>`).join('')}
  </div>
  ${shown.length ? shown.map(d => directiveCard(d)).join('') : '<div class="card quiet">해당하는 지시가 없습니다.</div>'}`;

  main.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.dirFilter = b.dataset.f; go('directives'); });
  $('#dgo').onclick = guard(async () => {
    const content = $('#dtxt').value.trim(); if (!content) return;
    const sc = parseInt($('#dsc').value, 10);
    await q(S.sb.from('directives').insert({ content, episode_id: $('#dep').value || null, scene_no: Number.isFinite(sc) ? sc : null }));
    S.dirFilter = 'open'; toast('지시를 보냈습니다'); go('directives');
  });
  main.querySelectorAll('[data-cancel]').forEach(b => b.onclick = guard(async () => {
    if (!confirm('이 지시를 취소할까요?')) return;
    await q(S.sb.from('directives').update({ status: 'cancelled', result_note: '대표가 취소' }).eq('id', b.dataset.cancel)); go('directives');
  }));
  main.querySelectorAll('[data-more]').forEach(b => b.onclick = guard(() => directiveDetail(b.dataset.more)));
  if (S.focusDirective) {
    const el = main.querySelector(`[data-dir="${S.focusDirective}"]`);
    if (el) { el.classList.add('focus'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); await directiveDetail(S.focusDirective); }
    else if (S.dirFilter !== 'all') { S.dirFilter = 'all'; return go('directives'); }
    S.focusDirective = null;
  }
}

function directiveCard(d) {
  const who = d.assigned_to_label || d.staff?.name;
  const order = ['received', 'assigned', 'in_progress', 'done'];
  const endBad = d.status === 'rejected' || d.status === 'cancelled';
  const at = endBad ? 3 : order.indexOf(d.status);
  const st = (i, title, desc) => {
    const cls = i < at || (i === 3 && d.status === 'done') ? 'done' : i === at ? (endBad ? 'fail' : 'now') : '';
    return `<div class="step ${cls}"><div class="dot">${cls === 'done' ? '✓' : cls === 'fail' ? '!' : i + 1}</div>
      <div class="t">${title}</div><div class="d">${desc}</div></div>`;
  };
  const statusLine = {
    received: '에이전트가 지시를 읽고 담당 직원을 정하는 중입니다.',
    assigned: `${esc(who)}에게 배정되었고 곧 처리를 시작합니다.`,
    in_progress: `${esc(who)}이(가) 처리하고 있습니다${d.progress_note ? ': ' + esc(d.progress_note) : '.'}`,
    done: `완료되었습니다${d.result_note ? ': ' + esc(d.result_note) : '.'}`,
    rejected: `처리하지 못했습니다${d.result_note ? ': ' + esc(d.result_note) : '.'}`,
    cancelled: '대표가 취소한 지시입니다.',
  }[d.status];
  return `<div class="card dcard" data-dir="${esc(d.id)}">
    <div class="row"><b style="font-size:15.5px;flex:1;min-width:200px">${esc(d.content)}</b>
      ${pill(DIR_STATUS[d.status] || d.status, d.status === 'done' ? 'good' : endBad ? 'bad' : 'accent')}</div>
    ${d.summary ? `<div class="quiet" style="margin-top:2px">요약: ${esc(d.summary)}</div>` : ''}
    <div class="route" style="margin-top:10px">
      <span class="node"><b>보낸 사람</b> 대표 · ${esc(d.devices?.name || '기기 미상')}</span><span class="arrow">→</span>
      <span class="node"><b>받는 사람</b> ${who ? esc(who) : '<span class="quiet">배정 전</span>'}</span>
      ${d.episodes ? `<span class="node">${esc(d.episodes.series?.title)} ${d.episodes.number}화${d.scene_no ? ' S#' + d.scene_no : ''}</span>` : ''}
    </div>
    <div class="steps">
      ${st(0, '접수', fmt(d.created_at))}
      ${st(1, '배정', d.assigned_at ? esc(who || '') + '<br>' + fmt(d.assigned_at) + (d.assigned_reason ? '<br>' + esc(d.assigned_reason) : '') : '담당 직원 정하기')}
      ${st(2, '처리 중', d.started_at ? (d.progress_note ? esc(d.progress_note) + '<br>' : '') + fmt(d.started_at) : '작업 진행')}
      ${st(3, endBad ? (d.status === 'cancelled' ? '취소' : '반려') : '완료', d.completed_at ? fmt(d.completed_at) : '결과 보고')}
    </div>
    <p style="margin:10px 0 6px"><b>지금 상태:</b> ${statusLine}</p>
    <div class="row"><button class="btn small" data-more="${esc(d.id)}">진행 기록 자세히</button>
      ${['received', 'assigned', 'in_progress'].includes(d.status) ? `<button class="btn small danger" data-cancel="${esc(d.id)}">지시 취소</button>` : ''}</div>
    <div id="more-${esc(d.id)}"></div>
  </div>`;
}

  const box = document.getElementById('more-' + id); if (!box) return;
  if (box.innerHTML) { box.innerHTML = ''; return; }
  const jobs = await q(S.sb.from('jobs').select('id,type,status,attempts,error,created_at,finished_at').eq('directive_id', id).order('created_at'));
  const ids = [id, ...jobs.map(j => j.id)];
  const events = await q(S.sb.from('activity_log').select('occurred_at,actor,summary,devices(name)').in('entity_id', ids).order('occurred_at'));
  const JOB = { queued: ['대기', ''], running: ['실행 중', 'accent'], done: ['완료', 'good'], failed: ['실패', 'bad'], cancelled: ['취소', ''], on_hold: ['보류', 'warn'] };
  box.innerHTML = `
    <h3>이 지시로 생긴 작업</h3>
    ${jobs.length ? `<table><tr><th>작업</th><th>상태</th><th>시각</th></tr>${jobs.map(j => `<tr><td>${esc(JOB_NAME[j.type] || j.type)}

      <td class="quiet">${fmt(j.finished_at || j.created_at)}</td></tr>`).join('')}</table>` : '<p class="quiet">아직 없습니다.</p>'}
    <h3>진행 기록</h3>
    ${events.length ? `<table>${events.map(e => `<tr><td class="quiet" style="white-space:nowrap">${fmt(e.occurred_at)}</td>
      <td>${esc(e.actor)}<br><span class="quiet">${esc(e.devices?.name || '')}</span></td><td>${esc(human(e.summary))}</td></tr>`).join('')}</table>` : '<p class="quiet">기록이 없습니다.</p>'}`;

const AGENT_FILES = ['agent.py', 'install.sh', 'install.ps1'];
const agentFile = name => document.getElementById('f-' + name)?.textContent.replace(/^\n/, '') || '';
const AGENT_VERSION = (agentFile('agent.py').match(/^VERSION = "([^"]+)"/m) || [])[1] || '?';
const agentBase = () => loadJSON(LS.cfg).url + '/storage/v1/object/public/agent';
// 에이전트 원본은 GitHub에 있다. 올리는 순간 에이전트들이 10분 안에 스스로 받아 간다.
const AGENT_GH = 'https://raw.githubusercontent.com/gostoping/nyxwhite-dashboard/main/agent';
async function latestAgentVersion() {
  try {
    const t = await fetch(AGENT_GH + '/agent.py', { cache: 'no-store' }).then(r => r.ok ? r.text() : '');
    return (t.match(/^VERSION = "([^"]+)"/m) || [])[1] || null;
  } catch { return null; }
}
const ONLINE_SEC = 60;
const verNum = v => String(v || '0').split('.').map(n => n.padStart(4, '0')).join('.');

function installCommand(platform, token) {
  const { url, key } = loadJSON(LS.cfg);
  return platform === 'mac'
    ? `curl -fsSL "${AGENT_GH}/install.sh" | bash -s -- "${url}" "${key}" "${token}"`
    : `$env:NYX_URL='${url}'; $env:NYX_KEY='${key}'; $env:NYX_TOKEN='${token}'; iex ([Text.Encoding]::UTF8.GetString((Invoke-WebRequest '${AGENT_GH}/install.ps1' -UseBasicParsing).RawContentStream.ToArray()))`;
}
function installBox(platform, name, token) {
  const cmd = installCommand(platform, token);
  const how = platform === 'mac'
    ? '<b>맥</b>: ⌘+스페이스 → "터미널" 입력 → Enter로 터미널을 엽니다. 아래 명령을 붙여 넣고(⌘V) Enter를 누르세요.'
    : '<b>Windows</b>: 시작 메뉴에서 "PowerShell"을 검색해 엽니다. 아래 명령을 붙여 넣고(마우스 오른쪽 클릭) Enter를 누르세요.';
  return `<div class="card" style="border-color:var(--accent)">
    <b>${esc(name)} 설치 명령</b>
    <p>${how}</p>
    <pre class="doc" id="icmd" style="max-height:160px">${esc(cmd)}</pre>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="icopy">명령 복사</button>
      <span class="quiet">설치하는 컴퓨터에서 이 대시보드를 열고 복사하면 편합니다.</span></div>
    <p class="quiet" style="margin-top:10px">⚠️ 이 명령에는 이 기기 전용 열쇠(토큰)가 들어 있어 <b>지금 한 번만</b> 보입니다. 다른 사람에게 보내지 마세요.
    다시 필요하면 "설치 명령 다시 받기"를 누르면 됩니다(새 열쇠가 나오고 이전 설치는 끊깁니다). 1~3분 걸리며 관리자 비밀번호는 필요 없습니다.</p>
  </div>`;
}
function bindCopy() {
  const b = $('#icopy'); if (!b) return;
  b.onclick = async () => {
    try { await navigator.clipboard.writeText($('#icmd').textContent); toast('복사했습니다'); }
    catch { const r = document.createRange(); r.selectNodeContents($('#icmd')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('선택해 두었습니다. 복사하기(⌘C / Ctrl+C)를 누르세요'); }
  };
}

  { name: '회사 맥', platform: 'mac', role: 'office' }, { name: '집 윈도우 (서버)', platform: 'windows', role: 'server' },
  { name: '이동용 맥', platform: 'mac', role: 'mobile' }, { name: '이동용 윈도우', platform: 'windows', role: 'mobile' },
];

    ${storedVer && storedVer !== AGENT_VERSION ? `<p class="quiet" style="margin:6px 0 0">v1.0.0 에이전트는 자동 업데이트 기능이 없어 한 번만 손으로 올려야 합니다: "예전 에이전트용 배포" → 해당 기기 "업데이트".</p>` : ''}

async function renderAgentList(newest) {
  const box = $('#agList'); if (!box) return;
  const [st, cmds] = await Promise.all([
    q(S.sb.from('agent_status').select('*,devices(name,kind)')),
    q(S.sb.from('agent_commands').select('id,device_id,command,status,result,created_at,done_at').order('created_at', { ascending: false }).limit(60)),
  ]);
  const list = st.filter(a => a.state !== 'removed').sort((a, b) => (a.devices?.name || '').localeCompare(b.devices?.name || ''));
  if (!list.length) { box.innerHTML = '<div class="card quiet">아직 에이전트가 없습니다. 아래에서 추가하세요.</div>'; return; }
  const CMD = { ping: '연결 시험', restart: '재시작', update: '업데이트', test_keys: 'API 키 시험' };
  const CST = { queued: ['전달 대기', ''], sent: ['처리 중', 'accent'], done: ['완료', 'good'], failed: ['실패', 'bad'] };
  box.innerHTML = list.map(a => {
    const age = a.last_seen_at ? (Date.now() - new Date(a.last_seen_at)) / 1000 : null;
    const online = age != null && age < ONLINE_SEC;
    const conn = a.last_seen_at == null ? pill('설치 전', 'warn') : online ? pill('온라인', 'good') : pill('오프라인', 'bad');
    const state = !online ? '' : a.paused ? pill('일시정지', 'warn') : a.current_job ? pill('작업 중', 'accent')
      : a.state === 'error' ? pill('오류', 'bad') : pill('대기 중', '');
    const old = newest && a.version && verNum(a.version) < verNum(newest);
    const recent = cmds.filter(c => c.device_id === a.device_id).slice(0, 3);
    return `<div class="card">
      <div class="row"><b style="font-size:16px">${esc(a.devices?.name || '이름 없음')}</b>
        ${pill(a.platform === 'mac' ? '맥' : a.platform === 'windows' ? 'Windows' : (a.platform || '-'))}${pill(ROLE[a.role || 'office'][0], ROLE[a.role || 'office'][1])}${conn}${state}
        ${a.version ? pill('v' + a.version, old ? 'warn' : '') : ''}${old ? `<span class="quiet">새 버전 v${esc(newest)} ${a.info?.auto_update_minutes ? '· 곧 자동 업데이트' : '· "업데이트"를 한 번 눌러 주세요'}</span>` : ''}</div>
      ${a.info?.rolled_back_from ? `<div class="msg err" style="margin:8px 0 0">v${esc(a.info.rolled_back_from)} 업데이트가 이 기기에서 시작에 실패해 이전 버전으로 되돌렸습니다. 다음 버전이 나오면 다시 시도합니다.</div>` : ''}
      <div class="quiet" style="margin-top:6px">마지막 통신 ${fmt(a.last_seen_at)}${a.info?.hostname ? ` · ${esc(a.info.hostname)} · ${esc(a.info.os || '')}` : ''}
        ${a.current_job ? `<br>지금 하는 일: <b>${esc(JOB_NAME[a.current_job] || a.current_job)}</b>` : ''}</div>
      ${a.last_error ? `<div class="msg err" style="margin:8px 0 0">${esc(a.last_error)}</div>` : ''}
      <div class="row" style="margin-top:8px"><span class="quiet">역할</span><select data-role="${esc(a.device_id)}" style="width:auto">${Object.entries(ROLE).map(([k, [l]]) => `<option value="${k}" ${k === (a.role || 'office') ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <span class="quiet">${esc(ROLE[a.role || 'office'][2])}</span></div>
      <div class="row" style="margin-top:10px">
        <button class="btn small" data-cmd="ping" data-dev="${esc(a.device_id)}">연결 시험</button>
        <button class="btn small" data-pause="${esc(a.device_id)}" data-v="${a.paused ? '0' : '1'}">${a.paused ? '다시 시작' : '일시정지'}</button>
        <button class="btn small" data-cmd="restart" data-dev="${esc(a.device_id)}">재시작</button>
        <button class="btn small ${old ? 'primary' : ''}" data-cmd="update" data-dev="${esc(a.device_id)}">업데이트</button>
        <button class="btn small" data-reissue="${esc(a.device_id)}" data-plat="${esc(a.platform || 'windows')}" data-name="${esc(a.devices?.name || '')}">설치 명령 다시 받기</button>
        <button class="btn small danger" data-remove="${esc(a.device_id)}">연결 해제</button></div>
      ${recent.length ? `<table style="margin-top:8px">${recent.map(c => `<tr><td class="quiet hide-m" style="white-space:nowrap">${fmt(c.created_at)}</td>
        <td style="white-space:nowrap">${esc(CMD[c.command] || c.command)}</td><td>${pill(CST[c.status][0], CST[c.status][1])}</td>
        <td class="quiet">${esc(c.result || '')}</td></tr>`).join('')}</table>` : ''}
      ${!online && a.last_seen_at == null ? '<p class="quiet" style="margin:8px 0 0">설치 명령을 실행하면 1분 안에 온라인으로 바뀝니다.</p>' : ''}
      ${!online && a.last_seen_at != null ? '<p class="quiet" style="margin:8px 0 0">컴퓨터가 꺼졌거나 잠들었거나 인터넷이 끊겼습니다. 명령은 다시 연결되면 처리됩니다.</p>' : ''}
    </div>`;
  }).join('');
  box.querySelectorAll('[data-cmd]').forEach(b => b.onclick = guard(async () => {
    await q(S.sb.from('agent_commands').insert({ device_id: b.dataset.dev, command: b.dataset.cmd }));
    toast(`${CMD[b.dataset.cmd]} 명령을 보냈습니다. 15초 안에 처리됩니다`); renderAgentList(newest);
  }));
  box.querySelectorAll('[data-role]').forEach(s => s.onchange = guard(async () => {
    if (s.value === 'server' && list.some(x => x.role === 'server' && x.device_id !== s.dataset.role) && !confirm('이미 서버가 있습니다. 서버를 둘로 두면 영상이 두 곳에 나뉘어 보관될 수 있습니다. 계속할까요?')) { s.value = list.find(x => x.device_id === s.dataset.role)?.role || 'office'; return; }
    await q(S.sb.from('agent_status').update({ role: s.value }).eq('device_id', s.dataset.role));
    toast(`역할을 "${ROLE[s.value][0]}"(으)로 바꿨습니다`); renderAgentList(newest);
  }));
  box.querySelectorAll('[data-pause]').forEach(b => b.onclick = guard(async () => {
    const paused = b.dataset.v === '1';
    await q(S.sb.from('agent_status').update({ paused }).eq('device_id', b.dataset.pause));
    toast(paused ? '일시정지했습니다. 하던 작업은 끝내고 멈춥니다' : '다시 시작했습니다'); renderAgentList(newest);
  }));
  box.querySelectorAll('[data-reissue]').forEach(b => b.onclick = guard(async () => {
    if (!confirm('새 설치 명령을 만들까요? 이 기기에 이미 설치된 에이전트는 연결이 끊기고, 새 명령으로 다시 설치해야 합니다.')) return;
    const token = await q(S.sb.rpc('reissue_agent_token', { p_device: b.dataset.reissue }));
    $('#ainstall').innerHTML = installBox(b.dataset.plat, b.dataset.name, token); bindCopy();
    $('#ainstall').scrollIntoView({ behavior: 'smooth' });
  }));
  box.querySelectorAll('[data-remove]').forEach(b => b.onclick = guard(async () => {
    if (!confirm('이 에이전트의 연결을 끊을까요? 그 컴퓨터의 프로그램은 더 이상 일을 받지 못합니다.')) return;
    await q(S.sb.rpc('remove_agent', { p_device: b.dataset.remove })); toast('연결을 끊었습니다'); renderAgentList(newest);
  }));
}

// ------------------------------------------------------------------
// 비용·견적서: 장부(모든 지출 한 줄씩), 순수 제작비 vs 누수 비용, 화별 견적서, 사전 견적
// ------------------------------------------------------------------
const STAGE = { script_revision: '대본 수정·변경 요약', cut_card: '컷 카드·프롬프트(감독)', prompt_review: '프롬프트 감수',
  keyframe: '키프레임 생성', keyframe_review: '키프레임 검사', video: '영상 생성(Higgsfield)', video_review: '영상 검사',
  final_review: '최종 감수', evaluate: '채점(평가자)', upscale: '업스케일(맥)', subtitle: '자막(맥)', audio: '음량·음성(맥)',
  edit: '편집(쌤컷)', directive: '지시 처리', localization: '현지화(자막·더빙·립싱크)', fixed: '고정비(구독 등)', other: '기타' };
const OUTCOME = { success: ['순수 제작비', 'good'], failed: ['실패(누수)', 'bad'], pending: ['진행 중', 'accent'], hold: ['보류', 'warn'] };
const CAUSE = { director: '감독(프롬프트)', tool: '영상 도구 한계', script: '대본', standard: '기준', other: '기타' };
const UNIT = { per_second: '초당', per_1m_input_tokens: '입력 100만 토큰당', per_1m_output_tokens: '출력 100만 토큰당', per_image: '이미지 1장당', per_call: '1회당', per_month: '월' };
const won = n => n == null || isNaN(n) ? '-' : Math.round(n).toLocaleString('ko-KR') + '원';
const usdf = n => n == null || isNaN(n) ? '-' : '$' + Number(n).toFixed(2);
const sum = (rows, f = r => r.krw) => rows.reduce((a, r) => a + (Number(f(r)) || 0), 0);
const qtyText = q => !q ? '' : [q.seconds && `${q.seconds}초`, q.images && `${q.images}장`, q.calls && `${q.calls}회`,
  q.input_tokens && `입력 ${Number(q.input_tokens).toLocaleString()}`, q.output_tokens && `출력 ${Number(q.output_tokens).toLocaleString()}`].filter(Boolean).join(' · ');
const groupBy = (rows, key) => rows.reduce((m, r) => { const k = key(r) ?? '-'; (m[k] = m[k] || []).push(r); return m; }, {});

function buildInvoice(events, meta) {
  const by = o => events.filter(e => e.outcome === o);
  const success = by('success'), failed = by('failed'), pending = by('pending'), hold = by('hold');
  const stageRows = rows => Object.entries(groupBy(rows, r => r.stage)).map(([k, rs]) => ({
    stage: k, label: STAGE[k] || k, count: rs.length, krw: sum(rs), usd: sum(rs, r => r.usd),
    seconds: sum(rs, r => r.qty?.seconds), tokens: sum(rs, r => (r.qty?.input_tokens || 0) + (r.qty?.output_tokens || 0)),
  })).sort((a, b) => b.krw - a.krw);
  const total = sum(events), pure = sum(success), leak = sum(failed);
  const successCuts = new Set(success.filter(e => e.stage === 'video' && e.cut_id).map(e => e.cut_id)).size;
  return {
    title: meta.title, generated_at: new Date().toISOString(), krw_per_usd: meta.krw_per_usd,
    totals: { total, pure, leak, pending: sum(pending), hold: sum(hold), count: events.length,
      leak_rate: total ? leak / total : 0, success_cuts: successCuts, per_cut: successCuts ? pure / successCuts : null },
    success_by_stage: stageRows(success), failed_by_stage: stageRows(failed),
    failed_by_cause: Object.entries(groupBy(failed, r => r.failure_cause || 'other')).map(([k, rs]) => ({ cause: CAUSE[k] || k, count: rs.length, krw: sum(rs) }))
      .sort((a, b) => b.krw - a.krw),
    failed_items: failed.slice().sort((a, b) => (b.krw || 0) - (a.krw || 0)).slice(0, 40).map(e => ({
      cut_id: e.cut_id, stage: STAGE[e.stage] || e.stage, attempt_no: e.attempt_no, reason: e.failure_reason,
      cause: CAUSE[e.failure_cause] || '', krw: e.krw, at: e.occurred_at })),
    pending_by_stage: stageRows(pending), hold_by_stage: stageRows(hold),
    has_edit: events.some(e => e.stage === 'edit'), revenue: meta.revenue ?? null,
  };
}

      <div class="card stat"><div class="n">${t.per_cut != null ? won(t.per_cut) : '-'}</div><div class="l">완성 컷당 순수 제작비 (${t.success_cuts}컷)</div></div>

    <h3>2. 추가 비용: 실패해서 다시 만든 비용</h3>
    <div class="split" style="grid-template-columns:1fr 1fr">
      <div><b class="quiet">원인별</b>${d.failed_by_cause.length ? `<table>${d.failed_by_cause.map(r => `<tr><td>${esc(r.cause)}</td>
