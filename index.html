    <div class="ed-tl" id="eTl">
      <div class="ed-lanes">
        <div class="ed-lane-h">시간</div><div class="ed-lane-h">영상</div><div class="ed-lane-h">대사</div><div class="ed-lane-h">음악</div><div class="ed-lane-h">자막</div>
      </div>
      <div class="ed-scroll" id="eScroll"><div class="ed-canvas" id="eCanvas" style="width:${Math.ceil(L.total * ED.pps) + 200}px">
        <div class="ed-ruler" id="eRuler">${edRuler(L.total)}</div>
        <div class="ed-track" data-track="video">${L.clips.map(x => edClipBlock(x)).join('')}</div>
        <div class="ed-track" data-track="voice">${L.clips.map(x => edVoiceBlock(x)).join('')}</div>
        <div class="ed-track" data-track="music">${ED.tl.music.map(m => edMusicBlock(m)).join('')}</div>
        <div class="ed-track" data-track="subs">${L.subs.map(x => edSubBlock(x)).join('')}</div>
        <div class="ed-head" id="eHead" style="left:${ED.t * ED.pps}px"></div>
      </div></div>
    </div>
    <div class="quiet ed-keys">단축키: 스페이스 재생 · ←/→ 0.1초 이동(⇧ 1초) · S 나누기 · Delete 빼기 · ⌘Z 되돌리기 · 컷을 끌어 순서 변경 · 가장자리를 끌어 자르기 · 대사 막대를 끌어 대사 위치 조정</div>
  </div>
  <div class="card ed-ask">
    <div class="row"><b>말로 편집·재생</b><span class="quiet">편집: "S03 C02 빼고, C04 끝 1초 줄여 줘" · 재생: "S02부터 대사만 들려줘", "음악만", "멈춰"</span></div>
    <div class="row" style="margin-top:6px"><input id="eAsk" placeholder="말하듯 적고 Enter (또는 🎤로 말하기)" style="flex:1">
      <button class="btn" id="eMic" title="말로 하기 (켜 두면 계속 듣습니다)">🎤 말하기</button><button class="btn primary" id="eAskGo">실행</button></div>
    <div id="eAskRes" class="quiet" style="margin-top:6px"></div>
  </div>
  <div class="card" id="eOut"></div>`;
  edBind(); edInspector(); edRenderOut(); edSeek(ED.t, false);
}

function edRuler(total) {
  const step = ED.pps > 60 ? 1 : ED.pps > 25 ? 2 : ED.pps > 12 ? 5 : 10;
  let h = ''; for (let s = 0; s <= total + step; s += step) h += `<span style="left:${s * ED.pps}px">${fmtT(s).replace(/\.0$/, '')}</span>`;
  return h;
}
function edClipBlock(x) {
  const c = x.c, tk = takeOf(c), cut = cutOf(c), poster = ED.urls[tk.files?.poster];
  const sel = ED.sel?.type === 'clip' && ED.sel.id === c.id;
  const warn = cut.best_take_id && cut.best_take_id !== c.take_id ? ' ed-newtake' : tk.verdict !== 'pass' ? ' ed-unpassed' : '';
  return `${+c.gap > 0 ? `<div class="ed-gap" data-gap="${c.id}" style="left:${(x.start - c.gap) * ED.pps}px;width:${c.gap * ED.pps}px" title="정적 ${c.gap}초"></div>` : ''}
    <div class="ed-clip${sel ? ' sel' : ''}${warn}" data-clip="${c.id}" style="left:${x.start * ED.pps}px;width:${Math.max(4, x.dur * ED.pps - 2)}px;${poster ? `background-image:url('${poster}')` : ''}">
      <i class="h l" data-trim="in"></i><span>${esc(clipCode(c))}<small>${x.dur.toFixed(1)}s</small></span><i class="h r" data-trim="out"></i></div>`;
}
function edVoiceBlock(x) {
  const c = x.c, off = +c.voice_offset || 0, g = c.voice_gain ?? 1;
  const sel = ED.sel?.type === 'clip' && ED.sel.id === c.id;
  return `<div class="ed-voice${sel ? ' sel' : ''}${off ? ' moved' : ''}" data-voice="${c.id}" style="left:${(x.start + off) * ED.pps}px;width:${Math.max(4, x.dur * ED.pps - 2)}px;opacity:${0.45 + Math.min(1, g) * 0.55}">
    <span>${off ? (off < 0 ? `◀ ${Math.abs(off).toFixed(1)}s 먼저` : `${off.toFixed(1)}s 나중 ▶`) : ''}${g !== 1 ? ` ${Math.round(g * 100)}%` : ''}</span></div>`;
}
function edMusicBlock(m) {
  const dur = Math.max(0.5, (+m.out || 0) - (+m.in || 0));
  const sel = ED.sel?.type === 'music' && ED.sel.id === m.id;
  return `<div class="ed-music${sel ? ' sel' : ''}" data-music="${m.id}" style="left:${(+m.start || 0) * ED.pps}px;width:${dur * ED.pps}px">
    <i class="h l" data-trim="in"></i><span>♪ ${esc(m.name || '음악')} ${Math.round((m.gain ?? 0.6) * 100)}%</span><i class="h r" data-trim="out"></i></div>`;
}
function edSubBlock(x) {
  const sel = ED.sel?.type === 'sub' && ED.sel.id === x.s.id;
  return `<div class="ed-subb${sel ? ' sel' : ''}" data-sub="${x.s.id}" style="left:${x.start * ED.pps}px;width:${Math.max(4, (x.end - x.start) * ED.pps - 1)}px" title="${esc(x.s.text)}">
    <i class="h l" data-trim="in"></i><span>${esc(x.s.text)}</span><i class="h r" data-trim="out"></i></div>`;
}

// ---------------- 인스펙터(선택한 것 자세히)
function edInspector() {
  const box = $('#eInsp'); if (!box) return;
  const L = ED.L, sel = ED.sel;
  const num = (id, v, step = 0.1, min = '', max = '') => `<div class="ed-num"><button class="btn small" data-nd="${id}" data-d="${-step}">−</button><input id="${id}" type="number" step="${step}" value="${v}" ${min !== '' ? `min="${min}"` : ''} ${max !== '' ? `max="${max}"` : ''}><button class="btn small" data-nd="${id}" data-d="${step}">+</button></div>`;
  if (sel?.type === 'clip') {
    const x = L.clips.find(y => y.c.id === sel.id); if (!x) { ED.sel = null; return edInspector(); }
    const c = x.c, cut = cutOf(c), tk = takeOf(c);
    const ts = Object.values(ED.takes).filter(t => t.cut_id === c.cut_id && ['completed', 'stored'].includes(t.status));
    box.innerHTML = `<div class="row"><b>${esc(cut.code || '컷')}</b>${pill(tk.verdict === 'pass' ? '통과' : tk.verdict === 'fail' ? '불합격' : '감수 전', tk.verdict === 'pass' ? 'good' : tk.verdict === 'fail' ? 'bad' : 'warn')}
        <span class="quiet">타임라인 ${fmtT(x.start)} · ${x.dur.toFixed(1)}초</span></div>
      ${cut.dialogue ? `<div class="dlg" style="margin-top:6px">${esc(cut.dialogue)}</div>` : `<div class="quiet" style="margin-top:6px">${esc(cut.summary || '')}</div>`}
      ${ts.length > 1 ? `<label>테이크</label><select id="iTake">${ts.map(t => `<option value="${t.id}" ${t.id === c.take_id ? 'selected' : ''}>테이크 ${t.take_no}${t.score != null ? ` · ${t.score}점` : ''}${t.id === cut.best_take_id ? ' · 채택' : ''}</option>`).join('')}</select>` : ''}
      ${cut.best_take_id && cut.best_take_id !== c.take_id ? `<div class="msg" style="background:var(--accent-soft)">새로 채택된 테이크가 있습니다 <button class="btn small" id="iBest">바꾸기</button></div>` : ''}
      <div class="ed-grid2">
        <div><label>시작 (원본 기준 초)</label>${num('iIn', (+c.in).toFixed(2), 0.1, 0, c.src_len)}</div>
        <div><label>끝 (원본 ${(+c.src_len || 0).toFixed(1)}초 중)</label>${num('iOut', (+c.out).toFixed(2), 0.1, 0, c.src_len)}</div>
      </div>
      <div class="row" style="margin-top:6px"><button class="btn small" id="iSetIn">재생 위치를 시작으로</button><button class="btn small" id="iSetOut">재생 위치를 끝으로</button></div>
      <label>이 컷 앞 정적 (검은 화면, 초)</label>${num('iGap', (+c.gap || 0).toFixed(1), 0.5, 0, 10)}
      <label>대사 위치: <b id="iOffV">${edOffLabel(+c.voice_offset || 0)}</b></label>
      <input type="range" id="iOff" min="-2" max="2" step="0.05" value="${+c.voice_offset || 0}">
      <div class="ed-scale"><span>대사 먼저 (앞 컷에 걸침)</span><span>0</span><span>대사 나중</span></div>
      <label>대사·현장음 크기: <b id="iGainV">${Math.round((c.voice_gain ?? 1) * 100)}%</b></label>
      <input type="range" id="iGain" min="0" max="2" step="0.05" value="${c.voice_gain ?? 1}">
      <div class="row" style="margin-top:12px">
        <button class="btn small" id="iPlay">이 컷만 재생</button>
        <button class="btn small" id="iFix">감독에게 다시 요청</button>
        <button class="btn small danger" id="iDel" style="margin-left:auto">이 컷 빼기</button></div>`;
    const setNum = (id, fn) => { const el = $('#' + id); el.onchange = () => edChange(() => fn(+el.value)); };
    setNum('iIn', v => { c.in = r3(Math.max(0, Math.min(+c.out - 0.3, v))); });
    setNum('iOut', v => { c.out = r3(Math.min(+c.src_len || v, Math.max(+c.in + 0.3, v))); });
    setNum('iGap', v => { c.gap = Math.max(0, Math.min(10, r3(v))); });
    box.querySelectorAll('[data-nd]').forEach(b => b.onclick = () => { const el = $('#' + b.dataset.nd); el.value = r3(+el.value + +b.dataset.d); el.onchange(); });
    $('#iSetIn').onclick = () => { const rel = ED.t - x.start; if (rel <= 0 || rel >= x.dur) return toast('재생 위치를 이 컷 안에 두세요'); edChange(() => { c.in = r3(+c.in + rel); }); };
    $('#iSetOut').onclick = () => { const rel = ED.t - x.start; if (rel <= 0 || rel >= x.dur) return toast('재생 위치를 이 컷 안에 두세요'); edChange(() => { c.out = r3(+c.in + rel); }); };
    const off = $('#iOff'); off.oninput = () => { $('#iOffV').textContent = edOffLabel(+off.value); }; off.onchange = () => edChange(() => { c.voice_offset = r3(+off.value); });
    const g = $('#iGain'); g.oninput = () => { $('#iGainV').textContent = Math.round(+g.value * 100) + '%'; }; g.onchange = () => edChange(() => { c.voice_gain = r3(+g.value); });
    const ts2 = $('#iTake'); if (ts2) ts2.onchange = () => edChange(() => { const t = ED.takes[ts2.value]; c.take_id = t.id; c.src_len = +t.seconds || c.src_len; c.out = Math.min(+c.out, c.src_len); });
    const bb = $('#iBest'); if (bb) bb.onclick = () => edChange(() => { const t = ED.takes[cut.best_take_id]; c.take_id = t.id; c.src_len = +t.seconds || c.src_len; c.in = 0; c.out = c.src_len; });
    $('#iPlay').onclick = () => { edSeek(x.start); edPlay(x.start + x.dur); };
    $('#iDel').onclick = () => edDelete();
    $('#iFix').onclick = guard(async () => {
      const text = prompt(`${cut.code} — 감독에게 고칠 점 (대사는 그대로)\n새 테이크가 통과하면 여기 "바꾸기"로 교체할 수 있습니다`, ''); if (!text) return;
      await q(S.sb.from('production_cuts').update({ fix_request: text.trim(), status: 'designed' }).eq('id', cut.id));
      await q(S.sb.from('pipeline_tasks').insert({ kind: 'director', episode_id: ED.ep.id, scene_no: cut.scene_no, cut_id: cut.id, payload: { cut_id: cut.id } }));
      toast('감독에게 보냈습니다. 고친 뒤 제작 탭에서 다시 생성 승인을 눌러 주세요');
    });
  } else if (sel?.type === 'music') {
    const m = ED.tl.music.find(y => y.id === sel.id); if (!m) { ED.sel = null; return edInspector(); }
    box.innerHTML = `<div class="row"><b>♪ ${esc(m.name || '음악')}</b><span class="quiet">원본 ${(+m.src_len || 0).toFixed(1)}초</span></div>
      <div class="ed-grid2"><div><label>타임라인 시작 (초)</label>${num('mStart', (+m.start).toFixed(1), 0.5, 0)}</div>
        <div><label>음악의 어디부터 (초)</label>${num('mIn', (+m.in).toFixed(1), 0.5, 0)}</div></div>
      <label>음악의 어디까지 (초)</label>${num('mOut', (+m.out).toFixed(1), 0.5, 0, m.src_len || '')}
      <label>크기: <b id="mGainV">${Math.round((m.gain ?? 0.6) * 100)}%</b> <span class="quiet">(대사 밑에 깔리면 30~50% 권장)</span></label>
      <input type="range" id="mGain" min="0" max="1.5" step="0.05" value="${m.gain ?? 0.6}">
      <div class="ed-grid2"><div><label>시작 페이드 (초)</label>${num('mFi', (+m.fade_in || 0).toFixed(1), 0.5, 0, 10)}</div>
        <div><label>끝 페이드 (초)</label>${num('mFo', (+m.fade_out || 0).toFixed(1), 0.5, 0, 10)}</div></div>
      <div class="row" style="margin-top:10px"><button class="btn small" id="mHere">재생 위치에서 시작</button><button class="btn small danger" id="mDel" style="margin-left:auto">음악 빼기</button></div>`;
    const set = (id, fn) => { const el = $('#' + id); el.onchange = () => edChange(() => fn(+el.value)); };
    set('mStart', v => { m.start = Math.max(0, r3(v)); }); set('mIn', v => { m.in = Math.max(0, Math.min(+m.out - 0.5, r3(v))); });
    set('mOut', v => { m.out = Math.max(+m.in + 0.5, Math.min(+m.src_len || v, r3(v))); });
    set('mFi', v => { m.fade_in = Math.max(0, v); }); set('mFo', v => { m.fade_out = Math.max(0, v); });
    box.querySelectorAll('[data-nd]').forEach(b => b.onclick = () => { const el = $('#' + b.dataset.nd); el.value = r3(+el.value + +b.dataset.d); el.onchange(); });
    const g = $('#mGain'); g.oninput = () => { $('#mGainV').textContent = Math.round(+g.value * 100) + '%'; }; g.onchange = () => edChange(() => { m.gain = r3(+g.value); });
    $('#mHere').onclick = () => edChange(() => { m.start = r3(ED.t); });
    $('#mDel').onclick = () => edChange(tl => { tl.music = tl.music.filter(y => y.id !== m.id); }, { keepSel: false });
  } else if (sel?.type === 'sub') {
    const x = L.subs.find(y => y.s.id === sel.id); if (!x) { ED.sel = null; return edInspector(); }
    const s = x.s;
    box.innerHTML = `<b>자막</b>
      <textarea id="sText" style="min-height:70px;font-family:inherit;margin-top:6px">${esc(s.text)}</textarea>
      <div class="ed-grid2"><div><label>시작 ${fmtT(x.start)}</label>${num('sS', 0, 0.1)}</div><div><label>끝 ${fmtT(x.end)}</label>${num('sE', 0, 0.1)}</div></div>
      <p class="quiet" style="margin:4px 0">± 버튼으로 0.1초씩 옮깁니다. 컷에 붙은 자막은 컷을 옮기면 함께 움직입니다.</p>
      <div class="row" style="margin-top:8px"><button class="btn small" id="sHere">재생 위치에서 시작</button><button class="btn small danger" id="sDel" style="margin-left:auto">자막 빼기</button></div>`;
    $('#sText').onchange = e => edChange(() => { s.text = e.target.value; });
    const shift = (k, d) => edChange(() => { if (s.clip_id) { s[k === 'start' ? 'rs' : 're'] = r3(Math.max(0, (+s[k === 'start' ? 'rs' : 're'] || 0) + d)); } else { s[k] = r3(Math.max(0, (+s[k] || 0) + d)); } });
    box.querySelectorAll('[data-nd]').forEach(b => b.onclick = () => shift(b.dataset.nd === 'sS' ? 'start' : 'end', +b.dataset.d));
    $('#sHere').onclick = () => edChange(() => { const len = x.end - x.start; const owner = s.clip_id && L.pos[s.clip_id];
      if (owner) { s.rs = r3(Math.max(0, ED.t - owner.start)); s.re = r3(s.rs + len); } else { s.start = r3(ED.t); s.end = r3(ED.t + len); } });
    $('#sDel').onclick = () => edChange(tl => { tl.subs = tl.subs.filter(y => y.id !== s.id); }, { keepSel: false });
  } else {
    const st = ED.tl.settings;
    const unp = L.clips.filter(x => takeOf(x.c).verdict !== 'pass').length;
    box.innerHTML = `<b>${ED.ep.number}화 「${esc(ED.ep.title || '')}」</b>
      <div class="ed-stats"><div><b>${L.clips.length}</b><span>컷</span></div><div><b>${fmtT(L.total)}</b><span>길이</span></div>
        <div><b>${L.subs.length}</b><span>자막</span></div><div><b>${ED.tl.music.length}</b><span>음악</span></div></div>
      ${unp ? `<div class="msg" style="background:rgba(183,121,31,.12);color:var(--warn)">감수 통과 전 컷 ${unp}개가 들어 있습니다(주황 테두리).</div>` : ''}
      <label class="ed-chk" style="margin-top:10px"><input type="checkbox" id="sBurn" ${st.burn_subs ? 'checked' : ''}> 완성본에 자막을 화면에 새기기</label>
      <p class="quiet" style="margin:2px 0 0 22px">끄면 자막은 따로 파일(.srt)로만 나옵니다. 다국어 자막을 바꿔 끼우려면 끄는 것이 좋습니다.</p>
      <h4 style="margin:14px 0 6px">쓰는 법</h4>
      <ol class="ed-help"><li>타임라인에서 <b>컷·대사·음악·자막 막대를 누르면</b> 여기서 자세히 고칩니다.</li>
        <li>컷을 <b>좌우로 끌면</b> 순서가 바뀌고, <b>양 끝을 끌면</b> 잘립니다.</li>
        <li><b>대사 막대를 끌면</b> 대사가 화면보다 먼저/나중에 나옵니다(감정 연결에 쓰는 기법).</li>
        <li>말로 시키려면 위의 <b>말로 편집</b> 칸에 적으세요.</li>
        <li>다 됐으면 아래 <b>정확한 미리보기</b>로 확인하고 <b>완성본 내보내기</b>.</li></ol>`;
    $('#sBurn').onchange = e => edChange(tl => { tl.settings.burn_subs = e.target.checked; });
  }
}
const edOffLabel = v => Math.abs(v) < 0.01 ? '화면과 같이' : v < 0 ? `${Math.abs(v).toFixed(2)}초 먼저` : `${v.toFixed(2)}초 나중`;

// ---------------- 타임라인 조작(끌기·자르기·선택)
function edBind() {
  $('#eIns') && ($('#eIns').onclick = edInsertMissing);
  $('#ePlay').onclick = () => ED.playing ? edPause() : edPlay();
  $('#ePrev').onclick = () => { const xs = ED.L.clips; const cur = xs.findLast(x => x.start < ED.t - 0.3); edSeek(cur ? cur.start : 0); };
  $('#eNext').onclick = () => { const nx = ED.L.clips.find(x => x.start > ED.t + 0.01); if (nx) edSeek(nx.start); };
  $('#eShowSub').onchange = e => { ED.showSub = e.target.checked; edSyncSub(); };
  $('#eZoom').oninput = e => { ED.pps = +e.target.value; ED.ppsSet = true; edRender(); };
  $('#eFit').onclick = () => { ED.ppsSet = false; edRender(); };
  $('#eSplit').onclick = edSplit;
  $('#eAddSub').onclick = () => edChange(tl => { const s = { id: rid('s'), start: r3(ED.t), end: r3(ED.t + 2), text: '새 자막' }; tl.subs.push(s); ED.sel = { type: 'sub', id: s.id }; });
  $('#eReSub').onclick = () => { if (!confirm('지금 자막을 모두 지우고 컷의 대사로 다시 만들까요?')) return;
    edChange(tl => { tl.subs = []; for (const x of edLayout(tl).clips) tl.subs.push(...subsFromDialogue(x.c.id, cutOf(x.c).dialogue, x.dur)); }); };
  $('#eTone').onclick = guard(async () => {
    const box = $('#eToneBox'); if (box.innerHTML) { box.innerHTML = ''; return; }
    const rows = await q(S.sb.from('bible_entries').select('id,name,appears,bible_versions(description,details,prompt_en,status)').eq('series_id', S.seriesId).eq('category', 'music'))
      .catch(() => q(S.sb.from('bible_entries').select('id,name,appears,bible_versions(description,details,status)').eq('series_id', S.seriesId).eq('category', 'music')));
    const gs = await q(S.sb.from('app_settings').select('value').eq('key', 'generation').maybeSingle()).catch(() => null);
    const tool = gs?.value?.music_tool || 'elevenlabs';
    const secs = Math.max(10, Math.min(300, Math.round(ED.L?.total || 60)));

  $('#eRebuild').onclick = () => { if (!confirm('지금 타임라인을 지우고 통과한 컷으로 처음부터 다시 구성할까요? (되돌리기 가능)')) return;
    const b = edBuild(true); edChange(tl => { tl.clips = b.clips; tl.subs = b.subs; }, { keepSel: false }); };
  $('#eMusic').onchange = guard(async e => {
    const f = e.target.files[0]; if (!f) return;

    const { error } = await S.sb.storage.from('takes').upload(path, f, { contentType: f.type || 'audio/mpeg' }); if (error) throw error;
    const len = await new Promise(res => { const a = new Audio(); a.preload = 'metadata'; a.onloadedmetadata = () => res(a.duration || 30); a.onerror = () => res(30); a.src = URL.createObjectURL(f); });
    await edSign(); const { data } = await S.sb.storage.from('takes').createSignedUrl(path, 6 * 3600); if (data?.signedUrl) ED.urls[path] = data.signedUrl;
    const m = { id: rid('m'), path, name: f.name.replace(/\.[^.]+$/, '').slice(0, 30), start: r3(ED.t), in: 0, out: r3(Math.min(len, Math.max(1, ED.L.total - ED.t) + 0)), src_len: r3(len), gain: 0.4, fade_in: 1, fade_out: 2 };

  const ask = guard(async (spoken) => {
    if (S.tab !== 'edit' || !$('#eAsk')) return;

    const local = edLocalCommand(text);
    if (local) { $('#eAsk').value = ''; $('#eAskRes').innerHTML = `▶ ${esc(local)}`; return; }
    await edSave();
    if (!ED.proj) return toast('먼저 타임라인을 만드세요');
    const r = await q(S.sb.from('pipeline_tasks').insert({ kind: 'edit_command', episode_id: ED.ep.id, payload: { project_id: ED.proj.id, text } }).select('id').single());
    $('#eAsk').value = ''; $('#eAskRes').innerHTML = '<span class="spin"></span>편집 보조가 읽는 중… (보통 10~20초)';

  const scroll = $('#eScroll'), canvas = $('#eCanvas');
  const toSec = ev => (ev.clientX - canvas.getBoundingClientRect().left) / ED.pps;
  canvas.onpointerdown = ev => {
    const el = ev.target.closest('[data-clip],[data-voice],[data-music],[data-sub],[data-gap]');
    const trim = ev.target.dataset.trim;
    if (!el) { edSeek(Math.max(0, Math.min(ED.L.total, toSec(ev)))); return; }
    ev.preventDefault();
    const kind = el.dataset.clip ? 'clip' : el.dataset.voice ? 'voice' : el.dataset.music ? 'music' : el.dataset.sub ? 'sub' : 'gap';
    const id = el.dataset.clip || el.dataset.voice || el.dataset.music || el.dataset.sub || el.dataset.gap;
    ED.sel = { type: kind === 'voice' || kind === 'gap' ? 'clip' : kind, id };
    const x0 = ev.clientX, snap = JSON.stringify(ED.tl); let moved = false;
    const tl = ED.tl, L = ED.L;
    const c = tl.clips.find(y => y.id === id), m = tl.music.find(y => y.id === id), s = tl.subs.find(y => y.id === id);
    const orig = JSON.parse(JSON.stringify(c || m || s || {}));
    const ghost = kind === 'clip' && !trim ? el : null;
    // 끌기는 다시 그려지지 않는 캔버스가 잡는다: 막대(el)는 끄는 중 다시 그려져 사라지므로 거기에 잡으면 첫 칸만 움직이고 저장도 안 됐다
    canvas.setPointerCapture(ev.pointerId);
    canvas.onpointermove = e2 => {
      const dx = (e2.clientX - x0) / ED.pps; if (Math.abs(e2.clientX - x0) > 3) moved = true; if (!moved) return;
      if (kind === 'clip' && trim === 'in') { c.in = r3(Math.max(0, Math.min(+orig.out - 0.3, +orig.in + dx))); }
      else if (kind === 'clip' && trim === 'out') { c.out = r3(Math.min(+orig.src_len || 999, Math.max(+orig.in + 0.3, +orig.out + dx))); }
      else if (kind === 'clip') { ghost.style.transform = `translateX(${e2.clientX - x0}px)`; ghost.classList.add('drag'); return; }
      else if (kind === 'voice') { c.voice_offset = r3(Math.max(-3, Math.min(3, Math.round(((+orig.voice_offset || 0) + dx) * 20) / 20))); }
      else if (kind === 'gap') { c.gap = r3(Math.max(0, Math.min(10, (+orig.gap || 0) - dx))); }
      else if (kind === 'music' && trim === 'in') { const d = Math.max(-orig.in, Math.min(+orig.out - +orig.in - 0.5, dx)); m.in = r3(+orig.in + d); m.start = r3(Math.max(0, +orig.start + d)); }
      else if (kind === 'music' && trim === 'out') { m.out = r3(Math.min(+orig.src_len || 9999, Math.max(+orig.in + 0.5, +orig.out + dx))); }
      else if (kind === 'music') { m.start = r3(Math.max(0, +orig.start + dx)); }
      else if (kind === 'sub') {
        const a = s.clip_id ? 'rs' : 'start', b = s.clip_id ? 're' : 'end';
        if (trim === 'in') s[a] = r3(Math.max(0, Math.min(+orig[b] - 0.3, +orig[a] + dx)));
        else if (trim === 'out') s[b] = r3(Math.max(+orig[a] + 0.3, +orig[b] + dx));
        else { const d = Math.max(-orig[a], dx); s[a] = r3(+orig[a] + d); s[b] = r3(+orig[b] + d); }

    canvas.onpointerup = canvas.onpointercancel = e2 => {
      canvas.onpointermove = canvas.onpointerup = canvas.onpointercancel = null;
      try { canvas.releasePointerCapture(e2.pointerId); } catch {}
      if (!moved) { edLiveTracks(); edInspector(); return; }
      if (kind === 'clip' && !trim) {
        const at = toSec(e2); const others = L.clips.filter(y => y.c.id !== id);
        let idx = others.findIndex(y => at < y.start + y.dur / 2); if (idx < 0) idx = others.length;
        const from = tl.clips.indexOf(c); tl.clips.splice(from, 1);
        const before = others[idx]?.c; const to = before ? tl.clips.indexOf(before) : tl.clips.length;
        tl.clips.splice(to, 0, c);
      }
      ED.hist.push(snap); ED.fut = []; edRefresh(); edQueueSave();
    };
  };
  scroll.scrollLeft = ED.scrollLeft || 0; scroll.onscroll = () => { ED.scrollLeft = scroll.scrollLeft; };
}
function edLiveTracks() {
  const L = edLayout(); ED.L = L; const cv = $('#eCanvas'); if (!cv) return;
  cv.querySelector('[data-track="video"]').innerHTML = L.clips.map(x => edClipBlock(x)).join('');
  cv.querySelector('[data-track="voice"]').innerHTML = L.clips.map(x => edVoiceBlock(x)).join('');
  cv.querySelector('[data-track="music"]').innerHTML = ED.tl.music.map(m => edMusicBlock(m)).join('');
  cv.querySelector('[data-track="subs"]').innerHTML = L.subs.map(x => edSubBlock(x)).join('');
}
function edSplit() {
  const x = ED.L.clips.find(y => ED.t > y.start + 0.15 && ED.t < y.start + y.dur - 0.15);
  if (!x) return toast('재생 위치를 나눌 컷 가운데에 두세요');
  const at = r3(+x.c.in + (ED.t - x.start));
  edChange(tl => {
    const c = tl.clips.find(y => y.id === x.c.id); const n = { ...c, id: rid('c'), in: at, gap: 0 }; c.out = at;
    tl.clips.splice(tl.clips.indexOf(c) + 1, 0, n);
    for (const s of tl.subs.filter(s => s.clip_id === c.id)) { const cut = at - +c.in;
      if (+s.rs >= cut) { s.clip_id = n.id; s.rs = r3(+s.rs - cut); s.re = r3(+s.re - cut); } }
    ED.sel = { type: 'clip', id: n.id };
  });
}
function edDelete() {
  const sel = ED.sel; if (!sel) return;
  if (sel.type === 'clip') edChange(tl => { tl.clips = tl.clips.filter(y => y.id !== sel.id); tl.subs = tl.subs.filter(s => s.clip_id !== sel.id); }, { keepSel: false });
  else if (sel.type === 'music') edChange(tl => { tl.music = tl.music.filter(y => y.id !== sel.id); }, { keepSel: false });
  else if (sel.type === 'sub') edChange(tl => { tl.subs = tl.subs.filter(y => y.id !== sel.id); }, { keepSel: false });
}

// ---------------- 빠른 재생(컷 미리보기 파일을 이어서 재생)
const edMusicEls = {};
function edSeek(t, keepPlay = true) {
  ED.t = Math.max(0, Math.min(ED.L?.total || 0, t));
  const was = ED.playing; if (!keepPlay && was) edPause();
  edShowFrame();
  edUiTime();
  if (was && keepPlay) edPlay(ED.stopAt);
}
function edAt(t) { return ED.L.clips.find(x => t >= x.start - 0.0005 && t < x.start + x.dur - 0.02); }
function edShowFrame() {
  const v = $('#eVid'); if (!v) return;
  const x = edAt(ED.t);
  $('#eBlack').hidden = !!x;
  if (!x) { v.style.visibility = 'hidden'; v.pause(); edSyncSub(); return; }
  v.style.visibility = 'visible';
  const url = ED.urls[takeOf(x.c).files?.preview];
  if (!url) { $('#eBlack').hidden = false; $('#eBlack').textContent = '미리보기 파일 없음'; return; }
  if (v.dataset.src !== url) { v.src = url; v.dataset.src = url; }
  const pos = +x.c.in + (ED.t - x.start);
  const apply = () => { try { v.currentTime = pos; } catch {} };
  if (v.readyState >= 1) apply(); else v.onloadedmetadata = apply;
  v.volume = Math.min(1, x.c.voice_gain ?? 1); v.muted = ED.mode === 'music';
  edSyncSub();
}
function edSyncSub() {
  const el = $('#eSub'); if (!el) return;
  const s = ED.showSub === false ? null : ED.L.subs.find(x => ED.t >= x.start && ED.t < x.end);
  el.textContent = s ? s.s.text : ''; el.style.display = s ? '' : 'none';
}
function edUiTime() {
  const h = $('#eHead'); if (h) h.style.left = ED.t * ED.pps + 'px';
  const tm = $('#eTime'); if (tm) tm.textContent = `${fmtT(ED.t)} / ${fmtT(ED.L.total)}`;
  const sc = $('#eScroll'); if (sc && ED.playing) { const px = ED.t * ED.pps; if (px < sc.scrollLeft || px > sc.scrollLeft + sc.clientWidth - 40) sc.scrollLeft = px - 60; }
}
function edPlay(stopAt) {
  if (!ED.L.clips.length) return;
  if (ED.t >= ED.L.total - 0.05) ED.t = 0;
  ED.playing = true; ED.stopAt = stopAt; $('#ePlay').textContent = '❚❚';
  const v = $('#eVid'); edShowFrame();
  let last = performance.now();
  const tick = now => {
    if (!ED.playing) return;
    const x = edAt(ED.t);
    if (x && !v.paused && v.dataset.src) {
      const t = x.start + (v.currentTime - +x.c.in);
      ED.t = t;
      if (v.currentTime >= +x.c.out - 0.03) { ED.t = x.start + x.dur + 0.001; edShowFrame(); if (edAt(ED.t)) v.play().catch(() => {}); }
    } else if (!x) { ED.t += (now - last) / 1000; const nx = edAt(ED.t); if (nx) { edShowFrame(); v.play().catch(() => {}); } }
    else if (v.paused && x) { v.play().catch(() => {}); }
    last = now;
    edMusicSync(); edSyncSub(); edUiTime();
    if (ED.t >= (ED.stopAt ?? ED.L.total) - 0.02) { edPause(); return; }
    ED.raf = requestAnimationFrame(tick);
  };
  if (edAt(ED.t)) v.play().catch(() => {});
  ED.raf = requestAnimationFrame(tick);
}
function edPause() {
  ED.playing = false; cancelAnimationFrame(ED.raf);
  const v = $('#eVid'); if (v) v.pause(); const p = $('#ePlay'); if (p) p.textContent = '▶';
  Object.values(edMusicEls).forEach(a => a.pause());
}
function edMusicSync() {
  for (const m of ED.tl.music) {
    const url = ED.urls[m.path]; if (!url) continue;
    const a = edMusicEls[m.id] || (edMusicEls[m.id] = Object.assign(new Audio(url), { preload: 'auto' }));
    const rel = ED.t - (+m.start || 0), dur = (+m.out || 0) - (+m.in || 0);
    if (ED.playing && rel >= 0 && rel < dur && ED.mode !== 'voice') {
      a.volume = Math.min(1, ED.mode === 'music' ? Math.max(0.6, m.gain ?? 0.6) : (m.gain ?? 0.6));
      const want = (+m.in || 0) + rel;
      if (Math.abs(a.currentTime - want) > 0.35) a.currentTime = want;
      if (a.paused) a.play().catch(() => {});
    } else if (!a.paused) a.pause();
  }
}
function edStop() { edPause(); clearInterval(ED.pollTimer); ED.pollTimer = null; edMicOff(); }

// 듣기 방식: 전체 / 대사만 / 음악만 (빠른 재생과 결과물 플레이어 모두)
function edSetMode(mode) {
  ED.mode = mode;
  document.querySelectorAll('#eMode [data-mode], #eRMode [data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  const v = $('#eVid'); if (v) v.muted = mode === 'music';
  edMusicSync(); edResultMode();
}

// 말로 재생 (비용 없음, 화면에서 바로): 재생·멈춤·대사만·음악만·씬/컷/초로 이동
function edLocalCommand(text) {
  const t = text.replace(/\s+/g, ' ');
  const edit = /(빼|줄여|줄이|늘려|늘리|잘라|자르|옮겨|옮기|넣어|넣고|바꿔|바꾸|키워|낮춰|올려|크게|작게|페이드|정적|순서|지워|삭제|추가|맞춰|당겨|밀어)/.test(t);
  const stop = /(멈춰|멈춤|정지|스톱|그만|일시\s*정지)/.test(t);
  const play = /(재생|틀어|들려|들어|보여|플레이|play|시작)/i.test(t);
  const mode = /대사\s*만|목소리\s*만/.test(t) ? 'voice' : /(배경\s*)?음악\s*만|bgm\s*만/i.test(t) ? 'music' : /(전체|다\s*같이|모두\s*같이|원래대로|섞어서)/.test(t) ? 'full' : null;
  if (edit && !stop) return null;
  if (!stop && !play && !mode) return null;
  const target = /(미리\s*보기|완성본|결과물)/.test(t) ? 'result' : 'timeline';
  if (stop) { edPause(); const rv = $('#eRVid'); if (rv) rv.pause(); return '멈췄습니다'; }
  const done = [];
  if (mode) { edSetMode(mode); done.push({ full: '전체 소리', voice: '대사만', music: '음악만' }[mode]); }
  if (target === 'result') {
    const rv = $('#eRVid'); if (!rv) return '아직 결과물이 없습니다';
    rv.currentTime = 0; rv.play().catch(() => {}); edResultMode(); return `결과물 ${done.join(' ')} 재생`;
  }
  let at = null;
  const sm = t.match(/S\s*0*(\d{1,3})|(\d{1,3})\s*(번\s*)?씬/i), cm = t.match(/C\s*0*(\d{1,3})|(\d{1,3})\s*(번째\s*)?컷/i), secm = t.match(/(\d+(?:\.\d+)?)\s*초/);
  const xs = ED.L.clips;
  if (sm || cm) {
    const sc = sm ? +(sm[1] || sm[2]) : null, cn = cm ? +(cm[1] || cm[2]) : null;
    let x = null;
    if (sc != null && cn != null) x = xs.find(y => cutOf(y.c).scene_no === sc && cutOf(y.c).cut_no === cn);
    else if (sc != null) x = xs.find(y => cutOf(y.c).scene_no === sc);
    else if (/번째/.test(t)) x = xs[cn - 1];
    else x = xs.find(y => cutOf(y.c).cut_no === cn && cutOf(y.c).scene_no === cutOf((edAt(ED.t) || xs[0]).c).scene_no) || xs[cn - 1];
    if (!x) return `${sm ? 'S' + (sm[1] || sm[2]) : ''}${cm ? ' C' + (cm[1] || cm[2]) : ''}을(를) 타임라인에서 찾지 못했습니다`;
    at = x.start; done.unshift(`${clipCode(x.c)}부터`);
    if (cn != null && /(만|하나만|그\s*컷만)/.test(t.replace(/대사\s*만|음악\s*만/g, ''))) { edSeek(at); edPlay(x.start + x.dur); return `${clipCode(x.c)}만 ${done.slice(1).join(' ')} 재생`; }
  } else if (/처음/.test(t)) { at = 0; done.unshift('처음부터'); }
  else if (secm) { at = +secm[1]; done.unshift(`${secm[1]}초부터`); }
  if (at != null) edSeek(at);
  if (play || at != null || mode) { if (!ED.playing) edPlay(); }
  return `${done.join(' ')} 재생`.trim();
}

const AD_M = [['impressions', '노출'], ['views', '조회'], ['clicks', '클릭'], ['subs', '구독'], ['watch_hours', '시청 시간(시간)'], ['avg_view_pct', '평균 시청 비율(%)'], ['next_ep_rate', '다음 화 이동(%)'], ['revenue_krw', '광고 수익(원)']];
const n0 = v => +v || 0;
const pct = v => v == null || !isFinite(v) ? '-' : (v * 100).toFixed(1) + '%';
const num = v => v == null || !isFinite(v) ? '-' : Math.round(v).toLocaleString('ko-KR');

function adAgg(runs) {
  const a = { runs: runs.length, spend: 0, impressions: 0, views: 0, clicks: 0, subs: 0, watch_hours: 0, revenue: 0, vpct_w: 0, next_w: 0, first: null, last: null, pviews: 0, psubs: 0, pimp: 0, pclicks: 0, rviews: 0, vv: 0, nv: 0 };
  for (const r of runs) {
    const m = r.metrics || {};
    a.spend += n0(r.spend_krw); a.impressions += n0(m.impressions); a.views += n0(m.views); a.clicks += n0(m.clicks); a.subs += n0(m.subs);
    a.watch_hours += n0(m.watch_hours); a.revenue += n0(m.revenue_krw);
    if (m.avg_view_pct != null) { a.vpct_w += n0(m.avg_view_pct) * n0(m.views); a.vv += n0(m.views); }
    if (m.next_ep_rate != null) { a.next_w += n0(m.next_ep_rate) * n0(m.views); a.nv += n0(m.views); }
    if (n0(r.spend_krw) > 0) { a.pviews += n0(m.views); a.psubs += n0(m.subs); a.pimp += n0(m.impressions); a.pclicks += n0(m.clicks); }
    if (n0(m.revenue_krw) > 0) a.rviews += n0(m.views);
    if (r.started_at && (!a.first || r.started_at < a.first)) a.first = r.started_at;
    const e = r.ended_at || r.started_at; if (e && (!a.last || e > a.last)) a.last = e;
  }
  // 비용 지표는 돈을 쓴 집행만, 수익 지표는 수익이 난 집행만으로 계산
  a.cpv = a.pviews ? a.spend / a.pviews : null; a.cps = a.psubs ? a.spend / a.psubs : null;
  a.ctr = a.pimp ? a.pclicks / a.pimp : null; a.rpm = a.rviews && a.revenue ? a.revenue / a.rviews * 1000 : null;
  a.avg_view = a.vv ? a.vpct_w / a.vv / 100 : null; a.next_ep = a.nv ? a.next_w / a.nv / 100 : null;
  a.roas = a.spend && a.revenue ? a.revenue / a.spend : null;
  return a;
}
// 비교 기준: 수익 집행만 있으면 1,000회당 수익(높을수록), 구독이 있으면 구독당 비용(낮을수록), 아니면 조회당 비용(낮을수록)
function adKey(a) {
  if (a.rpm != null && !a.spend) return { k: 'rpm', v: a.rpm, better: 'high', label: '1,000회당 수익' };
  if (a.cps != null) return { k: 'cps', v: a.cps, better: 'low', label: '구독당 비용' };
  if (a.cpv != null) return { k: 'cpv', v: a.cpv, better: 'low', label: '조회당 비용' };
  return null;
}
function adWinRates(contents, runsBy) {
  const keys = Object.fromEntries(contents.map(c => [c.id, adKey(adAgg(runsBy[c.id] || []))]));
  const out = {};
  for (const c of contents) {
    const me = keys[c.id]; if (!me) { out[c.id] = null; continue; }
    let w = 0, l = 0;
    for (const o of contents) {
      const ot = keys[o.id]; if (o.id === c.id || !ot || ot.k !== me.k) continue;
      if (me.v === ot.v) continue;
      ((me.better === 'low' ? me.v < ot.v : me.v > ot.v) ? w++ : l++);
    }
    out[c.id] = w + l ? { w, l, rate: w / (w + l), key: me } : { w: 0, l: 0, rate: null, key: me };
  }
  return out;
}
const adKeyText = k => !k ? '-' : k.k === 'rpm' ? won(k.v) : won(k.v);

async function viewAds(main) {
  const series = await q(S.sb.from('series').select('id,title').order('created_at'));
  if (!S.seriesId || !series.some(s => s.id === S.seriesId)) S.seriesId = series[0]?.id || null;

  const [episodes, contents, settings] = await Promise.all([
    q(S.sb.from('episodes').select('id,number,title').eq('series_id', S.seriesId).order('number')),
    q(S.sb.from('ad_contents').select('*').eq('series_id', S.seriesId).order('created_at')),

  const runsBy = {}; runs.forEach(r => (runsBy[r.content_id] = runsBy[r.content_id] || []).push(r));
  const all = adAgg(runs), wins = adWinRates(contents, runsBy);
  const epOf = id => episodes.find(e => e.id === id);
  // 스토리(화) 순서대로
  const order = c => (epOf(c.episode_id)?.number ?? 9999) * 1e13 + new Date(c.created_at).getTime() / 1000;
  const sorted = [...contents].sort((a, b) => order(a) - order(b));
  const groups = []; for (const c of sorted) { const k = c.episode_id || 'all'; let g = groups.find(x => x.k === k); if (!g) groups.push(g = { k, ep: epOf(c.episode_id), items: [] }); g.items.push(c); }
  const best = sorted.filter(c => wins[c.id]?.rate != null).sort((a, b) => wins[b.id].rate - wins[a.id].rate)[0];
  if (!S.adSel || !contents.some(c => c.id === S.adSel)) S.adSel = sorted[0]?.id || null;
  const budget = settings?.value?.monthly_budget_krw || 0;

  main.innerHTML = `
  <div class="row" style="margin-bottom:10px"><h2 style="margin:0 12px 0 0">광고</h2>
    <select id="aSer" style="width:auto">${series.map(s => `<option value="${esc(s.id)}" ${s.id === S.seriesId ? 'selected' : ''}>${esc(s.title)}</option>`).join('')}</select>
    <span class="quiet" style="margin-left:auto">월 광고 한도 ${budget ? won(budget) : '0원(광고비 제안 안 함)'} · <a href="#settings" id="aSet">바꾸기</a></span>
    <button class="btn primary small" id="aNew">+ 광고 콘텐츠</button></div>
  <div class="grid ad-sum">
    <div class="card stat"><div class="n">${won(all.spend)}</div><div class="l">누적 광고비 · ${all.runs}회 집행</div></div>
    <div class="card stat"><div class="n">${num(all.subs)}</div><div class="l">광고로 얻은 구독 · 구독당 ${all.cps != null ? won(all.cps) : '-'}</div></div>
    <div class="card stat"><div class="n">${num(all.views)}</div><div class="l">조회 · 조회당 ${all.cpv != null ? won(all.cpv) : '-'} · 평균 시청 ${pct(all.avg_view)}</div></div>
    <div class="card stat"><div class="n">${won(all.revenue)}</div><div class="l">광고 수익 ${all.roas != null ? `· 광고비 대비 ${all.roas.toFixed(2)}배` : ''}</div></div>
    <div class="card stat"><div class="n" style="font-size:18px">${best ? esc(best.title) : '-'}</div><div class="l">${best ? `승률 1위 · ${Math.round(wins[best.id].rate * 100)}% (${wins[best.id].w}승 ${wins[best.id].l}패)` : '승률은 집행 기록이 2개 이상 쌓이면 나옵니다'}</div></div>
  </div>
  ${contents.length ? `<div class="split ad-split">
    <div class="card ad-list">${groups.map(g => `<div class="ad-grp">${g.ep ? `${g.ep.number}화 「${esc(g.ep.title || '')}」` : '시리즈 전체'}</div>
      ${g.items.map(c => { const a = adAgg(runsBy[c.id] || []), wr = wins[c.id], k = adKey(a);
        return `<div class="ad-item ${c.id === S.adSel ? 'on' : ''}" data-ad="${c.id}">
          <div class="row" style="gap:6px"><b>${esc(c.title)}</b></div>
          <div class="row" style="gap:6px;margin-top:3px">${pill(AD_KIND[c.kind] || c.kind)}${pill(...(AD_STATUS[c.status] || [c.status, '']))}
            ${wr?.rate != null ? pill(`승률 ${Math.round(wr.rate * 100)}%`, wr.rate >= 0.5 ? 'good' : 'bad') : ''}</div>
          <div class="quiet" style="margin-top:3px">${a.runs ? `${a.runs}회 · ${won(a.spend)}${k ? ` · ${k.label} ${adKeyText(k)}` : ''}` : '아직 집행 안 함'}</div></div>`; }).join('')}`).join('')}</div>
    <div id="adDetail"></div></div>`
  : `<div class="card ad-emptyc"><h3 style="margin-top:0">아직 광고 콘텐츠가 없습니다</h3>
      <p>쇼츠, 갈고리 장면, 예고편, 몰아보기(합본)처럼 <b>광고나 홍보에 쓰는 영상</b>을 여기서 시리즈·화별로 관리합니다.
      유튜브·Google Ads를 연결하면 광고 담당이 만들고 결과를 자동으로 기록하고, 지금은 <b>+ 광고 콘텐츠</b>로 직접 넣을 수 있습니다.</p></div>`}
  <div id="adForm"></div>`;
  $('#aSer').onchange = e => { S.seriesId = e.target.value; S.adSel = null; go('ads'); };
  $('#aSet').onclick = e => { e.preventDefault(); go('settings'); };
  $('#aNew').onclick = () => adContentForm(episodes);
  main.querySelectorAll('[data-ad]').forEach(el => el.onclick = () => { S.adSel = el.dataset.ad; main.querySelectorAll('.ad-item').forEach(x => x.classList.toggle('on', x === el)); adDetail(); });
  const ctx = { sorted, runsBy, wins, episodes, epOf };
  S.adCtx = ctx;
  adDetail();
}

function adDetail() {
  const box = $('#adDetail'); if (!box) return;
  const { sorted, runsBy, wins, episodes, epOf } = S.adCtx;
  const c = sorted.find(x => x.id === S.adSel); if (!c) { box.innerHTML = ''; return; }
  const runs = runsBy[c.id] || [], a = adAgg(runs), k = adKey(a), wr = wins[c.id];
  const i = sorted.indexOf(c), prev = sorted[i - 1], next = sorted[i + 1];
  const cmpRow = (label, f, fmtv, better) => {
    const me = f(a), cell = o => { if (!o) return '<td class="quiet">-</td>'; const v = f(adAgg(runsBy[o.id] || []));
      if (v == null || me == null) return `<td>${fmtv(v)}</td>`;
      const good = better === 'low' ? me < v : me > v; return `<td>${fmtv(v)} <span class="${me === v ? 'quiet' : good ? 'up' : 'down'}">${me === v ? '=' : good ? '▲ 이쪽이 나음' : '▼'}</span></td>`; };
    return `<tr><td>${label}</td><td><b>${fmtv(me)}</b></td>${cell(prev)}${cell(next)}</tr>`;
  };
  const place = {}; runs.filter(r => r.placement && AD_PLACE[r.placement]).forEach(r => (place[r.placement] = place[r.placement] || []).push(r));
  const rank = sorted.filter(o => wins[o.id]?.rate != null && wins[o.id].key.k === k?.k).sort((x, y) => wins[y.id].rate - wins[x.id].rate);
  const delta = (cur, prv, key, better) => { if (cur == null || prv == null || !prv) return ''; const d = (cur - prv) / prv; const good = better === 'low' ? d < 0 : d > 0;
    return ` <span class="${good ? 'up' : 'down'}">${d > 0 ? '+' : ''}${(d * 100).toFixed(0)}%</span>`; };
  box.innerHTML = `<div class="card">
    <div class="row"><h3 style="margin:0">${esc(c.title)}</h3>${pill(AD_KIND[c.kind] || c.kind)}
      <select id="adStat" style="width:auto;margin-left:auto">${Object.entries(AD_STATUS).map(([s, [l]]) => `<option value="${s}" ${s === c.status ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="quiet" style="margin-top:4px">${epOf(c.episode_id) ? `${epOf(c.episode_id).number}화에서` : '시리즈 전체'} · ${esc(c.created_by || '대표')} · ${fmt(c.created_at)}${c.media?.youtube_id ? ` · <a href="https://youtu.be/${esc(c.media.youtube_id)}" target="_blank">유튜브에서 보기</a>` : ''}</div>
    ${c.description ? `<div class="bdesc">${esc(c.description)}</div>` : ''}

    <h4 class="ad-h">누적 성과 ${a.first ? `<span class="quiet">${a.first} ~ ${a.last || ''}</span>` : ''}</h4>
    ${a.runs ? `<div class="ad-kpis">
      <div><b>${won(a.spend)}</b><span>광고비 (${a.runs}회)</span></div>
      <div><b>${num(a.views)}</b><span>조회 · ${a.cpv != null ? won(a.cpv) : '-'}/회</span></div>
      <div><b>${num(a.subs)}</b><span>구독 · ${a.cps != null ? won(a.cps) : '-'}/명</span></div>
      <div><b>${pct(a.ctr)}</b><span>클릭률</span></div>
      <div><b>${pct(a.avg_view)}</b><span>평균 시청 비율</span></div>
      <div><b>${pct(a.next_ep)}</b><span>다음 화 이동</span></div>
      <div><b>${won(a.revenue)}</b><span>수익 ${a.rpm != null ? `· 1,000회당 ${won(a.rpm)}` : ''}</span></div>
      <div><b>${wr?.rate != null ? Math.round(wr.rate * 100) + '%' : '-'}</b><span>승률 ${wr?.rate != null ? `(${wr.w}승 ${wr.l}패)` : ''}</span></div>
    </div>` : '<p class="quiet">아직 집행 기록이 없습니다. 아래 "+ 집행 기록"으로 넣거나, 광고 연결 후 자동으로 쌓입니다.</p>'}

    <h4 class="ad-h">언제, 어떻게 돌렸고 결과는</h4>
    ${runs.length ? `<div class="ad-runs">${runs.map((r, j) => { const m = r.metrics || {}, ra = adAgg([r]), pa = j ? adAgg([runs[j - 1]]) : null;
      return `<div class="ad-run"><div class="row"><b>${esc(r.started_at || '날짜 미정')}${r.ended_at ? ` ~ ${esc(r.ended_at)}` : ''}</b>
        ${pill(AD_PLATFORM[r.platform] || r.platform, r.platform === 'youtube_monetization' ? 'good' : 'accent')}${pill('목표: ' + (AD_OBJ[r.objective] || r.objective))}
        ${r.placement ? pill(AD_FORM[r.placement] || r.placement) : ''}${r.position_sec != null ? pill(fmtT(+r.position_sec) + ' 위치') : ''}
        ${r.source === 'agent' ? '<span class="quiet">광고 담당 기록</span>' : ''}
        <button class="btn small" data-rdel="${r.id}" style="margin-left:auto">삭제</button></div>
        ${r.targeting ? `<div class="quiet">대상: ${esc(r.targeting)}</div>` : ''}
        <div class="ad-mline">광고비 <b>${won(r.spend_krw)}</b>${r.budget_krw ? ` / 예산 ${won(r.budget_krw)}` : ''} · 노출 ${num(m.impressions)} · 조회 ${num(m.views)}
          · 구독 ${num(m.subs)} · 조회당 <b>${ra.cpv != null ? won(ra.cpv) : '-'}</b>${delta(ra.cpv, pa?.cpv, 'cpv', 'low')}
          · 구독당 <b>${ra.cps != null ? won(ra.cps) : '-'}</b>${delta(ra.cps, pa?.cps, 'cps', 'low')}
          ${m.avg_view_pct != null ? ` · 평균 시청 ${m.avg_view_pct}%` : ''}${m.next_ep_rate != null ? ` · 다음 화 ${m.next_ep_rate}%` : ''}${m.revenue_krw ? ` · 수익 ${won(m.revenue_krw)}` : ''}</div>
        ${r.note ? `<div class="quiet">메모: ${esc(r.note)}</div>` : ''}${j ? '<div class="quiet" style="font-size:12px">% 표시는 바로 앞 집행 대비</div>' : ''}</div>`; }).join('')}</div>` : ''}
    <button class="btn small" id="adRunAdd" style="margin-top:8px">+ 집행 기록</button>

    <h4 class="ad-h">앞뒤 콘텐츠와 비교 <span class="quiet">스토리 순서 기준</span></h4>
    <table class="ad-cmp"><tr><th></th><th>이 콘텐츠</th><th>앞: ${prev ? esc(prev.title) : '-'}</th><th>뒤: ${next ? esc(next.title) : '-'}</th></tr>
      ${cmpRow('조회당 비용', x => x.cpv, v => v == null ? '-' : won(v), 'low')}
      ${cmpRow('구독당 비용', x => x.cps, v => v == null ? '-' : won(v), 'low')}
      ${cmpRow('평균 시청 비율', x => x.avg_view, pct, 'high')}
      ${cmpRow('다음 화 이동', x => x.next_ep, pct, 'high')}
      ${cmpRow('1,000회당 수익', x => x.rpm, v => v == null ? '-' : won(v), 'high')}</table>
    ${Object.keys(place).length ? `<h4 class="ad-h">수익 광고 위치별 비교 (앞·중간·뒤)</h4><table class="ad-cmp"><tr><th>위치</th><th>집행</th><th>1,000회당 수익</th><th>평균 시청 비율</th></tr>
      ${['pre', 'mid', 'post'].filter(p => place[p]).map(p => { const pa = adAgg(place[p]); return `<tr><td>${AD_PLACE[p]}</td><td>${place[p].length}회</td><td>${pa.rpm != null ? won(pa.rpm) : '-'}</td><td>${pct(pa.avg_view)}</td></tr>`; }).join('')}</table>` : ''}

    <h4 class="ad-h">다른 콘텐츠와 비교한 승률</h4>
    ${wr?.rate != null ? `<p style="margin:4px 0">기준: <b>${esc(wr.key.label)}</b>(${wr.key.better === 'low' ? '낮을수록' : '높을수록'} 이김). 같은 기준을 가진 다른 콘텐츠 ${wr.w + wr.l}개와 1:1로 비교해 <b>${wr.w}승 ${wr.l}패, 승률 ${Math.round(wr.rate * 100)}%</b>.</p>
      <table class="ad-cmp"><tr><th>순위</th><th>콘텐츠</th><th>${esc(wr.key.label)}</th><th>승률</th></tr>${rank.map((o, r) => `<tr ${o.id === c.id ? 'class="me"' : ''}><td>${r + 1}</td><td>${esc(o.title)}</td><td>${adKeyText(wins[o.id].key)}</td><td>${Math.round(wins[o.id].rate * 100)}%</td></tr>`).join('')}</table>`
      : '<p class="quiet">비교할 집행 기록이 부족합니다. 같은 목표로 집행한 콘텐츠가 2개 이상 생기면 계산됩니다.</p>'}
    <div class="row" style="margin-top:14px"><button class="btn small" id="adEdit">내용 고치기</button><button class="btn small danger" id="adDel" style="margin-left:auto">콘텐츠 삭제</button></div>
  </div>`;
  $('#adStat').onchange = guard(async e => { await q(S.sb.from('ad_contents').update({ status: e.target.value }).eq('id', c.id)); toast('상태를 바꿨습니다'); go('ads'); });
  $('#adRunAdd').onclick = () => adRunForm(c);
  $('#adEdit').onclick = () => adContentForm(episodes, c);
  $('#adDel').onclick = guard(async () => { if (!confirm(`"${c.title}"과 집행 기록을 모두 삭제할까요?`)) return; await q(S.sb.from('ad_contents').delete().eq('id', c.id)); S.adSel = null; go('ads'); });
  box.querySelectorAll('[data-rdel]').forEach(b => b.onclick = guard(async () => { if (!confirm('이 집행 기록을 삭제할까요?')) return; await q(S.sb.from('ad_runs').delete().eq('id', b.dataset.rdel)); go('ads'); }));
}

function adContentForm(episodes, c) {
  const box = $('#adForm'); if (!box) return;
  box.innerHTML = `<div class="card" style="border-color:var(--accent)"><b>${c ? '광고 콘텐츠 고치기' : '새 광고 콘텐츠'}</b>
    <div class="ed-grid2"><div><label>제목</label><input id="fT" value="${esc(c?.title || '')}" placeholder="예: 1화 공항 갈고리 쇼츠"></div>
      <div><label>종류</label><select id="fK">${Object.entries(AD_KIND).map(([k, l]) => `<option value="${k}" ${k === (c?.kind || 'shorts') ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
    <div class="ed-grid2"><div><label>어느 화(스토리)</label><select id="fE"><option value="">시리즈 전체</option>${episodes.map(e => `<option value="${e.id}" ${e.id === c?.episode_id ? 'selected' : ''}>${e.number}화 ${esc(e.title || '')}</option>`).join('')}</select></div>
      <div><label>유튜브 영상 ID (선택)</label><input id="fY" value="${esc(c?.media?.youtube_id || '')}" placeholder="youtu.be/ 뒤의 11자리"></div></div>
    <label>설명 (어떤 장면·어떤 의도인지)</label><textarea id="fD" style="min-height:70px;font-family:inherit">${esc(c?.description || '')}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="fGo">저장</button><button class="btn" id="fX">취소</button></div></div>`;
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('#fX').onclick = () => { box.innerHTML = ''; };
  $('#fGo').onclick = guard(async () => {
    const title = $('#fT').value.trim(); if (!title) return toast('제목을 적어 주세요');
    const row = { title, kind: $('#fK').value, episode_id: $('#fE').value || null, description: $('#fD').value.trim() || null,
      media: { ...(c?.media || {}), youtube_id: $('#fY').value.trim().replace(/.*(?:youtu\.be\/|v=|shorts\/)/, '').slice(0, 11) || undefined } };
    if (c) await q(S.sb.from('ad_contents').update(row).eq('id', c.id));
    else { const r = await q(S.sb.from('ad_contents').insert({ ...row, series_id: S.seriesId, created_by: '대표' }).select('id').single()); S.adSel = r.id; }
    toast('저장했습니다'); go('ads');
  });
}

function adRunForm(c) {
  const box = $('#adForm'); if (!box) return;
  const today = new Date().toISOString().slice(0, 10);
  box.innerHTML = `<div class="card" style="border-color:var(--accent)"><b>집행 기록 추가 · ${esc(c.title)}</b>
    <p class="quiet" style="margin:4px 0">광고를 연결하면 광고 담당이 자동으로 기록합니다. 지금은 광고 관리자·유튜브 스튜디오 숫자를 옮겨 적으면 됩니다. 모르는 칸은 비워 두세요.</p>
    <div class="ed-grid2"><div><label>어디에</label><select id="rP">${Object.entries(AD_PLATFORM).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
      <div><label>목표</label><select id="rO">${Object.entries(AD_OBJ).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div></div>
    <div class="ed-grid2"><div><label>시작일</label><input id="rS" type="date" value="${today}"></div><div><label>종료일</label><input id="rE" type="date"></div></div>
    <div class="ed-grid2"><div><label>광고 형태·위치</label><select id="rPl"><option value="">-</option><option value="pre">앞 광고</option><option value="mid">중간 광고</option><option value="post">뒤 광고</option>
        <option value="instream">인스트림</option><option value="shorts">쇼츠 피드</option><option value="discovery">검색·추천</option></select></div>
      <div><label>중간 광고 위치(초, 수익 광고일 때)</label><input id="rPos" type="number" step="1"></div></div>
    <label>대상 (나라·나이·관심사)</label><input id="rT" placeholder="예: 한국·일본 18-34 · K팝·드라마 관심">
    <div class="ed-grid2"><div><label>예산(원)</label><input id="rB" type="number"></div><div><label>실제 쓴 돈(원)</label><input id="rSp" type="number"></div></div>
    <div class="ad-mform">${AD_M.map(([k, l]) => `<div><label>${l}</label><input data-m="${k}" type="number" step="any"></div>`).join('')}</div>
    <label>메모</label><input id="rN" placeholder="예: 썸네일 B안, 첫 3초 공항 장면">
    <div class="row" style="margin-top:10px"><button class="btn primary" id="rGo">기록</button><button class="btn" id="rX">취소</button></div></div>`;
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('#rX').onclick = () => { box.innerHTML = ''; };
  $('#rGo').onclick = guard(async () => {
    const metrics = {}; box.querySelectorAll('[data-m]').forEach(i => { if (i.value !== '') metrics[i.dataset.m] = +i.value; });
    const v = id => $('#' + id).value.trim();
    await q(S.sb.from('ad_runs').insert({ content_id: c.id, platform: v('rP'), objective: v('rO'), placement: v('rPl') || null, position_sec: v('rPos') ? +v('rPos') : null,
      targeting: v('rT') || null, started_at: v('rS') || null, ended_at: v('rE') || null, budget_krw: v('rB') ? +v('rB') : null, spend_krw: v('rSp') ? +v('rSp') : null,
      metrics, note: v('rN') || null }));
    toast('기록했습니다'); go('ads');
  });
}

<tr><td>스타일·톤</td><td>모든 화 공통 화면 규칙: 색감·조명·렌즈·질감·금지</td><td>따뜻한 시네마틱 색감, 얕은 심도, 화면 글자 금지</td></tr>
<tr><td>목소리</td><td>인물이 아닌 목소리(내레이션 등). 인물 목소리는 캐릭터 카드에서</td><td>예고편 내레이터 — 낮고 차분한 30대 남성</td></tr>
<tr><td>용어집</td><td>이름·호칭·고유명사 표기 기준(자막·번역에서 같게)</td><td>린 = Rin = リン / "아이돌 서바이벌" = "Idol Survival"</td></tr>
<tr><td>배경음악</td><td>화별로 원하는 음악 톤. 적용 화를 정할 수 있음</td><td>1·2화 — 긴장감 있는 저음 피아노, 느린 템포 / 비우면 전체 화</td></tr>
</table>

<h4>③ 카드 읽기와 버튼</h4>
<ul>
<li>카드 = 항목 하나. 지금 적용 중인 버전(v2 등)만 보입니다.<span class="ex">예: "린 v3 · 얼굴 고정됨 · 등장: 1화 S1·S2·S4"</span></li>
<li><b>내용</b> 줄 — 내용 채우기 / 고쳐 쓰기(새 버전) / 이력 / 넣을 곳 추천받기(장소·배경·소품).<span class="ex">예: 고쳐 쓰기에서 "앞머리가 눈썹을 덮음" 추가 → v4</span></li>
<li><b>사진</b> 줄 — 먼저 <b>자동으로 만들기 / 직접 올리기</b>를 고릅니다.<span class="ex">예: 실제 배우 사진이 있으면 직접 올리기 → 사진 올리기</span></li>
<li><b>목소리</b> 줄 — 목소리 디자인(캐릭터·목소리 카드).<span class="ex">예: "밝고 맑은 20대 초반, 약한 태국 억양" → 후보 3개</span></li>
<li><b>동일인</b>(캐릭터) — 같은 사람의 다른 시점·호칭을 연결. 목소리를 물려받고, 사진이 없으면 그 사람 사진을 참고. 외모는 각 카드 묘사.<span class="ex">예: "미래의 남자" → 동일인: 탄</span></li>
<li>버튼을 눌러도 화면이 맨 위로 튀지 않고, 고쳐 쓰기 칸은 그 카드 안에서 열립니다.</li>
</ul>

<h4>④ 묘사는 한글로 적어도 됩니다</h4>
<ul>
<li>적용되는 순간 작가실이 <b>영어 고정 프롬프트</b>로 한 번 옮겨 두고(1~2분), 감독·사진 모델은 그 문장을 그대로 씁니다.<span class="ex">예: "20대 초반 태국계 여성, 어깨 길이 검은 생머리" → "A Thai woman in her early 20s, shoulder-length straight black hair…"</span></li>
<li>카드의 "영어 프롬프트"를 펼치면 확인할 수 있고, 묘사를 고치면 다시 만들어집니다.</li>
<li>사진을 올리면 작가실이 <b>사진을 보고</b> 묘사를 씁니다(묘사 칸을 비워 둬도 됨).<span class="ex">예: 협찬 카페 사진 3장 → "통유리 창, 원목 테이블, 노출 콘크리트 벽…"</span></li>
</ul>

<h4>⑤ 대본에서 찾기 → 모두 적용 → 사진</h4>
<ol>
<li><b>필요한 인물·장소·소품 찾기</b> → 수정안이 올라옵니다.<span class="ex">예: "대본 추출 캐릭터 18건"</span></li>
<li>직접 사진을 넣을 항목은 카드에서 <b>직접 올리기</b>로 바꿔 둡니다.<span class="ex">예: 린·탄은 직접, 나머지는 자동</span></li>
<li><b>대본 추출 모두 적용 + 사진 만들기</b> → '자동' 항목만 후보 생성(인물 Soul 2 실사 4장, 나머지 2장), '직접' 항목은 비워 둠.<span class="ex">예: 18건 적용 · 사진 후보 14건 생성 · 직접 4건 비어 있음</span></li>
<li>비운 채로 제작하면 컷 설계 때 작가실 묘사로 <b>임시 기준 사진 1장</b>을 만들어 모든 컷에 고정합니다. 카드에서 "이 사진으로 확정"하거나 사진을 올려 바꿉니다.<span class="ex">예: "심사위원" 사진이 없음 → 제작 때 임시 사진 → 모든 컷 같은 얼굴</span></li>
<li>수정안이 많으면 지시 탭 <b>적용 대기함</b>에서 한꺼번에 처리할 수도 있습니다.</li>
</ol>

<h4>필수 항목: 인물과 협찬만</h4>
<ul>
<li><b>필수</b>는 <b>인물</b>과 <b>협찬 소품·협찬 장소</b>뿐입니다. 사진을 만들어 얼굴·모습을 고정하고 코디네이터가 감수합니다. 협찬이 없으면 인물만 만듭니다.</li>
<li><b>장소·소품·배경</b>(대본에서 나온 것, 직접 추가한 것 모두)은 사진을 따로 만들지 않고, 묘사가 영어 프롬프트로 옮겨져 <b>바로 바이블에 적용</b>됩니다(대표 승인 없이). 그래서 바이블 준비가 빠릅니다.</li>
<li>제작하며 그 장소·소품이 나온 <b>장면 사진이 카드에 참고 사진으로 쌓이고</b>(최근 6장), 다음 컷·다음 화는 그 사진을 참고해 같은 모습으로 나옵니다.<span class="ex">예: '편의점' — 3화 S#2 C01 장면 사진이 쌓임 → 7화 편의점 장면이 같은 진열대·조명</span></li>
<li>장소·소품을 반드시 고정해야 하면 사진을 직접 올리세요(올린 사진이 먼저 쓰입니다).</li>
</ul>
<h4>같은 인물의 다른 모습 (성형 후·나이 든 모습 등)</h4>
<ul>
<li>"항목 추가" → 분류 <b>인물</b> → 이름(예: 예뻐진 린) → <b>동일인</b>에서 원래 인물(린) 선택 → <b>나오는 화</b>(예: 5~, 5-12, 3,4,7) → <b>무엇이 달라졌나요?</b>에 바뀐 점을 적고 저장.<span class="ex">예: 예뻐진 린 · 동일인 린 · 5~ · "성형 후 쌍꺼풀이 또렷하고 턱선이 갸름해짐, 밝은 갈색 웨이브 머리"</span></li>
<li>그 화에서는 대본에 "린"으로 나와도 감독·장면 사진이 <b>예뻐진 린</b>의 묘사·사진·얼굴을 씁니다. 목소리는 린 것을 물려받습니다. 그 전 화는 원래 린 그대로.</li>
<li>묘사를 비워 두면 원래 인물 묘사 + 달라진 점으로 코디네이터가 영어 프롬프트를 쓰고, 그 뒤 "사진 자동 만들기"로 얼굴을 고정하면 됩니다. 카드에 "린의 다른 모습 · 5-12화에 적용 · 달라진 점"이 보입니다.</li>
</ul>
<h4>코디네이터 — 감수·반영 기록</h4>
<ul>
<li>항목을 적용하거나 고쳐쓰면, <b>코디네이터</b>가 감수해 카드의 <b>감수·반영 기록</b>에 남깁니다. 고쳐쓰기의 "바꾸는 이유·바꿀 내용"에 적은 요청이 정확히 들어갔는지 확인할 수 있습니다.<span class="ex">예: 탄 v4 — 대표 요청 "눈매를 날카롭게, 은발로" · ✓ 은발 반영(묘사) · 🔧 날카로운 눈매(프롬프트에 빠져 보정) → [프롬프트 보정]</span></li>
<li>동시 처리: 감수·반영 <b>4개</b>, 사진 후보·얼굴 학습 <b>2개</b>(기준 사진 4장도 한꺼번에), 영상 생성 <b>3개</b>, 컷 장면 사진 <b>2개</b>, 감독 컷 설계는 씬 묶음을 <b>4개씩</b> 동시에. 서로 줄을 따로 서서 긴 일 뒤에 짧은 일이 기다리지 않습니다.</li>
<li>순서: <b>반영 중</b>(작가실이 요청을 묘사·영어 프롬프트에 넣는 중) → <b>반영 완료</b> → <b>감수 대기/감수 중</b> → 결과.</li>
<li>결과는 세 가지입니다.
  <ul>
  <li><b>반영 확인</b>: 모두 맞음.</li>
  <li><b>프롬프트 보정</b>: 영어 프롬프트가 빠뜨린 것을 코디네이터가 고침. 전·후 문장을 볼 수 있습니다.</li>
  <li><b>대표 확인 필요</b>: 한글 묘사 자체가 요청·대본과 어긋남. 무엇을 고치면 되는지 한 줄로 알려 주고, [고쳐쓰기]로 바로 열립니다.</li>
  </ul></li>
<li>인물 사진 감수는 <b>얼굴과 몸(체형·비율·몸매)만</b> 봅니다. 의상·액세서리·헤어스타일·배경은 장면마다 바뀌므로 감수에서 문제로 삼지 않습니다.</li>
<li>코디네이터는 <b>기준 사진</b>도 봅니다: 묘사와 맞는지, 사진에 글자·이름표·자막(예: 다른 사람 이름)이 찍혀 있지 않은지, 같은 사람인지. 문제가 있으면 카드가 빨갛게 표시되고 <b>다시 적용해서 사진 만들기 (추천)</b> 버튼이 나옵니다. 바이블 위 "코디네이터 감수 결과"에 이상 항목이 모입니다.<span class="ex">예: 도윤 — 사진 2에 '김윤호' 이름표 글자, 사진 3은 다른 사람 → [다시 적용해서 사진 만들기]</span></li>
<li><b>다시 감수</b>(카드), <b>전체 감수 다시 하기</b>(위 "한꺼번에" 줄)으로 언제든 다시 확인할 수 있습니다. 지난 감수는 "이전 감수"에 쌓입니다.</li>
<li><b>사진을 직접 넣으면</b> 코디네이터가 바로(짧은 일 줄) 사진을 보고 한글 묘사·세부 사항·영어 프롬프트를 꼼꼼히 쓰고, 이어서 감수까지 합니다. 사진을 안 넣으면 대본에서 가져온 추천 묘사로 작가실이 영어 프롬프트를 씁니다.<span class="ex">예: 도윤 사진 3장 업로드 → "20대 후반 한국 남성, 쌍꺼풀 없는 가는 눈, 짧은 흑발 투블럭…" + 영어 프롬프트 → 감수: 반영 확인</span></li>
<li><b>사진 후보 확인 → 다음 후보 개선</b>: 코디네이터가 후보에서 찾은 문제(사원증 글자·나이·다른 사람 등)는 고친 프롬프트와 금지 사항("no ID badge" 등)으로 정리돼 <b>다음 "새로 만들기"에 자동 반영</b>됩니다. 프롬프트가 부족했던 탓이면 바이블 영어 프롬프트도 고치고 감수 기록에 남깁니다.</li>
<li><b>고르지 않아도 진행</b>: 후보 칸의 "코디네이터 추천(2·3번)으로 학습", 감수 결과 칸의 <b>코디네이터 추천으로 학습 시작</b>(인물 여럿 한꺼번에), 얼굴 학습이 끝나면 <b>기준 사진 모두 바이블에 적용</b>(한 번에).</li>
<li><b>코디네이터가 스스로 고칩니다</b>: ① 영어 프롬프트를 쓰거나 감수할 때 생성 서비스가 거절할 표현(실존 배우 이름·성적인 신체 강조)을 뜻은 살려 완곡하게 바꿉니다(한글 묘사는 대표 문장 그대로). ② 사진이 내용 거절로 막히면 표현을 고쳐 바로 다시 만듭니다. ③ 후보가 전부 못 쓸 때는 고친 프롬프트로 한 번 더 만들어 둡니다(같은 요청에서 1번만, 비용 때문에). 그래도 안 되면 그때 대표님께 무엇을 바꾸면 되는지 알려 드립니다.</li>
<li><b>모델 바꾸기</b>: 인물 사진 칸에 "이 인물 사진 요청 N번째 · 이번 모델"이 보이고, 결과가 계속 마음에 안 들면 <b>다른 모델로 후보 다시 만들기</b>(Seedream 5.0 Pro · Soul 2 · Kling Image 4.0 · 나노바나나 프로 · Grok Imagine)를 누르세요. 나노바나나 프로는 2026-11 현재 Higgsfield API에서 꺼져 있어 누르면 Seedream 5.0 Pro로 만들어집니다. 어느 모델로 만든 사진이든 고르면 Soul ID 얼굴 고정은 그대로 됩니다. 사진 구석의 Higgsfield 로고 워터마크는 모델이 아니라 Higgsfield 무료 계정 때문입니다(유료 요금제에서는 없음).</li>
<li><b>얼굴이 고정된 인물</b>은 사진 후보 칸이 다시 나타나지 않습니다. 얼굴을 바꾸려면 <b>고쳐쓰기</b>에서 묘사를 고치고 "저장한 뒤 실사 사진 후보 4장 새로 만들기"를 체크하세요.</li>
<li>사진 <b>새로 만들기</b>는 그 항목의 반영·감수가 진행 중이면 <b>그게 끝난 뒤</b> 반영된 프롬프트로 만듭니다.</li>
</ul>
<h4>⑥ 실사 사진·얼굴 고정 (캐릭터)</h4>
<ol>
<li><b>실사 사진 만들기·얼굴 고정</b> → 묘사 확인 → 후보 4장(Soul 2).<span class="ex">예: 민지 후보 4장 중 2번·4번이 같은 사람 느낌</span></li>
<li><b>사진을 누르면 크게</b> 볼 수 있습니다. ←/→로 넘기고, 크게 본 채로 "이 사진 고르기". 기준 사진·임시 사진·제작 키프레임도 같습니다.<span class="ex">예: 후보 2번을 눌러 눈매를 확대해 보고 → "이 사진 고르기" → → 로 3번 확인</span></li>
<li>같은 사람으로 쓸 사진 1~4장 체크 → <b>이 얼굴로 학습 + 기준 사진 만들기</b>(5~20분) → 정면·3/4·전신·감정 표정 4장.<span class="ex">예: 2번·4번 체크 → Soul ID 학습 → 기준 사진 4장</span></li>
<li>같은 사람으로 보이면 <b>바이블에 적용</b> → "얼굴 고정됨".<span class="ex">예: 이후 민지가 나오는 모든 장면 사진이 이 얼굴</span></li>
</ol>

<h4>⑦ 협찬 씬 (PPL)</h4>
<ul>
<li>분류 버튼의 <b>협찬 씬</b> → <b>+ 협찬 장소 / + 협찬 소품</b>. 사진을 꼭 넣으세요: 그 사진 그대로 화면에 나옵니다.<span class="ex">예: 협찬 텀블러 정면·측면 사진 2장</span></li>

function openHelp() {
  const [title, html] = HELP[S.tab] || ['사용법', '<p>이 화면의 설명이 아직 없습니다.</p>'];
  closeHelp();
  const d = document.createElement('div'); d.id = 'helpDrawer'; d.className = 'helpdrawer';
  d.innerHTML = `<div class="hhead"><b>${esc(title)}</b>
      <select id="hTab" style="width:auto;margin-left:auto">${TABS.map(([k, l]) => `<option value="${k}" ${k === S.tab ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
      <button class="btn small" id="hClose">닫기</button></div><div class="hbody">${html}</div>`;
  const bg = document.createElement('div'); bg.id = 'helpBg'; bg.className = 'helpbg'; bg.onclick = closeHelp;
  document.body.append(bg, d);
  $('#hClose').onclick = closeHelp;
  $('#hTab').onchange = e => { const [t, h] = HELP[e.target.value] || ['사용법', '']; d.querySelector('.hhead b').textContent = t; d.querySelector('.hbody').innerHTML = h; d.querySelector('.hbody').scrollTop = 0; };
}
function closeHelp() { $('#helpDrawer')?.remove(); $('#helpBg')?.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHelp(); });

  <div class="card"><b>2단계 인증</b>
    ${verified.length ? `<p>${pill('켜짐', 'good')} 로그인할 때 인증 앱 숫자를 함께 입력합니다.</p>`
      : `<p>${pill('꺼짐', 'bad')} 휴대폰 인증 앱(Google Authenticator 등)으로 켜 두세요. 대본과 모든 기록을 보호합니다.</p>
         <button class="btn primary" id="mfa">2단계 인증 켜기</button>`}
    <div id="mfaBox"></div></div>
  <div class="card"><b>브라우저 알림</b>
    <p class="quiet">이 화면이 열려 있지만 다른 창을 보고 있을 때도 알림 창을 띄웁니다. 화면을 완전히 닫았을 때의 휴대폰 알림은 다음 단계(푸시 알림)에서 추가됩니다.</p>
    <div class="row">${'Notification' in window ? (Notification.permission === 'granted' ? pill('허용됨', 'good')
      : `<button class="btn" id="perm">알림 허용하기</button>`) : '<span class="quiet">이 브라우저는 알림을 지원하지 않습니다.</span>'}</div></div>
  <div class="card" id="keyBox"><b>API 키</b><p class="quiet">불러오는 중…</p></div>
  <div class="card" id="prodSetBox"><b>제작</b><p class="quiet">불러오는 중…</p></div>
  <div class="card" id="relSetBox"><b>배포</b><p class="quiet">불러오는 중…</p></div>
  <div class="card" id="adSetBox"><b>광고</b><p class="quiet">불러오는 중…</p></div>
  <div class="card" id="wrBox"><b>작가실</b><p class="quiet">불러오는 중…</p></div>
  <div class="card" id="langBox"><b>다국어</b><p class="quiet">불러오는 중…</p></div>
  <div class="card"><b>계정</b><p class="quiet">${esc(S.user.email)}</p>
    <div class="row"><button class="btn" id="out">로그아웃</button><button class="btn small" id="cfg" style="margin-left:auto">서버 설정 초기화</button></div></div>`;
  renderKeys().catch(e => { const b = $('#keyBox'); if (b) b.innerHTML = `<b>API 키</b><div class="msg err">${esc(errText(e))}</div>`; });
  (async () => { const box = $('#relSetBox'); if (!box) return;
    try { const row = await q(S.sb.from('app_settings').select('value').eq('key', 'release').maybeSingle()); const v = row?.value || {};
      box.innerHTML = `<b>배포</b><p class="quiet" style="margin:4px 0 8px">유튜브는 한 채널에서 24시간에 최대 3개의 새 영상 알림만 보냅니다. 배포 담당은 이 한도 안에서 시청자 반응을 보고 공개 시점과 편수를 정합니다. 공개할 수 있는 것은 대표님이 확정한 완성본뿐이고, 결정할 때마다 알림으로 알려 드립니다.</p>
        <label class="ed-chk"><input type="checkbox" id="relAuto" ${v.auto_decide !== false ? 'checked' : ''}> 공개 시점·편수는 배포 담당이 반응을 보고 스스로 결정</label>
        <div class="row" style="align-items:flex-end;margin-top:8px"><div style="width:150px"><label>하루 최대 (알림 있는 편)</label><select id="relPer">${[1, 2, 3].map(n => `<option ${n === (v.per_day || 3) ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
          <div style="width:240px"><label>기본 시간 (반응 보며 조정)</label><input id="relTimes" value="${esc((v.times || ['12:00', '18:00', '21:00']).join(', '))}"></div>
          <div style="width:150px"><label>재고 최소 (일)</label><input id="relBuf" type="number" min="1" value="${v.buffer_days || 3}"></div>
          <button class="btn" id="relSave">저장</button></div>`;
      $('#relSave').onclick = guard(async () => { await q(S.sb.from('app_settings').upsert({ key: 'release', value: { ...v, auto_decide: $('#relAuto').checked, per_day: +$('#relPer').value,
        times: $('#relTimes').value.split(/[,\s]+/).filter(t => /^\d{1,2}:\d{2}$/.test(t)), buffer_days: Math.max(1, +$('#relBuf').value || 3) }, updated_at: new Date().toISOString() })); toast('배포 설정을 저장했습니다'); });
    } catch (e) { box.innerHTML = `<b>배포</b><div class="msg err">${esc(errText(e))}</div>`; } })();
  (async () => { const box = $('#adSetBox'); if (!box) return;
    try { const row = await q(S.sb.from('app_settings').select('value').eq('key', 'ads').maybeSingle()); const v = row?.value || {};
      box.innerHTML = `<b>광고</b><p class="quiet" style="margin:4px 0 8px">광고 담당은 이 한도 안에서만 광고비를 제안합니다. 0이면 돈이 드는 제안은 하지 않고, 제목·썸네일·쇼츠처럼 무료 개선만 제안합니다. 모든 지출은 승인 버튼을 눌러야 실행됩니다.</p>
        <div class="row" style="align-items:flex-end"><div style="width:220px"><label>월 광고 한도 (원)</label><input id="adBud" type="number" step="10000" value="${v.monthly_budget_krw || 0}"></div>
        <button class="btn" id="adBudSave">저장</button></div>`;
      $('#adBudSave').onclick = guard(async () => { await q(S.sb.from('app_settings').upsert({ key: 'ads', value: { ...v, monthly_budget_krw: Math.max(0, +$('#adBud').value || 0) }, updated_at: new Date().toISOString() })); toast('월 광고 한도를 저장했습니다'); });
    } catch (e) { box.innerHTML = `<b>광고</b><div class="msg err">${esc(errText(e))}</div>`; } })();
  renderProdSettings().catch(e => { const b = $('#prodSetBox'); if (b) b.innerHTML = `<b>제작</b><div class="msg err">${esc(errText(e))}</div>`; });
  (async () => {
    const box = $('#wrBox'); if (!box) return;
    try {
      const row = await q(S.sb.from('app_settings').select('value').eq('key', 'writers_room_auto_confirm').maybeSingle());
      const on = row?.value === true;
      box.innerHTML = `<b>작가실</b>
        <p class="quiet" style="margin:4px 0 8px">원고를 올리면 작가실이 흐름은 그대로 두고 감정선과 감정 연결 장치만 다듬어 정리본을 만듭니다. 흐름을 바꾸는 것은 제안으로만 올라옵니다(대본 탭에서 승인).</p>
        <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="wrAuto" style="width:auto" ${on ? 'checked' : ''}>
          정리본 자동 확정: 흐름 제안이 없는 정리본은 바로 확정하고 변경 요약만 알림으로 받기</label>`;
      $('#wrAuto').onchange = guard(async e => {
        await q(S.sb.from('app_settings').upsert({ key: 'writers_room_auto_confirm', value: e.target.checked, updated_at: new Date().toISOString() }));
        toast(e.target.checked ? '정리본을 자동으로 확정합니다' : '정리본을 확정하기 전에 직접 확인합니다');
      });
    } catch (e) { box.innerHTML = `<b>작가실</b><div class="msg err">${esc(errText(e))}</div>`; }
  })();
  renderLanguages().catch(e => { const b = $('#langBox'); if (b) b.innerHTML = `<b>다국어</b><div class="msg err">${esc(errText(e))}</div>`; });
  if ($('#perm')) $('#perm').onclick = async () => {
    const r = await Notification.requestPermission();
    toast(r === 'granted' ? '알림을 허용했습니다' : '알림이 허용되지 않았습니다. 브라우저 설정에서 바꿀 수 있습니다'); go('settings');
  };
  $('#chdev').onclick = () => { localStorage.removeItem(LS.device); location.reload(); };
  $('#out').onclick = async () => { await signOutAll(); location.hash = ''; boot(); };
  $('#cfg').onclick = async () => { if (!confirm('서버 설정을 지우고 처음 화면으로 갈까요?')) return; await signOutAll(); localStorage.removeItem(LS.cfg); resetClient(); boot(); };
  if ($('#mfa')) $('#mfa').onclick = guard(async () => {
    for (const f of factors.data?.all || []) if (f.status !== 'verified') await S.sb.auth.mfa.unenroll({ factorId: f.id });
    const { data, error } = await S.sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'NYX ' + Date.now() });
    if (error) throw error;
    $('#mfaBox').innerHTML = `
      <p>1. 인증 앱으로 아래 QR을 찍으세요.</p><img src="${esc(data.totp.qr_code)}" alt="QR" style="width:200px;height:200px;background:#fff;padding:6px;border-radius:8px">
      <p class="quiet">QR을 못 찍으면 이 키를 직접 입력: <code>${esc(data.totp.secret)}</code></p>
      <p>2. 앱에 나온 6자리 숫자를 입력하세요.</p>
      <div class="row"><input id="mcode" inputmode="numeric" maxlength="6" style="width:140px"><button class="btn primary" id="mok">확인</button></div>`;
    $('#mok').onclick = guard(async () => {
      const r = await S.sb.auth.mfa.challengeAndVerify({ factorId: data.id, code: $('#mcode').value.trim() });
      if (r.error) return toast('숫자가 맞지 않습니다');
      toast('2단계 인증을 켰습니다'); go('settings');
    });
  });
}

boot().catch(e => { console.error(e); $('#app').innerHTML = `<div class="center card"><div class="msg err">${esc(errText(e))}</div>
  <button class="btn" onclick="localStorage.clear();location.reload()">처음부터 다시</button></div>`; });
</script>
</body>
</html>
