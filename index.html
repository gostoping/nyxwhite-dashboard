        shutil.rmtree(work, ignore_errors=True)
        return f"{kind} {len(clips)}컷 {total:.1f}초" + (f" → {files.get('folder')}" if files.get("folder") else "")
    except Exception as ex:
        upd(status="failed", error=str(ex)[:1500])
        raise


EDIT_OPS = """사용할 수 있는 명령(ops):
- {"op":"remove","clip":"c3"}  클립 빼기
- {"op":"move","clip":"c3","to":0}  순서 바꾸기(to = 0부터 시작하는 새 위치)
- {"op":"cut_head","clip":"c3","sec":0.5}  앞부분 잘라내기 / {"op":"cut_tail","clip":"c3","sec":1}  뒷부분 잘라내기
- {"op":"extend_tail","clip":"c3","sec":0.5}  잘라 낸 뒷부분 되살리기(원본 길이 안에서) / {"op":"extend_head",...}
- {"op":"gap","clip":"c3","sec":2}  이 클립 앞 검은 화면(정적) 길이를 sec로
- {"op":"voice_offset","clip":"c3","sec":-0.5}  대사를 화면보다 먼저(음수)/나중(양수)
- {"op":"voice_gain","clip":"c3","gain":1.2}  대사 크기(1 = 그대로)
- {"op":"music_gain","music":"m1","gain":0.4} / {"op":"music_fade","music":"m1","fade_in":2,"fade_out":3} / {"op":"music_start","music":"m1","sec":12.5}
- {"op":"sub_text","sub":"s4","text":"바꾼 자막"} / {"op":"sub_remove","sub":"s4"}"""


def apply_ops(tl, ops):
    clips = tl.setdefault("clips", [])
    find = lambda cid: next((c for c in clips if c.get("id") == cid), None)
    done = []
    for o in ops or []:
        op, c = o.get("op"), find(o.get("clip"))
        sec = float(o.get("sec") or 0)
        try:
            if op == "remove" and c:
                clips.remove(c)
                tl["subs"] = [s for s in tl.get("subs") or [] if s.get("clip_id") != c["id"]]
            elif op == "move" and c:
                clips.remove(c)
                clips.insert(max(0, min(len(clips), int(o.get("to") or 0))), c)
            elif op == "cut_head" and c:
                c["in"] = round(min(float(c["out"]) - 0.3, float(c["in"]) + sec), 3)
            elif op == "cut_tail" and c:
                c["out"] = round(max(float(c["in"]) + 0.3, float(c["out"]) - sec), 3)
            elif op == "extend_head" and c:
                c["in"] = round(max(0.0, float(c["in"]) - sec), 3)
            elif op == "extend_tail" and c:
                c["out"] = round(min(float(c.get("src_len") or c["out"]), float(c["out"]) + sec), 3)
            elif op == "gap" and c:
                c["gap"] = round(max(0.0, min(10.0, sec)), 2)
            elif op == "voice_offset" and c:
                c["voice_offset"] = round(max(-3.0, min(3.0, sec)), 2)
            elif op == "voice_gain" and c:
                c["voice_gain"] = round(max(0.0, min(3.0, float(o.get("gain") or 1))), 2)
            elif op.startswith("music_"):
                m = next((x for x in tl.get("music") or [] if x.get("id") == o.get("music")), None)
                if not m:
                    continue
                if op == "music_gain":
                    m["gain"] = round(max(0.0, min(3.0, float(o.get("gain") or 0.6))), 2)
                elif op == "music_fade":
                    m["fade_in"], m["fade_out"] = float(o.get("fade_in") or m.get("fade_in") or 0), float(o.get("fade_out") or m.get("fade_out") or 0)
                elif op == "music_start":
                    m["start"] = round(max(0.0, sec), 2)
            elif op in ("sub_text", "sub_remove"):
                s = next((x for x in tl.get("subs") or [] if x.get("id") == o.get("sub")), None)
                if not s:
                    continue
                if op == "sub_text":
                    s["text"] = str(o.get("text") or s["text"])
                else:
                    tl["subs"].remove(s)
            else:
                continue
            done.append(o)
        except Exception as ex:
            log(f"편집 명령 건너뜀 {o}: {ex}")
    return done


@task("edit_command")
def t_edit_command(t):
    p = t.get("payload") or {}
    ed = rpc("agent_get_edit", p_token=TOKEN, p_project=p["project_id"])
    tl = (ed.get("project") or {}).get("timeline") or {}
    takes = ed.get("takes") or {}
    clips, total, _ = tl_layout(tl)
    table = [{"clip": c["id"], "code": c.get("code") or (takes.get(c.get("take_id")) or {}).get("code"), "position_sec": c["start"],
              "length": c["dur"], "in": c["in"], "out": c["out"], "src_len": c.get("src_len"), "gap_before": c.get("gap") or 0,
              "voice_offset": c.get("voice_offset") or 0, "voice_gain": c.get("voice_gain", 1),
              "dialogue": ((takes.get(c.get("take_id")) or {}).get("dialogue") or "")[:120]} for c in clips]
    music = [{k: m.get(k) for k in ("id", "name", "start", "in", "out", "gain", "fade_in", "fade_out")} for m in tl.get("music") or []]
    subs = [{k: s.get(k) for k in ("id", "clip_id", "text")} for s in (tl.get("subs") or [])][:200]
    system = f"""너는 드라마 편집 보조다. 대표의 말을 타임라인 명령으로 바꾼다. 컷 이름(S03 C02, E01-S03-C02, 세 번째 컷 등)은 code와 position으로 찾는다.
애매하면 가장 그럴듯한 해석 하나만 하고 summary에 그렇게 해석했다고 적는다. 할 수 없는 요청(색보정, 화면 효과 등)은 ops 없이 summary로 설명한다.
{EDIT_OPS}
답 형식: <json>{{"ops": [...], "summary": "무엇을 바꿨는지 한두 줄(한국어)"}}</json>"""
    user = f"[대표 지시]\n{p.get('text')}\n\n[클립 {len(table)}개, 전체 {total:.1f}초]\n{json.dumps(table, ensure_ascii=False)}\n\n[음악]\n{json.dumps(music, ensure_ascii=False)}\n\n[자막]\n{json.dumps(subs, ensure_ascii=False)}"
    text, _ = claude("claude-sonnet-5-5", system, user, max_tokens=3000, stage="edit", episode_id=(ed.get("episode") or {}).get("id"), note="말로 편집")
    res = pick_json(text)
    done = apply_ops(tl, res.get("ops"))
    if done:
        rpc("agent_save_edit", p_token=TOKEN, p_project=p["project_id"], p_timeline=tl)
    return (res.get("summary") or "") + f" (명령 {len(done)}개 적용)"


def run_task(tk):
    kind = tk["kind"]
    CURRENT["task"] = tk
    log(f"제작 작업 시작: {kind} ({tk['id']})")
    try:
        result = TASKS[kind](tk)
        rpc("agent_task_update", p_token=TOKEN, p_id=tk["id"], p_status="done", p_progress="완료", p_result=str(result or "완료"))
        log(f"제작 작업 완료: {kind} · {result}")
    except Retry as r:
        log(f"잠시 뒤 다시: {kind}: {r.why}")
        try:   # 기다림은 시도 횟수에 세지 않는다(DB 650 이후). 옛 DB면 예전 방식으로
            rpc("agent_task_update", p_token=TOKEN, p_id=tk["id"], p_status="queued", p_progress=r.why[:200], p_retry_in=int(r.seconds), p_wait=True)
        except Exception:
            rpc("agent_task_update", p_token=TOKEN, p_id=tk["id"], p_status="queued", p_progress=r.why[:200], p_retry_in=int(r.seconds))
    except Exception as e:
        log(f"제작 작업 실패: {kind}: {e}\n{traceback.format_exc()}")
        # 일시적인 문제(인터넷 끊김·서비스 붐빔·5xx·시간 초과·재시작)는 실패로 띄우지 않고 조용히 다시 한다(최대 3번)
        if is_transient(str(e)) and (tk.get("attempts") or 1) < 4:   # 영상 생성도: 다시 집으면 이미 맡긴 요청을 이어서 기다림(새 결제 없음)
            wait = 30 * (tk.get("attempts") or 1)
            if kind in ("photo_design", "photo_set"):
                did = (tk.get("payload") or {}).get("design_id")
                try:
                    rpc("agent_update_photo_design", p_token=TOKEN, p_id=did, p={"status": "training" if kind == "photo_set" else "queued"})
                except Exception:
                    pass
            rpc("agent_task_update", p_token=TOKEN, p_id=tk["id"], p_status="queued", p_progress=f"일시적인 문제로 {wait}초 뒤 자동으로 다시 합니다({str(e)[:80]})", p_retry_in=wait)
            return
        retry = 120 if (tk.get("attempts") or 1) < 2 and kind in ("store", "video_review") else None
        rpc("agent_task_update", p_token=TOKEN, p_id=tk["id"], p_status="failed", p_error=str(e)[:1500], p_retry_in=retry)
        # 바이블 보조 작업은 하나하나 알림을 울리지 않는다: 지시 탭 적용 대기함 '실패'에 원인과 함께 모이고 거기서 다시 시도
        if kind not in QUIET_FAIL and (kind in ("writers_room", "director") or retry is None):
            notify(f"작업 실패: {TASK_NAME.get(kind, kind)}", f"원인: {str(e)[:260]}\n이렇게 하세요: {fail_hint(str(e))}\n(제작 탭 빨간 상자·지시 탭 '실패'에서 바로 다시 시도할 수 있습니다)", "warning")
    finally:
        CURRENT["task"] = None


def is_transient(e):
    """다시 하면 대부분 되는 오류인가(인터넷·서비스 붐빔·서버 오류·시간 초과).
    단, Higgsfield 생성·얼굴 학습이 '시간 초과'된 것은 다시 하면 새로 결제되므로 자동 반복하지 않는다(대표가 확인 후 다시 시도)."""
    if re.search(r"(생성|학습) 시간 초과", e):
        return False
    return bool(re.search(r"(URLError|Connection|connection|reset|refused|Temporary failure|Name or service|timed out|timeout|시간 초과|"
                          r"(?:실패|failed|error|Error|오류|HTTP|status|code|응답)\D{0,10}(429|500|502|503|504|520|522|524|529)\b|overloaded|rate.?limit|SSL|EOF occurred|RemoteDisconnected|IncompleteRead|"
                          r"Remote end closed|BrokenPipe|주소를 찾지 못함|후보가 만들어지지 않았습니다)", e))


def fail_hint(e):
    """실패 알림에 붙일 '대표가 할 일' 한 줄(대시보드 explainFail과 같은 기준)."""
    rules = [(r"확정된 대본이 없", "대본 탭에서 정리본(또는 원고)을 확정한 뒤 다시 시도"),
             (r"키가 없|401|403|Unauthorized|invalid.*key", "설정 → API 키를 다시 넣고 '연결 시험' 후 다시 시도"),
             (r"402|잔액|credit|insufficient|quota|balance", "원인에 적힌 서비스(Higgsfield·ElevenLabs·Claude) 충전 후 다시 시도"),
             (r"429|rate.?limit|overloaded|529", "몇 분 뒤 다시 시도(서비스가 잠시 붐빔)"),
             (r"시간 초과|timeout|timed out", "다시 시도, 계속되면 에이전트 탭에서 그 컴퓨터 재시작"),
             (r"nsfw|safety|moderation", "컷 카드 '감독에게 수정 요청'으로 표현을 순화한 뒤 다시 생성"),
             (r"ffmpeg", "에이전트 탭에서 그 컴퓨터 재시작 후 다시 시도"),
             (r"묘사", "바이블에서 그 항목 묘사를 한글로 자세히 고치기(고치면 자동으로 다시 돎)"),
             (r"JSON|형식|만들지 못했", "다시 시도(대부분 해결). 두 번 이상 같으면 원인 문구를 개발에 전달")]
    for pat, how in rules:
        if re.search(pat, e, re.I):
            return how
    return "다시 시도. 같은 원인으로 또 실패하면 원인 문구를 개발(Claude)에 전달"


QUIET_FAIL = {"coord_review", "bible_prompt", "photo_describe", "bible_place", "photo_design", "prep_cut"}
TASK_NAME = {"balance_check": "잔액 조회", "cut_review": "컷 감수(감정·영상)", "coord_review": "코디네이터 감수", "upscale": "1080p 업그레이드", "bgm": "배경음악 만들기", "bible_suggest": "작가실 추천(스타일·음악)", "api_check": "실제 연결 점검", "bible_prompt": "코디네이터: 영어 프롬프트", "bible_extract": "대본에서 필요 항목 찾기", "photo_describe": "사진 보고 묘사 쓰기", "bible_place": "넣을 화·씬 추천", "photo_design": "사진 디자인", "photo_set": "얼굴 학습·기준 사진", "prep_cut": "컷 준비(사진·목소리)", "assemble": "편집본 조립", "edit_command": "말로 편집", "voice_cast": "시리즈 목소리 설계", "voice_design": "목소리 후보 만들기", "voice_save": "목소리 저장", "writers_room": "작가실 정리", "director": "감독 컷 설계", "generate": "영상 생성", "store": "윈도우 보관", "video_review": "영상 감수"}


# ------------------------------------------------------------------ 본체
def main():
    global DEVICE_ID
    log(f"NYX 에이전트 v{VERSION} 시작 ({PLATFORM}, {socket.gethostname()})")
    keep_awake()
    os.makedirs(os.path.join(HOME, "work"), exist_ok=True)   # 새로 설치한 컴퓨터에서 첫 대사 파일 쓰기가 실패하던 문제
    last_error, paused = None, False
    info = {"hostname": socket.gethostname(), "os": f"{platform.system()} {platform.release()}",
            "python": platform.python_version(), "started_at": STARTED, "jobs": sorted(HANDLERS), "tasks": sorted(TASKS),
            "auto_update_minutes": UPDATE_EVERY // 60}
    try:
        with open(os.path.join(HOME, "rollback.json"), encoding="utf-8") as f:
            rb = json.load(f)
        info["rolled_back_from"] = rb.get("from")
        log(f"주의: v{rb.get('from')} 업데이트가 시작에 실패해 이전 버전으로 되돌렸습니다")
    except Exception:
        pass
    while True:
        busy = False
        try:
            info["latest_seen"] = LATEST_SEEN
            hb = rpc("agent_heartbeat", p_token=TOKEN, p_platform=PLATFORM, p_version=VERSION,
                     p_state="busy" if lanes_busy() else ("error" if last_error else ("paused" if paused else "idle")),
                     p_current_job=lanes_busy(), p_last_error=last_error, p_info=info)
            DEVICE_ID, paused = hb.get("device_id"), bool(hb.get("paused"))
            PULSE["last"] = time.time()
            QUICK["paused"] = paused
            if PULSE.get("restart"):   # 신호 줄이 받아 둔 재시작·업데이트 명령
                what = PULSE["restart"]; PULSE["restart"] = False
                if what == "update":
                    check_update(force=True)
                raise Restart()
            if not QUICK.get("started"):   # 첫 연결이 된 뒤에 일 줄을 연다. 모든 제작 일은 줄에서 동시에 하고, 본체는 신호·명령·업데이트만 맡는다
                QUICK["started"] = True
                threading.Thread(target=pulse, daemon=True).start()
                lanes = [(QUICK_KINDS, "busy", "짧은 일 줄", QUICK_WORKERS),
                         (PHOTO_KINDS, "photo", "사진 줄", 2),        # 서로 다른 인물 후보·얼굴 학습
                         (GEN_KINDS, "gen", "영상 줄", 3),
                         (PREP_KINDS, "prep", "장면 사진 줄", 2),
                         (work_kinds(), "work", "일반 줄", WORK_WORKERS),   # 감독·작가실·감수·보관·목소리 등
                         (HEAVY_KINDS, "heavy", "편집·업스케일 줄", 1)]
                for kinds, slot, label, n in lanes:
                    for i in range(n):
                        threading.Thread(target=lane, args=(kinds, f"{slot}{i}", f"{label} {i + 1}"), daemon=True,
                                         name=f"{slot}{i}").start()
                        time.sleep(0.3)   # 줄마다 대기열 확인 시점을 흩어 둔다
                log("일 줄 시작: " + ", ".join(f"{label} {n}개" for _, _, label, n in lanes))
            last_error = None
            if os.path.exists(PENDING):  # 새 버전이 정상적으로 연결됨 → 업데이트 확정
                os.remove(PENDING)
                log(f"v{VERSION} 업데이트 확정")
            for c in hb.get("commands") or []:
                handle_command(c)
            if not paused and not QUICK.get("draining"):
                j = rpc("agent_claim_job", p_token=TOKEN, p_types=sorted(HANDLERS))
                if j and j.get("id"):
                    busy = True
                    run_job(j)
        except Restart:
            drain()
            log("재시작")
            sys.exit(0)  # 자동 시작 장치(맥 launchd / Windows 실행기)가 다시 켭니다
        except Exception as e:
            last_error = str(e)[:500]
            log(f"오류: {last_error}")
            if "invalid agent token" in last_error:
                log("토큰이 맞지 않습니다. 대시보드에서 토큰을 다시 발급하고 설치 명령을 다시 실행하세요.")
                time.sleep(300)
                continue
        # 업데이트 확인은 일이 계속 있어도 일 사이마다(10분 간격) 한다 — 바쁘면 영영 옛 버전에 머물던 문제
        try:
            if check_update():
                drain()
                log("새 버전으로 재시작")
                sys.exit(0)
        except SystemExit:
            raise
        except Exception as e:
            log(f"업데이트 확인 실패(다음에 다시 시도): {e}")
        if not busy:
            time.sleep(BEAT_SECONDS)


if __name__ == "__main__":
    try:
        main()
    except KeyboardInterrupt:
        log("사용자가 중지함")

#   curl -fsSL <저장소>/install.sh | bash -s -- <URL> <KEY> <TOKEN>

fi

"$UV" python install 3.12 >/dev/null

  <key>StandardErrorPath</key><string>$DIR/agent.out.log</string>
</dict>
</plist>

launchctl bootstrap "gui/$(id -u)" "$PLIST"

echo ""

<script type="text/plain" id="f-install.ps1">
# NYX WHITE DIRECTOR 에이전트 설치 (Windows)
# 대시보드 → 에이전트 탭에서 복사한 한 줄 명령을 PowerShell에 붙여 넣으면 실행됩니다. 관리자 권한은 필요 없습니다.
$ErrorActionPreference = 'Stop'
[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

$URL = $env:NYX_URL; $KEY = $env:NYX_KEY; $TOKEN = $env:NYX_TOKEN
if (-not $URL -or -not $KEY -or -not $TOKEN) { throw '설치 정보가 빠졌습니다. 대시보드에서 설치 명령을 다시 복사하세요.' }
$URL = $URL.TrimEnd('/')
$Dir = Join-Path $env:USERPROFILE 'NYX\agent'
New-Item -ItemType Directory -Force -Path $Dir | Out-Null
Write-Host "NYX 에이전트 설치를 시작합니다 ($Dir)"

# 0) 이미 돌고 있는 에이전트가 있으면 멈춤
Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
  Where-Object { $_.CommandLine -and $_.CommandLine -like '*NYX\agent*' -and $_.ProcessId -ne $PID } |
  ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

# 1) 실행 도구(uv): 파이썬을 관리자 권한 없이 설치·실행
$uv = (Get-Command uv -ErrorAction SilentlyContinue).Source
if (-not $uv) { $uv = Join-Path $env:USERPROFILE '.local\bin\uv.exe' }
if (-not (Test-Path $uv)) {
  Write-Host '실행 도구(uv)를 설치합니다'
  $env:UV_NO_MODIFY_PATH = '1'
  Invoke-RestMethod https://astral.sh/uv/install.ps1 | Invoke-Expression
}
Write-Host '파이썬 준비'
& $uv python install 3.12 | Out-Null

# 2) 에이전트 프로그램과 설정
Write-Host '에이전트 프로그램 내려받기'
try {
  Invoke-WebRequest 'https://raw.githubusercontent.com/gostoping/nyxwhite-dashboard/main/agent/agent.py' -OutFile (Join-Path $Dir 'agent.py') -UseBasicParsing
} catch {
  Invoke-WebRequest "$URL/storage/v1/object/public/agent/agent.py?t=$([DateTimeOffset]::Now.ToUnixTimeSeconds())" -OutFile (Join-Path $Dir 'agent.py') -UseBasicParsing
}
@{ url = $URL; key = $KEY; token = $TOKEN } | ConvertTo-Json | Set-Content -Path (Join-Path $Dir 'config.json') -Encoding UTF8

# 3) 꺼지면 다시 켜는 실행기 + 로그인하면 자동 시작(창 없이)
$runner = Join-Path $Dir 'runner.ps1'
@"
Set-Location '$Dir'
`$env:PYTHONIOENCODING = 'utf-8'
while (`$true) {
  & '$uv' run --python 3.12 --no-project '$Dir\agent.py' *>> '$Dir\agent.out.log'
  Start-Sleep -Seconds 10
}
"@ | Set-Content -Path $runner -Encoding UTF8
$vbs = Join-Path ([Environment]::GetFolderPath('Startup')) 'NYX-agent.vbs'
"CreateObject(""Wscript.Shell"").Run ""powershell -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File """"$runner"""""", 0, False" |
  Set-Content -Path $vbs -Encoding Unicode

# 4) 전원 연결 시 절전·최대 절전 끄기 (화면 끄기는 그대로)
try { powercfg /change standby-timeout-ac 0 | Out-Null; powercfg /change hibernate-timeout-ac 0 | Out-Null } catch {}

Start-Process wscript.exe -ArgumentList "`"$vbs`""
Write-Host ''
Write-Host '설치 완료. 1분 안에 대시보드 에이전트 탭에서 온라인으로 바뀝니다.'
Write-Host "기록 파일: $Dir\agent.log"
Write-Host '참고: Windows 업데이트의 사용 시간을 지정해 두면 마음대로 재부팅하지 않습니다.'
</script>

const $ = (sel, root = document) => root.querySelector(sel);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = t => t ? new Date(t).toLocaleString('ko-KR', { year: '2-digit', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-';
const loadJSON = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
const saveJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

function toast(text) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function errText(e) {
  const m = e?.message || String(e);
  if (/row-level security/i.test(m)) return '권한이 없습니다. 대표 계정으로 로그인했는지 확인하세요.';
  if (/Failed to fetch/i.test(m)) return '서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요.';
  if (/Could not find the (table|function)|schema cache|does not exist|Bucket not found/i.test(m))
    return '필요한 표가 아직 없습니다. Supabase SQL Editor에서 nyx_bible.sql(바이블 추가 스크립트)을 실행했는지 확인하세요.';
  if (/duplicate key/i.test(m)) return '같은 이름이 이미 있습니다.';
  return m;
}
async function q(promise) {
  const { data, error } = await promise;
  if (error) throw error;
  return data;
}
function guard(fn) {
  return async (...a) => { try { await fn(...a); } catch (e) { console.error(e); toast('오류: ' + errText(e)); } };
}

// 서버 연결은 하나만 만든다(여러 개를 만들면 로그인 처리가 서로 기다리며 멈출 수 있음).
// 기기 표시(x-device-id)는 요청할 때마다 붙인다.
function makeClient(cfg) {
  const withDevice = (input, init = {}) => {
    const headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
    const dev = loadJSON(LS.device);
    if (dev?.id) headers.set('x-device-id', dev.id);
    return fetch(input, { ...init, headers });
  };
  const sb = createClient(cfg.url, cfg.key, {
    global: { fetch: withDevice },
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'nix.auth' },
  });
  // 사진 주소 재사용: 다시 그릴 때마다 새 서명 주소를 받으면 같은 사진을 또 내려받아 깜박인다 → 만료 10분 전까지는 같은 주소를 쓴다
  const SIGN = new Map();
  const from0 = sb.storage.from.bind(sb.storage);
  sb.storage.from = bucket => {
    const api = from0(bucket);
    const many = api.createSignedUrls.bind(api), one = api.createSignedUrl.bind(api);
    const ok = (p, exp) => { const c = SIGN.get(bucket + '|' + p); return c && c.until > Date.now() + 600e3 ? c : null; };
    api.createSignedUrls = async (paths, exp, opt) => {
      if (opt) return many(paths, exp, opt);
      const need = [...new Set(paths.filter(p => !ok(p, exp)))];
      if (need.length) {
        const r = await many(need, exp);
        if (r.error) return r;
        (r.data || []).forEach(x => { if (x.signedUrl) SIGN.set(bucket + '|' + x.path, { url: x.signedUrl, until: Date.now() + exp * 1000 }); });
      }
      return { data: paths.map(p => ({ path: p, signedUrl: ok(p, exp)?.url || null, error: ok(p, exp) ? null : 'not signed' })), error: null };
    };
    api.createSignedUrl = async (path, exp, opt) => {
      if (opt) return one(path, exp, opt);
      const c = ok(path, exp); if (c) return { data: { signedUrl: c.url }, error: null };
      const r = await one(path, exp); if (r.data?.signedUrl) SIGN.set(bucket + '|' + path, { url: r.data.signedUrl, until: Date.now() + exp * 1000 });
      return r;
    };
    return api;
  };
  return sb;
}
function resetClient() { S.sb = null; }

// ------------------------------------------------------------------
// 시작: 설정 → 로그인 → 2단계 인증 → 대표 확인 → 기기 등록
// ------------------------------------------------------------------
async function boot() {
  const cfg = loadJSON(LS.cfg);
  if (!cfg?.url || !cfg?.key) return renderSetup();
  const dev = loadJSON(LS.device);
  if (!S.sb) S.sb = makeClient(cfg);
  const { data: { session } } = await S.sb.auth.getSession();
  if (!session) return renderLogin();
  S.user = session.user;

  const aal = await S.sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal.data && aal.data.nextLevel === 'aal2' && aal.data.currentLevel !== 'aal2') return renderMfaChallenge();

  const member = await q(S.sb.from('app_members').select('role,label').eq('user_id', S.user.id).maybeSingle());
  if (!member || member.role !== 'owner') return renderNotOwner();

  if (dev?.id) {
    const found = await q(S.sb.from('devices').select('id,name,kind').eq('id', dev.id).maybeSingle());
    if (found) { S.device = found; return renderShell(); }
  }
  renderDeviceSetup();
}

function atobSafe(s) { try { return atob(s.replace(/-/g, '+').replace(/_/g, '/')); } catch { return ''; } }

function renderLogin() {
  $('#app').innerHTML = `
  <div class="center card">
    <h2>대표 로그인</h2>
    <label>이메일</label><input id="e" type="email" autocomplete="username">
    <label>비밀번호</label><input id="p" type="password" autocomplete="current-password">
    <div id="m"></div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="go">로그인</button>
      <button class="btn small" id="reset" style="margin-left:auto">서버 설정 바꾸기</button></div>
  </div>`;
  const go = async () => {
    const btn = $('#go'); if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '로그인 중…'; $('#m').innerHTML = '';
    try {
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('TIMEOUT')), 20000));
      const { error } = await Promise.race([
        S.sb.auth.signInWithPassword({ email: $('#e').value.trim(), password: $('#p').value }), timeout]);
      if (error) {
        const m = error.message || '';
        const text = /Invalid login credentials/i.test(m) ? '이메일 또는 비밀번호가 틀립니다'
          : /Email not confirmed/i.test(m) ? '이메일 인증이 안 된 계정입니다. Supabase에서 계정을 만들 때 Auto Confirm을 체크했는지 확인하세요'
          : /Invalid API key|No API key/i.test(m) ? '공개용 키가 맞지 않습니다. "서버 설정 바꾸기"로 키를 다시 넣으세요'
          : m;
        $('#m').innerHTML = `<div class="msg err">로그인 실패: ${esc(text)}</div>`;
        return;
      }
      await boot();
    } catch (e) {
      console.error(e);
      $('#m').innerHTML = `<div class="msg err">${e.message === 'TIMEOUT'
        ? '서버 응답이 없습니다. 인터넷 연결과 Project URL을 확인하세요.' : esc(errText(e))}</div>`;
    } finally {
      const b = $('#go'); if (b) { b.disabled = false; b.textContent = '로그인'; }
    }
  };
  $('#go').onclick = go;
  $('#p').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#reset').onclick = () => { localStorage.removeItem(LS.cfg); resetClient(); boot(); };
}

async function renderMfaChallenge() {
  $('#app').innerHTML = `
  <div class="center card">
    <h2>2단계 인증</h2>
    <p class="quiet">인증 앱에 표시된 6자리 숫자를 입력하세요.</p>
    <input id="c" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <div id="m"></div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="go">확인</button>
      <button class="btn small" id="out" style="margin-left:auto">로그아웃</button></div>
  </div>`;
  $('#out').onclick = async () => { await S.sb.auth.signOut(); boot(); };
  $('#go').onclick = guard(async () => {
    const factors = await S.sb.auth.mfa.listFactors();
    const f = factors.data?.totp?.find(x => x.status === 'verified');
    if (!f) return $('#m').innerHTML = '<div class="msg err">등록된 인증 앱이 없습니다.</div>';
    const { error } = await S.sb.auth.mfa.challengeAndVerify({ factorId: f.id, code: $('#c').value.trim() });
    if (error) return $('#m').innerHTML = '<div class="msg err">숫자가 맞지 않습니다.</div>';
    boot();
  });
}

function guessKind() {
  const ua = navigator.userAgent;
  if (/Android|iPhone|iPad/i.test(ua)) return 'phone';
  if (/Macintosh/i.test(ua)) return 'mac_browser';
  return 'pc_browser';
}
function renderDeviceSetup() {
  const kind = guessKind();
  const suggested = { phone: '대표 휴대폰', mac_browser: '맥북', pc_browser: 'Windows 본부 PC' }[kind];
  $('#app').innerHTML = `
  <div class="center card">
    <h2>이 기기 등록</h2>
    <p class="quiet">모든 기록에 "어느 기기에서 했는지"가 남습니다. 이 기기의 이름을 정해 주세요. 기기마다 한 번만 하면 됩니다.</p>
    <label>기기 이름</label><input id="n" value="${esc(suggested)}">
    <label>종류</label>
    <select id="k">
      <option value="phone" ${kind === 'phone' ? 'selected' : ''}>휴대폰</option>
      <option value="pc_browser" ${kind === 'pc_browser' ? 'selected' : ''}>Windows PC (브라우저)</option>
      <option value="mac_browser" ${kind === 'mac_browser' ? 'selected' : ''}>맥북 (브라우저)</option>
      <option value="other">기타</option>
    </select>
    <div id="m"></div>
    <div id="existing"></div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="go">등록</button></div>
  </div>`;
  q(S.sb.from('devices').select('id,name,kind').eq('is_agent', false).order('created_at')).then(list => {
    if (!list.length) return;
    $('#existing').innerHTML = `<label>이미 등록한 기기라면 선택</label>` + list.map(d =>
      `<button class="btn small" data-id="${esc(d.id)}" style="margin:0 6px 6px 0">${esc(d.name)}</button>`).join('');
    $('#existing').querySelectorAll('button').forEach(b => b.onclick = () => useDevice(list.find(d => d.id === b.dataset.id)));
  }).catch(() => {});
  $('#go').onclick = guard(async () => {
    const name = $('#n').value.trim();
    if (!name) return;
    const row = await q(S.sb.from('devices').insert({ name, kind: $('#k').value, is_agent: false }).select('id,name,kind').single());
    useDevice(row);
  });
}
function useDevice(d) {
  saveJSON(LS.device, { id: d.id, name: d.name });
  location.reload();
}

// 알림: 화면 위 종 모양, 실시간 수신, 브라우저 알림

async function refreshBadge() {
  const { count } = await S.sb.from('notifications').select('id', { count: 'exact', head: true }).is('read_at', null);
  const b = $('#badge'); if (!b) return;
  b.hidden = !count; b.textContent = count > 99 ? '99+' : String(count || '');
}
function showSystemNotification(n) {
  try {
    if ('Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible') {
      const sn = new Notification('NYX · ' + n.title, { body: n.body || '', tag: n.id });
      sn.onclick = () => { window.focus(); openNotification(n); sn.close(); };
    }
  } catch {}
}
function startNotifications() {
  refreshBadge().catch(() => {});
  if (S.notifTimer) clearInterval(S.notifTimer);
  S.notifTimer = setInterval(() => refreshBadge().catch(() => {}), 60000);
  try {
    if (S.notifChannel) S.sb.removeChannel(S.notifChannel);
    S.notifChannel = S.sb.channel('nyx-notifications')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, ({ new: n }) => {
        toast(n.title + ' — ' + (n.body || ''));
        showSystemNotification(n);
        refreshBadge().catch(() => {});
        // 지시를 쓰는 중이면 화면을 다시 그리지 않는다(쓰던 글이 지워지지 않도록)
        const typing = $('#dtxt')?.value.trim() || ['TEXTAREA', 'INPUT'].includes(document.activeElement?.tagName);
        if (S.tab === 'directives' && n.directive_id && !typing) go('directives');
        if ($('#npanel').innerHTML) renderNotifPanel();
      })
      .subscribe();
  } catch (e) { console.warn('실시간 알림 연결 실패, 1분마다 확인합니다', e); }
}
function stopNotifications() {
  if (S.notifTimer) clearInterval(S.notifTimer);
  S.notifTimer = null;
  try { if (S.notifChannel) S.sb.removeChannel(S.notifChannel); } catch {}
  S.notifChannel = null;
}
async function signOutAll() { stopNotifications(); await S.sb.auth.signOut(); }
async function renderNotifPanel() {
  const list = await q(S.sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(40));
  $('#npanel').innerHTML = `<div class="npanel">
    <div class="row" style="padding:10px 14px;border-bottom:1px solid var(--line)"><b>알림</b>
      <button class="btn small" id="readAll" style="margin-left:auto">모두 읽음</button></div>
    ${list.length ? list.map(n => `<div class="it ${n.read_at ? '' : 'unread'}" data-n="${esc(n.id)}">
      <b class="lvl-${esc(n.level)}">${esc(n.title)}</b> <span class="quiet">${fmt(n.created_at)}</span>
      <div style="font-size:13.5px">${esc(n.body || '')}</div></div>`).join('')
      : '<div class="it quiet">알림이 없습니다.</div>'}</div>`;
  $('#readAll').onclick = guard(async () => {
    await q(S.sb.from('notifications').update({ read_at: new Date().toISOString() }).is('read_at', null));
    refreshBadge(); renderNotifPanel();
  });
  $('#npanel').querySelectorAll('[data-n]').forEach(el => el.onclick = () => openNotification(list.find(n => n.id === el.dataset.n)));
}
function toggleNotifPanel() {
  if ($('#npanel').innerHTML) { $('#npanel').innerHTML = ''; return; }
  renderNotifPanel().catch(e => toast('오류: ' + errText(e)));
}
async function openNotification(n) {
  $('#npanel').innerHTML = '';
  if (!n.read_at) { await S.sb.from('notifications').update({ read_at: new Date().toISOString() }).eq('id', n.id); refreshBadge(); }
  if (n.directive_id) S.focusDirective = n.directive_id;
  go(n.link_tab || 'home');
}
function go(tab) {
  // 같은 탭을 다시 그릴 때(버튼을 눌러 새로 고침)는 화면을 비우지 않고 스크롤 위치를 지킨다 → 맨 위로 튕기지 않음
  const same = S.tab === tab && $('#main')?.children.length;
  const y = window.scrollY, main = $('#main');
  if (S.tab === 'edit' && tab !== 'edit') { try { edStop(); } catch {} }   // 편집실을 떠나면 재생·배경음악·마이크를 끈다(다른 탭에서 말이 유료 편집 명령이 되던 문제)
  const views = { home: viewHome, guide: viewGuide, scripts: viewScripts, production: viewProduction, edit: viewEdit, release: viewRelease, ads: viewAds, bible: viewBible, staff: viewStaff, directives: viewDirectives, agents: viewAgents, costs: viewCosts, log: viewLog, settings: viewSettings };
  if (!views[tab]) tab = 'home';
  S.tab = tab; history.replaceState(null, '', '#' + tab);
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  if (same) {
    main.style.minHeight = main.offsetHeight + 'px';
    main.classList.add('refreshing');
  } else {
    main.style.minHeight = ''; main.innerHTML = '<p class="quiet">불러오는 중…</p>'; window.scrollTo(0, 0);
  }
  const done = () => { if (same) { window.scrollTo(0, y); requestAnimationFrame(() => { main.style.minHeight = ''; main.classList.remove('refreshing'); }); } };
  views[tab](main)
    .then(done).catch(e => { console.error(e); main.style.minHeight = ''; main.classList.remove('refreshing'); main.innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; });
}
const pill = (text, kind = '') => `<span class="pill ${kind}">${esc(text)}</span>`;

// 에이전트 상태: agent_status(새 방식) 기준으로 이름·온라인 여부를 만든다
async function agentRows() {
  const rows = await q(S.sb.from('agent_status').select('device_id,platform,role,paused,current_job,last_seen_at,state,devices(name)'));
  return rows.filter(r => r.state !== 'removed').map(r => ({
    name: r.devices?.name || '이름 없음', platform: r.platform, role: r.role || 'office', paused: r.paused,
    current_job: r.current_job ? (JOB_NAME[r.current_job] || r.current_job) : null, last_seen_at: r.last_seen_at,
    alive: !!r.last_seen_at && (Date.now() - new Date(r.last_seen_at)) / 1000 < 60,
  }));
}

function human(text) {
  let t = String(text ?? '');
  for (const [k, v] of Object.entries(JOB_NAME)) t = t.split(k).join(v);
  const W = { queued: '대기', running: '실행 중', done: '완료', failed: '실패', cancelled: '취소', on_hold: '보류',
    offline: '꺼짐', online: '켜짐', busy: '작업 중', error: '오류', proposed: '수정안', active: '적용', retired: '이전', rejected: '반려' };
  return t.replace(/\b(queued|running|done|failed|cancelled|on_hold|offline|online|busy|error|proposed|active|retired|rejected)\b/g, m => W[m]);
}
function activityTable(rows) {
  if (!rows.length) return '<p class="quiet">기록이 없습니다.</p>';
  return `<table><tr><th>시각</th><th>누가</th><th>기기</th><th>내용</th></tr>${rows.map(r => `
    <tr><td class="quiet" style="white-space:nowrap">${fmt(r.occurred_at)}</td><td>${esc(r.actor)}</td>
    <td>${esc(r.device)}</td><td>${esc(human(r.summary))}</td></tr>`).join('')}</table>`;
}

        <button class="btn small" id="addSer">+</button></div>
      </div>
      <div class="card">
        <div class="row"><b>화 목록</b><button class="btn small" id="bulk" style="margin-left:auto">파일로 여러 화 넣기</button><button class="btn small" id="addEp">+ 화 추가</button></div>
        ${episodes.length ? `<table>${episodes.map(e => {

          const d = drafts.filter(x => x.episode_id === e.id).length;
          return `<tr class="click" data-ep="${esc(e.id)}" ${e.id === S.episodeId ? 'style="background:var(--accent-soft)"' : ''}>
            <td><b>${e.number}화</b> ${esc(e.title || '')}<br><span class="quiet">${v ? 'v' + v.version_no + ' 확정' : '확정본 없음'}${d ? ' · 초안 ' + d : ''}</span></td>
            <td style="text-align:right">${pill(EP_STATUS[e.status] || e.status)}</td></tr>`; }).join('')}</table>`
          : '<p class="quiet">아직 화가 없습니다. "+ 화 추가"를 누르세요.</p>'}
      </div>
    </div>
    <div id="epPane">${S.episodeId && episodes.some(e => e.id === S.episodeId) ? '' : '<div class="card quiet">왼쪽에서 화를 고르세요.</div>'}</div>

  $('#addSer').onclick = guard(async () => {

    const r = await q(S.sb.from('series').insert({ title }).select('id').single());

    if (!S.seriesId) return toast('먼저 시리즈를 만드세요');
    const next = (episodes.at(-1)?.number || 0) + 1;
    const num = Number(prompt('몇 화인가요?', String(next))); if (!num) return;
    const title = prompt('화 제목 (없으면 비워 두세요)', '') || null;
    const r = await q(S.sb.from('episodes').insert({ series_id: S.seriesId, number: num, title }).select('id').single());
    S.episodeId = r.id; S.versionId = null; go('scripts');

  $('#bulk').onclick = () => { if (!S.seriesId) return toast('먼저 시리즈를 만드세요 (+ 버튼)'); S.episodeId = null; viewBulkImport($('#epPane'), series, episodes); };

// 여러 화가 들어 있는 대본 파일을 화별로 나눈다 ("EP.01 — 제목" 형식)
function parseBulkScript(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  const epRe = /^\s*EP\.?\s*0*(\d{1,3})\s*[—–\-:]\s*(.+?)\s*$/;
  const idx = [];
  lines.forEach((l, i) => { const m = l.match(epRe); if (m) idx.push({ i, n: +m[1], title: m[2] }); });
  // 마지막 화 뒤에 붙은 체크리스트 구역(있으면)부터는 대본이 아니다
  const lastEp = idx.length ? idx[idx.length - 1].i : -1;
  const endIdx = lines.findIndex((l, i) => i > lastEp && /체크리스트/.test(l) && !/^\s*☐/.test(l));
  const episodes = idx.map((e, k) => {
    const stop = k + 1 < idx.length ? idx[k + 1].i : (endIdx > e.i ? endIdx : lines.length);
    const body = lines.slice(e.i, stop).join('\n').replace(/\n{3,}/g, '\n\n').trim();
    const scenes = body.split('\n').filter(l => /^\s*\d{1,2}:\d{2}\s*[–\-~]\s*\d{1,2}:\d{2}/.test(l)).length;
    return { n: e.n, title: e.title, body, scenes };
  });
  const pl = (idx.length ? lines.slice(0, idx[0].i) : []).map(s => s.trim()).filter(Boolean);
  const toc = {};
  for (let i = 0; i < pl.length - 1; i++) {
    const m = pl[i].match(/^(\d{1,3})화$/);
    if (m && !/^\d{1,3}화$/.test(pl[i + 1]) && !/공통 제작 기준/.test(pl[i + 1])) toc[+m[1]] = pl[i + 1];
  }
  const ci = pl.findIndex(l => /공통 제작 기준/.test(l));
  const common = ci >= 0 ? pl.slice(ci + 1).join('\n\n') : '';
  const checklist = {};
  if (endIdx >= 0) lines.slice(endIdx).forEach(l => {
    const m = l.match(/EP\s*0*(\d{1,3})(?:\s*[~\-–]\s*(?:EP\s*)?0*(\d{1,3}))?\s+(.+)$/);
    if (m) { const a = +m[1], b = m[2] ? +m[2] : a; for (let n = a; n <= b; n++) (checklist[n] = checklist[n] || []).push(m[3].trim()); }
  });
  return { episodes, toc, common, checklist };
}

async function loadMammoth() {
  if (window.mammoth) return window.mammoth;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js';
    s.onload = res; s.onerror = () => rej(new Error('Word 파일 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'));
    document.head.appendChild(s);
  });
  return window.mammoth;
}
async function readScriptFile(f) {
  if (/\.docx$/i.test(f.name)) {
    const m = await loadMammoth();
    const r = await m.extractRawText({ arrayBuffer: await f.arrayBuffer() });
    return r.value;
  }
  return await f.text();
}

    <p class="quiet">Word(.docx)나 텍스트(.txt) 파일 하나에 여러 화가 들어 있으면 "EP.01 — 제목" 줄을 기준으로 화별로 나눠 <b>${esc(ser?.title || '')}</b>에 넣습니다.
    각 화에는 <b>초안</b>으로 들어가고, 화마다 읽어 보신 뒤 "확정"을 누르면 제작이 시작됩니다. 대본은 이 브라우저에서 Supabase로 바로 가며 GitHub에는 올라가지 않습니다.</p>
    <input type="file" id="bkFile" accept=".docx,.txt,.md,text/plain">
    <div id="bkPrev" style="margin-top:12px"></div></div>`;
  $('#bkClose').onclick = () => go('scripts');
  $('#bkFile').onchange = guard(async e => {
    const f = e.target.files[0]; if (!f) return;
    $('#bkPrev').innerHTML = '<p class="quiet">읽는 중…</p>';
    const parsed = parseBulkScript(await readScriptFile(f));
    if (!parsed.episodes.length) { $('#bkPrev').innerHTML = '<div class="msg err">"EP.01 — 제목" 형식의 화 구분을 찾지 못했습니다.</div>'; return; }
    const exist = n => episodes.find(e => e.number === n);
    const notes = n => (parsed.toc[n] ? 1 : 0) + (parsed.checklist[n] || []).length;
    $('#bkPrev').innerHTML = `
      <table><tr><th>화</th><th>제목</th><th style="text-align:right">씬</th><th style="text-align:right">글자</th><th>연출 메모</th><th>대시보드</th></tr>${parsed.episodes.map(e => `
        <tr><td><b>${e.n}화</b></td><td>${esc(e.title)}</td><td style="text-align:right">${e.scenes}</td><td style="text-align:right">${e.body.length.toLocaleString()}</td>
        <td class="quiet">${notes(e.n) ? notes(e.n) + '건' : '-'}</td><td>${exist(e.n) ? pill('있는 화에 초안 추가') : pill('새 화 만들기', 'accent')}</td></tr>`).join('')}</table>
      ${episodes.length ? `<div class="card" style="border-color:var(--bad);margin:12px 0 0">
        <label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin:0"><input type="checkbox" id="bkReplace" style="width:auto">
          <b>기존 대본 지우고 이 파일로 갈아끼우기</b></label>
        <p class="quiet" style="margin:4px 0 0 26px">겹치는 화(${parsed.episodes.filter(e => exist(e.n)).map(e => e.n + '화').join(', ') || '없음'})의 예전 대본 모든 버전과 그 대본으로 만든 컷·영상·편집·연출 메모를 지우고 새 원고만 남깁니다. 제목도 파일대로 바꿉니다. 비용 기록은 남습니다. 되돌릴 수 없습니다.</p>
        ${episodes.filter(e => !parsed.episodes.some(p => p.n === e.number)).length ? `<label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin:6px 0 0 26px"><input type="checkbox" id="bkDropExtra" style="width:auto">
          파일에 없는 화도 지우기 (${episodes.filter(e => !parsed.episodes.some(p => p.n === e.number)).map(e => e.number + '화').join(', ')})</label>` : ''}
      </div>` : ''}
      <label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin-top:12px"><input type="checkbox" id="bkDrafts" style="width:auto" checked>
        각 화에 <b>대본 초안</b> 넣기 <span class="quiet">(끄면 아래 메모·공통 기준만 가져옵니다)</span></label>
      <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="bkNotes" style="width:auto" checked>
        앞쪽 "화별 핵심"과 뒤쪽 "연속성 체크리스트"를 각 화의 <b>대표 연출 메모(필수)</b>로 넣기</label>
      ${parsed.common ? `<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="bkCommon" style="width:auto" checked>
        "전 회차 공통 제작 기준"을 바이블의 <b>스타일·톤</b> 항목으로 넣기 (${parsed.common.length}자)</label>` : ''}
      ${!parsed.common && !Object.keys(parsed.toc).length && !Object.keys(parsed.checklist).length ? '<p class="quiet">이 파일에는 화별 핵심·공통 기준·체크리스트가 없어 원고만 들어갑니다.</p>' : ''}
      <div class="row" style="margin-top:12px"><button class="btn primary" id="bkGo">${parsed.episodes.length}개 화 넣기</button>

      <div id="bkLog"></div>`;
    $('#bkGo').onclick = guard(async () => {
      const btn = $('#bkGo'); btn.disabled = true; btn.textContent = '넣는 중…';
      try { await bulkRun(btn); } catch (e) {   // 중간에 실패해도 버튼이 '넣는 중…'에 멈추지 않게(이미 넣은 화는 다시 눌러도 건너뜀)
        btn.disabled = false; btn.textContent = '다시 시도(넣은 화는 건너뜀)'; throw e;
      }
    });
    const bulkRun = async btn => {
      const log = m => { $('#bkLog').insertAdjacentHTML('beforeend', `<div class="quiet">${esc(m)}</div>`); };
      const withNotes = $('#bkNotes').checked, withDrafts = $('#bkDrafts').checked;
      const replace = $('#bkReplace')?.checked, dropExtra = replace && $('#bkDropExtra')?.checked;
      let made = 0, drafts = 0, skipped = 0, noteCount = 0;
      if (replace) {
        const hit = parsed.episodes.filter(e => exist(e.n)), extra = dropExtra ? episodes.filter(e => !parsed.episodes.some(p => p.n === e.number)) : [];
        if (!confirm(`정말 갈아끼울까요?\n\n대본·제작 자료를 지우고 새 원고로 바꿀 화: ${hit.map(e => e.n + '화').join(', ') || '없음'}${extra.length ? `\n완전히 지울 화: ${extra.map(e => e.number + '화').join(', ')}` : ''}\n\n되돌릴 수 없습니다.`)) { btn.disabled = false; btn.textContent = `${parsed.episodes.length}개 화 넣기`; return; }
        for (const ep of hit) {
          const row = exist(ep.n);
          await q(S.sb.rpc('owner_reset_episode', { p_episode: row.id, p_drop: false }));
          await q(S.sb.from('episodes').update({ title: ep.title }).eq('id', row.id)); row.title = ep.title;
          log(`${ep.n}화: 예전 대본·제작 자료 지움`);
        }
        for (const e of extra) {
          await q(S.sb.rpc('owner_reset_episode', { p_episode: e.id, p_drop: true }));
          episodes.splice(episodes.indexOf(e), 1); log(`${e.number}화: 화 삭제`);
        }
      }
      for (const ep of parsed.episodes) {
        let row = episodes.find(e => e.number === ep.n);
        if (!row) {
          row = await q(S.sb.from('episodes').insert({ series_id: S.seriesId, number: ep.n, title: ep.title }).select('id,number,title').single());
          episodes.push(row); made++;
        } else if (!row.title) {
          await q(S.sb.from('episodes').update({ title: ep.title }).eq('id', row.id));
        }
        if (withDrafts) {
          // 대본 전체를 주소에 넣어 비교하면 한글 수천 자에서 주소가 너무 길어 실패했다 → 이 화 대본을 받아 여기서 비교
          const same = (await q(S.sb.from('script_versions').select('id,content').eq('episode_id', row.id))).filter(v => v.content === ep.body);
          if (same.length) { skipped++; log(`${ep.n}화: 같은 대본이 이미 있어 대본은 건너뜀`); }
          else { await q(S.sb.from('script_versions').insert({ episode_id: row.id, content: ep.body, note: `원고: ${f.name}` })); drafts++; }
        }
        if (withNotes) {
          const items = [];
          if (parsed.toc[ep.n]) items.push('이 화에서 분명히 보여야 할 것: ' + parsed.toc[ep.n]);
          (parsed.checklist[ep.n] || []).forEach(c => items.push('연속성 체크: ' + c));
          const have = (await q(S.sb.from('episode_notes').select('content').eq('episode_id', row.id))).map(n => n.content);
          for (const c of items.filter(c => !have.includes(c))) {
            await q(S.sb.from('episode_notes').insert({ episode_id: row.id, scene_no: null, priority: 'must', important: false, content: c }));
            noteCount++;
          }
        }
        log(`${ep.n}화 「${ep.title}」: ${withDrafts ? `원고 초안 (씬 ${ep.scenes}개)` : '메모만'} 처리`);
      }
      if ($('#bkCommon')?.checked) {
        const name = '전 회차 공통 제작 기준';
        let entry = (await q(S.sb.from('bible_entries').select('id').eq('series_id', S.seriesId).eq('category', 'style').eq('name', name).limit(1)))[0];
        if (!entry) entry = await q(S.sb.from('bible_entries').insert({ series_id: S.seriesId, category: 'style', name, summary: '대본 파일의 공통 제작 기준' }).select('id').single());
        const cur = (await q(S.sb.from('bible_versions').select('description').eq('entry_id', entry.id).eq('status', 'active').limit(1)))[0];
        if (cur?.description === parsed.common) log('바이블: 공통 제작 기준이 이미 같은 내용으로 적용되어 있음');
        else {
          const v = await q(S.sb.from('bible_versions').insert({ entry_id: entry.id, description: parsed.common, change_reason: `${f.name}에서 가져옴`, status: 'proposed' }).select('id').single());
          await q(S.sb.rpc('activate_bible_version', { p_id: v.id }));
          log('바이블: 스타일·톤 "전 회차 공통 제작 기준" 적용');
        }
      }
      toast(`완료: 새 화 ${made}개, 초안 ${drafts}개, 연출 메모 ${noteCount}건${skipped ? `, 건너뜀 ${skipped}` : ''}`);
      btn.textContent = '완료'; log('끝났습니다. 왼쪽 화 목록에서 각 화를 열어 초안을 읽고 "확정"을 누르세요.');
      setTimeout(() => go('scripts'), 2500);
    };
  });
}

// 줄 단위 비교 (LCS)
function lineDiff(a, b) {
  const A = a.split(/\r?\n/), B = b.split(/\r?\n/);
  if (A.length * B.length > 4_000_000) return null;
  const n = A.length, m = B.length, L = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { out.push([' ', A[i]]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out.push(['-', A[i++]]);
    else out.push(['+', B[j++]]);
  }
  while (i < n) out.push(['-', A[i++]]);
  while (j < m) out.push(['+', B[j++]]);
  return out;
}
async function compareVersions(aId, bId) {
  const [a, b] = await Promise.all([aId, bId].map(id => q(S.sb.from('script_versions').select('version_no,content').eq('id', id).single())));
  const d = lineDiff(a.content, b.content);
  const added = d ? d.filter(x => x[0] === '+').length : 0, removed = d ? d.filter(x => x[0] === '-').length : 0;
  $('#detail').innerHTML = `<div class="card">
    <div class="row"><b>v${a.version_no} → v${b.version_no}</b><span class="quiet">추가 ${added}줄 · 삭제 ${removed}줄</span>
    <label class="quiet" style="margin:0 0 0 auto"><input type="checkbox" id="onlyCh" style="width:auto" checked> 바뀐 부분만</label></div>
    <div class="diff" id="diffBox" style="margin-top:10px"></div></div>`;
  const draw = () => {
    if (!d) return $('#diffBox').innerHTML = '<div>대본이 너무 길어 화면 비교를 할 수 없습니다.</div>';
    const only = $('#onlyCh').checked;
    const rows = d.map((x, k) => ({ x, k })).filter(({ x, k }) => !only || x[0] !== ' ' ||
      d.slice(Math.max(0, k - 2), k + 3).some(y => y[0] !== ' '));
    $('#diffBox').innerHTML = rows.length ? rows.map(({ x }) =>
      `<div class="${x[0] === '+' ? 'add' : x[0] === '-' ? 'del' : ''}">${x[0] === ' ' ? '  ' : x[0] + ' '}${esc(x[1]) || '&nbsp;'}</div>`).join('')
      : '<div>두 버전의 내용이 같습니다.</div>';
  };
  $('#onlyCh').onchange = draw; draw();
  $('#detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

    q(S.sb.from('staff_guidelines').select('id,staff_id,version_no,content,change_reason,status,proposed_by,decided_by,decided_at,created_at,devices(name)').order('version_no', { ascending: false })),
  ]);
  const proposals = all.filter(g => g.status === 'proposed');
  main.innerHTML = `
  <h2>AI 직원</h2>
  <p class="quiet">지침 적용(감독 해고·재설정 포함)은 대표만 할 수 있습니다. AI는 수정안만 올립니다.</p>
  ${proposals.length ? `<h3>검토할 수정안 ${proposals.length}건</h3>${proposals.map(g => {
    const st = staff.find(s => s.id === g.staff_id); const cur = all.find(x => x.staff_id === g.staff_id && x.status === 'active');
    return `<div class="card" style="border-color:var(--warn)">
      <div class="row"><b>${esc(st?.name)} 지침 v${g.version_no} 수정안</b><span class="quiet">${esc(g.proposed_by)} · ${fmt(g.created_at)}</span></div>
      ${g.change_reason ? `<p><b>이유:</b> ${esc(g.change_reason)}</p>` : ''}
      <div class="diff">${(lineDiff(cur?.content || '', g.content) || []).map(x =>
        `<div class="${x[0] === '+' ? 'add' : x[0] === '-' ? 'del' : ''}">${esc(x[1]) || '&nbsp;'}</div>`).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="btn primary small" data-act="${esc(g.id)}">적용</button>
      <button class="btn small" data-edit="${esc(g.id)}">고쳐서 적용</button>
      <button class="btn danger small" data-rej="${esc(g.id)}">반려</button></div></div>`; }).join('')}` : ''}
  <div id="lessonBox"></div>
  ${staff.map(s => {
    const cur = all.find(g => g.staff_id === s.id && g.status === 'active');
    const hist = all.filter(g => g.staff_id === s.id && g.status !== 'proposed');
    return `<div class="card">
      <div class="row"><h3 style="margin:0">${esc(s.name)}</h3>${cur ? pill('지침 v' + cur.version_no, 'accent') : pill('지침 없음', 'bad')}
        <button class="btn small" data-new="${esc(s.id)}" style="margin-left:auto">새 지침 작성</button></div>
      <p class="quiet" style="margin:6px 0">${esc(s.role_summary)}</p>
      ${cur ? `<pre class="doc">${esc(cur.content)}</pre><p class="quiet">적용: ${esc(cur.decided_by || '-')} · ${fmt(cur.decided_at)}</p>` : ''}
      ${hist.length > 1 ? `<details><summary class="quiet">지침 이력 ${hist.length}개</summary><table>${hist.map(g => `
        <tr><td>v${g.version_no}</td><td>${pill(G_STATUS[g.status], g.status === 'active' ? 'good' : '')}</td>
        <td>${esc(g.change_reason || '')}</td><td class="quiet">${fmt(g.decided_at || g.created_at)}</td>
        <td>${g.status === 'retired' ? `<button class="btn small" data-act="${esc(g.id)}">이 버전으로 되돌리기</button>` : ''}</td></tr>`).join('')}</table></details>` : ''}
    </div>`; }).join('')}
  <div id="editor"></div>`;

  renderLessons().catch(e => { const b = $('#lessonBox'); if (b) b.innerHTML = `<div class="card"><b>감독 노하우</b><div class="msg err">${esc(errText(e))}</div></div>`; });
  main.querySelectorAll('[data-act]').forEach(b => b.onclick = guard(async () => {
    if (!confirm('이 지침을 적용할까요? 현재 지침은 이전 버전으로 보관됩니다.')) return;
    await q(S.sb.rpc('activate_guideline', { p_id: b.dataset.act })); toast('적용했습니다'); go('staff');
  }));
  main.querySelectorAll('[data-rej]').forEach(b => b.onclick = guard(async () => {
    await q(S.sb.from('staff_guidelines').update({ status: 'rejected' }).eq('id', b.dataset.rej)); toast('반려했습니다'); go('staff');
  }));
  const openEditor = (st, base, reason, fromId = null) => {
    const nextNo = Math.max(0, ...all.filter(g => g.staff_id === st.id).map(g => g.version_no)) + 1;
    $('#editor').innerHTML = `<div class="card" style="border-color:var(--accent)">
      <b>${esc(st.name)} 지침 v${nextNo} 작성</b>
      <textarea id="gtxt">${esc(base)}</textarea>
      <label>바꾸는 이유 (나중에 어떤 변경이 효과 있었는지 비교할 때 씁니다)</label><input id="greason" value="${esc(reason || '')}">
      <div class="row" style="margin-top:10px"><button class="btn primary" id="gsave">저장하고 바로 적용</button><button class="btn" id="gcancel">취소</button></div></div>`;
    $('#gcancel').onclick = () => { $('#editor').innerHTML = ''; };
    $('#gsave').onclick = guard(async () => {
      const content = $('#gtxt').value.trim(); if (!content) return;
      const r = await q(S.sb.from('staff_guidelines').insert({ staff_id: st.id, version_no: nextNo, content, change_reason: $('#greason').value.trim() || null, status: 'proposed' }).select('id').single());
      await q(S.sb.rpc('activate_guideline', { p_id: r.id }));
      // "고쳐서 적용"이면 원래 수정안은 저장에 성공한 뒤에만 반려 처리(취소하면 그대로 남음)
      if (fromId) await q(S.sb.from('staff_guidelines').update({ status: 'rejected' }).eq('id', fromId).eq('status', 'proposed'));
      toast(`${st.name} 지침 v${nextNo} 적용`); go('staff');
    });
    $('#editor').scrollIntoView({ behavior: 'smooth' });
  };
  main.querySelectorAll('[data-new]').forEach(b => b.onclick = () => {
    const st = staff.find(s => s.id === b.dataset.new);
    openEditor(st, all.find(g => g.staff_id === st.id && g.status === 'active')?.content || '', '');
  });
  main.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const g = all.find(x => x.id === b.dataset.edit);
    openEditor(staff.find(s => s.id === g.staff_id), g.content, g.change_reason, g.id);
  });
}

// ------------------------------------------------------------------
// 시리즈 바이블: 캐릭터·장소·소품·톤·목소리 기준 원본 + 연속성 기록
// ------------------------------------------------------------------
const diffRows = (a, b) => (lineDiff(a, b) || []).map(x =>
  `<div class="${x[0] === '+' ? 'add' : x[0] === '-' ? 'del' : ''}">${esc(x[1]) || '&nbsp;'}</div>`).join('');
async function signedUrls(paths) {
  if (!paths.length) return {};
  const { data, error } = await S.sb.storage.from(BUCKET).createSignedUrls(paths, 3600);
  if (error || !data) return {};
  return Object.fromEntries(data.filter(d => d.signedUrl).map(d => [d.path, d.signedUrl]));
}
async function uploadBibleFile(entryId, file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'bin';
  const path = `${S.seriesId}/${entryId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await S.sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || undefined, upsert: false });
  if (error) throw error;
  return path;
}
const thumbs = (paths, urls) => paths?.length ? `<div class="thumbs">${paths.map(p => urls[p]
  ? `<a href="${esc(urls[p])}" target="_blank" rel="noopener"><img src="${esc(urls[p])}" alt="기준 사진" loading="lazy"></a>` : '').join('')}</div>` : '';

// 등장 씬: [{ep, scene}] → "1화 S1·S3 · 2화 S2"
function appearsLine(e, c) {
  const ap = Array.isArray(e.appears) ? e.appears : [];
  const need = PHOTO_CATS.includes(e.category) && !(c?.image_paths || []).length;
  if (!ap.length && !need) return '';
  const byEp = {}; ap.forEach(x => { (byEp[x.ep] = byEp[x.ep] || []).push(x.scene); });
  const txt = Object.keys(byEp).sort((a, b) => a - b).map(ep => `${ep}화 ${[...new Set(byEp[ep])].sort((a, b) => a - b).map(s => 'S' + s).join('·')}`).join(' · ');
  return `<div class="row" style="gap:6px;margin-top:6px">${need ? pill(e.photo_source === 'upload' ? '사진 직접 올릴 예정' : '사진 필요', 'warn') : ''}${e.origin === 'script' ? pill('대본에서 찾음') : ''}${txt ? `<span class="quiet">등장: ${esc(txt)}</span>` : ''}</div>`;
}
// 사진 없는 인물·장소·배경·소품에 사진 디자인을 한꺼번에 맡긴다
async function queuePhotos(entries, curOf, only) {
  const open = new Set((entries.length ? await q(S.sb.from('photo_designs').select('entry_id').in('entry_id', entries.map(e => e.id))
    .in('status', ['queued', 'ready', 'training', 'set_ready'])) : []).map(d => d.entry_id));
  const todo = entries.filter(e => PHOTO_CATS.includes(e.category) && e.photo_source !== 'upload' && e.essential !== false && (!only || only.has(e.id)) && !open.has(e.id)
    && curOf(e.id) && !(curOf(e.id).image_paths || []).length);
  for (const e of todo) {
    const c = curOf(e.id);
    const r = await q(S.sb.from('photo_designs').insert({ entry_id: e.id, prompt: [c.description, e.summary].filter(Boolean).join('. ').slice(0, 1800) }).select('id').single());
    await q(S.sb.from('pipeline_tasks').insert({ kind: 'photo_design', payload: { design_id: r.id } }));
  }
  return todo.length;
}

// "대본에서 필요한 것 찾기" 화별 진행: 작업(pipeline_tasks) 상태와 진행 문구("N화에서…")로 화마다 준비 중/만드는 중/완료/실패를 보여 준다
const BX_CAT = { character: '인물', location: '장소', prop: '소품' };
const agoText = t => { if (!t) return ''; const m = Math.max(0, Math.round((Date.now() - new Date(t)) / 60000)); return m < 1 ? '방금' : m < 60 ? `${m}분 전` : `${Math.floor(m / 60)}시간 ${m % 60}분 전`; };
async function renderExtractBox(episodes) {
  const box = $('#bxBox'); if (!box || !S.seriesId) return null;
  const sid = S.seriesId;
  const [tasks, entries, scripts] = await Promise.all([
    q(S.sb.from('pipeline_tasks').select('id,status,progress,result,error,attempts,created_at,started_at,finished_at,devices(name)')
      .eq('kind', 'bible_extract').eq('series_id', sid).order('created_at', { ascending: false }).limit(1)),
    q(S.sb.from('bible_entries').select('id,category,name,appears').eq('series_id', sid)),
    episodes.length ? q(S.sb.from('script_versions').select('episode_id').in('episode_id', episodes.map(e => e.id))) : [],
  ]);
  if (S.seriesId !== sid || !$('#bxBox')) return null;
  const t = tasks[0] || null;
  const hasText = new Set(scripts.map(s => s.episode_id));
  const eps = episodes.filter(e => hasText.has(e.id));
  const anyAppears = entries.some(e => (e.appears || []).length);
  if (!t && !anyAppears) { box.innerHTML = ''; return null; }
  const open = t && (t.status === 'queued' || t.status === 'running');
  const curNo = Number((/(\d+)\s*화에서/.exec(t?.progress || '') || [])[1]) || null;
  const found = no => {
    const list = entries.filter(e => BX_CAT[e.category] && (e.appears || []).some(a => Number(a.ep) === Number(no)));
    if (!list.length) return '<span class="quiet">찾은 항목 없음</span>';
    return Object.entries(BX_CAT).map(([k, l]) => { const xs = list.filter(e => e.category === k); return xs.length ? `<b>${l} ${xs.length}</b> ${esc(xs.map(e => e.name).join(', '))}` : ''; })
      .filter(Boolean).join(' · ');
  };
  const stateOf = no => {
    if (!t) return 'done';
    if (t.status === 'done') return 'done';
    if (t.status === 'cancelled') return curNo && no < curNo ? 'done' : 'cancelled';
    if (t.status === 'failed') return !curNo ? 'failed' : no < curNo ? 'done' : no === curNo ? 'failed' : 'stopped';
    if (t.status === 'running' && curNo) return no < curNo ? 'done' : no === curNo ? 'working' : 'waiting';
    return 'waiting';
  };
  const since = t?.started_at || t?.created_at;
  const row = e => {
    const st = stateOf(e.number);
    const badge = {
      done: pill('완료', 'good'),
      working: pill('준비 중 · 지금 만드는 중', 'warn'),
      waiting: pill('준비 중', 'warn'),
      failed: pill('실패', 'bad'),
      stopped: pill('멈춤', 'bad'),
      cancelled: pill('취소됨'),
    }[st];
    const body = st === 'done' ? found(e.number)
      : st === 'working' ? `<span class="quiet">작가실이 이 화 대본을 읽고 필요한 인물·장소·배경·소품을 찾는 중입니다 (작업 시작 ${esc(agoText(since))})</span>`
      : st === 'waiting' ? `<span class="quiet">${t.status === 'running' ? '앞 화가 끝나면 이어서 만듭니다'
          : t.attempts > 0 ? `잠시 멈췄다가 다시 시도합니다${t.error || t.progress ? ` (${esc(t.error || t.progress)})` : ''}`
          : `에이전트가 받아 가기를 기다리는 중 (요청 ${esc(agoText(t.created_at))})`}</span>`
      : st === 'failed' ? `<span style="color:var(--bad)">${esc(t.error || '이유가 남지 않았습니다')}</span>`
      : st === 'stopped' ? '<span class="quiet">앞 화에서 실패해서 만들지 못했습니다</span>'
      : '<span class="quiet">작업이 취소되었습니다</span>';
    return `<div class="row" style="gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line, rgba(127,127,127,.2))">
      <b style="min-width:42px">${e.number}화</b>${badge}<div style="flex:1;min-width:200px">${body}</div></div>`;
  };
  const head = !t ? '' : open
    ? `${pill(t.status === 'running' ? '진행 중' : '대기 중', 'warn')} <span class="quiet">요청 ${esc(fmt(t.created_at))}${t.started_at ? ` · 시작 ${esc(agoText(t.started_at))}` : ''}${t.devices?.name ? ` · ${esc(t.devices.name)}` : ''}${t.status === 'queued' && t.progress ? ` · ${esc(t.progress)}` : ''} · 8초마다 자동 갱신</span>`
    : t.status === 'done' ? `${pill('완료', 'good')} <span class="quiet">${esc(fmt(t.finished_at))} · ${esc(t.result || '')}</span>`
    : t.status === 'failed' ? `${pill('실패', 'bad')} <span class="quiet">${esc(fmt(t.finished_at))}</span>`
    : pill('취소됨');
  box.innerHTML = `<div class="card" style="margin-top:14px"><div class="row"><b>대본에서 필요한 것 찾기 — 화별 결과</b>${head}</div>
    ${eps.length ? eps.map(row).join('') : '<p class="quiet">대본이 들어간 화가 없습니다.</p>'}</div>`;
  return t;
}

// 제작자가 추천한 '넣을 화·씬': 넣기를 누르면 그 씬의 감독 메모(episode_notes)로 들어간다
function placementBox(e) {
  const list = Array.isArray(e.placement) ? e.placement : [];
  if (!list.length) return '';
  return `<div style="margin-top:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px">
    <div class="quiet" style="margin-bottom:4px">제작자 추천: 넣을 화·씬</div>
    ${list.map((p, i) => `<div class="row" style="gap:6px;align-items:flex-start;padding:4px 0">
      <b style="min-width:58px">${esc(p.ep)}화 S${esc(p.scene)}</b>
      <div style="flex:1;min-width:180px">${esc(p.how || '')}${p.reason ? `<div class="quiet">이유: ${esc(p.reason)}</div>` : ''}</div>
      ${p.accepted ? pill('넣음 · 감독 메모', 'good') : `<button class="btn primary small" data-plok="${esc(e.id)}" data-i="${i}">넣기</button>
        <button class="btn small" data-plno="${esc(e.id)}" data-i="${i}">빼기</button>`}</div>`).join('')}</div>`;
}

// 소품 빨리 추가: 이름·한국어 설명(사진 선택) → 사진이 있으면 사진 보고 묘사, 없으면 설명으로 묘사 + 넣을 화·씬 추천
function openPropForm(cat = 'prop') {
  const L = cat === 'location' ? { n: '장소', ex: '예: 성수동 카페 \'모노\'', d: '예: 통유리 창, 원목 테이블, 노출 콘크리트 벽. 오후 햇빛이 길게 들어오는 2층 카페', h: '예: 린과 탄이 다시 만나는 장면에 쓰고 싶다(협찬 매장)' }
    : { n: '소품', ex: '예: 할머니의 은반지', d: '예: 오래된 은반지. 안쪽에 이니셜이 새겨져 있고 조금 긁혀 있다. 주인공이 늘 끼고 다닌다', h: '예: 협찬 제품이라 주인공이 자주 쓰게 하고 싶다' };
  $('#bEditor').innerHTML = `<div class="card" style="border-color:var(--accent)">
    <b>협찬 ${L.n} 추가 (PPL)</b>
    <p class="quiet" style="margin:4px 0 0">영어 묘사는 쓰지 않아도 됩니다. 사진을 넣으면 사진을 보고, 없으면 설명을 보고 작가실이 씁니다. 직접 넣는 ${L.n}은 광고(PPL·협찬)일 가능성이 높으니, 작가실이 대본을 읽고 <b>세게 보일</b> 화·씬과 보여 주는 방법(크게·화면 중앙·3초 이상)을 추천합니다. '넣기'를 누르면 그 씬 감독 메모로 들어갑니다.</p>
    <label>${L.n} 이름</label><input id="ppname" placeholder="${L.ex}">
    <label>어떤 ${L.n}인가요 (한글로 적어도 됩니다)</label><textarea id="ppdesc" style="min-height:80px" placeholder="${L.d}"></textarea>
    <label>어디에 쓰고 싶나요 (선택)</label><input id="pphint" placeholder="${L.h}">
    <label>협찬 ${L.n} 사진 <b style="color:var(--warn)">(강력 권장)</b> — 이 사진이 기준이 되어 화면에 그대로 보입니다. 정면·측면 등 2~3장</label><input type="file" id="ppimg" accept="image/*" multiple>
    <label class="quiet" style="margin-top:8px"><input type="checkbox" id="ppplace" style="width:auto" checked> 작가실에 세게 보일 화·씬 추천받기</label>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="ppsave">추가</button><button class="btn" id="ppcancel">취소</button></div></div>`;
  $('#ppcancel').onclick = () => { $('#bEditor').innerHTML = ''; };
  $('#ppsave').onclick = guard(async () => {
    const name = $('#ppname').value.trim(), desc = $('#ppdesc').value.trim(), hint = $('#pphint').value.trim();
    if (!name) return toast(`${L.n} 이름을 적어 주세요`);
    if (!desc) return toast(`어떤 ${L.n}인지 한두 줄 적어 주세요`);
    const files = [...$('#ppimg').files];
    if (!files.length && !confirm(`사진 없이 추가할까요?\n협찬 ${L.n}은 사진이 있어야 실제 제품·장소 모습 그대로 나옵니다. 사진이 없으면 설명으로 만든 임의의 모습이 됩니다.`)) return;
    if (files.some(f => f.size > 15e6)) return toast('사진이 너무 큽니다 (15MB까지)');
    const btn = $('#ppsave'); btn.disabled = true; btn.textContent = '추가하는 중…';
    try {
      const row = { series_id: S.seriesId, category: cat, name, summary: desc.slice(0, 300), origin: 'sponsor' };
      const ent = await q(S.sb.from('bible_entries').insert({ ...row, photo_source: files.length ? 'upload' : 'auto' }).select('id').single())
        .catch(() => q(S.sb.from('bible_entries').insert(row).select('id').single()));
      const paths = [];
      for (const f of files) paths.push(await uploadBibleFile(ent.id, f));
      const v = await q(S.sb.from('bible_versions').insert({
        entry_id: ent.id, description: desc, details: hint ? `대표 희망 쓰임: ${hint}` : null, image_paths: paths,
        change_reason: `협찬 ${L.n} 추가`, status: 'proposed',
      }).select('id,version_no').single());
      await q(S.sb.rpc('activate_bible_version', { p_id: v.id }));
      const jobs = [];
      if (files.length) jobs.push({ kind: 'photo_describe', series_id: S.seriesId, payload: { entry_id: ent.id, version_id: v.id } });

// 바이블 '지금 하는 일' 목록(예상 소요 시간). live=true면 끝난 일은 '끝남'으로 바꾸고 새로 보기 버튼
const DASH_AGENT_VER = (document.getElementById('f-agent.py')?.textContent.match(/VERSION = "([\d.]+)"/) || [])[1] || '';
const verLt = (a, b) => { const x = String(a || '0').split('.').map(Number), y = String(b || '0').split('.').map(Number);
  for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) < (y[i] || 0); } return false; };
// 멈춘 것 같은 일의 이유: 에이전트가 꺼짐 / 옛 버전이라 이 일을 모름 / 예상보다 훨씬 오래
function stuckWhy(t) {
  const on = (S.agentsNow || []).filter(a => a.last_seen_at && Date.now() - new Date(a.last_seen_at) < 120e3 && a.state !== 'removed');
  if (!on.length) return { why: '켜져 있는 에이전트가 없습니다(컴퓨터 꺼짐·잠자기·인터넷 끊김)', act: 'agents' };
  if (t.status === 'queued' && !on.some(a => (a.info?.tasks || []).includes(t.kind)))
    return { why: `켜져 있는 에이전트(${on.map(a => `${a.devices?.name || '?'} v${a.version || '?'}`).join(', ')})가 옛 버전이라 이 일(${TASK_LABEL[t.kind] || t.kind})을 할 줄 모릅니다`, act: 'update' };
  if (on.some(a => verLt(a.version, DASH_AGENT_VER)) && t.status === 'queued' && Date.now() - new Date(t.created_at) > 5 * 60e3)
    return { why: `에이전트가 옛 버전(v${on.map(a => a.version).join(', ')} · 최신 v${DASH_AGENT_VER})입니다. 새 버전은 이 일을 따로 줄 세워 바로 합니다`, act: 'update' };
  const e = (S.eta || {})[t.kind], d = ETA_DEFAULT[t.kind];
  const hi = e ? e.p80 : d ? d[1] : 600;
  if (t.status === 'running' && t.started_at && (Date.now() - new Date(t.started_at)) / 1000 > Math.max(hi * 2.5, 600))
    return { why: `예상(${mins(hi)})보다 훨씬 오래 걸리고 있습니다(${mins((Date.now() - new Date(t.started_at)) / 1000)} 지남)`, act: 'retry' };
  return null;
}
function liveList(live) {
  const list = S.bibleOpen || [];

  const why = stuck.length ? `<div class="msg warn" style="margin:6px 0 0"><b>멈춘 것 같은 이유:</b> ${esc(stuck[0].s.why)}

async function designToBible(entryId, list) {
  const out = [];
  for (const x of list) {
    if ((x.bucket || 'takes') === 'bible') { out.push(x.path); continue; }
    const { data, error } = await S.sb.storage.from('takes').download(x.path);
    if (error) throw error;
    out.push(await uploadBibleFile(entryId, new File([data], 'photo.jpg', { type: 'image/jpeg' })));
  }
  return out;
}

function okOnly(d, list) {

// 코디네이터 추천 사진: 확인 결과의 best(1부터) 중 문제없는 것, 없으면 문제없는 사진 전부
function designPicks(d) {
  const items = d.previews || [], rv = d.review || {};

// 화 번호 입력: "5-12", "5~", "3,4,7" → [5..12] / [5..마지막 화] / [3,4,7]
function parseEps(s) {
  const out = new Set(), max = Math.max(S.bibleMaxEp || 0, 1);
  String(s || '').split(/[,\s]+/).filter(Boolean).forEach(p => {
    const m = p.match(/^(\d+)\s*[-~]\s*(\d+)?$/);
    if (m) { const a = +m[1], b = m[2] ? +m[2] : Math.max(max, a); for (let i = a; i <= Math.min(b, a + 300); i++) out.add(i); }
    else if (/^\d+$/.test(p)) out.add(+p);
  });
  return [...out].sort((a, b) => a - b);
}
function fmtEps(arr) {
  if (!arr?.length) return '';
  const a = [...arr].sort((x, y) => x - y), parts = [];
  for (let i = 0; i < a.length; i++) { let j = i; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++; parts.push(j > i ? `${a[i]}-${a[j]}` : `${a[i]}`); i = j; }
  return parts.join(', ');
}

  <h3>연속성 기록</h3>

      if (!busy) go('bible');

      <p class="quiet" style="margin:4px 0">원하는 방향이 있으면 적어 주세요. <b>한글로 편하게</b> 적어도 됩니다 — 작가실이 이 제안을 가장 먼저 반영해 추천안을 쓰고, 적용하면 AI가 읽기 좋게 꼼꼼한 영어 프롬프트로 바뀝니다. <b>비워 두면 작가실이 대본을 읽고 추천한 그대로</b> 올립니다.</p>
